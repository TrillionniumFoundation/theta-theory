name: General Theta Foundations I v6 Markov revision
on:
  push:
    branches: [revision/general-theta-foundations-i-v6-markov-2026-09-22]
    paths:
      - '.github/workflows/general-theta-foundations-i-v6-markov.yml'
      - '.github/revision-inputs/gtf-i-v6-markov/**'
      - 'papers/GTF-I-v6-markov/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gtf-i-v6-markov-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-source-and-review-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover hash-verified native revision sources
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, lzma, tarfile
          from pathlib import Path, PurePosixPath
          folder = Path('.github/revision-inputs/gtf-i-v6-markov')
          encoded = b''.join((folder / ('part%d.b64' % i)).read_bytes() for i in range(7))
          packed = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(packed).hexdigest() != '6a090164d18f318d9c17e48fb992fbc4c6c8e64c9ab6529dff3012f42c6e53a1':
              raise SystemExit('Native source transfer digest mismatch')
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(packed)), mode='r:') as archive:
              members = archive.getmembers()
              if len(members) != 30:
                  raise SystemExit('Unexpected source member count')
              seen = set()
              for entry in members:
                  p = PurePosixPath(entry.name)
                  if (not entry.isfile() or p.is_absolute() or '..' in p.parts
                      or p.parts[:2] != ('papers', 'GTF-I-v6-markov') or entry.name in seen):
                      raise SystemExit('Unsafe or duplicate source member: ' + entry.name)
                  seen.add(entry.name)
                  data = archive.extractfile(entry).read()
                  target = Path(entry.name)
                  if target.exists() and target.read_bytes() != data:
                      raise SystemExit('Refusing to replace differing native source: ' + entry.name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
          print('Recovered 30 hash-verified native files')
          PY
      - name: Commit native mathematical source snapshot
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/GTF-I-v6-markov
          if ! git diff --cached --quiet; then
            git commit -m 'paper(GTF-I v6): Markov-renewal realization, critical laws, nonregenerative filtering and A2 finite budgets'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "GTF_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install native TeX build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended texlive-science lmodern poppler-utils
      - name: Rebuild both editions and verify exact sources
        run: python3 papers/GTF-I-v6-markov/build.py
      - name: Write referee handoff index
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('papers/GTF-I-v6-markov')
          r = json.loads((p / 'evidence/BUILD_RECEIPT.json').read_text())
          lines = [
              '# General Theta Foundations I — sixth Markov revision',
              '',
              '**Author:** Qian Qi. **Date:** 22 September 2026.',
              '**Complete preserved article:** [paper.pdf](papers/GTF-I-v6-markov/paper.pdf), %s pages.' % r['outputs']['main']['pages'],
              '**Same-source principal edition:** [principal-paper.pdf](papers/GTF-I-v6-markov/principal-paper.pdf), %s pages.' % r['outputs']['principal']['pages'],
              '',
              'Working branch: `revision/general-theta-foundations-i-v6-markov-2026-09-22`.',
              'The referee-ready snapshot is frozen separately after the downloaded publication is verified.',
              '',
              '## Reading materials',
              '',
              '| Material | Path |',
              '|---|---|',
              '| Principal and full manuscripts | `papers/GTF-I-v6-markov/principal-paper.pdf`, `paper.pdf` |',
              '| Native TeX and reproduction | `papers/GTF-I-v6-markov/main.tex`, `principal.tex`, `README.md` |',
              '| Every v5 objection and routes A-G | `papers/GTF-I-v6-markov/RESPONSE_TO_REFEREE.md` |',
              '| Proof dependencies and constants | `papers/GTF-I-v6-markov/PROOF_LEDGER.md` |',
              '| Frozen historical and active-pipeline audit | `papers/GTF-I-v6-markov/HISTORY_AUDIT.md`, `HISTORY_INPUT_MANIFEST.json` |',
              '| Primary literature comparison | `papers/GTF-I-v6-markov/LITERATURE_AUDIT.md` |',
              '| Standalone exact-source archive | `papers/GTF-I-v6-markov/evidence/COMPILED_SOURCES.zip` |',
              '| Executed build | `papers/GTF-I-v6-markov/evidence/BUILD_RECEIPT.json` |',
              '',
              '## Mathematical response',
              '',
              'Theorems 2.1-2.2 treat primitive finite-type languages with forbidden transitions, nongeometric renewal weights and delay-identifying Holder readouts on separated metric repellers. The suffix proof allows unary nodes and counts every retained vertex. The pressure exponent is derived from the intrinsic cylinder profile.',
              '',
              'Theorems 5.1-5.2 classify critical power-log, log-log and no-log regimes and give uniform finite-profile crossover laws for equal-contraction Parry systems with polynomially modified renewal tails.',
              '',
              'Theorem 6.1 and Corollary 6.3 prove matched finite-register excess rates through posterior contraction without a common regeneration component. The Gaussian autoregressive model verifies the hypotheses and has no common positive minorization measure at any fixed number of steps.',
              '',
              'Theorem 7.1 gives pathwise finite-interface simulations. Theorem 9.1 in the full edition derives a joint sample-size/register-budget Le Cam bound for the active A2-v118 known-mark count-to-contact experiment. It is not a claim of an optimal necessary budget or a proof of unrelated historical gates.',
              '',
              'All previous mathematical theorem/proof bodies remain in the complete edition. Active A1-v37 is pinned at 90465076589f5e5c69227d624f278c47744f1c1d and active A2-v118 at 44bfc648ead008896a6981a7302a6d5ab8b21bb8. Later revisions are outside this fixed discovery snapshot.',
              '',
              '## Exact identities',
              '',
              '- Controlling v5 review: `%s`.' % r['review_commit'],
              '- Native mathematical source: `%s`.' % r['source_commit'],
              '- Successful workflow run: `%s`.' % r['run_id'],
              '- Complete PDF SHA-256: `%s`.' % r['outputs']['main']['sha256'],
              '- Principal PDF SHA-256: `%s`.' % r['outputs']['principal']['sha256'],
              '- Source archive SHA-256: `%s`.' % r['compiled_source_archive_sha256'],
              '- Standalone archive inputs: %s.' % r['compiled_source_archive_files'],
              '- Retained resolved mathematical labels: %s; same-number shared core labels: %s.' % (r['retained_mathematical_labels'], r['core_labels']),
              '- Finite deterministic checks: %s; ordinary and optimized results agree; eight negative controls rejected in both modes.' % r['finite_diagnostics']['finite_checks'],
              '- Inherited v1-v5 diagnostics passed. Both editions have stable references and no overfull boxes.',
              '',
              'The publication commit containing this index adds the generated PDFs and evidence after the native source commit recorded above. Build evidence identifies the reviewed object; it is not a formal proof certificate, independent approval, priority determination or journal acceptance.',
              ''
          ]
          Path('GTF_I_V6_MARKOV_INDEX.md').write_text('\n'.join(lines))
          PY
      - name: Publish manuscripts and exact-source evidence
        shell: bash
        run: |
          git add -f papers/GTF-I-v6-markov/paper.pdf papers/GTF-I-v6-markov/principal-paper.pdf papers/GTF-I-v6-markov/evidence GTF_I_V6_MARKOV_INDEX.md
          if ! git diff --cached --quiet; then
            git commit -m 'paper(GTF-I v6): publish full and principal referee editions with exact-source receipts'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "Publication commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gtf-i-v6-markov-referee-build
          path: |
            papers/GTF-I-v6-markov/paper.pdf
            papers/GTF-I-v6-markov/principal-paper.pdf
            papers/GTF-I-v6-markov/evidence
            GTF_I_V6_MARKOV_INDEX.md
          retention-days: 30
