name: A2-DYN v24 exact introduction assembly
on:
  push:
    branches: [revision/a2-dyn-v24-referee-response-2026-10-06]
    paths:
      - .github/a2-dyn-v24-assemble.py
      - .github/workflows/a2-dyn-v24-assemble.yml
permissions:
  contents: write
jobs:
  assemble:
    if: contains(github.event.head_commit.message, '[assemble-v24]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install inherited diagnostic imports
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-numpy python3-mpmath python3-sympy
      - name: Replay introduction edits and create immutable objects only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/a2-dyn-v24-assemble.py
      - uses: actions/upload-artifact@v4
        with:
          name: a2-dyn-v24-assembly-${{ github.sha }}
          path: v24-assembly-receipt.json
          if-no-files-found: error
