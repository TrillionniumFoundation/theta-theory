name: A2 v139 sharp infinitesimal pencil reconstruction
on:
  push:
    branches:
      - revision/a2-v139-natural-moduli-referee-closure-2026-09-23
    paths:
      - 'revisions/a2-v139/**'
      - '.github/workflows/a2-v139-revision.yml'
      - 'A2_REVISION_V139_INDEX.md'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: a2-v139-referee-build
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/revision/a2-v139-natural-moduli-referee-closure-2026-09-23'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REVISION: papers/A2-v17-boundary-information-coarsening/article/v139
      TARGET_BRANCH: revision/a2-v139-natural-moduli-referee-closure-2026-09-23
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the pinned predecessor and assemble native revision sources
        run: python revisions/a2-v139/assemble.py
      - name: Install mathematical build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern
          python -m pip install 'sympy==1.14.0' 'numpy==2.3.5' 'PyMuPDF==1.26.7'
      - name: Execute fourteen exact scripts and compile the three manuscripts
        run: bash "$REVISION/build.sh"
      - name: Record successful source-bound publication
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import json, os, re
          p=Path(os.environ['REVISION'])
          r=json.loads((p/'evidence/BUILD_RECEIPT.json').read_text())
          assert r['ok'] and all(r['checks'].values())
          assert len(r['scripts_executed'])==14 and r['preserved_label_count']==310
          assert r['current_label_count']==326
          url=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          s='Remote build completed successfully: [GitHub Actions run]('+url+').\n\n'
          s+='Source commit: `'+r['source_commit']+'`.\n\n'
          s+='PDF pages: '+', '.join(n+' '+str(v['pages']) for n,v in r['pdfs'].items())+'.\n\n'
          s+='Fourteen exact scripts and '+str(len(r['checks']))+' build checks passed. All 310 inherited mathematical labels are retained (326 current labels); 81 inherited TeX files are byte-identical. Source hashes, cross-references, page bounds and absence of overfull boxes passed. Structural proofs and historical priority are not machine-certified; B137.1 remains documentary-open.\n'
          index=Path('A2_REVISION_V139_INDEX.md')
          text,count=re.subn(r'<!-- REMOTE_BUILD_START -->.*?<!-- REMOTE_BUILD_END -->',
              '<!-- REMOTE_BUILD_START -->\n'+s+'<!-- REMOTE_BUILD_END -->',index.read_text(),flags=re.S)
          assert count==1
          index.write_text(text)
          PYCODE
      - name: Publish only the new revision with a non-forced push
        run: |
          test "${GITHUB_REF#refs/heads/}" = "$TARGET_BRANCH"
          git diff --exit-code cf4925b91608b806580bc0cd4fd8ce2441870c08 -- papers/A2-v17-boundary-information-coarsening/article/v138 reviews
          find "$REVISION" revisions/a2-v139 -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -f "$REVISION"/*.aux "$REVISION"/*.out "$REVISION"/*.log "$REVISION"/*.toc
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$REVISION" revisions/a2-v139 A2_REVISION_V139_INDEX.md
          python - <<'PYCODE'
          import subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only','cf4925b91608b806580bc0cd4fd8ce2441870c08'],text=True).splitlines()
          allowed=('papers/A2-v17-boundary-information-coarsening/article/v139/','revisions/a2-v139/')
          exact={'A2_REVISION_V139_INDEX.md','.github/workflows/a2-v139-revision.yml'}
          assert paths and all(p.startswith(allowed) or p in exact for p in paths), paths
          PYCODE
          if ! git diff --cached --quiet; then
            git commit -m 'A2 v139: native sharp-order proofs, three PDFs and executed evidence [skip ci]'
            git push origin "HEAD:$TARGET_BRANCH"
          fi
      - name: Package the complete referee revision
        run: tar -czf a2-v139-referee-bundle.tar.gz A2_REVISION_V139_INDEX.md revisions/a2-v139 "$REVISION"
      - uses: actions/upload-artifact@v4
        with:
          name: a2-v139-referee-bundle
          path: a2-v139-referee-bundle.tar.gz
          retention-days: 30
