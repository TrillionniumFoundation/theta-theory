name: General Theta R58 complete source-bound build
on:
  push:
    branches: [foundation/general-theta-restart-r58-reference-stability-research-2026-10-14]
    paths: [.github/workflows/theta-r58-complete.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: theta-r58-complete
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0' 'pypdf==5.9.0' 'PyYAML==6.0.2'
      - name: Publish proofread sealed ordinary source
        id: source
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,runpy,subprocess,sys
          helper=Path('.github/scripts/theta-r58-publish.py')
          ns=runpy.run_path(str(helper)); need=ns['need']; git=ns['git']; run=ns['run']
          run('git','config','user.name','github-actions[bot]')
          run('git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          before=git('rev-parse','HEAD'); need(ns['remote']()==before,'remote changed')
          ns['preservation'](before)
          root=Path(ns['DEST']); manifest=root/'SOURCE_MANIFEST.json'
          old='bb1f6178d472173e70baaf5bb462ca08a33293e92394a8c5bbd096db02cba57d'
          new='fea8ca55592c59d8cac848cf7e98872fb26c15c213916a92f69ce1823cfa9e0f'
          projection='85e02e0aeb1e200f1bad7388bb7b55512b94a2db'
          digest=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          current=digest(manifest); need(current in {old,new},'unexpected source manifest')
          if current==old:
              p=root/'sections/03-calibrated-experiments.tex'
              need(digest(p)=='aaef17a5a74391ec9ffe7c8d41f34d1626fa52ef208ce202bfeabb4f01e56911','unexpected TeX input')
              text=p.read_text(); needle='i\\ {\nm productive}'
              need(text.count(needle)==2,'exact two subscript corrections required')
              p.write_text(text.replace(needle,'i\\ {\\rm productive}'))
              need(digest(p)=='2020ba78bdf06ef27cf265cdea8b0f2834c8cf9cb610fbbe9b8f10f6163e46dd','corrected TeX digest')
              run(sys.executable,str(root/'seal.py'))
              text=helper.read_text()
              need(text.count(old)==1 and text.count('db9984429eb65d2f57e12ac4f3dc5d0c7bc45f0c')==1,'publisher seal pins')
              helper.write_text(text.replace(old,new).replace('db9984429eb65d2f57e12ac4f3dc5d0c7bc45f0c',projection))
              run('git','add','--',str(root),str(helper))
              run('git','commit','-m','math(theta): proofread occupation indices and seal final R58 source without altering theorems')
              need(git('rev-parse','HEAD^')==before,'ordinary source parent')
          audit=json.loads(subprocess.check_output([sys.executable,str(root/'verify.py')],text=True))
          need(digest(manifest)==new and audit['ordinary_source_projection_tree_sha']==projection,'final source seal mismatch')
          source=git('rev-parse','HEAD'); ns['preservation'](source)
          if source!=before: ns['publish'](before)
          ns['bind']('source_sha',source)
          PY
      - name: Acquire exact retained source without changing historical files
        id: inputs
        run: |
          gh api repos/TrillionniumFoundation/theta-theory/actions/artifacts/11863579443/zip > "$RUNNER_TEMP/r56-pinned.zip"
          python .github/scripts/theta-r58-publish.py historical --archive "$RUNNER_TEMP/r56-pinned.zip" --target "$RUNNER_TEMP/theta-r58-prepared"
      - name: Full ordinary and optimized regression, independent builds and reference checks
        run: |
          python papers/General-Theta-Foundations-I-restart/r58-reference-stability/build.py --source-sha '${{ steps.source.outputs.source_sha }}' --prepared-root "$RUNNER_TEMP/theta-r58-prepared" --retained --output "$RUNNER_TEMP/theta-r58-build"
      - name: Publish source-bound PDF artifacts
        id: artifacts
        run: python .github/scripts/theta-r58-publish.py store --build "$RUNNER_TEMP/theta-r58-build"
      - uses: actions/upload-artifact@v4
        with:
          name: theta-r58-complete
          path: ${{ runner.temp }}/theta-r58-build/download/complete
          if-no-files-found: error
          retention-days: 90
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: theta-r58-failure-diagnostics
          path: |
            ${{ runner.temp }}/theta-r58-build/*.log
            ${{ runner.temp }}/theta-r58-build/BUILD_RECEIPT.json
          if-no-files-found: ignore
          retention-days: 90
