name: verify-publish-round9-referee

on:
  push:
    branches:
      - revision/round9-referee-positive-closure-11paper-2026-08-31
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-publish-round9-referee
  cancel-in-progress: true

jobs:
  verify-build-publish:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Capture immutable round-nine inputs and merge latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name theta-theory-revision-bot
          git config user.email revision-bot@users.noreply.github.com
          git fetch origin main --tags
          PRE_MAIN="$(git rev-parse origin/main)"
          git merge --no-edit origin/main
          git merge-base --is-ancestor \
            57349d5b8f042fd995b37a369f71af7f22f6acdb HEAD
          echo "PRE_MAIN=$PRE_MAIN" >> "$GITHUB_ENV"
          echo "REVISION_SOURCE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Restore exact round-nine proof payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .round9 -maxdepth 1 -name 'payload.part-*' -type f | wc -l)" -eq 7
          cat .round9/payload.part-* | tr -d '\r\n' \
            | base64 --decode > /tmp/round9-payload.tar.gz
          echo 'cf230322211332af59a7883af1b669eeb9b4f7e9f4220fc24712c634bda17716  /tmp/round9-payload.tar.gz' \
            | sha256sum --check
          tar -xzf /tmp/round9-payload.tar.gz
          rm -rf .round9
          rm -f .github/workflows/export-round9-source-snapshot.yml
          chmod +x \
            tools/materialize_round9_referee.py \
            tools/verify_round9_referee.py \
            tools/hostile_rereview_round9.py \
            tools/build_round9.py \
            tools/write_round9_certificate.py

      - name: Syntax-check round-nine tooling
        run: |
          python -m py_compile \
            tools/materialize_round9_referee.py \
            tools/verify_round9_referee.py \
            tools/hostile_rereview_round9.py \
            tools/build_round9.py \
            tools/write_round9_certificate.py

      - name: Materialize all eleven positive reconstructions
        run: python tools/materialize_round9_referee.py

      - name: Run exact-source structural and hostile proof gates
        run: |
          python tools/verify_round9_referee.py
          python tools/hostile_rereview_round9.py

      - name: Install TeX and PDF inspection toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk biber poppler-utils \
            texlive-latex-base texlive-latex-extra \
            texlive-fonts-recommended texlive-bibtex-extra

      - name: Clean-build all eleven round-nine papers
        run: python tools/build_round9.py

      - name: Re-run exact-byte and counterexample gates after build
        run: |
          python tools/verify_round9_referee.py
          python tools/hostile_rereview_round9.py

      - name: Commit verified mathematical tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git add -f papers/*/main.pdf
          if git diff --cached --quiet; then
            echo 'Round-nine materialization produced no changes.' >&2
            exit 1
          fi
          git commit -m 'Materialize round-nine positive referee closure for all eleven papers [skip ci]'
          echo "MATHEMATICAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:revision/round9-referee-positive-closure-11paper-2026-08-31

      - name: Write exact-source build and publication certificate
        shell: bash
        run: |
          set -euo pipefail
          python tools/write_round9_certificate.py \
            --mathematical-sha "$MATHEMATICAL_SHA" \
            --pre-main "$PRE_MAIN" \
            --workflow-run "$GITHUB_RUN_ID"

      - name: Commit certificate and publication record
        shell: bash
        run: |
          set -euo pipefail
          git add \
            ROUND9_FINAL_CERTIFICATE.json \
            ROUND9_PUBLICATION_RECORD.json \
            ROUND9_REVISION_STATUS.md
          git commit -m 'Record exact round-nine verification and publication metadata [skip ci]'
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:revision/round9-referee-positive-closure-11paper-2026-08-31

      - name: Archive old main and atomically publish verified tree
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE='archive/main-pre-round9-positive-closure-2026-08-31'
          TAG='round9-positive-closure-verified-2026-08-31'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$PRE_MAIN"
          git merge-base --is-ancestor "$PRE_MAIN" HEAD

          if git ls-remote --exit-code --heads origin "refs/heads/$ARCHIVE" >/tmp/round9-archive-ref 2>/dev/null; then
            existing="$(cut -f1 /tmp/round9-archive-ref)"
            test "$existing" = "$PRE_MAIN"
          else
            git push origin "$PRE_MAIN:refs/heads/$ARCHIVE"
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo 'Round-nine publication tag already exists before publication.' >&2
            exit 1
          fi
          git tag -a "$TAG" -m 'Verified round-nine positive referee closure for eleven papers' HEAD
          git push --atomic \
            --force-with-lease="refs/heads/main:$PRE_MAIN" \
            origin \
            HEAD:refs/heads/main \
            "refs/tags/$TAG"

      - name: Verify remote main archive and tag topology
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE='archive/main-pre-round9-positive-closure-2026-08-31'
          TAG='round9-positive-closure-verified-2026-08-31'
          git fetch origin \
            main \
            "$ARCHIVE" \
            "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse origin/main)" = "$FINAL_SHA"
          test "$(git rev-parse "origin/$ARCHIVE")" = "$PRE_MAIN"
          test "$(git rev-list -n1 "$TAG")" = "$FINAL_SHA"
          git diff --exit-code "$MATHEMATICAL_SHA" "$FINAL_SHA" -- \
            papers \
            revision/round9-referee-final \
            tools/materialize_round9_referee.py \
            tools/verify_round9_referee.py \
            tools/hostile_rereview_round9.py \
            tools/build_round9.py \
            ROUND9_HISTORICAL_DERIVATION_AUDIT.md \
            ROUND9_PROOF_DEPENDENCY_LEDGER.md \
            ROUND9_REFEREE_INVENTORY.md \
            ROUND9_REFEREE_INVENTORY.json \
            REFEREE_ROUND9_RESPONSE.md
          echo "ROUND9_REMOTE_PUBLICATION_PASS main=$FINAL_SHA archive=$PRE_MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: theta-theory-round9-verified-papers-and-audit
          path: |
            papers/*/main.pdf
            ROUND9_FINAL_CERTIFICATE.json
            ROUND9_PUBLICATION_RECORD.json
            ROUND9_REVISION_STATUS.md
            ROUND9_BUILD_SUMMARY.json
            ROUND9_STRUCTURAL_VERIFICATION.json
            ROUND9_HOSTILE_REREVIEW.json
            ROUND9_INTERNAL_HARSH_REREVIEW.md
            ROUND9_HISTORICAL_DERIVATION_AUDIT.md
            ROUND9_PROOF_DEPENDENCY_LEDGER.md
            ROUND9_REFEREE_INVENTORY.md
            ROUND9_REFEREE_INVENTORY.json
            REFEREE_ROUND9_RESPONSE.md
          if-no-files-found: error
