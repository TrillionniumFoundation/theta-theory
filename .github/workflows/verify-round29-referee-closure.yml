name: Verify Round 29 referee closure

on:
  push:
    branches:
      - revision/round29-referee-positive-closure-11paper-2026-09-02
  pull_request:
    paths:
      - 'papers/**/ROUND29_POSITIVE_CLOSURE.tex'
      - 'papers/**/ROUND29_REVISION.tex'
      - 'papers/**/main.tex'
      - 'ROUND29_*'
      - 'AUTHOR_RESPONSE_ROUND28.md'
      - 'tools/verify_round29.py'
      - '.github/workflows/verify-round29-referee-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-regressions-build-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - name: Verify active source graph and rebuild all manuscripts
        env:
          TERM: xterm
        run: python3 tools/verify_round29.py --build
      - name: Show page inventory
        run: |
          pdfinfo ROUND29_REVISION_DOSSIER.pdf | grep '^Pages:'
          find papers -name 'ROUND29_REVISION.pdf' -print -exec pdfinfo {} \; \
            | grep -E 'ROUND29_REVISION.pdf|^Pages:'
      - name: Upload next-review manuscripts
        uses: actions/upload-artifact@v4
        with:
          name: theta-round29-next-review-manuscripts
          if-no-files-found: error
          path: |
            ROUND29_REVISION_DOSSIER.pdf
            papers/*/ROUND29_REVISION.pdf
            papers/*/main.pdf
