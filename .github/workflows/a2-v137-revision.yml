name: A2 v137 intrinsic coefficient reconstruction
on:
  push:
    branches:
      - revision/a2-v137-intrinsic-coefficient-torelli-2026-09-23
    paths:
      - 'revisions/a2-v137/**'
      - '.github/workflows/a2-v137-revision.yml'
      - 'A2_REVISION_V137_INDEX.md'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: a2-v137-referee-build
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/revision/a2-v137-intrinsic-coefficient-torelli-2026-09-23'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REVISION: papers/A2-v17-boundary-information-coarsening/article/v137
      TARGET_BRANCH: revision/a2-v137-intrinsic-coefficient-torelli-2026-09-23
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify transport and assemble from the immutable v136 review
        run: |
          python revisions/a2-v137/unpack.py
          python revisions/a2-v137/assemble.py
      - name: Install mathematical build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern
          python -m pip install 'sympy==1.14.0' 'numpy==2.3.5' 'PyMuPDF==1.26.7'
      - name: Execute twelve exact scripts and compile three manuscripts
        run: bash "$REVISION/build.sh"
      - name: Record successful source-bound publication
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import json, os, re
          p=Path(os.environ['REVISION'])
          r=json.loads((p/'evidence/BUILD_RECEIPT.json').read_text())
          assert r['ok'] and all(r['checks'].values())
          assert len(r['scripts_executed'])==12
          assert all(not v['outside_page_blocks'] for v in r['pdfs'].values())
          url=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          s='Remote build completed successfully: [GitHub Actions run]('+url+').\n\n'
          s+='Source commit: `'+r['source_commit']+'`.\n\n'
          s+='PDF pages: '+', '.join(n+' '+str(v['pages']) for n,v in r['pdfs'].items())+'. '
          s+='Twelve exact scripts, all inherited mathematical labels, source hashes, references, page bounds and absence of overfull boxes passed. '
          s+='Structural proofs and historical priority are not machine-certified.\n'
          index=Path('A2_REVISION_V137_INDEX.md')
          text,count=re.subn(r'<!-- REMOTE_BUILD_START -->.*?<!-- REMOTE_BUILD_END -->',
              '<!-- REMOTE_BUILD_START -->\n'+s+'<!-- REMOTE_BUILD_END -->',index.read_text(),flags=re.S)
          assert count==1
          index.write_text(text)
          PYCODE
      - name: Verify predecessor manuscript and every review remain untouched
        run: git diff --exit-code d15c9bcabdfc31070b773e2c8014601e75d4e641 -- papers/A2-v17-boundary-information-coarsening/article/v136 reviews
      - name: Publish native editable sources PDFs and executed evidence on v137 only
        run: |
          test "${GITHUB_REF#refs/heads/}" = "$TARGET_BRANCH"
          find "$REVISION" revisions/a2-v137 -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -f "$REVISION"/*.aux "$REVISION"/*.out "$REVISION"/*.log "$REVISION"/*.toc
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$REVISION" revisions/a2-v137 A2_REVISION_V137_INDEX.md
          if ! git diff --cached --quiet; then
            git commit -m 'A2 v137: native manuscripts and executed source-bound evidence [skip ci]'
            git push origin "HEAD:$TARGET_BRANCH"
          fi
      - name: Package the complete referee revision
        run: tar -czf a2-v137-referee-bundle.tar.gz A2_REVISION_V137_INDEX.md revisions/a2-v137 "$REVISION"
      - uses: actions/upload-artifact@v4
        with:
          name: a2-v137-referee-bundle
          path: a2-v137-referee-bundle.tar.gz
          retention-days: 30
