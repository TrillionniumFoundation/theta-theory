name: A2 v161 complete revision publication
on:
  push:
    branches: [revision/a2-v161-multiple-incidence-contact-singularities-2026-09-25]
    paths:
      - .github/workflows/a2-v161-build.yml
      - papers/A2-v17-boundary-information-coarsening/article/v161/*.py
      - papers/A2-v17-boundary-information-coarsening/article/v161/multiple-incidence-v161.tex
      - papers/A2-v17-boundary-information-coarsening/article/v161/higher-contact-v161.tex
      - papers/A2-v17-boundary-information-coarsening/article/v161/effective-boundary-v161.tex
permissions:
  contents: write
concurrency:
  group: a2-v161-complete-publication
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install exact algebra and compilation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils python3-venv
          python3 -m venv /tmp/a2-v161-env
          /tmp/a2-v161-env/bin/pip install 'sympy==1.14.0'
      - name: Exact audits and complete inherited v160 chain
        run: /tmp/a2-v161-env/bin/python papers/A2-v17-boundary-information-coarsening/article/v161/check_v161.py
      - name: Assemble and compile both complete papers and preservation master
        run: /tmp/a2-v161-env/bin/python papers/A2-v17-boundary-information-coarsening/article/v161/assemble_v161.py --build
      - name: Prepare source-bound reading entry and render the new theorem pages
        run: |
          /tmp/a2-v161-env/bin/python papers/A2-v17-boundary-information-coarsening/article/v161/publish_v161.py
          p=papers/A2-v17-boundary-information-coarsening/article/v161
          { python3 --version; /tmp/a2-v161-env/bin/python -c 'import sympy; print("SymPy",sympy.__version__)'; pdflatex --version | head -2; echo "Source $GITHUB_SHA"; echo "Run $GITHUB_RUN_ID"; } > "$p/BUILD_ENVIRONMENT.txt"
      - name: Archive outputs before attempting publication
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a2-v161-complete-review-build
          path: papers/A2-v17-boundary-information-coarsening/article/v161
          retention-days: 30
          if-no-files-found: error
      - name: Publish complete objects to this revision branch only
        env:
          GH_PUBLICATION_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = revision/a2-v161-multiple-incidence-contact-singularities-2026-09-25
          p=papers/A2-v17-boundary-information-coarsening/article/v161
          auth=$(printf 'x-access-token:%s' "$GH_PUBLICATION_TOKEN" | base64 -w0)
          head=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          test "$head" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$p"/*.tex "$p"/*.pdf "$p"/*.json "$p"/*.md "$p"/BUILD_ENVIRONMENT.txt "$p"/render-audit/*.png CURRENT_REVIEW_ENTRY.md
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess
          p=Path('papers/A2-v17-boundary-information-coarsening/article/v161')
          r=json.loads((p/'BUILD_RECEIPT_V161.json').read_text())
          c=json.loads((p/'EXACT_CHECKS_V161.json').read_text())
          assert r['compiled'] and r['all_predecessor_math_blocks_retained_byte_for_byte'] and r['body_partitioned_exactly_once']
          assert r['predecessor_labels']==421 and r['predecessor_math_blocks']==277
          assert c['all_checks_pass'] and c['inherited_v160_suite_actually_rerun']
          for name,o in r['outputs'].items():
              assert o['clean_references_and_no_overfull_hboxes']
              assert hashlib.sha256((p/(name+'.pdf')).read_bytes()).hexdigest()==o['pdf_sha256']
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert paths and all(x.startswith(str(p)+'/') or x=='CURRENT_REVIEW_ENTRY.md' for x in paths),paths
          for name in ('reconstruction','divisor-geometry','geometry'):assert str(p/(name+'.pdf')) in paths
          print('Complete outputs and strictly scoped publication paths verified.')
          PY
          git commit -m 'A2 v161: publish complete manuscripts, PDFs and passing audit receipts [skip ci]'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
