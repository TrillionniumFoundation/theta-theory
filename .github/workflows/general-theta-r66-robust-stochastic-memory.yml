name: General Theta R66 source-bound native verification
on:
  push:
    branches:
      - revision/general-theta-r66-robust-stochastic-memory-20261016
    paths:
      - papers/General-Theta-Foundations-I-restart/r66-robust-stochastic-memory/**
      - papers/General-Theta-Foundations-I-restart/r66-robust-stochastic-memory-publication/**
      - .github/workflows/general-theta-r66-robust-stochastic-memory.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact source and its publication record
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            papers/General-Theta-Foundations-I-restart/r66-robust-stochastic-memory
            papers/General-Theta-Foundations-I-restart/r66-robust-stochastic-memory-publication
      - name: Install native verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-venv texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
          python3 -m venv "$RUNNER_TEMP/r66-env"
          "$RUNNER_TEMP/r66-env/bin/python" -m pip install -r papers/General-Theta-Foundations-I-restart/r66-robust-stochastic-memory/requirements.txt
      - name: Verify complete source, six diagnostic generations and native documents
        shell: bash
        run: |
          set -euo pipefail
          P=papers/General-Theta-Foundations-I-restart/r66-robust-stochastic-memory
          "$RUNNER_TEMP/r66-env/bin/python" "$P/verify.py" --out "$RUNNER_TEMP/r66-result" --source-commit "$GITHUB_SHA"
          cp -a "$P" "$RUNNER_TEMP/r66-result/source"
          cp -a papers/General-Theta-Foundations-I-restart/r66-robust-stochastic-memory-publication "$RUNNER_TEMP/r66-result/publication"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/r66-result/SOURCE_COMMIT.txt"
      - name: Upload native review packet and actual logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: general-theta-r66-independent-${{ github.sha }}
          path: ${{ runner.temp }}/r66-result
          if-no-files-found: warn
          retention-days: 90
