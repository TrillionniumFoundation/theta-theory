name: A2 v17 complete native build
on:
  push:
    branches:
      - revision/a2-v17-boundary-information-coarsening-2026-09-11
    paths:
      - papers/A2-v17-boundary-information-coarsening/**
      - .github/workflows/a2-v17-native-build.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve the exact complete native source
        run: |
          mkdir -p "${RUNNER_TEMP}/a2-v17-source"
          git rev-parse HEAD > "${RUNNER_TEMP}/a2-v17-source/source-commit.txt"
          tar -czf "${RUNNER_TEMP}/a2-v17-source/native-source.tar.gz" -C papers A2-v17-boundary-information-coarsening
      - uses: actions/upload-artifact@v4
        with:
          name: a2-v17-native-source-${{ github.sha }}
          path: ${{ runner.temp }}/a2-v17-source
          retention-days: 30
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils python3-numpy python3-scipy
      - name: Build original companion before the complete article
        run: |
          python3 papers/A2-v17-boundary-information-coarsening/tools/build_submission.py --output-dir "${RUNNER_TEMP}/a2-v17-build"
      - name: Verify boundary diagnostics in both Python modes
        run: |
          python3 papers/A2-v17-boundary-information-coarsening/tools/check_boundary_information.py > "${RUNNER_TEMP}/a2-v17-build/boundary-normal.json"
          python3 -O papers/A2-v17-boundary-information-coarsening/tools/check_boundary_information.py > "${RUNNER_TEMP}/a2-v17-build/boundary-optimized.json"
          cmp "${RUNNER_TEMP}/a2-v17-build/boundary-normal.json" "${RUNNER_TEMP}/a2-v17-build/boundary-optimized.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a2-v17-native-build-${{ github.sha }}
          path: ${{ runner.temp }}/a2-v17-build
          if-no-files-found: warn
          retention-days: 30
