name: Read-only verification of Round 45
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ROUND45_REVISION.tex'
      - 'round45/**'
      - 'tests/test_round45.py'
      - 'tools/verify_round45.py'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern
      - name: Verify frozen sources
        run: python3 tools/verify_round45.py --build --source-sha "$(git rev-parse HEAD)"
