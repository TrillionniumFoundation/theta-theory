name: verify-publish-round23-referee

on:
  push:
    branches:
      - revision/round23-referee-positive-closure-11paper-2026-09-02
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-publish-round23-referee
  cancel-in-progress: false

jobs:
  verify-build-publish:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out the exact revision branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run source, citation, dependency, and mathematical regression gates
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m py_compile tools/verify_round23.py tools/write_round23_build_record.py 2>&1 | tee /tmp/round23-verify.log
          python tools/verify_round23.py 2>&1 | tee -a /tmp/round23-verify.log

      - name: Persist verifier failure on the revision branch
        if: ${{ steps.verify.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# Round-Twenty-Three CI diagnostic'
            echo
            echo '**Stage:** source/citation/dependency/mathematical-regression verifier  '
            echo "**Source commit:** \`${GITHUB_SHA}\`  "
            echo "**Run:** \`${GITHUB_RUN_ID}\`"
            echo
            echo '```text'
            tail -n 200 /tmp/round23-verify.log
            echo '```'
          } > ROUND23_CI_DIAGNOSTIC.md
          git config user.name theta-theory-round23-bot
          git config user.email actions@users.noreply.github.com
          git add ROUND23_CI_DIAGNOSTIC.md
          git commit -m 'Record Round 23 verifier failure [skip ci]'
          git push origin HEAD:revision/round23-referee-positive-closure-11paper-2026-09-02
          exit 1

      - name: Install the TeX toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            biber \
            lmodern \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-bibtex-extra

      - name: Clean-build all eleven manuscripts
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          make clean 2>&1 | tee /tmp/round23-build.log
          make all 2>&1 | tee -a /tmp/round23-build.log

      - name: Persist TeX/build failure on the revision branch
        if: ${{ steps.build.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# Round-Twenty-Three CI diagnostic'
            echo
            echo '**Stage:** clean build of all eleven manuscripts  '
            echo "**Source commit:** \`${GITHUB_SHA}\`  "
            echo "**Run:** \`${GITHUB_RUN_ID}\`"
            echo
            echo '```text'
            tail -n 300 /tmp/round23-build.log
            echo '```'
          } > ROUND23_CI_DIAGNOSTIC.md
          git config user.name theta-theory-round23-bot
          git config user.email actions@users.noreply.github.com
          git add ROUND23_CI_DIAGNOSTIC.md
          git commit -m 'Record Round 23 TeX build failure [skip ci]'
          git push origin HEAD:revision/round23-referee-positive-closure-11paper-2026-09-02
          exit 1

      - name: Re-run fail-closed gates and write exact build records
        run: |
          set -euo pipefail
          python tools/verify_round23.py
          python tools/write_round23_build_record.py

      - name: Commit generated regression evidence, PDFs, and hashes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name theta-theory-round23-bot
          git config user.email actions@users.noreply.github.com
          git rm -f --ignore-unmatch ROUND23_CI_DIAGNOSTIC.md
          git add \
            ROUND23_REGRESSION_RESULTS.json \
            ROUND23_BUILD_SUMMARY.json \
            ROUND23_REVISION_STATUS.md
          git add -f papers/*/main.pdf
          if git diff --cached --quiet; then
            echo 'Generated Round-Twenty-Three artifacts already match the branch.'
          else
            git commit -m 'Build all eleven Round-Twenty-Three manuscripts [skip ci]'
            git push origin HEAD:revision/round23-referee-positive-closure-11paper-2026-09-02
          fi

      - name: Upload the next-round referee packet
        uses: actions/upload-artifact@v4
        with:
          name: theta-theory-round23-referee-packet-${{ github.run_id }}
          path: |
            papers/*/main.pdf
            papers/*/ROUND23_POSITIVE_CLOSURE.tex
            papers/*/AUTHOR_RESPONSE_ROUND22.md
            REFEREE_REPORT_ROUND22_GPT56_PRO_HARSH.md
            REFEREE_ROUND22_RESPONSE.md
            ROUND23_HISTORICAL_DERIVATION_AUDIT.md
            ROUND23_PROOF_DEPENDENCY_LEDGER.md
            ROUND23_MATHEMATICAL_REGRESSION.md
            ROUND23_INTERNAL_HARSH_REREVIEW.md
            ROUND23_SOURCE_MANIFEST.json
            ROUND23_REGRESSION_RESULTS.json
            ROUND23_BUILD_SUMMARY.json
            ROUND23_REVISION_STATUS.md
          if-no-files-found: error
          retention-days: 90
