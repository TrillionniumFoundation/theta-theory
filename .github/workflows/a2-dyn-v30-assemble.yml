name: A2-DYN v30 one-time exact source transport
on:
  push:
    branches:
      - revision/a2-dyn-v30-referee-response-2026-10-07
    paths:
      - .github/a2-dyn-v30-transport/**
      - .github/workflows/a2-dyn-v30-assemble.yml
permissions:
  contents: write
jobs:
  assemble:
    if: contains(github.event.head_commit.message, '[assemble-v30]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Create checksum-verified immutable source objects only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/a2-dyn-v30-transport/assemble.py
      - name: Record source transport and assembly evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-dyn-v30-assembly-${{ github.sha }}
          include-hidden-files: true
          retention-days: 7
          path: |
            /tmp/a2-dyn-v30-assembly.json
            .github/a2-dyn-v30-transport
