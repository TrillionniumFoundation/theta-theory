name: A2 v52 support and interior-window native submission
on:
  push:
    branches:
      - revision/a2-v52-interior-window-rigidity-2026-09-15
    paths:
      - papers/A2-v17-boundary-information-coarsening/**/*.tex
      - papers/A2-v17-boundary-information-coarsening/tools/**
      - .github/workflows/a2-v52-native-submission.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions:
      contents: write
    outputs:
      source_commit: ${{ steps.source.outputs.source_commit }}
    steps:
      - name: Check out the exact preparation commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Materialize the complete manuscript and preserve the reviewed source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = revision/a2-v52-interior-window-rigidity-2026-09-15
          P=papers/A2-v17-boundary-information-coarsening
          python3 -B "$P/tools/materialize_revision_v52.py" > "$RUNNER_TEMP/materialization-v52.json"
          A="$P/history/v51-review-baseline"
          test -e "$A/REPOSITORY_README.md" || cp README.md "$A/REPOSITORY_README.md"
          test -e "$A/README.md" || cp "$P/README.md" "$A/README.md"
          cat > README.md <<'EOF'
          # Theta-Theory: A2 revision 52

          **Boundary laws and rigidity of periodic dispersing billiards** — Qian Qi, September 15, 2026.

          [Complete main source](papers/A2-v17-boundary-information-coarsening/main.tex) · [Complete companion](papers/A2-v17-boundary-information-coarsening/two_collision.tex) · [Response to the latest v51 report](papers/A2-v17-boundary-information-coarsening/RESPONSE_TO_REFEREE_V52.md) · [Historical audit](papers/A2-v17-boundary-information-coarsening/HISTORICAL_DERIVATION_AUDIT_V52.md) · [Primary literature check](papers/A2-v17-boundary-information-coarsening/LITERATURE_CHECK_V52.md).

          Author branch: `revision/a2-v52-interior-window-rigidity-2026-09-15`. Latest review head: `d0fd9a9b0d5cdd8004f42a7f109e39de50adda75`; actual reviewed source: `b9201bc272bc7ecbab1ad6a91fc844216685fadd`.

          The new Section 14.6–14.8 records the referee's complete-support centering comparison, then proves signed-action and full-table reconstruction from a known positive interior recording window containing both unknown numerical origins. The physical cap boundary and discarded mass are not observed. The original Theorems A/B and all inherited proof bodies remain active. The introduction identifies the common relative measure and the different observation requirements of the three parts.

          All 109 inherited active inputs remain active; 104 are byte-identical in place and five exact originals are archived. All 532 inherited statement/proof blocks, including 250 proofs, are preserved verbatim. The new graph has 110 active inputs. A1 and other workstreams are unchanged.

          Native products will be retained by the version-scoped workflow under `deliveries/a2-v52/<actual-source-commit>/` on `revision/a2-v52-native-products-<run>-<attempt>`. The final review-ready entry will name the verified products. This source entry does not claim that an unfinished workflow succeeded.
          EOF
          cat > "$P/README.md" <<'EOF'
          # A2 revision 52 — complete manuscript

          [Main source](main.tex) · [Full companion](two_collision.tex) · [Response to v51](RESPONSE_TO_REFEREE_V52.md) · [Historical audit](HISTORICAL_DERIVATION_AUDIT_V52.md) · [Primary literature check](LITERATURE_CHECK_V52.md).

          The historical directory name `A2-v17` is not the current revision number. The new [support and interior-window module](article/23q_support_and_interior_windows_v52.tex) appends Section 14.6–14.8. It distinguishes complete-support centering from boundary-independent interior extraction, then proves the same geometric fiber and projected derivative kernel for positive rectangular windows containing the unknown origins. Window visibility, signed units, directions, gaps and offsets remain specified hypotheses.

          The complete Theorems A/B and all inherited proof blocks remain active. The [v51 baseline archive](history/v51-review-baseline/) retains the exact originals of the five amended inputs and the source-matched active manifest. The catalogue remains compiled in Appendix A.1, and the quantitative and calibration modules are unchanged.

          The native workflow compiles both complete entries from the actual committed source and retains both PDFs, the full source ZIP, manifests, logs and paired controls. The completed source and product identities and actual visual coverage belong to the final v52 review-ready ledger, not this preparatory source entry.
          EOF
          git switch -C "$GITHUB_REF_NAME"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md "$P"
          if ! git diff --cached --quiet; then
            git commit -m 'A2 v52: materialize the complete interior-window revision and archive exact reviewed v51 inputs'
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
          SOURCE=$(git rev-parse HEAD)
          echo "source_commit=$SOURCE" >> "$GITHUB_OUTPUT"
          printf 'Preparation: `%s`\n\nActual mathematical source: `%s`\n' "$GITHUB_SHA" "$SOURCE" >> "$GITHUB_STEP_SUMMARY"
      - name: Install the native toolchain and diagnostic libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils python3-numpy python3-scipy python3-sympy
      - name: Verify verbatim preservation and finite controls in both Python modes
        shell: bash
        run: |
          set -euo pipefail
          P=papers/A2-v17-boundary-information-coarsening
          for script in check_revision_v52 check_quantized_v46 check_adaptive check_revision_v32 check_revision_v38; do
            /usr/bin/python3 -B "$P/tools/$script.py" > "$RUNNER_TEMP/$script-normal.json"
            /usr/bin/python3 -O -B "$P/tools/$script.py" > "$RUNNER_TEMP/$script-optimized.json"
            cmp "$RUNNER_TEMP/$script-normal.json" "$RUNNER_TEMP/$script-optimized.json"
          done
      - name: Compile both complete entries from actual source Git objects
        env:
          SOURCE: ${{ steps.source.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          /usr/bin/python3 -B papers/A2-v17-boundary-information-coarsening/tools/build_submission.py --output-dir "$RUNNER_TEMP/a2-v52-native-$SOURCE"
          cp "$RUNNER_TEMP"/check_*-normal.json "$RUNNER_TEMP"/check_*-optimized.json "$RUNNER_TEMP/a2-v52-native-$SOURCE/"
          cp "$RUNNER_TEMP/materialization-v52.json" "$RUNNER_TEMP/a2-v52-native-$SOURCE/"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/a2-v52-native-$SOURCE/workflow-preparation-commit.txt"
      - name: Retain products and raw evidence
        if: always() && steps.source.outputs.source_commit != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a2-v52-native-${{ steps.source.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a2-v52-native-${{ steps.source.outputs.source_commit }}/
          if-no-files-found: error
          retention-days: 90
  publish-verified-products:
    needs: native
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.native.outputs.source_commit }}
          fetch-depth: 1
          persist-credentials: true
      - name: Retrieve and validate the source-matched native products
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ needs.native.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          P=papers/A2-v17-boundary-information-coarsening
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "a2-v52-native-$SOURCE-$GITHUB_RUN_ATTEMPT" --dir "$RUNNER_TEMP/v52"
          python3 -B "$P/tools/retain_native_v52.py" prepare --evidence "$RUNNER_TEMP/v52" --destination "deliveries/a2-v52/$SOURCE" --source-commit "$SOURCE" --run-id "$GITHUB_RUN_ID"
      - name: Publish on a new products branch and verify fetched Git objects
        env:
          SOURCE: ${{ needs.native.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          P=papers/A2-v17-boundary-information-coarsening
          D="deliveries/a2-v52/$SOURCE"
          branch="revision/a2-v52-native-products-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$D"
          python3 -B "$P/tools/retain_native_v52.py" verify --destination "$D" --ref INDEX
          git commit -m 'A2 v52: retain both complete native manuscripts and all source-matched evidence'
          git push origin "HEAD:refs/heads/$branch"
          git fetch origin "refs/heads/$branch"
          python3 -B "$P/tools/retain_native_v52.py" verify --destination "$D" --ref FETCH_HEAD --attestation
          git add -- "$D/COMMITTED_OBJECTS_VERIFIED.json"
          git commit -m 'A2 v52: attest the fetched published native Git objects'
          git push origin "HEAD:refs/heads/$branch"
          git fetch origin "refs/heads/$branch"
          python3 -B "$P/tools/retain_native_v52.py" verify --destination "$D" --ref FETCH_HEAD
          printf 'Source: `%s`\n\nProducts branch: `%s`\n\nVerified final head: `%s`\n' "$SOURCE" "$branch" "$(git rev-parse FETCH_HEAD)" >> "$GITHUB_STEP_SUMMARY"
