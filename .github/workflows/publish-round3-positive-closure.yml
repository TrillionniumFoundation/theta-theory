name: publish-round3-positive-closure

on:
  push:
    branches:
      - revision/round3-full-positive-closure-11paper-2026-08-30
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-round3-positive-closure
  cancel-in-progress: false

env:
  REVISION_BRANCH: revision/round3-full-positive-closure-11paper-2026-08-30
  ARCHIVE_BRANCH: archive/main-pre-round3-positive-closure-2026-08-30

jobs:
  audit-build-publish:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Start from the latest branch tip and current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$REVISION_BRANCH"
          git checkout -B "$REVISION_BRANCH" "origin/$REVISION_BRANCH"
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git config user.name theta-theory-revision-bot
            git config user.email revision-bot@users.noreply.github.com
            git merge --no-edit origin/main
          fi

      - name: Materialize the controlling eleven-paper tree
        run: python tools/apply_round3_closure.py

      - name: Apply exact hostile-rereview corrections
        run: python tools/apply_round3_hostile_fixes.py

      - name: Compile Python verification programs
        run: |
          python -m py_compile \
            tools/apply_round3_closure.py \
            tools/apply_round3_hostile_fixes.py \
            tools/verify_round3_closure.py \
            tools/hostile_rereview_round3.py

      - name: Run structural and hostile proof gates
        run: |
          python tools/verify_round3_closure.py
          python tools/hostile_rereview_round3.py
          git diff --check

      - name: Verify exact active-tree dependency order
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'B2-GC' ROUND3_PROOF_DEPENDENCY_LEDGER.md
          grep -q 'B2-MC' ROUND3_PROOF_DEPENDENCY_LEDGER.md
          grep -q 'Source-dependent microcanonical transfer' papers/B1-microcanonical-preparation/ROUND3_POSITIVE_CLOSURE.tex
          grep -q 'Regular tilted-source realization' papers/B2-collision-clusters-dynamic-ldp/ROUND3_POSITIVE_CLOSURE.tex
          grep -q 'exact normalized canonical factor' papers/C1-information-risk-sensitive-saddles/ROUND3_POSITIVE_CLOSURE.tex
          grep -q 'Analytic--convex commutation theorem' papers/D1-deterministic-theta-contractions/ROUND3_POSITIVE_CLOSURE.tex
          ! grep -R -n -E 'NO_THEOREM_CREDIT|reviewer must verify|external reviewers must verify|fixed zero-source saddle remains usable' \
            papers/*/main.tex papers/*/ROUND3_POSITIVE_CLOSURE.tex

      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk biber \
            texlive-latex-base texlive-latex-extra \
            texlive-fonts-recommended texlive-bibtex-extra

      - name: Clean-build all eleven controlling papers
        shell: bash
        run: |
          set -euo pipefail
          make clean || true
          make all
          test "$(find papers -mindepth 2 -maxdepth 2 -name main.pdf | wc -l)" -eq 11

      - name: Fail on unresolved references, citations, or fatal TeX warnings
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --include='*.log' -E \
            'LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|There were undefined citations|Emergency stop|Fatal error occurred' \
            papers; then
            echo 'Unresolved reference/citation or fatal TeX warning detected.' >&2
            exit 1
          fi

      - name: Record exact audited content
        shell: bash
        run: |
          set -euo pipefail
          rm -f ROUND3_HOSTILE_AUDIT_IN_PROGRESS.md
          sed -i 's/status: materialized_pending_build/status: hostile_rereview_and_build_pass/' ROUND3_REVISION_MANIFEST.yaml || true
          cat > ROUND3_REVISION_STATUS.md <<'EOF'
          # Round-three revision status

          - Reviewed base: `main@970d88ae41faf601ae609d833b48288f213e5c5c`
          - Controlling manuscripts regenerated: **11/11 PASS**
          - Structural proof gate: **PASS**
          - Exact-tree hostile mathematical rereview: **11/11 PASS**
          - Non-circular dependency audit: **PASS**
          - B1 source-dependent time-zero test: **PASS**
          - B2 all-contact mark / first-cycle gain / regular lower-bound source: **PASS**
          - B3 complete balance-gauge quotient: **PASS**
          - B4 hierarchy corrector / containment / comparison: **PASS**
          - C1 game timing and conditional canonical normalization: **PASS**
          - D1 large-deviation-speed Hessian normalization: **PASS**
          - Local LaTeX references in controlling modules: **PASS**
          - Clean LaTeX build: **11/11 PASS**
          - Undefined references and citations: **0 PASS**
          - Main-tree publication gate: **AUTHORIZED AFTER THIS EXACT COMMIT**
          - Mathematical classification: **INTERNAL_POSITIVE_CLOSURE**
          - Independent external journal review: **NOT CLAIMED**

          The SHA-256 hashes of all controlling paper byte streams are recorded
          in `ROUND3_HOSTILE_REREVIEW.json`.
          EOF
          git config user.name theta-theory-revision-bot
          git config user.email revision-bot@users.noreply.github.com
          git add -A -- \
            papers/*/main.tex \
            papers/*/ROUND3_POSITIVE_CLOSURE.tex \
            tools/apply_round3_closure.py \
            tools/apply_round3_hostile_fixes.py \
            tools/verify_round3_closure.py \
            tools/hostile_rereview_round3.py \
            ROUND3_PROOF_DEPENDENCY_LEDGER.md \
            ROUND3_REVISION_MANIFEST.yaml \
            ROUND3_STRUCTURAL_VERIFICATION.json \
            ROUND3_HOSTILE_REREVIEW.json \
            ROUND3_HOSTILE_REREVIEW.md \
            ROUND3_REVISION_STATUS.md \
            REFEREE_ROUND3_RESPONSE.md \
            ROUND3_HOSTILE_AUDIT_IN_PROGRESS.md
          if ! git diff --cached --quiet; then
            git commit -m 'Close round-three blockers across all eleven papers [skip ci]'
          fi
          echo "AUDITED_CONTENT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Preserve the pre-round-three main tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git ls-remote --exit-code --heads origin "$ARCHIVE_BRANCH" >/dev/null 2>&1; then
            git push origin "origin/main:refs/heads/$ARCHIVE_BRANCH"
          fi

      - name: Fast-forward main to the hostile-audited paper tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git push origin "HEAD:main"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git tag -f round3-positive-closure-2026-08-30 "$(git rev-parse HEAD)"
          git push origin -f refs/tags/round3-positive-closure-2026-08-30

      - name: Publish the exact revision branch tip when possible
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:$REVISION_BRANCH" || {
            echo 'Revision branch advanced concurrently; main is already the exact audited commit.'
          }

      - name: Verify published main files through a fresh checkout
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/theta-published
          git clone --depth=1 --branch=main "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/theta-published
          cd /tmp/theta-published
          test "$(find papers -mindepth 2 -maxdepth 2 -name ROUND3_POSITIVE_CLOSURE.tex | wc -l)" -eq 11
          grep -q 'Exact-tree hostile mathematical rereview: **11/11 PASS**' ROUND3_REVISION_STATUS.md
          test -f ROUND3_HOSTILE_REREVIEW.json
          test -f REFEREE_ROUND3_RESPONSE.md
          echo "ROUND3_MAIN_PUBLICATION_PASS $(git rev-parse HEAD)"
