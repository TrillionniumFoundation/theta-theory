name: Verify Round 27 referee closure

on:
  push:
    branches:
      - revision/round27-referee-positive-closure-11paper-2026-09-02
  pull_request:
    paths:
      - 'papers/**/ROUND27_POSITIVE_CLOSURE.tex'
      - 'papers/**/ROUND27_REVISION.tex'
      - 'papers/**/main.tex'
      - 'ROUND27_*'
      - 'AUTHOR_RESPONSE_ROUND26.md'
      - 'tools/verify_round27.py'
      - '.github/workflows/verify-round27-referee-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-build:
    if: github.event_name != 'pull_request' || github.head_ref == 'revision/round27-referee-positive-closure-11paper-2026-09-02'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - name: Verify active sources and rebuild all manuscripts
        env:
          TERM: xterm
        run: python3 tools/verify_round27.py --build
      - name: Show PDF inventory
        run: |
          pdfinfo ROUND27_REVISION_DOSSIER.pdf | grep '^Pages:'
          find papers -name 'ROUND27_REVISION.pdf' -print -exec pdfinfo {} \; \
            | grep -E 'ROUND27_REVISION.pdf|^Pages:'
      - name: Upload referee PDFs
        uses: actions/upload-artifact@v4
        with:
          name: theta-round27-referee-pdfs
          if-no-files-found: error
          path: |
            ROUND27_REVISION_DOSSIER.pdf
            papers/*/ROUND27_REVISION.pdf
            papers/*/main.pdf
