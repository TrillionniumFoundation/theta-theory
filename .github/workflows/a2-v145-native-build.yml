name: A2 v145 native revision and twenty-one-check publication
on:
  push:
    branches: ['revision/a2-v145-intrinsic-reconstruction-referee-2026-09-24']
    paths:
      - '.revision-bootstrap/a2-v145/**'
      - '.github/workflows/a2-v145-native-build.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: a2-v145-native-build
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRANCH: revision/a2-v145-intrinsic-reconstruction-referee-2026-09-24
      P: papers/A2-v17-boundary-information-coarsening/article/v145
      OPENBLAS_NUM_THREADS: '1'
      SYMPY_GROUND_TYPES: flint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Publish complete native source before compiling it
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor d8376b5dbb47422d93a474add8362d39cf2a68c1 HEAD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! test -f "$P/geometry.tex"; then
            python .revision-bootstrap/a2-v145/assemble.py
            mkdir -p "$P/review_inputs"
            git show d8376b5dbb47422d93a474add8362d39cf2a68c1:reviews/a2-v144-independent-harsh-top4-r2-2026-09-24/REFEREE_REPORT.md > "$P/review_inputs/V144_SECOND_REPORT.md"
            git show e392e7ba5f04a94444831140b22638ae42aa2972:reviews/a2-v144-independent-harsh-top4-2026-09-24/REFEREE_REPORT.md > "$P/review_inputs/V144_FIRST_REPORT.md"
            test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
            git add -A -f -- "$P" revisions/a2-v145/history README.md CURRENT_REVIEW_ENTRY.md
            git commit -m 'A2 v145: native curve-supported inverse, precise orbit input, separate applications and full mathematical preservation [skip ci]'
            git push origin "HEAD:$BRANCH"
          fi
          SOURCE=$(git rev-parse HEAD)
          echo "A2_SOURCE_COMMIT=$SOURCE" >> "$GITHUB_ENV"
          echo "$SOURCE" > /tmp/a2-v145-source-commit.txt
      - name: Install native compilation and exact-arithmetic dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
          python -m pip install --disable-pip-version-check sympy==1.14.0 numpy==2.3.5 PyMuPDF==1.26.7 python-flint
      - name: Execute twenty-one scripts and compile three native manuscripts
        run: |
          set -euo pipefail
          bash "$P/build.sh" 2>&1 | tee /tmp/a2-v145-build.log
      - name: Publish verified PDFs and immutable referee source lock
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['P']);r=json.loads((p/'evidence/BUILD_RECEIPT_V145.json').read_text())
          assert r['all_checks_pass'] and r['source_commit']==os.environ['A2_SOURCE_COMMIT']
          assert r['executed_script_count']==21
          lock=json.loads((p/'SOURCE_LOCK_V145.json').read_text())
          assert lock['source_commit']==r['source_commit']
          prefix=str(p)
          lines=['# Canonical A2 referee entry — revision 145','',
          '**Native mathematical source commit:** `'+r['source_commit']+'`.',
          '**Controlling second-v144 report:** `d8376b5dbb47422d93a474add8362d39cf2a68c1`.',
          '**Additional first-v144 report:** `e392e7ba5f04a94444831140b22638ae42aa2972`.',
          '**Preserved v144 publication:** `542bcd5027e96ca41568f3eb9c3481dc0f296fed`.','',
          'The immutable source SHA defines the mathematical review object. All three native builds and twenty-one executed regression scripts passed in run '+os.environ['GITHUB_RUN_ID']+'. Finite regressions are not formal proof, an exhaustive priority audit or an editorial certificate.','',
          '**Principal submission:** [geometry.pdf]('+prefix+'/geometry.pdf). Its required proofs and references are internal.','',
          '**Separate applications manuscript:** [applications.pdf]('+prefix+'/applications.pdf).','',
          '**Non-submitted complete research archive:** [archive-v144.pdf]('+prefix+'/archive-v144.pdf). It preserves all predecessor mathematical parts and is not an additional submission supplement.','',
          '[Source lock]('+prefix+'/SOURCE_LOCK_V145.json) · [Source-bound receipt]('+prefix+'/evidence/BUILD_RECEIPT_V145.json) · [Nondeletion audit]('+prefix+'/NONDELETION_V145.json)','',
          '[Point-by-point response]('+prefix+'/RESPONSE_TO_V144_REPORTS.md) · [Issue matrix]('+prefix+'/ISSUE_MATRIX.json) · [Literature audit]('+prefix+'/LITERATURE_AUDIT_V145.md) · [Reading guide]('+prefix+'/README.md)','',
          'The main article retains the all-pencil inverse and its smallest uniform order, proves reconstruction on a projective curve and on one Schubert line, and supplies precise classical orthogonal inputs. The applications preserve critical collisions and clarify the prime-field-section and nonreduced Hessian arguments.','',
          'The full Ballico 1993 theorem-level six-axis comparison remains documentary-open. The verified Ohta input and the new curve theorem do not certify historical priority relative to that unread full text.','',
          'Earlier root entries are retained under revisions/a2-v145/history. Earlier versions and review branches are unchanged.']
          Path('CURRENT_REVIEW_ENTRY.md').write_text('\n'.join(lines)+'\n')
          PY
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$A2_SOURCE_COMMIT"
          git add -A -f -- "$P/geometry.pdf" "$P/applications.pdf" "$P/archive-v144.pdf" "$P/evidence" "$P/SOURCE_LOCK_V145.json" "$P/PROVENANCE_MANIFEST_V145.json" "$P/NONDELETION_V145.json" CURRENT_REVIEW_ENTRY.md
          git commit -m 'A2 v145: publish verified native PDFs, twenty-one-check receipt and source-bound referee entry [skip ci]'
          git push origin "HEAD:$BRANCH"
          git rev-parse HEAD > /tmp/a2-v145-publication-commit.txt
      - name: Package exact native referee objects
        if: always()
        run: |
          if test -d "$P"; then
            tar --exclude='__pycache__' --exclude='*.pyc' -czf /tmp/a2-v145-referee-bundle.tar.gz "$P" CURRENT_REVIEW_ENTRY.md
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a2-v145-native-referee-bundle
          path: |
            /tmp/a2-v145-referee-bundle.tar.gz
            /tmp/a2-v145-source-commit.txt
            /tmp/a2-v145-publication-commit.txt
            /tmp/a2-v145-build.log
            .revision-bootstrap/a2-v145
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: warn
