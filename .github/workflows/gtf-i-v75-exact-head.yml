name: GTF-I v75 exact-head read-only reconstruction
on:
  push:
    branches:
      - revision/general-theta-foundations-i-v75-full-measurement-body-2026-10-04
    paths:
      - papers/GTF-I-v75-biased-measurement-geometry/**
      - .github/workflows/gtf-i-v75-exact-head.yml
permissions:
  contents: read
concurrency:
  group: gtf75-final-${{ github.sha }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout the exact submitted object
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - name: Install typesetting and exact-arithmetic dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-venv texlive-latex-extra texlive-fonts-recommended lmodern
          python3 -m venv "$RUNNER_TEMP/gtf75-venv"
          "$RUNNER_TEMP/gtf75-venv/bin/pip" install --disable-pip-version-check -r papers/GTF-I-v75-biased-measurement-geometry/requirements.txt
      - name: Rebuild the submitted sources and every PDF page read-only
        run: |
          "$RUNNER_TEMP/gtf75-venv/bin/python" papers/GTF-I-v75-biased-measurement-geometry/build_revision.py --verify-published > "$RUNNER_TEMP/gtf75-FINAL_HEAD.json"
      - name: Independently rebuild the focused journal package
        run: |
          "$RUNNER_TEMP/gtf75-venv/bin/python" - <<'PY'
          import os,pathlib,subprocess,sys,zipfile
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'gtf75-journal-final'
          target.mkdir()
          with zipfile.ZipFile('papers/GTF-I-v75-biased-measurement-geometry/evidence/JOURNAL_PACKAGE.zip') as archive:
              archive.extractall(target)
          result=subprocess.run([sys.executable,str(target/'journal_verify.py')],check=True,capture_output=True)
          (target.parent/'gtf75-JOURNAL_FINAL.json').write_bytes(result.stdout)
          PY
      - name: Preserve source-bound reconstruction evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gtf-v75-final-head-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/gtf75-FINAL_HEAD.json
            ${{ runner.temp }}/gtf75-JOURNAL_FINAL.json
          if-no-files-found: error
