name: A2 v161 input audit
on:
  push:
    branches: [revision/a2-v161-multiple-incidence-contact-singularities-2026-09-25]
    paths: [.github/workflows/a2-v161-input-audit.yml]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - run: |
          mkdir -p /tmp/a2-v161
          tar -czf /tmp/a2-v161/inputs.tar.gz papers/A2-v17-boundary-information-coarsening/article/v161 reviews/a2-v160-independent-harsh-top4-2026-09-25
          git rev-parse HEAD > /tmp/a2-v161/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a2-v161-inputs
          path: /tmp/a2-v161
          retention-days: 7
