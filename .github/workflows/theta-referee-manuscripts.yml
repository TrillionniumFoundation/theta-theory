name: theta referee manuscripts

on:
  push:
    branches:
      - theta-referee-manuscripts-2026-08-28
    paths:
      - 'papers/referee-ready/**'
      - 'tools/verify_referee_manuscripts.py'
      - '.github/workflows/theta-referee-manuscripts.yml'
  pull_request:
    paths:
      - 'papers/referee-ready/**'
      - 'tools/verify_referee_manuscripts.py'
      - '.github/workflows/theta-referee-manuscripts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile verifier
        run: python3 -m py_compile tools/verify_referee_manuscripts.py
      - name: Run verifier
        run: python3 tools/verify_referee_manuscripts.py | tee referee-manuscript-verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: referee-manuscript-verification
          path: referee-manuscript-verification.json
          if-no-files-found: error

  latex:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        paper:
          - paper-I-bilateral-response
          - paper-II-pressure-diffusion
          - paper-III-rough-theta
          - paper-IV-filtering-games
          - paper-V-representations
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended
      - name: Build manuscript
        working-directory: papers/referee-ready/${{ matrix.paper }}
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.paper }}-pdf
          path: papers/referee-ready/${{ matrix.paper }}/main.pdf
          if-no-files-found: warn
