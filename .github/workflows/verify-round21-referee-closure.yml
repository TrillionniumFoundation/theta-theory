name: verify-publish-round21-referee

on:
  push:
    branches:
      - revision/round21-referee-positive-closure-11paper-2026-09-02
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-publish-round21-referee
  cancel-in-progress: false

jobs:
  verify-build-publish:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update manuscript wrappers
        run: python tools/update_round21_wrappers.py

      - name: Run source and dependency gates
        run: |
          python -m py_compile tools/update_round21_wrappers.py tools/verify_round21.py tools/write_round21_build_record.py
          python tools/verify_round21.py

      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk biber lmodern texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra

      - name: Clean-build all eleven manuscripts
        run: |
          make clean
          make all

      - name: Re-run source gates and write exact build records
        run: |
          python tools/verify_round21.py
          python tools/write_round21_build_record.py

      - name: Commit rebuilt wrappers, PDFs, and records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name theta-theory-round21-bot
          git config user.email actions@users.noreply.github.com
          git add papers/*/main.tex ROUND21_BUILD_SUMMARY.json ROUND21_REVISION_STATUS.md
          git add -f papers/*/main.pdf
          if git diff --cached --quiet; then
            echo 'No generated Round-Twenty-One files changed.' >&2
            exit 1
          fi
          git commit -m 'Build all eleven Round-Twenty-One manuscripts [skip ci]'
          git push origin HEAD:revision/round21-referee-positive-closure-11paper-2026-09-02

      - uses: actions/upload-artifact@v4
        with:
          name: theta-theory-round21-verified-papers-and-audit
          path: |
            papers/*/main.pdf
            papers/*/AUTHOR_RESPONSE_ROUND20.md
            ROUND21_BUILD_SUMMARY.json
            ROUND21_REVISION_STATUS.md
            ROUND21_HISTORICAL_DERIVATION_AUDIT.md
            ROUND21_PROOF_DEPENDENCY_LEDGER.md
            ROUND21_INTERNAL_HARSH_REREVIEW.md
            REFEREE_ROUND20_RESPONSE.md
          if-no-files-found: error
          retention-days: 90
