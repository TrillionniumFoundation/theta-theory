name: Round 33 immutable source and proof-example build
on:
  push:
    branches: [revision/round33-referee-positive-reconstruction-2026-09-03]
  pull_request:
    paths:
      - 'round33/**'
      - 'ROUND33_*'
      - 'AUTHOR_RESPONSE_ROUND32.md'
      - 'papers/**/ROUND33_REVISION.tex'
      - 'tests/test_round33.py'
      - 'tools/verify_round33.py'
      - '.github/workflows/verify-round33.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-verification:
    if: github.event_name != 'pull_request' || github.head_ref == 'revision/round33-referee-positive-reconstruction-2026-09-03'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - name: Validate the committed source without patching it
        run: |
          python3 tools/verify_round33.py --build
          git diff --exit-code
          git rev-parse HEAD > build/VERIFIED_SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: theta-round33-manuscripts-and-executed-evidence
          if-no-files-found: error
          path: |
            build/*/*.pdf
            build/ROUND33_BUILD_RESULTS.json
            build/ROUND33_REGRESSION_RESULTS.json
            build/VERIFIED_SOURCE_COMMIT.txt
            ROUND33_SOURCE_MANIFEST.json
