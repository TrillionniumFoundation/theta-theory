name: General Theta R9 pinned input export
on:
  push:
    branches: [foundation/general-theta-restart-r9-continuation-completion-research-2026-10-07]
    paths: [.github/workflows/general-theta-r9-pinned-input-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3c9b212f8673c95e3a28fd83811b8a4f3bacc431
          fetch-depth: 1
      - name: Export immutable inputs without modifying repository refs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/theta-r9-inputs"
          git archive HEAD foundations/general-theta papers/General-Theta-Foundations-I-restart | tar -x -C "$RUNNER_TEMP/theta-r9-inputs"
          git ls-tree -r HEAD > "$RUNNER_TEMP/theta-r9-inputs/RESEARCH_FULL_TREE.txt"
          git fetch --no-tags --depth=1 origin f04b0c0c967a75dfa2f09cbfb3d38e54cef639d2
          git show f04b0c0c967a75dfa2f09cbfb3d38e54cef639d2:GENERAL_THETA_FOUNDATIONS_I_RESTART_R7_ACQUISITION_COMPATIBLE_EXTERNAL_REFEREE_REPORT_R7.md > "$RUNNER_TEMP/theta-r9-inputs/R7_REFEREE_REPORT.md"
          printf '%s\n' 'research=3c9b212f8673c95e3a28fd83811b8a4f3bacc431' 'review=f04b0c0c967a75dfa2f09cbfb3d38e54cef639d2' 'canonical=18000b21e4bfd89180ccb069e46ac0f21621f34d' > "$RUNNER_TEMP/theta-r9-inputs/PINNED_HEADS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: theta-r9-pinned-inputs
          path: ${{ runner.temp }}/theta-r9-inputs
          include-hidden-files: false
          retention-days: 7
          if-no-files-found: error
