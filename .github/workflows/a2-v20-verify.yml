name: A2 v20 exact-source full-package verification
on:
  push:
    branches:
      - revision/a2-v20-canonical-channel-rigidity-2026-09-29
    paths:
      - 'papers/A2-v20-canonical-channel-rigidity/**'
      - '.github/workflows/a2-v20-verify.yml'
permissions:
  contents: read
jobs:
  manuscript:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            papers/A2-v20-canonical-channel-rigidity
      - name: Install the build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended latexmk python3 python3-numpy python3-scipy poppler-utils
      - name: Validate immutable sources and all submission volumes
        working-directory: papers/A2-v20-canonical-channel-rigidity
        run: python3 tools/validate_v20.py --all-volumes --require-checkout
      - name: Archive actual execution evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: A2-v20-${{ github.sha }}
          path: |
            papers/A2-v20-canonical-channel-rigidity/verification/current/
            papers/A2-v20-canonical-channel-rigidity/verification/local/
            papers/A2-v20-canonical-channel-rigidity/verification/local-execution.tar.xz
            papers/A2-v20-canonical-channel-rigidity/build/
            papers/A2-v20-canonical-channel-rigidity/SOURCE_PINS.json
            papers/A2-v20-canonical-channel-rigidity/PUBLICATION_BINDING.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
