name: export-round9-source-snapshot

on:
  push:
    branches:
      - revision/round9-referee-positive-closure-11paper-2026-08-31
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pack exact source snapshot outside repository tree
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz \
            --output=/tmp/round9-source-snapshot.tar.gz \
            HEAD
          sha256sum /tmp/round9-source-snapshot.tar.gz \
            > /tmp/round9-source-snapshot.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: theta-theory-round9-source-snapshot
          path: |
            /tmp/round9-source-snapshot.tar.gz
            /tmp/round9-source-snapshot.sha256
          if-no-files-found: error
