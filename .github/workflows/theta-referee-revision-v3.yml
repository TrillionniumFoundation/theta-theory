name: theta referee revision v3

on:
  push:
    branches:
      - theta-referee-revision-v3-positive-closure-2026-08-28
    paths:
      - 'papers/referee-ready/**'
      - 'tools/verify_referee_revision_v3.py'
      - '.github/workflows/theta-referee-revision-v3.yml'
  pull_request:
    paths:
      - 'papers/referee-ready/**'
      - 'tools/verify_referee_revision_v3.py'
      - '.github/workflows/theta-referee-revision-v3.yml'

permissions:
  contents: read

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile verifier
        run: python -m py_compile tools/verify_referee_revision_v3.py
      - name: Verify controlling manuscripts
        run: python tools/verify_referee_revision_v3.py

  latex:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - folder: papers/referee-ready/paper-I-bilateral-response
            main: main-submission.tex
          - folder: papers/referee-ready/paper-II-pressure-diffusion
            main: main-final.tex
          - folder: papers/referee-ready/paper-III-rough-theta
            main: main-final.tex
          - folder: papers/referee-ready/paper-IV-filtering-games
            main: main-final.tex
          - folder: papers/referee-ready/paper-V-representations
            main: main-final.tex
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live and latexmk
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
      - name: Compile ${{ matrix.folder }}/${{ matrix.main }}
        working-directory: ${{ matrix.folder }}
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error ${{ matrix.main }}
      - name: Check unresolved references
        working-directory: ${{ matrix.folder }}
        run: |
          log="${{ matrix.main }}"
          log="${log%.tex}.log"
          ! grep -E "LaTeX Warning: (Reference|Citation).*undefined|There were undefined references" "$log"
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: ${{ strategy.job-index }}-${{ matrix.main }}
          path: ${{ matrix.folder }}/*.pdf
          if-no-files-found: error
