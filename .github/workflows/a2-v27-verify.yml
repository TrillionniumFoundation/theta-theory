name: A2 v27 exact-source full-package verification
on:
  push:
    branches:
      - revision/a2-v27-fixed-aperture-collision-rigidity-2026-10-03
    paths:
      - 'papers/A2-v27-fixed-aperture-rigidity/**'
      - '.github/workflows/a2-v27-verify.yml'
permissions:
  contents: read
jobs:
  manuscript:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            papers/A2-v27-fixed-aperture-rigidity
      - name: Require the complete native qualification source
        working-directory: papers/A2-v27-fixed-aperture-rigidity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f tools/validate_v27.py
          test -f tools/verify_v27.py
          test -f tools/test_validation_contract.py
          test -f SOURCE_PINS.json
          test -f retained/v25/tools/validate_v25.py
      - name: Install all build and diagnostic tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended latexmk python3 python3-numpy python3-scipy poppler-utils
      - name: Qualify exact source and all declared volumes
        working-directory: papers/A2-v27-fixed-aperture-rigidity
        run: python3 tools/validate_v27.py --all-volumes --require-checkout --expected-commit "$GITHUB_SHA"
      - name: Archive native sources and actual evidence including failures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a2-v27-delivery"
          git archive --format=zip --output="$RUNNER_TEMP/a2-v27-delivery/A2-v27-exact-source.zip" HEAD papers/A2-v27-fixed-aperture-rigidity
          python3 - <<'PY'
          import hashlib, json, os, shutil, zipfile
          from pathlib import Path
          root=Path('papers/A2-v27-fixed-aperture-rigidity')
          out=Path(os.environ['RUNNER_TEMP'])/'a2-v27-delivery'
          locations=[root/'verification/current',root/'build',
            root/'retained/v25/build',root/'retained/v25/verification/v27-requalification',
            root/'retained/v25/retained/v24/build',
            root/'retained/v25/retained/v24/verification/v25-requalification']
          names=set()
          with zipfile.ZipFile(out/'A2-v27-actual-evidence.zip','w',zipfile.ZIP_DEFLATED) as z:
              for base in locations:
                  if not base.exists():
                      continue
                  for p in sorted(base.rglob('*')):
                      if p.is_file() and p.suffix in ('.pdf','.log','.json','.fls'):
                          name=str(p.relative_to(root))
                          if name not in names:
                              z.write(p,name); names.add(name)
              for p in [root/'SOURCE_PINS.json',*root.glob('*.md')]:
                  if p.is_file():
                      z.write(p,str(p.relative_to(root)))
          receipt=root/'verification/current/receipt.json'
          if receipt.exists():
              shutil.copy2(receipt,out/'receipt.json')
          if (root/'build/main.pdf').exists():
              shutil.copy2(root/'build/main.pdf',out/'A2-v27-primary.pdf')
          binding={'github_sha':os.environ.get('GITHUB_SHA'),'github_run_id':os.environ.get('GITHUB_RUN_ID'),
                   'files':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in out.iterdir() if p.is_file()},
                   'archive_is_not_a_qualification_claim':True}
          (out/'artifact-binding.json').write_text(json.dumps(binding,indent=2,sort_keys=True)+'\n')
          PY
      - name: Upload source-bound results and raw historical diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: A2-v27-${{ github.sha }}
          path: ${{ runner.temp }}/a2-v27-delivery/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
