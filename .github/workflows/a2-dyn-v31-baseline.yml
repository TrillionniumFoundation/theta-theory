name: A2-DYN v31 frozen review export
on:
  push:
    branches: [revision/a2-dyn-v31-referee-response-2026-10-07]
    paths: [.github/workflows/a2-dyn-v31-baseline.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Archive frozen controlling review
        run: |
          mkdir -p /tmp/a2-v31-review
          git archive HEAD reviews/a2-dyn-v30-external-top4-review-2026-10-07 > /tmp/a2-v31-review/review.tar
          git rev-parse HEAD > /tmp/a2-v31-review/export-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: a2-dyn-v31-frozen-review-${{ github.sha }}
          path: /tmp/a2-v31-review/*
          retention-days: 90
