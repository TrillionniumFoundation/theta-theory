name: A2-DYN v100 uniform-capacity full-source qualification
on:
  push:
    branches:
      - revision/a2-dyn-v100-uniform-capacity-referee-response-2026-10-13
      - revision/a2-dyn-v100-uniform-capacity-referee-copy-2026-10-13
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a2-dyn-v100-uniform-capacity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify-manuscript:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Pin original sources and exact checkout
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:papers/A2-DYN-v99-referee-response)" = "864bea62f1a63c5ec07e765cf4f720aaba0ebbe4"
          test "$(git rev-parse HEAD:reviews/a2-dyn-v98-external-top4-review-2026-10-13/REFEREE_REPORT.md)" = "041bdf3eb46f24c09dbc1a469a5e728713c4d900"
          test "$(git rev-parse HEAD:papers/A2-DYN-v88-referee-response)" = "af3d5707cc0ccad7fc20a6a67887cc0dc0e58ef6"
          test "$(git rev-parse HEAD:papers/A2-DYN-v88-main-preserved)" = "1c3e7c85c15f7265f66f8ee96ce6617d2f65488d"
          mkdir -p papers/A2-DYN-v100-uniform-capacity-referee-response/evidence
          printf '%s\n%s\n' "$GITHUB_SHA" "$GITHUB_REF" > papers/A2-DYN-v100-uniform-capacity-referee-response/evidence/exact-checkout.txt
          git rev-parse HEAD:papers/A2-DYN-v100-uniform-capacity-referee-response >> papers/A2-DYN-v100-uniform-capacity-referee-response/evidence/exact-checkout.txt
          git archive HEAD papers/A2-DYN-v100-uniform-capacity-referee-response papers/A2-DYN-v99-referee-response reviews/a2-dyn-v98-external-top4-review-2026-10-13 .github/workflows/a2-dyn-v100-uniform-capacity-qualification.yml A2_DYN_V100_UNIFORM_CAPACITY_REVISION_INDEX.md | gzip -n > papers/A2-DYN-v100-uniform-capacity-referee-response/evidence/active-and-baseline-source.tar.gz
      - name: Install native TeX and diagnostic dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern python3-numpy python3-mpmath python3-sympy python3-scipy poppler-utils
      - name: Preserve inherited sources and compile all 243 proof modules
        env:
          TZ: UTC
        run: bash papers/A2-DYN-v100-uniform-capacity-referee-response/build.sh
      - name: Upload exact-SHA article and complete archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-dyn-v100-uniform-capacity-${{ github.sha }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          path: |
            papers/A2-DYN-v100-uniform-capacity-referee-response/build/*.pdf
            papers/A2-DYN-v100-uniform-capacity-referee-response/build/*.log
            papers/A2-DYN-v100-uniform-capacity-referee-response/build/*.fls
            papers/A2-DYN-v100-uniform-capacity-referee-response/build/*.aux
            papers/A2-DYN-v100-uniform-capacity-referee-response/build/*.tex
            papers/A2-DYN-v100-uniform-capacity-referee-response/build/*-pass*.txt
            papers/A2-DYN-v100-uniform-capacity-referee-response/evidence/*
