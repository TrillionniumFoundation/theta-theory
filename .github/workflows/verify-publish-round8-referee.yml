name: verify-publish-round8-referee

on:
  push:
    branches:
      - revision/round8-referee-positive-closure-11paper-2026-08-31
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-publish-round8-referee
  cancel-in-progress: true

jobs:
  verify-build-publish:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Capture immutable round-eight inputs and merge latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          PRE_MAIN="$(git rev-parse origin/main)"
          test "$PRE_MAIN" = 'b1df534388f5ccd6de686caf5656447d607df0fb'
          git merge-base --is-ancestor \
            e366e858b564d9cdda389674ae3dfb6e65813a1e HEAD
          git config user.name theta-theory-revision-bot
          git config user.email revision-bot@users.noreply.github.com
          if ! git merge-base --is-ancestor "$PRE_MAIN" HEAD; then
            git merge --no-edit "$PRE_MAIN"
          fi
          git merge-base --is-ancestor "$PRE_MAIN" HEAD
          git merge-base --is-ancestor \
            e366e858b564d9cdda389674ae3dfb6e65813a1e HEAD
          echo "PRE_MAIN=$PRE_MAIN" >> "$GITHUB_ENV"
          echo "REVISION_SOURCE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Restore audited round-eight tooling bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .round8/tooling.part-* | base64 --decode > /tmp/round8-tooling.tar.gz
          echo '429f5624ea7cf65eaaa9c18365a39f4010e814ae9a419c79639c248ec460f2a3  /tmp/round8-tooling.tar.gz' | sha256sum --check
          tar -xzf /tmp/round8-tooling.tar.gz
          chmod +x \
            tools/materialize_round8_referee.py \
            tools/verify_round8_referee.py \
            tools/hostile_rereview_round8.py \
            tools/build_round8.py \
            tools/write_round8_certificate.py
          rm -rf .round8

      - name: Syntax-check all round-eight tooling
        run: |
          python -m py_compile \
            tools/materialize_round8_referee.py \
            tools/verify_round8_referee.py \
            tools/hostile_rereview_round8.py \
            tools/build_round8.py \
            tools/write_round8_certificate.py

      - name: Materialize all eleven positive reconstructions
        run: python tools/materialize_round8_referee.py

      - name: Run exact-source structural and hostile proof gates
        run: |
          python tools/verify_round8_referee.py
          python tools/hostile_rereview_round8.py

      - name: Install TeX and PDF inspection toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk biber poppler-utils \
            texlive-latex-base texlive-latex-extra \
            texlive-fonts-recommended texlive-bibtex-extra

      - name: Clean-build all eleven round-eight papers
        run: python tools/build_round8.py

      - name: Re-run exact-byte and counterexample gates after build
        run: |
          python tools/verify_round8_referee.py
          python tools/hostile_rereview_round8.py

      - name: Commit verified mathematical tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name theta-theory-revision-bot
          git config user.email revision-bot@users.noreply.github.com
          git add -A
          git add -f papers/*/main.pdf
          git commit -m 'Materialize round-eight positive referee closure for all eleven papers [skip ci]'
          echo "MATHEMATICAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:revision/round8-referee-positive-closure-11paper-2026-08-31

      - name: Write exact-source build and publication certificate
        shell: bash
        run: |
          set -euo pipefail
          python tools/write_round8_certificate.py \
            --mathematical-sha "$MATHEMATICAL_SHA" \
            --pre-main "$PRE_MAIN" \
            --workflow-run "$GITHUB_RUN_ID"

      - name: Commit certificate and publication record
        shell: bash
        run: |
          set -euo pipefail
          git add \
            ROUND8_FINAL_CERTIFICATE.json \
            ROUND8_PUBLICATION_RECORD.json \
            ROUND8_REVISION_STATUS.md
          git commit -m 'Record exact round-eight verification and publication metadata [skip ci]'
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:revision/round8-referee-positive-closure-11paper-2026-08-31

      - name: Archive old main and atomically publish verified tree
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE='archive/main-pre-round8-positive-closure-2026-08-31'
          TAG='round8-positive-closure-verified-2026-08-31'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$PRE_MAIN"
          git merge-base --is-ancestor "$PRE_MAIN" HEAD

          if git ls-remote --exit-code --heads origin "refs/heads/$ARCHIVE" >/tmp/round8-archive-ref 2>/dev/null; then
            existing="$(cut -f1 /tmp/round8-archive-ref)"
            test "$existing" = "$PRE_MAIN"
          else
            git push origin "$PRE_MAIN:refs/heads/$ARCHIVE"
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo 'Round-eight publication tag already exists before publication.' >&2
            exit 1
          fi
          git tag -a "$TAG" -m 'Verified round-eight positive referee closure for eleven papers' HEAD
          git push --atomic \
            --force-with-lease="refs/heads/main:$PRE_MAIN" \
            origin \
            HEAD:refs/heads/main \
            "refs/tags/$TAG"

      - name: Verify remote main archive and tag topology
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE='archive/main-pre-round8-positive-closure-2026-08-31'
          TAG='round8-positive-closure-verified-2026-08-31'
          git fetch origin \
            main \
            "$ARCHIVE" \
            "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse origin/main)" = "$FINAL_SHA"
          test "$(git rev-parse "origin/$ARCHIVE")" = "$PRE_MAIN"
          test "$(git rev-list -n1 "$TAG")" = "$FINAL_SHA"
          git diff --exit-code "$MATHEMATICAL_SHA" "$FINAL_SHA" -- \
            papers \
            revision/round8-referee-final \
            tools/materialize_round8_referee.py \
            tools/verify_round8_referee.py \
            tools/hostile_rereview_round8.py \
            tools/build_round8.py \
            ROUND8_HISTORICAL_DERIVATION_AUDIT.md \
            ROUND8_PROOF_DEPENDENCY_LEDGER.md \
            REFEREE_ROUND8_RESPONSE.md
          echo "ROUND8_REMOTE_PUBLICATION_PASS main=$FINAL_SHA archive=$PRE_MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: theta-theory-round8-verified-papers-and-audit
          path: |
            papers/*/main.pdf
            ROUND8_FINAL_CERTIFICATE.json
            ROUND8_PUBLICATION_RECORD.json
            ROUND8_REVISION_STATUS.md
            ROUND8_BUILD_SUMMARY.json
            ROUND8_STRUCTURAL_VERIFICATION.json
            ROUND8_HOSTILE_REREVIEW.json
            ROUND8_INTERNAL_HARSH_REREVIEW.md
            ROUND8_HISTORICAL_DERIVATION_AUDIT.md
            ROUND8_PROOF_DEPENDENCY_LEDGER.md
            REFEREE_ROUND8_RESPONSE.md
          if-no-files-found: error
