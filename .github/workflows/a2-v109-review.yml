name: A2 v109 exact-source review
on:
  push:
    branches:
      - revision/a2-v109-single-contact-multiplication-tomography-2026-09-21
    paths:
      - '.github/workflows/a2-v109-review.yml'
      - 'papers/A2-v17-boundary-information-coarsening/article/v109/*.tex'
      - 'papers/A2-v17-boundary-information-coarsening/article/v109/*.py'
      - 'papers/A2-v17-boundary-information-coarsening/article/v109/*.md'
      - 'papers/A2-v17-boundary-information-coarsening/article/v108/prepared/**'
permissions:
  contents: write
concurrency:
  group: a2-v109-exact-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify preparation does not change committed source
        run: |
          set -euo pipefail
          python3 papers/A2-v17-boundary-information-coarsening/article/v108/prepare.py
          git diff --exit-code -- papers/A2-v17-boundary-information-coarsening/article/v108/prepared
      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq latexmk texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
          python3 -m pip install sympy
      - name: Build both exact-source volumes and run diagnostics
        env:
          A2_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 papers/A2-v17-boundary-information-coarsening/article/v109/verify.py
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-v109-review-evidence-${{ github.sha }}
          path: papers/A2-v17-boundary-information-coarsening/article/v109/evidence/
          if-no-files-found: warn
          retention-days: 90
      - name: Commit successful evidence separately from source
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f papers/A2-v17-boundary-information-coarsening/article/v109/evidence
          if ! git diff --cached --quiet; then
            git commit -m 'A2 v109: record exact-source dual-volume native verification'
            git push origin HEAD:refs/heads/revision/a2-v109-single-contact-multiplication-tomography-2026-09-21
          fi
