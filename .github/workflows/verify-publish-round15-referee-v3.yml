name: verify-publish-round15-referee-v3

on:
  push:
    branches:
      - revision/round15-referee-positive-closure-11paper-2026-09-01
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: verify-publish-round15-referee-v3
  cancel-in-progress: false

jobs:
  verify-build-publish:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check whether Round Fifteen is already published
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          if git cat-file -e origin/main:ROUND15_FINAL_CERTIFICATE.json 2>/dev/null; then
            echo 'ALREADY_PUBLISHED=true' >> "$GITHUB_ENV"
          else
            echo 'ALREADY_PUBLISHED=false' >> "$GITHUB_ENV"
          fi

      - name: Restore immutable validated Round-Fifteen artifact
        if: env.ALREADY_PUBLISHED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/round15-artifact /tmp/round15-expanded
          python - <<'PY'
          import json, os, pathlib, urllib.request
          repo = 'TrillionniumFoundation/theta-theory'
          run_id = 33459091399
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'theta-round15-artifact-publisher',
          }
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts',
              headers=headers,
          )
          with urllib.request.urlopen(req, timeout=60) as response:
              listing = json.load(response)
          artifacts = [a for a in listing.get('artifacts', []) if not a.get('expired')]
          if not artifacts:
              raise SystemExit('validated Round-Fifteen artifact is missing')
          for index, artifact in enumerate(artifacts):
              req = urllib.request.Request(artifact['archive_download_url'], headers=headers)
              with urllib.request.urlopen(req, timeout=180) as response:
                  data = response.read()
              path = pathlib.Path(f'/tmp/round15-artifact/artifact-{index}.zip')
              path.write_bytes(data)
              print(artifact['id'], artifact['name'], len(data), path)
          PY
          for archive in /tmp/round15-artifact/*.zip; do
            unzip -q "$archive" -d /tmp/round15-expanded
          done
          find /tmp/round15-expanded -maxdepth 4 -type f | sort | head -200
          for archive in $(find /tmp/round15-expanded -type f \( -name '*.tar.xz' -o -name '*.tar.gz' -o -name '*.tgz' \)); do
            case "$archive" in
              *.tar.xz) tar -xJf "$archive" -C /tmp/round15-expanded/unpacked ;;
              *) tar -xzf "$archive" -C /tmp/round15-expanded/unpacked ;;
            esac
          done
          SCRIPT="$(find /tmp/round15-expanded -type f -path '*/tools/materialize_round15_referee.py' | head -1)"
          if [ -z "$SCRIPT" ]; then
            SCRIPT="$(find /tmp/round15-expanded/unpacked -type f -path '*/tools/materialize_round15_referee.py' 2>/dev/null | head -1)"
          fi
          test -n "$SCRIPT"
          SOURCE_ROOT="${SCRIPT%/tools/materialize_round15_referee.py}"
          test -f "$SOURCE_ROOT/tools/verify_round15_referee.py"
          test -d "$SOURCE_ROOT/revision/round15-referee-final"
          rsync -a --exclude='.git' "$SOURCE_ROOT/" /tmp/round15-source/
          test -f /tmp/round15-source/tools/materialize_round15_referee.py

      - name: Prepare latest main plus locked referee tree
        if: env.ALREADY_PUBLISHED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name theta-theory-revision-bot
          git config user.email revision-bot@users.noreply.github.com
          git fetch origin main review/round14-gpt56-pro-harsh-11paper-2026-09-01 --tags
          PRE_MAIN="$(git rev-parse origin/main)"
          git switch --detach "$PRE_MAIN"
          git switch -c round15-publication-work
          git merge --no-edit c0a436c8c952eb53f16ea40163105d7baee5e328
          git merge-base --is-ancestor c0a436c8c952eb53f16ea40163105d7baee5e328 HEAD
          rsync -a --exclude='.git' /tmp/round15-source/ ./
          chmod +x tools/materialize_round15_referee.py tools/verify_round15_referee.py tools/hostile_rereview_round15.py tools/build_round15.py tools/write_round15_certificate.py
          echo "PRE_MAIN=$PRE_MAIN" >> "$GITHUB_ENV"

      - name: Materialize and run mathematical proof gates
        if: env.ALREADY_PUBLISHED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/materialize_round15_referee.py
          python tools/verify_round15_referee.py
          python tools/hostile_rereview_round15.py

      - name: Install TeX and PDF tools
        if: env.ALREADY_PUBLISHED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y latexmk biber poppler-utils texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra

      - name: Clean-build all eleven papers and rerun gates
        if: env.ALREADY_PUBLISHED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_round15.py
          python tools/verify_round15_referee.py
          python tools/hostile_rereview_round15.py

      - name: Commit verified mathematical tree
        if: env.ALREADY_PUBLISHED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m 'Materialize round-fifteen positive referee closure for all eleven papers [skip ci]'
          echo "MATHEMATICAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Write exact certificate and publication metadata
        if: env.ALREADY_PUBLISHED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/write_round15_certificate.py
          git add ROUND15_FINAL_CERTIFICATE.json ROUND15_PUBLICATION_RECORD.json ROUND15_REVISION_STATUS.md
          git commit -m 'Record exact round-fifteen verification and publication metadata [skip ci]'
          echo "PUBLICATION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Archive old main and atomically publish
        if: env.ALREADY_PUBLISHED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin archive/main-pre-round15-positive-closure-2026-09-01 >/dev/null 2>&1; then
            test "$(git ls-remote origin refs/heads/archive/main-pre-round15-positive-closure-2026-09-01 | cut -f1)" = "$PRE_MAIN"
          else
            git push origin "$PRE_MAIN:refs/heads/archive/main-pre-round15-positive-closure-2026-09-01"
          fi
          git push --force-with-lease=refs/heads/revision/round15-referee-positive-closure-11paper-2026-09-01:${GITHUB_SHA} origin "$PUBLICATION_SHA:refs/heads/revision/round15-referee-positive-closure-11paper-2026-09-01"
          git push --force-with-lease=refs/heads/main:$PRE_MAIN origin "$PUBLICATION_SHA:refs/heads/main"
          if git rev-parse round15-positive-closure-verified-2026-09-01 >/dev/null 2>&1; then
            test "$(git rev-list -n1 round15-positive-closure-verified-2026-09-01)" = "$PUBLICATION_SHA"
          else
            git tag -a round15-positive-closure-verified-2026-09-01 "$PUBLICATION_SHA" -m 'Verified round-fifteen positive referee closure for eleven papers'
            git push origin refs/tags/round15-positive-closure-verified-2026-09-01
          fi

      - name: Verify remote topology and immutable mathematical tree
        if: env.ALREADY_PUBLISHED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main revision/round15-referee-positive-closure-11paper-2026-09-01 archive/main-pre-round15-positive-closure-2026-09-01 --tags
          test "$(git rev-parse origin/main)" = "$PUBLICATION_SHA"
          test "$(git rev-parse origin/revision/round15-referee-positive-closure-11paper-2026-09-01)" = "$PUBLICATION_SHA"
          test "$(git rev-parse origin/archive/main-pre-round15-positive-closure-2026-09-01)" = "$PRE_MAIN"
          test "$(git rev-list -n1 round15-positive-closure-verified-2026-09-01)" = "$PUBLICATION_SHA"
          git diff --quiet "$MATHEMATICAL_SHA" "$PUBLICATION_SHA" -- papers revision/round15-referee-final tools ROUND15_HISTORICAL_DERIVATION_AUDIT.md ROUND15_PROOF_DEPENDENCY_LEDGER.md REFEREE_ROUND15_RESPONSE.md ROUND15_REFEREE_INVENTORY.json ROUND15_MATERIALIZATION_MANIFEST.json ROUND15_STRUCTURAL_VERIFICATION.json ROUND15_HOSTILE_REREVIEW.json ROUND15_BUILD_SUMMARY.json

      - uses: actions/upload-artifact@v4
        if: env.ALREADY_PUBLISHED != 'true'
        with:
          name: theta-theory-round15-verified-papers-and-audit
          path: |
            papers/*/main.pdf
            papers/*/main.tex
            papers/*/ROUND15_POSITIVE_CLOSURE.tex
            papers/*/AUTHOR_RESPONSE_ROUND15.md
            revision/round15-referee-final
            ROUND15_*.json
            ROUND15_*.md
            REFEREE_ROUND15_RESPONSE.md
          if-no-files-found: error
