name: verify-round4-referee-closure

on:
  push:
    branches:
      - revision/round4-referee-positive-closure-11paper-2026-08-30
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-round4-referee-closure
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax-check all revision tooling
        run: |
          python -m py_compile \
            tools/apply_round3_exact_rereview_fixes.py \
            tools/apply_round4_referee_fixes.py \
            tools/verify_round4_closure.py \
            tools/hostile_rereview_round4.py \
            tools/write_round4_author_responses.py

      - name: Repair and materialize prior exact-rereview packets
        run: |
          python tools/repair_round3_materializer.py
          python tools/repair_round3_rereview_markers.py
          python tools/apply_round3_exact_rereview_fixes.py

      - name: Audit archived recursive and CM2 derivations
        shell: bash
        run: |
          set -euo pipefail
          archive_ref='origin/archive/full-v4-pre-governance-2026-08-29'
          mkdir -p /tmp/round4-history
          git show "${archive_ref}:canonical/theta_theory_recursive.md" \
            > /tmp/round4-history/theta_theory_recursive.md
          git show "${archive_ref}:canonical/CM2_LATEST_STATUS.md" \
            > /tmp/round4-history/CM2_LATEST_STATUS.md
          git show "${archive_ref}:canonical/THETA_THEORY_CURRENT_STATUS.md" \
            > /tmp/round4-history/THETA_THEORY_CURRENT_STATUS.md
          git show "${archive_ref}:canonical/THETA_MAXIMAL_FINAL_STATUS_V3.md" \
            > /tmp/round4-history/THETA_MAXIMAL_FINAL_STATUS_V3.md
          python tools/audit_historical_derivations.py \
            --output ROUND3_HISTORICAL_DERIVATION_AUDIT.md \
            recursive=/tmp/round4-history/theta_theory_recursive.md \
            cm2_latest=/tmp/round4-history/CM2_LATEST_STATUS.md \
            theta_current=/tmp/round4-history/THETA_THEORY_CURRENT_STATUS.md \
            theta_maximal_v3=/tmp/round4-history/THETA_MAXIMAL_FINAL_STATUS_V3.md

      - name: Verify the prior repair layer before superseding it
        run: |
          python tools/apply_round3_closure.py
          python tools/verify_round3_closure.py
          python tools/verify_round3_rereview.py

      - name: Install all round-four mathematical replacements
        run: |
          python tools/apply_round4_referee_fixes.py
          python tools/apply_round3_closure.py
          python tools/write_round4_author_responses.py

      - name: Run fail-closed round-four source and dependency gates
        run: |
          python tools/verify_round4_closure.py
          python tools/hostile_rereview_round4.py

      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk biber \
            texlive-latex-base texlive-latex-extra \
            texlive-fonts-recommended texlive-bibtex-extra

      - name: Clean-build all eleven revised papers
        run: python tools/build_round3.py

      - name: Fail on unresolved LaTeX references or citations
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --include='*.log' -E \
            'LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|There were undefined citations' \
            papers; then
            echo 'Unresolved LaTeX reference/citation detected.' >&2
            exit 1
          fi

      - name: Record exact verified round-four state
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          TOTAL_THEOREMS="$(python - <<'PY'
          import json
          d=json.load(open('ROUND4_STRUCTURAL_VERIFICATION.json'))
          print(d['total_theorem_like_environments'])
          PY
          )"
          cat > ROUND4_REVISION_MANIFEST.yaml <<EOF
          schema: theta-theory-round4-referee-v1
          report_branch: review/round3-referee-reports-11paper-2026-08-30
          revision_branch: revision/round4-referee-positive-closure-11paper-2026-08-30
          source_commit: ${SOURCE_SHA}
          papers: 11
          policy:
            positive_closure: true
            theorem_downgrade: false
            nogo_substitution: false
            fail_closed: true
          gates:
            historical_derivation_audit: pass
            prior_orphan_packet_materialization: pass
            structural_verification: pass
            hostile_dependency_rereview: pass
            clean_latex_build: pass
            undefined_references: 0
          EOF
          cat > ROUND4_REVISION_STATUS.md <<EOF
          # Round-four referee revision status

          - New referee branch: \`review/round3-referee-reports-11paper-2026-08-30\`
          - Revision branch: \`revision/round4-referee-positive-closure-11paper-2026-08-30\`
          - Materialization source: \`${SOURCE_SHA}\`
          - Archived recursive/CM2 audit: **PASS**
          - Useful orphan repair packets materialized and checked: **PASS**
          - New round-four proof packets installed: **11/11 PASS**
          - Per-paper author responses: **11/11 PASS**
          - Structural/source regression verifier: **PASS**
          - Dependency-aware hostile rereview: **PASS**
          - Theorem-like environments with proofs: **${TOTAL_THEOREMS}/${TOTAL_THEOREMS} PASS**
          - Clean LaTeX build: **11/11 PASS**
          - Undefined references/citations: **0 PASS**
          - Main-tree publication: **PENDING**
          - Mathematical status: **INTERNAL_ROUND4_POSITIVE_CLOSURE_CANDIDATE**

          Repository gates establish exact-source internal closure and reproducible
          build status; they do not constitute external journal acceptance.
          EOF

      - name: Commit and push exact materialized revision
        shell: bash
        run: |
          set -euo pipefail
          git config user.name theta-theory-revision-bot
          git config user.email revision-bot@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No materialized changes to publish.'
            exit 0
          fi
          git commit -m 'Materialize round-four positive referee closure for all eleven papers [skip ci]'
          git push origin HEAD:revision/round4-referee-positive-closure-11paper-2026-08-30
