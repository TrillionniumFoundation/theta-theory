name: A2-DYN v25 exact-source qualification
on:
  push:
    branches:
      - revision/a2-dyn-v25-referee-response-2026-10-07
      - revision/a2-dyn-v25-referee-copy-2026-10-07
    paths:
      - papers/A2-DYN-v25-referee-response/**
      - .github/workflows/a2-dyn-v25-qualification.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a2-dyn-v25-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Archive the exact A2-DYN source and report scope
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p papers/A2-DYN-v25-referee-response/evidence
          paths=(papers/A2-DYN* reviews/a2-dyn* .github/workflows/a2-dyn*)
          git archive HEAD "${paths[@]}" > papers/A2-DYN-v25-referee-response/evidence/exact-source.tar
      - name: Install native TeX and numerical checks
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra lmodern python3-numpy python3-mpmath python3-sympy poppler-utils
      - name: Verify normal and optimized source and build the complete article
        env:
          TZ: UTC
        run: bash papers/A2-DYN-v25-referee-response/build.sh
      - name: Record PDF metadata and render the new proof entry pages
        run: |
          cd papers/A2-DYN-v25-referee-response
          pdfinfo build/main.pdf > evidence/pdfinfo.txt
          pdftotext -layout build/main.pdf evidence/main-text.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re,subprocess
          root=Path.cwd()
          info=(root/'evidence/pdfinfo.txt').read_text()
          pages=int(re.search(r'^Pages:\s+(\d+)',info,re.M).group(1))
          aux=(root/'build/main.aux').read_text()
          wanted=['thm:intro-anisotropic-band','sec:high-order-damped-unsmoothing',
                  'lem:heterogeneous-cumulant-comparison','thm:high-order-damped-unsmoothing',
                  'sec:anisotropic-fixed-count-bands','cor:roof-box-fixed-count',
                  'cor:roof-box-raw-budget','app:dependency-guide']
          found={}
          for label in wanted:
              match=re.search(r'\\newlabel\{'+re.escape(label)+r'\}\{\{([^{}]*)\}\{(\d+)',aux)
              if not match:raise RuntimeError('missing rendered theorem label '+label)
              found[label]={'number':match.group(1),'page':int(match.group(2))}
          selected=sorted({1}|{v['page'] for v in found.values()})
          for page in selected:
              subprocess.run(['pdftoppm','-f',str(page),'-l',str(page),'-singlefile','-r','100','-png',
                              'build/main.pdf',f'evidence/render-{page:03d}'],check=True)
          checks=json.loads((root/'evidence/v25-source-and-finite-checks.json').read_text())
          receipt=json.loads((root/'evidence/build-receipt.json').read_text())
          summary={'event_sha':receipt['event_sha'],'workflow_run_id':receipt['workflow_run_id'],
              'pdf_pages':pages,'pdf_sha256':receipt['pdf_sha256'],'new_labels':found,
              'source':{k:v for k,v in checks['source'].items() if k!='source_sha256'},
              'new_finite_checks':checks['new_finite_checks'],
              'rendered_pages':selected,'renders_generated':True,'human_visual_review':False,
              'continuum_proof_certified':False,'full_raw_LLT_certified':False}
          (root/'evidence/qualification-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
      - name: Upload exact qualification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-dyn-v25-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            papers/A2-DYN-v25-referee-response/build/main.pdf
            papers/A2-DYN-v25-referee-response/build/main.log
            papers/A2-DYN-v25-referee-response/build/main.fls
            papers/A2-DYN-v25-referee-response/build/main.aux
            papers/A2-DYN-v25-referee-response/build/pass*.txt
            papers/A2-DYN-v25-referee-response/evidence/*
