name: Verify immutable Round 43 reviewer object

on:
  push:
    branches:
      - "revision/round43-referee-positive-closure-gpt56pro-2026-09-04"
    paths:
      - "ROUND43_REVISION.tex"
      - "ROUND43_READY_FOR_REVIEW.md"
      - "ROUND43_REVIEW_INDEX.md"
      - "AUTHOR_RESPONSE_ROUND42.md"
      - "round39/**"
      - "round41/**"
      - "round43/**"
      - "tests/test_round41.py"
      - "tests/test_round43.py"
      - "tools/verify_round43.py"
      - ".github/workflows/verify-round43.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern
      - name: Verify manifest and source structure
        run: python3 tools/verify_round43.py --check-manifest
      - name: Exact inherited Round 41 checks
        run: python3 -m unittest -v tests/test_round41.py
      - name: Exact Round 43 checks
        run: python3 -m unittest -v tests/test_round43.py
      - name: Build reviewer object twice
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error ROUND43_REVISION.tex
          pdflatex -interaction=nonstopmode -halt-on-error ROUND43_REVISION.tex
      - name: Verify built artifact
        run: python3 tools/verify_round43.py --check-manifest --check-build
