name: A2 v123 source bootstrap
on:
  push:
    branches:
      - revision/a2-v123-polarized-k3-corank-two-2026-09-23
    paths:
      - '.github/workflows/a2-v123-source-bootstrap.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: a2-v123-source-bootstrap
  cancel-in-progress: false
jobs:
  materialize:
    if: github.ref == 'refs/heads/revision/a2-v123-polarized-k3-corank-two-2026-09-23'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Reconstruct locked A2 v123 source packet
        shell: bash
        run: |
          set -euo pipefail
          cat .github/revision-sources/a2-v123-source.part-*.b64 | base64 -d > /tmp/a2-v123-source-bootstrap.tar.gz
          echo '733b6c121cf2e6952e7eb7cd9eed5bc065d39f242751455f5cb6fa3f039d11cd  /tmp/a2-v123-source-bootstrap.tar.gz' | sha256sum -c -
          rm -rf /tmp/a2-v123-stage
          mkdir -p /tmp/a2-v123-stage
          tar -xzf /tmp/a2-v123-source-bootstrap.tar.gz -C /tmp/a2-v123-stage
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/a2-v123-stage')
          allowed=('A2_REVISION_V123_INDEX.md','papers/A2-v17-boundary-information-coarsening/article/v123/')
          files=[p for p in root.rglob('*') if p.is_file()]
          if not files:
              raise SystemExit('Empty A2 v123 packet')
          for p in files:
              rel=p.relative_to(root).as_posix().lstrip('./')
              if rel != allowed[0] and not rel.startswith(allowed[1]):
                  raise SystemExit(f'Unexpected packet path: {rel}')
          print(f'Validated {len(files)} packet files')
          PY
          cp -a /tmp/a2-v123-stage/A2_REVISION_V123_INDEX.md ./
          mkdir -p papers/A2-v17-boundary-information-coarsening/article
          rm -rf papers/A2-v17-boundary-information-coarsening/article/v123
          cp -a /tmp/a2-v123-stage/papers/A2-v17-boundary-information-coarsening/article/v123 papers/A2-v17-boundary-information-coarsening/article/
      - name: Commit materialized revision source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- A2_REVISION_V123_INDEX.md papers/A2-v17-boundary-information-coarsening/article/v123
          if git diff --cached --quiet; then
            echo 'Revision source already materialized.'
            exit 0
          fi
          git commit -m 'A2 v123: materialize polarized K3 and corank-two revision source'
          git push origin HEAD:revision/a2-v123-polarized-k3-corank-two-2026-09-23
