name: apply-round23-gpt56-closure-once

on:
  push:
    branches:
      - revision/round23-referee-positive-closure-11paper-2026-09-02
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-round23-gpt56-closure-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact revision head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct and apply the deterministic closure patch
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/verify-round23-referee-closure.yml > .github/workflows/verify-round23-referee-closure.yml
          cat .gpt56-payload/part-* > /tmp/round23-gpt56.b64
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, zlib
          encoded = Path('/tmp/round23-gpt56.b64').read_text(encoding='ascii')
          source = zlib.decompress(base64.b64decode(encoded))
          expected = 'a133383ac8750976e57c3d3d7009868572b923ac03c20d7752cb99503c5a0acd'
          actual = hashlib.sha256(source).hexdigest()
          if actual != expected:
              raise SystemExit(f'payload digest mismatch: {actual}')
          old = base64.b64decode('ICAgIGZvciBiYWQsIGdvb2QgaW4gcmVwYWlyczoKICAgICAgICBkYXRhID0gZGF0YS5yZXBsYWNlKGJhZCwgZ29vZCkKICAgIHJlbWFpbmluZyA9IFsoaSwgYikgZm9yIGksIGIgaW4gZW51bWVyYXRlKGRhdGEpIGlmIChiIDwgMzIgYW5kIGIgIT0gMTApIG9yIGIgPT0gMTI3XQo=')
          new = base64.b64decode('')
          if source.count(old) != 1:
              raise SystemExit('control-byte repair patch site is not unique')
          source = source.replace(old, new, 1)
          patched_expected = '06eb339da6c75896bec5682334814071246eb4137c84b6d63baaf678bd86d743'
          patched_actual = hashlib.sha256(source).hexdigest()
          if patched_actual != patched_expected:
              raise SystemExit(f'patched source digest mismatch: {patched_actual}')
          target = Path('tools/apply_round23_gpt56_closure.py')
          target.write_bytes(source)
          PY
          python -m py_compile tools/apply_round23_gpt56_closure.py
          python tools/apply_round23_gpt56_closure.py
          python -m py_compile tools/verify_round23.py tools/verify_round23_gpt56.py tools/write_round23_build_record.py
          python tools/verify_round23_gpt56.py
          python tools/verify_round23.py

      - name: Commit the active revision and remove bootstrap transport
        run: |
          set -euo pipefail
          rm -rf .gpt56-payload
          rm -f .github/workflows/apply-round23-gpt56-closure-once.yml
          git config user.name theta-theory-gpt56-pro
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'Complete GPT-5.6 Pro independent referee closure'
          git push origin HEAD:revision/round23-referee-positive-closure-11paper-2026-09-02
