name: General Theta Foundations I v8 decision-spectrum revision
on:
  push:
    branches:
      - revision/general-theta-foundations-i-v8-decision-spectrum-2026-09-23
    paths:
      - '.github/workflows/general-theta-foundations-i-v8-decision-spectrum.yml'
      - '.github/revision-inputs/gtf-i-v8-decision-spectrum/**'
      - 'papers/GTF-I-v8-decision-spectrum/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native-source-and-review-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover exact native revision sources
        shell: bash
        run: |
          set -euo pipefail
          A=.github/revision-inputs/gtf-i-v8-decision-spectrum/source.tar.xz
          test "$(sha256sum "$A" | awk '{print $1}')" = d216f8c78c30c7b61aab96ac34280f763f958f76755f7bf09788ecf6d8368d5f
          test "$(git rev-parse HEAD^)" = fc6d51a47b42a3f097ea530b67616591c421db3b
          git cat-file -e fc6d51a47b42a3f097ea530b67616591c421db3b^{commit}
          test ! -e papers/GTF-I-v8-decision-spectrum
          tar -xJf "$A"
          test -f papers/GTF-I-v8-decision-spectrum/main.tex
          test -f papers/GTF-I-v8-decision-spectrum/build.py
          test -f papers/GTF-I-v8-decision-spectrum/RESPONSE_TO_REFEREE.md
      - name: Commit native mathematical source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/GTF-I-v8-decision-spectrum
          git rm .github/revision-inputs/gtf-i-v8-decision-spectrum/source.tar.xz
          git rm .github/workflows/general-theta-foundations-i-v8-decision-spectrum.yml
          git commit -m 'paper(GTF-I v8): decision spectrum, saturated quotients and compatible causal realizations'
          echo "GTF_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended texlive-science lmodern poppler-utils
          python3 -m pip install --disable-pip-version-check -r papers/GTF-I-v8-decision-spectrum/requirements.txt
      - name: Rebuild both editions and verify sources
        shell: bash
        run: |
          set -euo pipefail
          python3 papers/GTF-I-v8-decision-spectrum/build.py
      - name: Write referee handoff metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root=Path('papers/GTF-I-v8-decision-spectrum')
          r=json.loads((root/'evidence/BUILD_RECEIPT.json').read_text())
          src=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          run_id=os.environ.get('GITHUB_RUN_ID')
          p=r['views']['paper']; c=r['views']['complete-development']
          idx=f"""# General Theta Foundations I — eighth decision-spectrum revision

**Author:** Qian Qi. **Date:** 23 September 2026.  
**Canonical paper:** [papers/GTF-I-v8-decision-spectrum/paper.pdf](papers/GTF-I-v8-decision-spectrum/paper.pdf), **{p['pages']} pages**.  
**Complete preserved development:** [papers/GTF-I-v8-decision-spectrum/complete-development.pdf](papers/GTF-I-v8-decision-spectrum/complete-development.pdf), **{c['pages']} pages**.  
**Working branch:** `revision/general-theta-foundations-i-v8-decision-spectrum-2026-09-23`  
**Referee snapshot branch:** `revision/general-theta-foundations-i-v8-decision-spectrum-referee-ready-2026-09-23`

This revision responds to the external v8 decision-spectrum report at `fc6d51a47b42a3f097ea530b67616591c421db3b`. It adds, rather than substitutes away, the earlier mathematical development.

## Start the next referee pass here

- Canonical article: `papers/GTF-I-v8-decision-spectrum/paper.pdf`
- Complete preserved article: `papers/GTF-I-v8-decision-spectrum/complete-development.pdf`
- Point-by-point response: `papers/GTF-I-v8-decision-spectrum/RESPONSE_TO_REFEREE.md`
- Proof ledger: `papers/GTF-I-v8-decision-spectrum/PROOF_LEDGER.md`
- Resource signatures: `papers/GTF-I-v8-decision-spectrum/RESOURCE_SIGNATURES.md`
- History audit and exact inputs: `HISTORY_AUDIT.md`, `HISTORY_INPUT_MANIFEST.json`
- Pipeline theorem interfaces: `PIPELINE_DEPENDENCIES.json`, `verify_pipeline.py`
- Primary-literature audit: `LITERATURE_AUDIT.md`
- Executed evidence: `papers/GTF-I-v8-decision-spectrum/evidence/BUILD_RECEIPT.json`

## Principal mathematical response

The revision defines a common-encoder decision spectrum, proves resource-controlled causal invariance and its Blackwell–Le Cam terminal slice, derives parameter-uniform sufficient coordinates for dominated experiment families, gives a necessary-and-sufficient compatible-history partition theorem for finite-state causal realization, charges finite acquisition precision and program size in the constructive tree theorem, proves the full posterior-law W1 representation rate, establishes the sequential Gaussian total-register law, and verifies a concrete A2-v122 known-mark exposure protocol adapter. The complete edition retains the preceding mathematical bodies rather than deleting them.

## Exact identities

- Controlling review commit: `fc6d51a47b42a3f097ea530b67616591c421db3b`.
- Native mathematical source commit: `{src}`.
- GitHub Actions run: `{run_id}`.
- Canonical PDF SHA-256: `{p['sha256']}`.
- Complete PDF SHA-256: `{c['sha256']}`.
- Complete source archive SHA-256: `{r['archive_sha256']}`.
- Retained mathematical labels resolved: **{r['retained_labels_resolved']}**.
- Shared canonical labels with identical numbering: **{r['shared_canonical_labels_same_numbers']}**.
- Finite deterministic checks: **{r['finite_checks']}**.

Build evidence identifies the submitted object; it is not a formal proof certificate, referee approval, or journal acceptance.
"""
          Path('GTF_I_V8_DECISION_SPECTRUM_INDEX.md').write_text(idx)
          rr={
            'edition':r['edition'],
            'controlling_review_commit':r['review_commit'],
            'mathematical_source_commit':src,
            'workflow_run_id':int(run_id) if run_id else None,
            'canonical_pdf_pages':p['pages'],
            'canonical_pdf_sha256':p['sha256'],
            'complete_pdf_pages':c['pages'],
            'complete_pdf_sha256':c['sha256'],
            'source_archive_sha256':r['archive_sha256'],
            'verification':'fresh GitHub-hosted rebuild completed; PDF page counts checked by build.py',
            'scope':'publication identity and reproducibility evidence, not mathematical proof or referee approval'
          }
          Path('GTF_I_V8_DECISION_SPECTRUM_RENDER_REVIEW.json').write_text(json.dumps(rr,indent=2)+'\n')
          PY
      - name: Publish generated manuscripts and evidence
        shell: bash
        run: |
          set -euo pipefail
          git add -f papers/GTF-I-v8-decision-spectrum/paper.pdf             papers/GTF-I-v8-decision-spectrum/complete-development.pdf             papers/GTF-I-v8-decision-spectrum/evidence             GTF_I_V8_DECISION_SPECTRUM_INDEX.md             GTF_I_V8_DECISION_SPECTRUM_RENDER_REVIEW.json
          git commit -m 'paper(GTF-I v8): publish decision-spectrum referee edition and exact-source receipts'
          git push origin "HEAD:$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gtf-i-v8-decision-spectrum-referee-build
          path: |
            papers/GTF-I-v8-decision-spectrum/paper.pdf
            papers/GTF-I-v8-decision-spectrum/complete-development.pdf
            papers/GTF-I-v8-decision-spectrum/evidence
            GTF_I_V8_DECISION_SPECTRUM_INDEX.md
            GTF_I_V8_DECISION_SPECTRUM_RENDER_REVIEW.json
          retention-days: 30
