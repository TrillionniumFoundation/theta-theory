name: GTF I v55 native qualification

on:
  push:
    branches:
      - revision/general-theta-foundations-i-v55-stochastic-purification-2026-09-27
    paths:
      - '.github/workflows/gtf-i-v55-qualify.yml'
      - 'papers/GTF-I-v55-stochastic-purification/assembly/**'
      - 'papers/GTF-I-v55-stochastic-purification/assemble_revision.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gtf-i-v55-native-qualification
  cancel-in-progress: true

jobs:
  qualify:
    if: github.ref == 'refs/heads/revision/general-theta-foundations-i-v55-stochastic-purification-2026-09-27'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PREFIX: papers/GTF-I-v55-stochastic-purification
      ENTRY: GENERAL_THETA_FOUNDATIONS_I_V55_REVIEW_READY.md
      TARGET_BRANCH: revision/general-theta-foundations-i-v55-stochastic-purification-2026-09-27
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            papers/GTF-I-v54-chebyshev-radius
            papers/GTF-I-v55-stochastic-purification
            .github/workflows/gtf-i-v55-qualify.yml
            GENERAL_THETA_FOUNDATIONS_I_V55_REVIEW_READY.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Commit readable native manuscript before qualification
        shell: bash
        run: |
          set -euo pipefail
          python "$PREFIX/assemble_revision.py"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f -- "$PREFIX"
          python - <<'PY'
          import os,subprocess
          names=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          if any(n and not n.startswith(os.environ['PREFIX']+'/') for n in names):
              raise SystemExit('Native write outside isolated revision')
          PY
          if ! git diff --cached --quiet; then
            git commit -m 'feat(gtf-i): commit v55 purification, phase and profinite proofs'
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
          echo "GTF_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install typesetting and exact-check dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check sympy==1.14.0 PyMuPDF==1.26.7
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended texlive-latex-recommended texlive-science lmodern
      - name: Qualify exact source and isolated native archive
        working-directory: papers/GTF-I-v55-stochastic-purification
        shell: bash
        run: |
          set -euo pipefail
          python build.py --check-isolated
      - name: Publish qualified PDFs without changing native source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          home=pathlib.Path(os.environ['PREFIX'])
          receipt=json.loads((home/'evidence/BUILD_RECEIPT.json').read_text())
          if receipt['status']!='success' or receipt['source_commit']!=os.environ['GTF_SOURCE_COMMIT']:
              raise SystemExit('Invalid exact-source qualification')
          if receipt['isolated_rebuild']['status']!='success':
              raise SystemExit('Missing independent native rebuild')
          for name,digest in json.loads((home/'evidence/SOURCE_HASHES.json').read_text()).items():
              path=str(home/name)
              original=subprocess.check_output(['git','show',os.environ['GTF_SOURCE_COMMIT']+':'+path])
              if hashlib.sha256(original).hexdigest()!=digest or hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()!=digest:
                  raise SystemExit('Native source changed: '+name)
          PY
          git add --sparse -f -- "$PREFIX" "$ENTRY"
          python - <<'PY'
          import os,subprocess
          names=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          if any(n and not(n.startswith(os.environ['PREFIX']+'/') or n==os.environ['ENTRY']) for n in names):
              raise SystemExit('Publication would modify an unrelated path')
          PY
          git commit -m 'docs(gtf-i): publish qualified v55 manuscript and full reproduction evidence'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD | tee PUBLICATION_COMMIT.txt
      - name: Preserve actual qualification outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtf-v55-qualification-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            papers/GTF-I-v55-stochastic-purification/
            GENERAL_THETA_FOUNDATIONS_I_V55_REVIEW_READY.md
            PUBLICATION_COMMIT.txt
