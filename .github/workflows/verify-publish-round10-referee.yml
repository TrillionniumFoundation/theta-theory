name: verify-publish-round10-referee

on:
  push:
    branches:
      - revision/round10-referee-positive-closure-11paper-2026-08-31
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-publish-round10-referee
  cancel-in-progress: true

jobs:
  verify-build-publish:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Capture current main and merge the locked referee tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name theta-theory-revision-bot
          git config user.email revision-bot@users.noreply.github.com
          git fetch origin \
            main \
            review/round9-gpt56-pro-harsh-11paper-2026-08-31 \
            --tags
          PRE_MAIN="$(git rev-parse origin/main)"
          git merge --no-edit origin/main
          git merge --no-edit origin/review/round9-gpt56-pro-harsh-11paper-2026-08-31
          git merge-base --is-ancestor \
            322e4efe825146254d5f4eb6850625b8f99052ea HEAD
          echo "PRE_MAIN=$PRE_MAIN" >> "$GITHUB_ENV"
          echo "REVISION_SOURCE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Restore the checksum-pinned Round-Ten payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .round10 -maxdepth 1 -name 'payload.part-*' -type f | wc -l)" -eq 9
          cat .round10/payload.part-* | tr -d '\r\n' \
            | base64 --decode > /tmp/round10-payload.tar.gz
          echo 'b65758b6ccd288bb0cbc39e5c93e676a2741a1c961207110897f1f28e138a562  /tmp/round10-payload.tar.gz' \
            | sha256sum --check
          tar -xzf /tmp/round10-payload.tar.gz
          rm -rf .round10
          chmod +x \
            tools/materialize_round10_referee.py \
            tools/write_round10_responses.py \
            tools/verify_a2_round10_certificate.py \
            tools/verify_round10_referee.py \
            tools/hostile_rereview_round10.py \
            tools/build_round10.py \
            tools/write_round10_certificate.py

      - name: Syntax-check Round-Ten tooling
        run: |
          python -m py_compile \
            tools/materialize_round10_referee.py \
            tools/write_round10_responses.py \
            tools/verify_a2_round10_certificate.py \
            tools/verify_round10_referee.py \
            tools/hostile_rereview_round10.py \
            tools/build_round10.py \
            tools/write_round10_certificate.py

      - name: Materialize manuscripts and responses
        run: |
          python tools/materialize_round10_referee.py
          python tools/write_round10_responses.py

      - name: Run exact-source and counterexample gates
        run: |
          python tools/verify_round10_referee.py
          python tools/hostile_rereview_round10.py

      - name: Install TeX and PDF inspection toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk biber poppler-utils \
            texlive-latex-base texlive-latex-extra \
            texlive-fonts-recommended texlive-bibtex-extra

      - name: Clean-build all eleven papers
        run: python tools/build_round10.py

      - name: Re-run source and hostile gates after build
        run: |
          python tools/verify_round10_referee.py
          python tools/hostile_rereview_round10.py

      - name: Commit verified mathematical tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git add -f papers/*/main.pdf
          if git diff --cached --quiet; then
            echo 'Round-Ten materialization produced no changes.' >&2
            exit 1
          fi
          git commit -m 'Materialize round-ten positive referee closure for all eleven papers [skip ci]'
          echo "MATHEMATICAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:revision/round10-referee-positive-closure-11paper-2026-08-31

      - name: Write exact-source certificate and publication record
        shell: bash
        run: |
          set -euo pipefail
          python tools/write_round10_certificate.py \
            --mathematical-sha "$MATHEMATICAL_SHA" \
            --pre-main "$PRE_MAIN" \
            --workflow-run "$GITHUB_RUN_ID"
          git add \
            ROUND10_FINAL_CERTIFICATE.json \
            ROUND10_PUBLICATION_RECORD.json \
            ROUND10_REVISION_STATUS.md
          git commit -m 'Record exact round-ten verification and publication metadata [skip ci]'
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:revision/round10-referee-positive-closure-11paper-2026-08-31

      - name: Archive old main and atomically publish the verified tree
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE='archive/main-pre-round10-positive-closure-2026-08-31'
          TAG='round10-positive-closure-verified-2026-08-31'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$PRE_MAIN"
          git merge-base --is-ancestor "$PRE_MAIN" HEAD
          if git ls-remote --exit-code --heads origin "refs/heads/$ARCHIVE" >/tmp/round10-archive 2>/dev/null; then
            test "$(cut -f1 /tmp/round10-archive)" = "$PRE_MAIN"
          else
            git push origin "$PRE_MAIN:refs/heads/$ARCHIVE"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo 'Round-Ten tag already exists.' >&2
            exit 1
          fi
          git tag -a "$TAG" -m 'Verified round-ten positive referee closure for eleven papers' HEAD
          git push --atomic \
            --force-with-lease="refs/heads/main:$PRE_MAIN" \
            origin \
            HEAD:refs/heads/main \
            "refs/tags/$TAG"

      - name: Verify remote main archive and tag topology
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE='archive/main-pre-round10-positive-closure-2026-08-31'
          TAG='round10-positive-closure-verified-2026-08-31'
          git fetch origin main "$ARCHIVE" "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse origin/main)" = "$FINAL_SHA"
          test "$(git rev-parse "origin/$ARCHIVE")" = "$PRE_MAIN"
          test "$(git rev-list -n1 "$TAG")" = "$FINAL_SHA"
          git diff --exit-code "$MATHEMATICAL_SHA" "$FINAL_SHA" -- \
            papers \
            revision/round10-referee-final \
            tools/materialize_round10_referee.py \
            tools/write_round10_responses.py \
            tools/verify_round10_referee.py \
            tools/hostile_rereview_round10.py \
            tools/build_round10.py \
            ROUND10_HISTORICAL_DERIVATION_AUDIT.md \
            ROUND10_PROOF_DEPENDENCY_LEDGER.md \
            ROUND10_REFEREE_INVENTORY.md \
            ROUND10_REFEREE_INVENTORY.json \
            REFEREE_ROUND10_RESPONSE.md
          echo "ROUND10_REMOTE_PUBLICATION_PASS main=$FINAL_SHA archive=$PRE_MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: theta-theory-round10-verified-papers-and-audit
          path: |
            papers/*/main.pdf
            ROUND10_FINAL_CERTIFICATE.json
            ROUND10_PUBLICATION_RECORD.json
            ROUND10_REVISION_STATUS.md
            ROUND10_BUILD_SUMMARY.json
            ROUND10_STRUCTURAL_VERIFICATION.json
            ROUND10_HOSTILE_REREVIEW.json
            ROUND10_INTERNAL_HARSH_REREVIEW.md
            ROUND10_HISTORICAL_DERIVATION_AUDIT.md
            ROUND10_PROOF_DEPENDENCY_LEDGER.md
            ROUND10_REFEREE_INVENTORY.md
            ROUND10_REFEREE_INVENTORY.json
            REFEREE_ROUND10_RESPONSE.md
          if-no-files-found: error
