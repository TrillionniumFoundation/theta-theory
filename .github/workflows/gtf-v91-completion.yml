name: GTF-I v91 R60 completion and exact-head reconstruction
on:
  push:
    branches: [revision/general-theta-foundations-i-v91-r60-completion-2026-10-06]
    paths:
      - '.github/workflows/gtf-v91-completion.yml'
      - 'tools/gtf91/completion/**'
      - 'GENERAL_THETA_FOUNDATIONS_I_V91_FINAL_HEAD_REQUEST.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gtf91-completion-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  native:
    if: ${{ !contains(github.event.head_commit.message, 'verify-final-head') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 15
    outputs:
      source: ${{ steps.snapshot.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install pinned source-check tools
        run: python -m pip install --disable-pip-version-check pymupdf==1.26.7 sympy==1.14.0 numpy==2.3.5
      - name: Integrate, preserve, check and push the completed native manuscript
        id: snapshot
        env:
          REVISION_BRANCH: revision/general-theta-foundations-i-v91-r60-completion-2026-10-06
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python tools/gtf91/completion/complete.py
          PAPER=papers/GTF-I-v91-reset-variational
          python "$PAPER/build_revision.py" --check-source > /tmp/gtf91-completion-source-check.json
          python "$PAPER/rigidity_check.py" > /tmp/gtf91-completion-rigidity.json
          python -O "$PAPER/rigidity_check.py" > /tmp/gtf91-completion-rigidity-optimized.json
          cmp /tmp/gtf91-completion-rigidity.json /tmp/gtf91-completion-rigidity-optimized.json
          git config user.name 'GTF revision automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PAPER"
          git commit -m 'revision(GTF-I v91): complete R60 with quantitative contact and near-optimal reset rigidity'
          SOURCE=$(git rev-parse HEAD)
          echo "$SOURCE" > /tmp/gtf91-completion-native-sha.txt
          test "$(git ls-remote origin refs/heads/$REVISION_BRANCH | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:"refs/heads/$REVISION_BRANCH"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gtf91-completion-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            papers/GTF-I-v91-reset-variational
            /tmp/gtf91-completion-*.json
            /tmp/gtf91-completion-*-sha.txt
          if-no-files-found: warn
  publish:
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ needs.native.outputs.source }}
      - name: Install pinned reconstruction tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends texlive-latex-extra texlive-fonts-recommended lmodern
          python -m pip install --disable-pip-version-check pymupdf==1.26.7 sympy==1.14.0 numpy==2.3.5
      - name: Reconstruct the exact native commit and publish four manuscripts
        env:
          REVISION_BRANCH: revision/general-theta-foundations-i-v91-r60-completion-2026-10-06
          SOURCE_COMMIT: ${{ needs.native.outputs.source }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          PAPER=papers/GTF-I-v91-reset-variational
          echo "$SOURCE_COMMIT" > /tmp/gtf91-completion-native-sha.txt
          python "$PAPER/build_revision.py" --isolated > /tmp/gtf91-completion-build.json
          git config user.name 'GTF revision automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$PAPER/evidence" "$PAPER/paper.pdf" "$PAPER/BINARY_SUPPLEMENT.pdf" "$PAPER/STRUCTURAL_PAPER.pdf" "$PAPER/COMPLETE_REVISION.pdf"
          git commit -m 'publication(GTF-I v91): four rebuilt manuscripts and source-bound R60 completion evidence'
          PUBLISHED=$(git rev-parse HEAD)
          echo "$PUBLISHED" > /tmp/gtf91-completion-publication-sha.txt
          test "$(git ls-remote origin refs/heads/$REVISION_BRANCH | cut -f1)" = "$SOURCE_COMMIT"
          git push origin HEAD:"refs/heads/$REVISION_BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gtf91-completion-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            papers/GTF-I-v91-reset-variational
            /tmp/gtf91-completion-*.json
            /tmp/gtf91-completion-*-sha.txt
          if-no-files-found: warn
  final-head:
    if: ${{ contains(github.event.head_commit.message, 'verify-final-head') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install pinned read-only reconstruction tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends texlive-latex-extra texlive-fonts-recommended lmodern
          python -m pip install --disable-pip-version-check pymupdf==1.26.7 sympy==1.14.0 numpy==2.3.5
      - name: Reconstruct the exact triggering head without write credentials
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python papers/GTF-I-v91-reset-variational/build_revision.py --verify-published > /tmp/gtf91-completion-FINAL_HEAD.json
          python - <<'PY'
          import json, os
          x=json.load(open('/tmp/gtf91-completion-FINAL_HEAD.json'))
          if not (x['verified_head']==os.environ['GITHUB_SHA'] and x['read_only'] and x['status']=='success'):
              raise RuntimeError('Exact-head reconstruction identity failed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gtf91-completion-exact-final-head-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/gtf91-completion-FINAL_HEAD.json
          if-no-files-found: error
