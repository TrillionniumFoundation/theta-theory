name: Harden Round 31 source once

on:
  push:
    branches:
      - revision/round31-referee-positive-closure-11paper-2026-09-03
    paths:
      - 'papers/A2-sinai-homological-pressure/ROUND31_POSITIVE_CLOSURE.tex'
      - 'papers/A4-history-memory-universal-pressure/ROUND31_POSITIVE_CLOSURE.tex'
      - 'papers/B1-microcanonical-preparation/ROUND31_POSITIVE_CLOSURE.tex'
      - 'papers/B2-collision-clusters-dynamic-ldp/ROUND31_POSITIVE_CLOSURE.tex'
      - 'papers/D1-deterministic-theta-contractions/ROUND31_POSITIVE_CLOSURE.tex'
      - 'tools/verify_round31.py'
      - 'tools/harden_round31_once.py'
      - '.github/workflows/harden-round31-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-active-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revision/round31-referee-positive-closure-11paper-2026-09-03
          fetch-depth: 0
      - name: Require first-pass materialization
        run: |
          python3 tools/finalize_round31_once.py
          git diff --exit-code
      - name: Apply second-pass mathematical hardening
        run: python3 tools/harden_round31_once.py
      - name: Validate source graph before commit
        run: python3 tools/verify_round31.py
      - name: Commit hardened source when needed
        shell: bash
        run: |
          if git diff --quiet --exit-code && git diff --cached --quiet --exit-code; then
            echo 'No hardening changes remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            papers/A2-sinai-homological-pressure/ROUND31_POSITIVE_CLOSURE.tex \
            papers/A4-history-memory-universal-pressure/ROUND31_POSITIVE_CLOSURE.tex \
            papers/B1-microcanonical-preparation/ROUND31_POSITIVE_CLOSURE.tex \
            papers/B2-collision-clusters-dynamic-ldp/ROUND31_POSITIVE_CLOSURE.tex \
            papers/D1-deterministic-theta-contractions/ROUND31_POSITIVE_CLOSURE.tex \
            tools/verify_round31.py \
            .round31-hardened
          git commit -m 'Round 31: harden arithmetic, generator, radius, and phase scaling'
          git push origin HEAD:revision/round31-referee-positive-closure-11paper-2026-09-03
