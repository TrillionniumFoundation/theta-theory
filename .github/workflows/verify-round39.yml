name: Verify Round 39 revision

on:
  push:
    branches:
      - 'revision/round39-*'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-fonts-recommended
      - name: Run exact source tests
        run: python3 -m unittest -v tests/test_round39.py
      - name: Build manuscript
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error ROUND39_REVISION.tex
          pdflatex -interaction=nonstopmode -halt-on-error ROUND39_REVISION.tex
      - name: Verify manifest and build
        run: python3 tools/verify_round39.py --check-manifest --check-build --json ROUND39_CI_VERIFICATION.json
      - uses: actions/upload-artifact@v4
        with:
          name: round39-revision
          path: |
            ROUND39_REVISION.pdf
            ROUND39_REVISION.log
            ROUND39_CI_VERIFICATION.json
