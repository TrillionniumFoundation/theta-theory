name: GTF-I v41 intrinsic action and numerical memory

on:
  push:
    branches:
      - revision/general-theta-foundations-i-v41-intrinsic-action-2026-09-26
    paths:
      - 'papers/GTF-I-v41-intrinsic-action/**'
      - '.github/workflows/gtf-i-v41-intrinsic-action.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gtf-i-v41-intrinsic-action
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/revision/general-theta-foundations-i-v41-intrinsic-action-2026-09-26'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
          sparse-checkout: |
            papers/GTF-I-v41-intrinsic-action
            papers/GTF-I-v39-orbit-response
            papers/GTF-I-v38-orbit-entropy
            papers/GTF-I-v37-spectral-memory
            papers/GTF-I-v36-finite-alphabet-memory
            papers/GTF-I-v35-sharp-memory
            papers/GTF-I-v34-compatible-dynamics
            papers/GTF-I-v33-compatible-lifts
            papers/GTF-I-v32-causal-width
            papers/GTF-I-v31-compatible-memory
            papers/GTF-I-v30-streaming-geometry
            papers/GTF-I-v29-intrinsic-continuation
            papers/GTF-I-v28-causal-response
            papers/GTF-I-v27-resource-saddle
            papers/GTF-I-v26-controlled-memory-foundations
            papers/GTF-I-v25-controlled-minimax
            papers/GTF-I-v24-structural-resources
            reviews/general-theta-foundations-i-v39-orbit-response-independent-harsh-top4-r25-2026-09-25
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind committed native source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --depth=1 origin 9707844addcd9eb478eb863514f288923f9d40fd
          test -f papers/GTF-I-v41-intrinsic-action/main.tex
          test -f papers/GTF-I-v41-intrinsic-action/canonical-activation.tex
          test -z "$(git diff --name-only --diff-filter=DMRT 9707844addcd9eb478eb863514f288923f9d40fd HEAD)"
          echo "GTF_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install typesetting and exact arithmetic
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended lmodern
          python -m pip install sympy==1.14.0 PyMuPDF==1.26.7 numpy==2.3.5 scipy==1.17.0
      - name: Verify and build the full revision
        run: python papers/GTF-I-v41-intrinsic-action/build.py
      - name: Rebuild the standalone core sources independently
        shell: bash
        run: |
          python - <<'PY'
          import json,subprocess,sys,tempfile,zipfile,os
          from pathlib import Path
          import fitz
          h=Path('papers/GTF-I-v41-intrinsic-action').resolve()
          e=h/'evidence'
          with tempfile.TemporaryDirectory(prefix='gtf41-independent-') as td:
              root=Path(td)
              with zipfile.ZipFile(e/'CORE_SOURCES.zip') as z:
                  for name in z.namelist():
                      p=Path(name)
                      if p.is_absolute() or '..' in p.parts:
                          raise RuntimeError('Unsafe core archive')
                  z.extractall(root)
              core=root/h.name
              p=subprocess.run([sys.executable,str(core/'build.py'),'--core-only'],cwd=root,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              (e/'CORE_REBUILD_LOG.txt').write_text(p.stdout)
              if p.returncode:
                  print(p.stdout)
                  raise RuntimeError('Independent core build failed')
              a=fitz.open(h/'paper.pdf'); b=fitz.open(core/'paper.pdf')
              if len(a)!=len(b): raise RuntimeError('Independent page count mismatch')
              for i in range(len(a)):
                  if a[i].get_text()!=b[i].get_text():
                      raise RuntimeError('Independent text mismatch at page '+str(i+1))
                  ap=a[i].get_pixmap(matrix=fitz.Matrix(1,1),alpha=False)
                  bp=b[i].get_pixmap(matrix=fitz.Matrix(1,1),alpha=False)
                  if (ap.width,ap.height,ap.samples)!=(bp.width,bp.height,bp.samples):
                      raise RuntimeError('Independent raster mismatch at page '+str(i+1))
              receipt={'status':'success','pages':len(a),'all_page_text_equal':True,'all_page_raster_equal':True,'source_commit':os.environ['GTF_SOURCE_COMMIT']}
              (e/'CORE_REBUILD_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
              print(json.dumps(receipt))
          PY
      - name: Publish only this revision and its referee-ready branch
        shell: bash
        run: |
          git add -f papers/GTF-I-v41-intrinsic-action GENERAL_THETA_FOUNDATIONS_I_V41_REVIEW_READY.md
          git commit -m 'publish(GTF-I v41): manuscript, r25 response, standalone reproduction and preserved archives [skip ci]'
          test -z "$(git diff --name-only --diff-filter=DMRT 9707844addcd9eb478eb863514f288923f9d40fd HEAD)"
          READY='revision/general-theta-foundations-i-v41-referee-ready-2026-09-26'
          if git ls-remote --exit-code --heads origin "$READY"; then
            git fetch origin "$READY"
            git merge-base --is-ancestor FETCH_HEAD HEAD
          fi
          git push origin HEAD:"$GITHUB_REF_NAME" HEAD:"$READY"
      - name: Upload referee artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GTF-I-v41-intrinsic-action
          path: papers/GTF-I-v41-intrinsic-action/
          retention-days: 30
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GTF-I-v41-diagnostics
          path: |
            papers/GTF-I-v41-intrinsic-action/evidence/
            papers/GTF-I-v41-intrinsic-action/*.tex
            papers/GTF-I-v41-intrinsic-action/*.py
          retention-days: 7
