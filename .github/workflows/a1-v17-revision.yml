name: A1 v17 operational reconstruction and full referee response
on:
  push:
    branches:
      - revision/a1-english-v17-referee-response-2026-09-07
    paths:
      - .github/workflows/a1-v17-revision.yml
      - .github/scripts/prepare-a1-v17.py
      - .github/scripts/a1-v17-inputs-*.b64
permissions:
  contents: write
concurrency:
  group: a1-v17-referee-response
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install mathematical typesetting tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra lmodern poppler-utils
      - name: Materialize the complete anchored revision without changing its predecessors
        run: python .github/scripts/prepare-a1-v17.py
      - name: Execute all inherited suites, new exact diagnostics, pinned referee regression and full build
        working-directory: papers/A1-english-v17
        run: python validate.py --prior-review
      - name: Publish complete source, PDF and actual execution receipts
        run: |
          git diff --exit-code 0ef7e8bd90c0767b7fdc0f2bd175548242e39cec -- papers/A1-english-v16 reviews
          test -s papers/A1-english-v17/main.pdf
          test -s papers/A1-english-v17/validation/EXECUTION_REPORT.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- papers/A1-english-v17
          git add -f -- papers/A1-english-v17/main.pdf
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m 'Publish A1 v17: operational reconstruction, all retained proofs, referee response and verified PDF'
            git push origin HEAD:revision/a1-english-v17-referee-response-2026-09-07
          fi
          git rev-parse HEAD
      - name: Deposit the complete referee package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A1-v17-complete-referee-ready
          include-hidden-files: true
          path: |
            papers/A1-english-v17/
            !papers/A1-english-v17/build/
            !papers/A1-english-v17/**/__pycache__/
            !papers/A1-english-v17/*.aux
            !papers/A1-english-v17/*.log
            !papers/A1-english-v17/*.out
          if-no-files-found: error
