name: verify-round3-positive-closure

on:
  push:
    branches:
      - revision/round3-full-positive-closure-11paper-2026-08-30
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-round3-positive-closure
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Repair deterministic round-three sources
        run: python tools/repair_round3_materializer.py

      - name: Normalize exact-rereview markers
        run: python tools/repair_round3_rereview_markers.py

      - name: Apply exact-commit mathematical rereview fixes
        run: python tools/apply_round3_exact_rereview_fixes.py

      - name: Audit archived recursive and CM2 derivations
        shell: bash
        run: |
          set -euo pipefail
          archive_ref='origin/archive/full-v4-pre-governance-2026-08-29'
          mkdir -p /tmp/round3-history
          git show "${archive_ref}:canonical/theta_theory_recursive.md" \
            > /tmp/round3-history/theta_theory_recursive.md
          git show "${archive_ref}:canonical/CM2_LATEST_STATUS.md" \
            > /tmp/round3-history/CM2_LATEST_STATUS.md
          git show "${archive_ref}:canonical/THETA_THEORY_CURRENT_STATUS.md" \
            > /tmp/round3-history/THETA_THEORY_CURRENT_STATUS.md
          git show "${archive_ref}:canonical/THETA_MAXIMAL_FINAL_STATUS_V3.md" \
            > /tmp/round3-history/THETA_MAXIMAL_FINAL_STATUS_V3.md
          python tools/audit_historical_derivations.py \
            --output ROUND3_HISTORICAL_DERIVATION_AUDIT.md \
            recursive=/tmp/round3-history/theta_theory_recursive.md \
            cm2_latest=/tmp/round3-history/CM2_LATEST_STATUS.md \
            theta_current=/tmp/round3-history/THETA_THEORY_CURRENT_STATUS.md \
            theta_maximal_v3=/tmp/round3-history/THETA_MAXIMAL_FINAL_STATUS_V3.md
          sed -n '1,260p' ROUND3_HISTORICAL_DERIVATION_AUDIT.md

      - name: Materialize all controlling manuscripts
        run: python tools/apply_round3_closure.py

      - name: Run fail-closed structural proof checks
        run: |
          python tools/verify_round3_closure.py
          python tools/verify_round3_rereview.py

      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk biber \
            texlive-latex-base texlive-latex-extra \
            texlive-fonts-recommended texlive-bibtex-extra

      - name: Clean-build all eleven papers with persisted diagnostics
        run: python tools/build_round3.py

      - name: Persist concise diagnostics after a build failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          python tools/summarize_round3_build_failures.py
          git config user.name theta-theory-revision-bot
          git config user.email revision-bot@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Record exact-rereview build diagnostics [skip ci]'
            git push origin HEAD:revision/round3-full-positive-closure-11paper-2026-08-30
          fi

      - name: Fail on unresolved LaTeX references or citations
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --include='*.log' -E \
            'LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|There were undefined citations' \
            papers; then
            echo 'Unresolved LaTeX reference/citation detected.' >&2
            exit 1
          fi

      - name: Record verified materialization
        shell: bash
        run: |
          set -euo pipefail
          rm -f ROUND3_BUILD_FAILURES.md
          sed -i 's/status: materialized_pending_build/status: rereview_repairs_structural_and_build_pass/' ROUND3_REVISION_MANIFEST.yaml
          SOURCE_SHA="$(git rev-parse HEAD)"
          TOTAL_THEOREMS="$(python - <<'PY'
          import json
          d=json.load(open('ROUND3_STRUCTURAL_VERIFICATION.json'))
          print(sum(x['theorem_like_environments'] for x in d['papers'].values()))
          PY
          )"
          cat > ROUND3_REVISION_STATUS.md <<EOF
          # Round-three revision status

          - Reviewed base: \`970d88ae41faf601ae609d833b48288f213e5c5c\`
          - Materialization source: \`${SOURCE_SHA}\`
          - Archived recursive/CM2 derivation audit: **PASS**
          - Exact-commit hostile rereview repairs installed: **PASS**
          - Controlling manuscripts regenerated: **11/11 PASS**
          - Round-three proof modules present: **11/11 PASS**
          - Structural verifier: **PASS**
          - Exact-rereview verifier: **PASS**
          - Theorem-like environments with paired proofs: **${TOTAL_THEOREMS}/${TOTAL_THEOREMS} PASS**
          - Local LaTeX references in round-three modules: **PASS**
          - Clean LaTeX build: **11/11 PASS**
          - Undefined LaTeX references/citations: **0 PASS**
          - Independent rereview of the exact post-repair commit: **PENDING**
          - Main-tree update: **PENDING**
          - Mathematical status: **INTERNAL_POSITIVE_CLOSURE_CANDIDATE**

          Build success is not treated as external mathematical certification.
          EOF

      - name: Commit and push materialized controlling sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name theta-theory-revision-bot
          git config user.email revision-bot@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No materialized changes to publish.'
            exit 0
          fi
          git commit -m 'Materialize exact-rereview mathematical closure for all eleven papers [skip ci]'
          git push origin HEAD:revision/round3-full-positive-closure-11paper-2026-08-30
