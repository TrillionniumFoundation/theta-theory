name: Materialize authorized A2 v9 revision
on:
  push:
    branches:
      - automation/materialize-a2-v9-nonlinear-boundary-2026-09-10
permissions:
  contents: write
concurrency:
  group: materialize-a2-v9-nonlinear-boundary
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Fetch the pinned publication transport without third-party actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git init
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          git fetch --depth=2 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Restore, verify and publish the native manuscript in the matching TeX environment
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          docker run --rm -v "$PWD:/work" -w /work \
            -e GITHUB_REPOSITORY -e GITHUB_SERVER_URL -e GITHUB_RUN_ID \
            -e DEBIAN_FRONTEND=noninteractive \
            debian:trixie bash -ec '
              apt-get update -qq
              apt-get install -y --no-install-recommends git ca-certificates python3 python3-sympy python3-mpmath latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern
              git config --global --add safe.directory /work
              python3 .publication/a2-v9/materialize.py
            '
