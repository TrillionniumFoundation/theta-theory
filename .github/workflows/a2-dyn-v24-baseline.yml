name: A2-DYN v24 frozen baseline audit
on:
  push:
    branches: [revision/a2-dyn-v24-referee-response-2026-10-06]
    paths: [.github/workflows/a2-dyn-v24-baseline.yml]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Archive complete source before testing
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p audit
          git archive HEAD papers reviews .github/workflows > audit/exact-source.tar
          git rev-parse HEAD > audit/source-sha.txt
      - name: Install native TeX and numerical checks
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra lmodern python3-mpmath python3-sympy
      - name: Test recovered v23 source without edits
        run: bash papers/A2-DYN-v23-referee-response/build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a2-dyn-v24-baseline-${{ github.sha }}
          if-no-files-found: error
          path: |
            audit/*
            papers/A2-DYN-v23-referee-response/build/*
            papers/A2-DYN-v23-referee-response/evidence/*
