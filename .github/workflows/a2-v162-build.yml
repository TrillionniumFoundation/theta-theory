name: A2 v162 complete revision publication
on:
  push:
    branches: [revision/a2-v162-versal-contact-neighborhoods-2026-09-25]
    paths:
      - .github/workflows/a2-v162-build.yml
      - papers/A2-v17-boundary-information-coarsening/article/v162/versal-contacts-v162.tex
      - papers/A2-v17-boundary-information-coarsening/article/v162/euclidean-boundary-v162.tex
      - papers/A2-v17-boundary-information-coarsening/article/v162/technical-completions-v162.tex
      - papers/A2-v17-boundary-information-coarsening/article/v162/invariant-deformations-v162.tex
      - papers/A2-v17-boundary-information-coarsening/article/v162/frontmatter_v162.py
      - papers/A2-v17-boundary-information-coarsening/article/v162/assemble_v162.py
      - papers/A2-v17-boundary-information-coarsening/article/v162/check_v162.py
      - papers/A2-v17-boundary-information-coarsening/article/v162/publish_v162.py
permissions:
  contents: write
concurrency:
  group: a2-v162-complete-publication
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify inspected source bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('papers/A2-v17-boundary-information-coarsening/article/v162')
          expected={
            'versal-contacts-v162.tex':'d0e4a093801f18f102082fc114664dea68165ab947d3ac391190f322b3466512',
            'euclidean-boundary-v162.tex':'38e9a69d0971efa0dcae8673c5d57547b46675571535733669f07997122188e0',
            'technical-completions-v162.tex':'fdfa2db7addf8f29a0d5dde870dbad0ce858b618d70855967d4d2d97d9eadd55',
            'invariant-deformations-v162.tex':'86a38532e91aee92e92e7ed34f7d5f2376f1d190614bb5b2f7610cd61eb1e552',
            'frontmatter_v162.py':'e721f89c379d44bce249ffa40b4394984b1a98132889ebb833b8164169447540',
            'assemble_v162.py':'0f47b3f13aea6b0618f894e6378b499557a72df6652fda5c952456cebfcd5107',
            'check_v162.py':'27f54419df052b776e0a5e20b99e202a6e08168d59024d7f8f66b76ae50829c8',
            'publish_v162.py':'01be85d2f8c11eddc9eea0610f40c26446a1ea13b873be16b3485da2554f2269',
            'RESPONSE_TO_V161_REPORT.md':'641fddea6ee337584c3507b3fc8402e0bd71e4ce9f7abae2b82b95fc45066370',
            'LITERATURE_AUDIT_V162.md':'af23cfee8fe82fa8bee393cf870e2d95b79cc092c50e15bce2343ca6dae707ce'
          }
          for name,h in expected.items():
              actual=hashlib.sha256((p/name).read_bytes()).hexdigest()
              assert actual==h,(name,actual,h)
          print('All ten inspected input hashes agree.')
          PY
      - name: Install compilation and exact algebra tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils python3-venv
          python3 -m venv /tmp/a2-v162-env
          /tmp/a2-v162-env/bin/pip install 'sympy==1.14.0'
      - name: Run new exact audits and the complete inherited chain
        run: |
          /tmp/a2-v162-env/bin/python papers/A2-v17-boundary-information-coarsening/article/v162/check_v162.py
      - name: Compile all three complete manuscripts
        run: |
          /tmp/a2-v162-env/bin/python papers/A2-v17-boundary-information-coarsening/article/v162/assemble_v162.py --build
      - name: Prepare current review entry and rendered proof pages
        run: |
          /tmp/a2-v162-env/bin/python papers/A2-v17-boundary-information-coarsening/article/v162/publish_v162.py
          p=papers/A2-v17-boundary-information-coarsening/article/v162
          { python3 --version; /tmp/a2-v162-env/bin/python -c 'import sympy; print("SymPy",sympy.__version__)'; pdflatex --version | head -2; echo "Source $GITHUB_SHA"; echo "Run $GITHUB_RUN_ID"; } > "$p/BUILD_ENVIRONMENT.txt"
      - name: Archive complete build outputs before publication
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a2-v162-complete-review-build
          path: papers/A2-v17-boundary-information-coarsening/article/v162
          retention-days: 30
          if-no-files-found: error
      - name: Publish only the v162 outputs and root review entry
        env:
          GH_PUBLICATION_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = revision/a2-v162-versal-contact-neighborhoods-2026-09-25
          p=papers/A2-v17-boundary-information-coarsening/article/v162
          auth=$(printf 'x-access-token:%s' "$GH_PUBLICATION_TOKEN" | base64 -w0)
          head=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          test "$head" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$p"/*.tex "$p"/*.pdf "$p"/*.json "$p"/*.md "$p"/BUILD_ENVIRONMENT.txt "$p"/render-audit/*.png CURRENT_REVIEW_ENTRY.md
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          p=Path('papers/A2-v17-boundary-information-coarsening/article/v162')
          r=json.loads((p/'BUILD_RECEIPT_V162.json').read_text())
          c=json.loads((p/'EXACT_CHECKS_V162.json').read_text())
          assert r['compiled'] and r['all_predecessor_math_blocks_retained_byte_for_byte']
          assert r['current_labels']==490 and r['current_math_blocks']==325
          assert c['all_checks_pass'] and c['inherited_v161_suite_actually_rerun']
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert paths and all(x.startswith(str(p)+'/') or x=='CURRENT_REVIEW_ENTRY.md' for x in paths),paths
          for name in ('geometry','reconstruction','divisor-geometry'):
              assert str(p/(name+'.pdf')) in paths
          print('Complete build, all inherited checks and isolated publication paths verified.')
          PY
          git commit -m 'A2 v162: publish complete paired manuscripts, ambient contact proofs and verification receipts [skip ci]'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
