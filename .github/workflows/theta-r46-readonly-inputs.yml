name: Theta R46 read-only input export
on:
  push:
    branches: [foundation/general-theta-restart-r46-causal-stopping-research-2026-10-12]
    paths: [.github/workflows/theta-r46-readonly-inputs.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0d83c535fb75965e3252e0d945b05f3f6ab806ea
          persist-credentials: false
      - uses: actions/upload-artifact@v4
        with:
          name: theta-r46-pinned-input-files
          include-hidden-files: true
          path: |
            .github/data/theta-r45.part*
            .github/scripts/theta-r45-publish.py
          retention-days: 30
