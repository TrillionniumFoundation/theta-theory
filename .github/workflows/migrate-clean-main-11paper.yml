name: migrate-clean-main-11paper

on:
  push:
    branches:
      - staging/clean-main-11paper-2026-08-30
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clean-main-11paper-migration
  cancel-in-progress: false

jobs:
  validate-and-migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging source
        uses: actions/checkout@v4
        with:
          ref: staging/clean-main-11paper-2026-08-30
          path: staging

      - name: Reconstruct and verify clean tree
        shell: bash
        run: |
          set -euo pipefail
          cd staging/migration/clean-main-11paper
          cat parts/part-*.b64 | tr -d '\r\n' | base64 --decode > clean_main_11paper.tar.gz
          sha256sum -c clean_main_11paper.tar.gz.sha256
          mkdir extracted
          tar -xzf clean_main_11paper.tar.gz -C extracted
          python - <<'PY'
          from pathlib import Path
          root = Path('extracted')
          expected = {
              'A1-exact-benchmarks',
              'A2-sinai-homological-pressure',
              'A3-full-empirical-path-ldp',
              'A4-history-memory-universal-pressure',
              'B1-microcanonical-preparation',
              'B2-collision-clusters-dynamic-ldp',
              'B3-hamilton-boltzmann-cotangents',
              'B4-nonlinear-kinetic-semigroups',
              'C1-information-risk-sensitive-saddles',
              'C2-cotangent-rigidity-tangent-representations',
              'D1-deterministic-theta-contractions',
          }
          assert {p.name for p in (root/'papers').iterdir() if p.is_dir()} == expected
          assert len(list(root.rglob('main.tex'))) == 11
          assert len(list(root.rglob('references.bib'))) == 11
          for name in expected:
              p = root/'papers'/name
              assert {x.name for x in p.iterdir()} == {'main.tex','references.bib','README.md','REFEREE_GUIDE.md'}
          assert {p.name for p in root.iterdir()} == {'README.md','Makefile','.gitignore','papers'}
          PY

      - name: Install TeX
        run: sudo apt-get update && sudo apt-get install -y latexmk biber texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra

      - name: Build all eleven papers
        run: make -C staging/migration/clean-main-11paper/extracted all

      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-worktree
          fetch-depth: 0

      - name: Replace main atomically
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' staging/migration/clean-main-11paper/extracted/ main-worktree/
          cd main-worktree
          test "$(find papers -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 11
          test "$(find papers -name main.tex -type f | wc -l)" -eq 11
          test "$(find papers -name references.bib -type f | wc -l)" -eq 11
          test "$(find . -mindepth 1 -maxdepth 1 -type d | sed 's#^./##')" = papers
          git config user.name 'theta-theory-cleanup-bot'
          git config user.email 'theta-theory-cleanup-bot@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'main already matches clean eleven-paper tree'
            exit 0
          fi
          git commit -m 'Replace main with eleven-paper external-review tree'
          git push origin HEAD:main
