name: General Theta R70 source-bound native verification
on:
  push:
    branches:
      - revision/general-theta-r70-leakage-memory-20261016
    paths:
      - papers/General-Theta-Foundations-I-restart/r70-leakage-memory/**
      - papers/General-Theta-Foundations-I-restart/r70-leakage-memory-publication/**
      - .github/workflows/general-theta-r70-leakage-memory.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: papers/General-Theta-Foundations-I-restart/r70-leakage-memory
      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-venv texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern poppler-utils
          python3 -m venv "$RUNNER_TEMP/r70-env"
          "$RUNNER_TEMP/r70-env/bin/python" -m pip install -r papers/General-Theta-Foundations-I-restart/r70-leakage-memory/requirements.txt
      - name: Verify source, ten diagnostic pairs and native documents
        shell: bash
        run: |
          set -euo pipefail
          P=papers/General-Theta-Foundations-I-restart/r70-leakage-memory
          "$RUNNER_TEMP/r70-env/bin/python" "$P/verify.py" --out "$RUNNER_TEMP/r70-result" --source-commit "$GITHUB_SHA"
          cp -a "$P" "$RUNNER_TEMP/r70-result/source"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/r70-result/SOURCE_COMMIT.txt"
      - name: Upload complete source-bound review artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: general-theta-r70-independent-${{ github.sha }}
          path: ${{ runner.temp }}/r70-result
          if-no-files-found: error
          retention-days: 90
