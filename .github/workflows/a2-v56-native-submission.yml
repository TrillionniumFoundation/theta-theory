name: A2 v56 principal article and complete technical manuscript
on:
  push:
    branches:
      - revision/a2-v56-principal-proof-architecture-2026-09-15
    paths:
      - papers/A2-v17-boundary-information-coarsening/**/*.tex
      - papers/A2-v17-boundary-information-coarsening/tools/**
      - .github/workflows/a2-v56-native-submission.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions:
      contents: write
    outputs:
      source_commit: ${{ steps.source.outputs.source_commit }}
    steps:
      - name: Check out the exact preparation commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Materialize the principal article and preserve the complete manuscript
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = revision/a2-v56-principal-proof-architecture-2026-09-15
          P=papers/A2-v17-boundary-information-coarsening
          python3 -B "$P/tools/materialize_revision_v56.py" > "$RUNNER_TEMP/materialization-v56.json"
          A="$P/history/v55-review-baseline"
          test -e "$A/REPOSITORY_README.md" || cp README.md "$A/REPOSITORY_README.md"
          test -e "$A/README.md" || cp "$P/README.md" "$A/README.md"
          cat > README.md <<'DOC'
          # Theta-Theory: A2 revision 56

          **Boundary laws and rigidity of periodic dispersing billiards** — Qian Qi, September 15, 2026.

          [Principal article source](papers/A2-v17-boundary-information-coarsening/rigidity.tex) · [Complete technical manuscript](papers/A2-v17-boundary-information-coarsening/main.tex) · [Two-collision companion](papers/A2-v17-boundary-information-coarsening/two_collision.tex) · [Response to v55](papers/A2-v17-boundary-information-coarsening/RESPONSE_TO_REFEREE_V56.md) · [Historical derivation audit](papers/A2-v17-boundary-information-coarsening/HISTORICAL_DERIVATION_AUDIT_V56.md).

          Author branch: `revision/a2-v56-principal-proof-architecture-2026-09-15`. Addressed review: `5015444dc016dec38a7d0f0130b818823bbabd4e`; actual reviewed source: `3903f5b8a5ffb0d0a69065b1d303c247c06ebf69`.

          The new principal entry puts the relative-law and actual-smooth signed inverse first, followed by the complete geometric, window, lattice and differential proofs. Theorems A/B are shared verbatim. An elementary graph/support appendix supplies an internal coordinate interface. Nine references to comparisons in the full manuscript are explicitly prefixed F.; no full-only label occurs in a principal proof environment.

          The complete old manuscript remains independently compiled with every inherited statement, proof, statistical experiment, acquisition result and catalogue. All 111 inherited active inputs remain; only entry metadata changes, with its exact original archived. No further stopped-experiment theorem is added. The principal exposition and the complete corpus are two synchronized entries, not a deletion of the wider theory.

          The version-scoped workflow builds the companion, full manuscript and principal article, binds imported auxiliary inputs to the same frozen source, and retains all three PDFs and raw evidence on a new `revision/a2-v56-native-products-<run>-<attempt>` branch under `deliveries/a2-v56/<actual-source-commit>/`. The final review-ready entry records completed product identities; this source entry does not claim that an unfinished workflow succeeded.
          DOC
          cat > "$P/README.md" <<'DOC'
          # A2 revision 56 — principal article and complete technical manuscript

          [Principal article](rigidity.tex) · [Complete technical manuscript](main.tex) · [Two-collision companion](two_collision.tex) · [Response](RESPONSE_TO_REFEREE_V56.md) · [History](HISTORICAL_DERIVATION_AUDIT_V56.md) · [Primary literature](LITERATURE_CHECK_V56.md).

          The directory name `A2-v17` is historical. The active version is 56. The new principal article contains the full core proofs, a theorem-led introduction and explicit comparison appendices. The full manuscript retains all 111 inherited active inputs and all 546 statement/proof blocks, including 257 proofs. Its only amendment is entry metadata; the exact original and manifest are in `history/v55-review-baseline/`.

          The structural statements A/B are shared verbatim. The new Theorem 1.1 consolidates inherited analytical mechanisms; it is not presented as an additional discovery by renumbering. The graph/support lemma isolates an elementary geometric coordinate fact from the full quantitative/statistical material. `journal/DEPENDENCY_MAP_V56.json` records the principal inputs and the nine explicitly F.-prefixed full-manuscript comparisons; static closure is not mathematical certification.

          Native build order is `two_collision.tex`, `main.tex`, then `rigidity.tex`. The principal article imports source-matched auxiliary labels from the full manuscript only for its explicit comparisons. The version-scoped builder validates all three products and their producer/consumer evidence. The final review-ready entry identifies the completed source/products and actual sampled visual coverage.
          DOC
          git switch -C "$GITHUB_REF_NAME"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md "$P"
          if ! git diff --cached --quiet; then
            git commit -m 'A2 v56: materialize the principal proof architecture and preserve the complete v55 mathematical corpus'
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
          SOURCE=$(git rev-parse HEAD)
          echo "source_commit=$SOURCE" >> "$GITHUB_OUTPUT"
          printf 'Preparation: `%s`\n\nActual source: `%s`\n' "$GITHUB_SHA" "$SOURCE" >> "$GITHUB_STEP_SUMMARY"
      - name: Install native toolchain and finite diagnostic libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils python3-numpy python3-scipy python3-sympy
      - name: Verify complete preservation and both Python modes
        shell: bash
        run: |
          set -euo pipefail
          P=papers/A2-v17-boundary-information-coarsening
          for script in check_revision_v56 check_quantized_v46 check_adaptive check_revision_v32 check_revision_v38; do
            /usr/bin/python3 -B "$P/tools/$script.py" > "$RUNNER_TEMP/$script-normal.json"
            /usr/bin/python3 -O -B "$P/tools/$script.py" > "$RUNNER_TEMP/$script-optimized.json"
            cmp "$RUNNER_TEMP/$script-normal.json" "$RUNNER_TEMP/$script-optimized.json"
          done
      - name: Compile all three complete source-matched entries
        env:
          SOURCE: ${{ steps.source.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          /usr/bin/python3 -B papers/A2-v17-boundary-information-coarsening/tools/build_revision_v56.py --output-dir "$RUNNER_TEMP/a2-v56-native-$SOURCE"
          cp "$RUNNER_TEMP"/check_*-normal.json "$RUNNER_TEMP"/check_*-optimized.json "$RUNNER_TEMP/a2-v56-native-$SOURCE/"
          cp "$RUNNER_TEMP/materialization-v56.json" "$RUNNER_TEMP/a2-v56-native-$SOURCE/"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/a2-v56-native-$SOURCE/workflow-preparation-commit.txt"
      - name: Retain products and raw evidence
        if: always() && steps.source.outputs.source_commit != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a2-v56-native-${{ steps.source.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a2-v56-native-${{ steps.source.outputs.source_commit }}/
          if-no-files-found: error
          retention-days: 90
  publish-verified-products:
    needs: native
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.native.outputs.source_commit }}
          fetch-depth: 1
          persist-credentials: true
      - name: Retrieve and validate all three native products
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ needs.native.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "a2-v56-native-$SOURCE-$GITHUB_RUN_ATTEMPT" --dir "$RUNNER_TEMP/v56"
          python3 -B papers/A2-v17-boundary-information-coarsening/tools/retain_native_v56.py prepare --evidence "$RUNNER_TEMP/v56" --destination "deliveries/a2-v56/$SOURCE" --source-commit "$SOURCE" --run-id "$GITHUB_RUN_ID"
      - name: Publish a new products branch and verify fetched Git objects
        env:
          SOURCE: ${{ needs.native.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          P=papers/A2-v17-boundary-information-coarsening
          D="deliveries/a2-v56/$SOURCE"
          branch="revision/a2-v56-native-products-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$D"
          python3 -B "$P/tools/retain_native_v56.py" verify --destination "$D" --ref INDEX
          git commit -m 'A2 v56: retain all three complete native manuscripts and source-matched evidence'
          git push origin "HEAD:refs/heads/$branch"
          git fetch origin "refs/heads/$branch"
          python3 -B "$P/tools/retain_native_v56.py" verify --destination "$D" --ref FETCH_HEAD --attestation
          git add -- "$D/COMMITTED_OBJECTS_VERIFIED.json"
          git commit -m 'A2 v56: attest the fetched published native Git objects'
          git push origin "HEAD:refs/heads/$branch"
          git fetch origin "refs/heads/$branch"
          python3 -B "$P/tools/retain_native_v56.py" verify --destination "$D" --ref FETCH_HEAD
          printf 'Source: `%s`\n\nProducts branch: `%s`\n\nVerified head: `%s`\n' "$SOURCE" "$branch" "$(git rev-parse FETCH_HEAD)" >> "$GITHUB_STEP_SUMMARY"
