name: GTF-I v28 robust saddles and validation order

on:
  push:
    branches:
      - revision/general-theta-foundations-i-v28-causal-response-2026-09-24
    paths:
      - 'papers/GTF-I-v28-causal-response/**'
      - '.github/workflows/gtf-i-v28-causal-response.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gtf-i-v28-causal-response
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/revision/general-theta-foundations-i-v28-causal-response-2026-09-24'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
          sparse-checkout: |
            papers/GTF-I-v28-causal-response
            papers/GTF-I-v27-resource-saddle
            papers/GTF-I-v26-controlled-memory-foundations
            papers/GTF-I-v25-controlled-minimax
            papers/GTF-I-v24-structural-resources
            reviews/general-theta-foundations-i-v27-pipeline-harsh-top4-r12-2026-09-24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore hash-checked native manuscript source
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,lzma,runpy
          from pathlib import Path
          h=Path('papers/GTF-I-v28-causal-response')
          raw=b''.join((h/'.source-parts'/('part%02d.xz'%i)).read_bytes() for i in range(4))
          if len(raw)!=31280 or hashlib.sha256(raw).hexdigest()!='e64f6d3acc39571d8252e6945118d20ff3c8c04c80870674a0b3cecc993b0b77':
              raise RuntimeError('Source transport checksum mismatch')
          payload=json.loads(lzma.decompress(raw))
          if not isinstance(payload,dict) or len(payload)!=15: raise RuntimeError('Source manifest mismatch')
          for name,text in payload.items():
              p=Path(name)
              if p.name!=name or p.suffix not in {'.tex','.py','.md','.json'} or not isinstance(text,str):
                  raise RuntimeError('Unsafe source entry')
              dest=h/name
              if dest.exists() and dest.read_text()!=text:
                  raise RuntimeError('Refusing to replace modified native source: '+name)
              dest.write_text(text)
          runpy.run_path(str(h/'assemble.py'))
          print('Restored fifteen native inputs and reversibly assembled the full article.')
          PY
      - name: Publish native source before executing the build
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --depth=1 origin 63f52685341e0121f5494c63768bf53999f3c6c5
          test -z "$(git diff --name-only --diff-filter=DMRT 63f52685341e0121f5494c63768bf53999f3c6c5)"
          git add -f papers/GTF-I-v28-causal-response
          if ! git diff --cached --quiet; then
            git commit -m 'revise(GTF-I v28): exact positive-noise saddle, physical five-state law, optimal validation orders and support jump [skip ci]'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
          echo "GTF_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install typesetting and exact arithmetic
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended texlive-pictures lmodern
          python -m pip install sympy==1.14.0 PyMuPDF==1.26.7
      - name: Execute exact checks and compile the complete revision
        run: python papers/GTF-I-v28-causal-response/build.py
      - name: Publish the new revision package and referee-ready branch
        shell: bash
        run: |
          git add -f papers/GTF-I-v28-causal-response GENERAL_THETA_FOUNDATIONS_I_V28_REVIEW_READY.md
          git commit -m 'publish(GTF-I v28): full English article, response to r11-r12, preserved volumes and executed evidence [skip ci]'
          test -z "$(git diff --name-only --diff-filter=DMRT 63f52685341e0121f5494c63768bf53999f3c6c5 HEAD)"
          READY='revision/general-theta-foundations-i-v28-referee-ready-2026-09-24'
          if git ls-remote --exit-code --heads origin "$READY"; then
            git fetch origin "$READY"
            git merge-base --is-ancestor FETCH_HEAD HEAD
          fi
          git push origin HEAD:"$GITHUB_REF_NAME" HEAD:"$READY"
      - name: Upload referee package
        uses: actions/upload-artifact@v4
        with:
          name: GTF-I-v28-causal-response
          path: papers/GTF-I-v28-causal-response/
          retention-days: 30
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GTF-I-v28-diagnostics
          path: |
            papers/GTF-I-v28-causal-response/evidence/
            papers/GTF-I-v28-causal-response/*.tex
            papers/GTF-I-v28-causal-response/*.py
          retention-days: 7
