name: A2-DYN v14 one-time exact edit assembly
on:
  push:
    branches:
      - revision/a2-dyn-v14-referee-response-2026-10-06
permissions:
  contents: write
jobs:
  assemble:
    if: contains(github.event.head_commit.message, '[assemble-v14]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install finite-check import
        run: python3 -m pip install mpmath
      - name: Replay exact edits and create unreferenced Git objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys, urllib.request
          repo = 'TrillionniumFoundation/theta-theory'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          root = pathlib.Path('papers/A2-DYN-v14-referee-response')
          base = pathlib.Path('papers/A2-DYN-v13-referee-response')
          manifest = json.loads((root/'SOURCE_MANIFEST.json').read_text())
          ledger = json.loads((root/'INHERITED_EDITS.json').read_text())
          grouped = {}
          for edit in ledger['edits']:
              rel = edit['path']
              if rel != 'main.tex' and not (rel.startswith('core/') and rel.endswith('.tex') and '..' not in rel):
                  raise RuntimeError('out-of-scope edit: '+rel)
              grouped.setdefault(rel, []).append(edit)
          for rel, edits in grouped.items():
              data = (base/rel).read_bytes()
              if hashlib.sha256(data).hexdigest() != manifest['baseline_sha256'][rel]:
                  raise RuntimeError('baseline mismatch: '+rel)
              text = data.decode('utf-8')
              for edit in edits:
                  if text.count(edit['before']) != 1:
                      raise RuntimeError('ambiguous edit: '+rel)
                  text = text.replace(edit['before'], edit['after'], 1)
              (root/rel).write_text(text)
          sys.path.insert(0, str((root/'tools').resolve()))
          import verify_v14
          checked = verify_v14.source_checks()
          def post(endpoint, payload):
              req = urllib.request.Request('https://api.github.com/repos/'+repo+endpoint,
                  data=json.dumps(payload).encode(), method='POST', headers={
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json',
                  'Content-Type':'application/json',
                  'X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          entries = []
          blobs = {}
          for rel in sorted(grouped):
              data = (root/rel).read_bytes()
              wanted = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              actual = post('/git/blobs', {'encoding':'utf-8','content':data.decode()})['sha']
              if actual != wanted:
                  raise RuntimeError('Git blob identity mismatch: '+rel)
              entries.append({'path':rel,'mode':'100644','type':'blob','sha':actual})
              blobs[rel] = {'git_blob':actual,'sha256':hashlib.sha256(data).hexdigest()}
          tree = subprocess.check_output(['git','rev-parse','HEAD:'+root.as_posix()],text=True).strip()
          result = post('/git/trees', {'base_tree':tree,'tree':entries})
          receipt = {'event_sha':os.environ['GITHUB_SHA'],
              'run_id':os.environ['GITHUB_RUN_ID'],
              'paper_subtree_sha':result['sha'],'updated_blobs':blobs,
              'source_summary':{k:v for k,v in checked.items() if k!='source_sha256'},
              'branch_refs_modified_by_workflow':False}
          out = pathlib.Path('/tmp/a2-v14-assembly')
          out.mkdir(exist_ok=True)
          (out/'ASSEMBLY_RECEIPT.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY
      - name: Upload exact assembly receipt
        uses: actions/upload-artifact@v4
        with:
          name: a2-dyn-v14-assembly-${{ github.sha }}
          path: /tmp/a2-v14-assembly/ASSEMBLY_RECEIPT.json
          if-no-files-found: error
          retention-days: 90
