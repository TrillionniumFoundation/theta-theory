name: external-review-v6
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            papers/paper-I-path-ensembles/main.tex
            papers/paper-II-physical-homogenization/main.tex
            papers/paper-III-endogenous-theta/main.tex
            papers/paper-IV-saddle-information/main.tex
            papers/paper-V-rigidity-tangent/main.tex
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/verify_v6.py
      - run: python tools/verify_v6_deep.py
