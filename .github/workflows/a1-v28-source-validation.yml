name: A1 v28 source validation
on:
  workflow_dispatch:
    inputs:
      build_pdf:
        description: Compile both complete native volumes after source validation
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install TeX only for an explicitly requested full build
        if: inputs.build_pdf
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended lmodern
      - name: Validate the native revision
        env:
          BUILD_PDF: ${{ inputs.build_pdf }}
        run: |
          cd papers/A1-english-v28
          if [ "$BUILD_PDF" = "true" ]; then
            python3 build.py
          else
            python3 build.py --prepare-only
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: a1-v28-executed-validation
          path: |
            papers/A1-english-v28/build-v28/BUILD_RECORD_V28.json
            papers/A1-english-v28/build-v28/*-pass-*.txt
            papers/A1-english-v28/build-v28/native/main.pdf
            papers/A1-english-v28/build-v28/native/companions.pdf
          if-no-files-found: warn
          retention-days: 14
