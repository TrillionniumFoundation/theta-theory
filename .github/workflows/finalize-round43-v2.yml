name: Finalize immutable Round 43 v2 review object

on:
  push:
    branches:
      - 'revision/round43-positive-closure-v2-gpt56pro-2026-09-05'
    paths:
      - '.github/workflows/finalize-round43-v2.yml'

permissions:
  contents: write

concurrency:
  group: finalize-round43-v2
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revision/round43-positive-closure-v2-gpt56pro-2026-09-05
          fetch-depth: 0

      - name: Apply the audited finite source corrections and retire this lane
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement anchor, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "round43/quantitative_jacobi.tex",
              r'''For \(J\ge0\), set \(R_J=4J+8\) and
          \begin{equation}
           L_J=Q^{12(J+1)^3}.
           \label{eq:effective-LJ}
          \end{equation}
          All these constants are determined by the declared coefficient box and the
          probe horizon.''',
              r'''For \(J\ge0\), set \(R_J=4J+8\) and
          \begin{equation}
           L_J=Q^{32(J+2)^3}.
           \label{eq:effective-LJ}
          \end{equation}
          All these constants are determined by the declared coefficient box and the
          probe horizon.  The deliberately enlarged exponent absorbs every finite
          moment--Gram operation made explicit in
          Section~\ref{sec:effective-inversion-details}; it is not optimized.''',
          )

          replace_once(
              "round43/infinite_jacobi.tex",
              r'''By \eqref{eq:logarithmic-washout}, the residual and every fixed cylinder
          derivative satisfy the explicit summable estimate
          \begin{equation}
           \sup_{\beta,\|z\|\le R}|\partial^\alpha\eta_i^\beta(z)|
           \le C_\alpha(i+1)^{-1-\epsilon_w}.
           \label{eq:polynomial-washout-envelope}
          \end{equation}
          Thus logarithmic, rather than linear, washout already makes the persistent
          state an absolutely summable likelihood perturbation.''',
              r'''Repeated Duhamel differentiation gives the polynomial factor in the
          washout length explicitly.  For every fixed cylinder multi-index \(\alpha\)
          and every \(0<\bar\epsilon_w<\epsilon_w\),
          \begin{equation}
           \sup_{\beta,\|z\|\le R}|\partial^\alpha\eta_i^\beta(z)|
           \le C_\alpha(1+\log(i+1))^{|\alpha|}(i+1)^{-1-\epsilon_w}
           \le C_{\alpha,\bar\epsilon_w}(i+1)^{-1-\bar\epsilon_w}.
           \label{eq:polynomial-washout-envelope}
          \end{equation}
          The final envelope is summable.  Thus logarithmic, rather than linear,
          washout makes the persistent state and every fixed-order cylinder
          derivative an absolutely summable likelihood perturbation.''',
          )

          details = Path("round43/effective_inversion_details.tex")
          text = details.read_text(encoding="utf-8")
          start = text.index(r"\begin{proposition}[Quantified triangular moment map]")
          end = text.index(r"\end{proof}", start) + len(r"\end{proof}")
          new_prop = r'''\begin{proposition}[Quantified triangular moment map]
          \label{prop:quantified-moment-map}
          Let \(J\ge0\), and let \(\beta,\gamma\in\mathfrak B\).  With the constant
          \(Q\) of Section~\ref{sec:quantitative-jacobi},
          \begin{equation}
           \max\left\{|c-\widetilde c|,
                 \max_{0\le k\le2J+2}|\mu_k(\beta)-\mu_k(\gamma)|\right\}
           \le Q^{4(2J+3)^2}
                 \max_{0\le r\le4J+4}|d_r(\beta)-d_r(\gamma)|.
           \label{eq:quantified-moment-map}
          \end{equation}
          The map on the left is therefore an explicitly given polynomial-triangular
          map on the declared derivative box.
          \end{proposition}

          \begin{proof}
          Use \eqref{eq:explicit-moment-recursion} inductively through level
          \(2J+2\).  At level \(m\), there are at most \(m\) previous moments,
          every binomial coefficient is at most \(2^{2m}\), every moment is at most
          \(B_J^m\), and every power of \(c\) is bounded by
          \(\Lambda_A^{2m}\).  The difference of a power satisfies
          \(|c^r-\widetilde c^r|\le
          r\max(c_+,1)^{r-1}|c-\widetilde c|\).  Since
          \(Q\ge8\max\{2,\Lambda_A\}\), the increase of the Lipschitz exponent
          from level \(m-1\) to level \(m\) is at most \(8m+4\).  Therefore
          \[
           \sum_{m=0}^{2J+2}(8m+4)=4(2J+3)^2,
          \]
          which proves \eqref{eq:quantified-moment-map}.  Every operation in this
          induction is the addition or multiplication displayed in
          \eqref{eq:explicit-moment-recursion}.
          \end{proof}'''
          text = text[:start] + new_prop + text[end:]

          start = text.index(r"\begin{theorem}[Line-addressable effective response-jet inversion]")
          end = text.index(r"\end{proof}", start) + len(r"\end{proof}")
          new_thm = r'''\begin{theorem}[Line-addressable effective response-jet inversion]
          \label{thm:effective-response-jet-audit}
          For every \(J\ge0\) and \(\beta,\gamma\in\mathfrak B\),
          \begin{equation}
           d_J(\beta,\gamma)
           \le L_J
           \max_{0\le r\le4J+8}
           |h_\beta^{(r)}(0)-h_\gamma^{(r)}(0)|.
           \label{eq:audited-effective-jet-inverse}
          \end{equation}
          In particular, the constant \(L_J\) in
          \eqref{eq:effective-jet-inverse} is produced by the explicit recursions
          \eqref{eq:explicit-moment-recursion},
          \eqref{eq:gram-linear-system},
          \eqref{eq:gram-recover-b}, and \eqref{eq:gram-recover-a}.
          \end{theorem}

          \begin{proof}
          Compose Proposition~\ref{prop:quantified-moment-map} with
          Proposition~\ref{prop:effective-gram-reconstruction}.  Derivatives
          through order \(4J+6\) already suffice, and the stated maximum through
          \(4J+8\) only enlarges the right side.  The total exponent satisfies
          \[
           4(2J+3)^2+8(J+1)^3\le32(J+2)^3,
          \]
          which is exactly absorbed by \(L_J\) in
          \eqref{eq:effective-LJ}.
          \end{proof}'''
          text = text[:start] + new_thm + text[end:]
          details.write_text(text, encoding="utf-8")

          Path(".github/workflows/finalize-round43-v2.yml").unlink()
          PY

      - name: Install TeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern

      - name: Run strengthened source and algebra tests
        run: python3 -m unittest -v tests/test_round43.py

      - name: Build exact final source twice
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error ROUND43_REVISION.tex
          pdflatex -interaction=nonstopmode -halt-on-error ROUND43_REVISION.tex

      - name: Refresh source manifest and write verification record
        run: |
          python3 tools/verify_round43.py --refresh-manifest
          python3 tools/verify_round43.py --check-manifest --check-build --json ROUND43_LOCAL_VERIFICATION.json

      - name: Commit immutable source, PDF, manifest, and verification record
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add round43/infinite_jacobi.tex round43/quantitative_jacobi.tex round43/effective_inversion_details.tex
          git add round43/SOURCE_MANIFEST.json ROUND43_LOCAL_VERIFICATION.json
          git add -u .github/workflows/finalize-round43-v2.yml
          git add -f ROUND43_REVISION.pdf
          git commit -m "revision(round43-v2): freeze verified linear-time strengthened manuscript"
          git push origin HEAD:revision/round43-positive-closure-v2-gpt56pro-2026-09-05
