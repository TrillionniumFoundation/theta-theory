name: GTF-I v47 robust compatible realization
on:
  push:
    branches:
      - revision/general-theta-foundations-i-v47-compatible-certificates-2026-09-27
    paths:
      - 'papers/GTF-I-v47-compatible-certificates/**'
      - '.github/workflows/gtf-i-v47-compatible-certificates.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gtf-i-v47-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/revision/general-theta-foundations-i-v47-compatible-certificates-2026-09-27'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
          sparse-checkout: |
            papers/GTF-I-v47-compatible-certificates
            papers/GTF-I-v44-hankel-resonance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind already committed readable native source
        run: |
          echo "GTF_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          test -z "$(git diff --name-only --diff-filter=DMRT d7914880e7df679756c3b6ae86311485ac922f8a HEAD)"
      - name: Install typesetting and exact verification dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended lmodern
          python -m pip install sympy==1.14.0 PyMuPDF==1.26.7
      - name: Verify and build the current article and preserved archives
        run: python papers/GTF-I-v47-compatible-certificates/build.py
      - name: Rebuild the standalone sources in isolation
        shell: bash
        run: |
          P=papers/GTF-I-v47-compatible-certificates
          unzip -q "$P/evidence/CORE_SOURCES.zip" -d "$RUNNER_TEMP/v47-core"
          python "$RUNNER_TEMP/v47-core/GTF-I-v47-compatible-certificates/build.py" --core-only
          python - <<'PY'
          import fitz,json,os
          from pathlib import Path
          p=Path('papers/GTF-I-v47-compatible-certificates')
          a=fitz.open(p/'paper.pdf')
          b=fitz.open(Path(os.environ['RUNNER_TEMP'])/'v47-core/GTF-I-v47-compatible-certificates/paper.pdf')
          if len(a)!=len(b): raise RuntimeError('Core page count differs')
          for x,y in zip(a,b):
              if x.get_text()!=y.get_text() or x.get_pixmap().samples!=y.get_pixmap().samples:
                  raise RuntimeError('Core article differs')
          (p/'evidence/CORE_REBUILD_RECEIPT.json').write_text(json.dumps({'status':'success','pages':len(a),'all_page_text_equal':True,'all_page_raster_equal':True,'source_commit':os.environ['GTF_SOURCE_COMMIT']},indent=2)+'\n')
          PY
      - name: Publish only the v47 package without force
        shell: bash
        run: |
          P=papers/GTF-I-v47-compatible-certificates
          READY=revision/general-theta-foundations-i-v47-referee-ready-2026-09-27
          REMOTE=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          test "$REMOTE" = "$GTF_SOURCE_COMMIT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$P" GENERAL_THETA_FOUNDATIONS_I_V47_REVIEW_READY.md
          python - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          if not paths or any(not (p.startswith('papers/GTF-I-v47-compatible-certificates/') or p=='GENERAL_THETA_FOUNDATIONS_I_V47_REVIEW_READY.md') for p in paths):
              raise RuntimeError('Publication path fence')
          PY
          git commit -m 'publish(GTF-I v47): verified compatible error frontiers, complete manuscript and source-bound evidence [skip ci]'
          test -z "$(git diff --name-only --diff-filter=DMRT d7914880e7df679756c3b6ae86311485ac922f8a HEAD)"
          git push --atomic origin HEAD:"$GITHUB_REF_NAME" HEAD:"$READY"
      - name: Upload completed package
        uses: actions/upload-artifact@v4
        with:
          name: GTF-I-v47-compatible-certificates
          path: papers/GTF-I-v47-compatible-certificates/
          retention-days: 30
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GTF-I-v47-diagnostics
          path: |
            papers/GTF-I-v47-compatible-certificates/evidence/
            papers/GTF-I-v47-compatible-certificates/main.log
          retention-days: 7
