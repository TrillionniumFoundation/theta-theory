name: verify-round5-referee-closure

on:
  push:
    branches:
      - revision/round5-referee-positive-closure-11paper-2026-08-31
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-round5-referee-closure
  cancel-in-progress: true

jobs:
  verify-build-publish:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Capture immutable source and pre-publication main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force
          echo "ROUND5_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "ROUND5_PRE_MAIN=$(git rev-parse origin/main)" >> "$GITHUB_ENV"

      - name: Syntax-check round-five tooling
        run: |
          python -m py_compile \
            tools/apply_round5_referee_fixes.py \
            tools/verify_round5_closure.py \
            tools/hostile_rereview_round5.py \
            tools/build_round5.py \
            tools/write_round5_certificate.py

      - name: Materialize all eleven round-five controlling papers
        run: python tools/apply_round5_referee_fixes.py

      - name: Run structural and counterexample-aware mathematical gates
        run: |
          python tools/verify_round5_closure.py
          python tools/hostile_rereview_round5.py

      - name: Install TeX and PDF inspection toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk biber poppler-utils \
            texlive-latex-base texlive-latex-extra \
            texlive-fonts-recommended texlive-bibtex-extra

      - name: Clean-build all eleven revised papers
        run: python tools/build_round5.py

      - name: Independent unresolved-reference and PDF-count gate
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --include='*.log' -E \
            'LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|There were undefined citations' \
            ROUND5_BUILD_LOGS; then
            echo 'Unresolved LaTeX reference/citation detected.' >&2
            exit 1
          fi
          test "$(find ROUND5_PDF_BUNDLE -maxdepth 1 -name '*.pdf' -size +0c | wc -l)" -eq 11

      - name: Write exact-source certificate
        shell: bash
        run: |
          set -euo pipefail
          python tools/write_round5_certificate.py \
            --source-commit "$ROUND5_SOURCE_SHA" \
            --pre-publication-main "$ROUND5_PRE_MAIN"

      - name: Commit verified mathematical tree
        id: verified
        shell: bash
        run: |
          set -euo pipefail
          git config user.name theta-theory-revision-bot
          git config user.email revision-bot@users.noreply.github.com
          git add -A
          git commit -m 'Materialize round-five positive referee closure for all eleven papers [skip ci]'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record publication metadata
        shell: bash
        env:
          VERIFIED_SHA: ${{ steps.verified.outputs.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import os

          root = Path('.')
          record = {
              "schema": "theta-theory-round5-publication-v1",
              "pre_publication_main": os.environ["ROUND5_PRE_MAIN"],
              "archive_branch": "archive/main-pre-round5-positive-closure-2026-08-31",
              "revision_branch": "revision/round5-referee-positive-closure-11paper-2026-08-31",
              "verified_content_commit": os.environ["VERIFIED_SHA"],
              "publication_branch": "main",
              "publication_tag": "round5-positive-closure-2026-08-31",
              "atomic_push_required": True,
              "paper_count": 11,
              "gates": {
                  "structural_verification": "PASS",
                  "hostile_counterexample_rereview": "PASS",
                  "clean_latex_build": "11/11 PASS",
                  "undefined_references_or_citations": 0,
              },
          }
          (root / 'ROUND5_PUBLICATION_RECORD.json').write_text(
              json.dumps(record, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          status = (root / 'ROUND5_REVISION_STATUS.md').read_text(encoding='utf-8')
          status = status.replace(
              '- Main-tree publication: **PENDING**',
              '- Main-tree publication: **PUBLISHED AT WORKFLOW COMPLETION**',
          ).replace(
              '**INTERNAL_ROUND5_POSITIVE_CLOSURE_CANDIDATE**',
              '**INTERNAL_ROUND5_POSITIVE_CLOSURE_VERIFIED**',
          )
          (root / 'ROUND5_REVISION_STATUS.md').write_text(status, encoding='utf-8')
          PY
          git add ROUND5_PUBLICATION_RECORD.json ROUND5_REVISION_STATUS.md
          git commit -m 'Record round-five publication metadata [skip ci]'
          echo "ROUND5_PUBLICATION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Upload verified papers and audit bundle
        uses: actions/upload-artifact@v4
        with:
          name: round5-verified-papers
          if-no-files-found: error
          retention-days: 30
          path: |
            ROUND5_PDF_BUNDLE/*.pdf
            ROUND5_BUILD_LOGS/*.log
            ROUND5_BUILD_SUMMARY.json
            ROUND5_BUILD_FAILURES.md
            ROUND5_STRUCTURAL_VERIFICATION.json
            ROUND5_HOSTILE_REREVIEW.json
            ROUND5_REFEREE_INVENTORY.json
            ROUND5_HISTORICAL_DERIVATION_AUDIT.md
            ROUND5_PROOF_DEPENDENCY_LEDGER.md
            ROUND5_FINAL_CERTIFICATE.json
            ROUND5_REVISION_MANIFEST.yaml
            ROUND5_REVISION_STATUS.md
            ROUND5_PUBLICATION_RECORD.json
            REFEREE_ROUND5_RESPONSE.md
            papers/*/AUTHOR_RESPONSE_ROUND5.md

      - name: Atomically archive old main and publish verified tree
        shell: bash
        run: |
          set -euo pipefail
          REVISION='revision/round5-referee-positive-closure-11paper-2026-08-31'
          ARCHIVE='archive/main-pre-round5-positive-closure-2026-08-31'
          TAG='round5-positive-closure-2026-08-31'
          git merge-base --is-ancestor "$ROUND5_PRE_MAIN" HEAD
          if git ls-remote --exit-code --heads origin "$ARCHIVE" >/dev/null 2>&1; then
            test "$(git ls-remote --heads origin "$ARCHIVE" | awk '{print $1}')" = "$ROUND5_PRE_MAIN"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Publication tag already exists; refusing ambiguous republish." >&2
            exit 1
          fi
          git tag -a "$TAG" -m 'Round-five positive referee closure: eleven verified papers'
          git push --atomic origin \
            HEAD:"refs/heads/$REVISION" \
            HEAD:refs/heads/main \
            "$ROUND5_PRE_MAIN":"refs/heads/$ARCHIVE" \
            "refs/tags/$TAG"

      - name: Verify remote publication refs
        shell: bash
        run: |
          set -euo pipefail
          REVISION='revision/round5-referee-positive-closure-11paper-2026-08-31'
          ARCHIVE='archive/main-pre-round5-positive-closure-2026-08-31'
          TAG='round5-positive-closure-2026-08-31'
          EXPECTED="$(git rev-parse HEAD)"
          test "$(git ls-remote --heads origin main | awk '{print $1}')" = "$EXPECTED"
          test "$(git ls-remote --heads origin "$REVISION" | awk '{print $1}')" = "$EXPECTED"
          test "$(git ls-remote --heads origin "$ARCHIVE" | awk '{print $1}')" = "$ROUND5_PRE_MAIN"
          test "$(git rev-list -n1 "$TAG")" = "$EXPECTED"
          echo "ROUND5_REMOTE_PUBLICATION_PASS sha=$EXPECTED"
