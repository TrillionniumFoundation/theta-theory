name: A1 v24 publication
on:
  push:
    branches:
      - revision/a1-english-v24-core-companions-2026-09-07
    paths:
      - .github/workflows/a1-v24-publication.yml
      - papers/A1-english-v24/publication/**
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify publication runner availability
        run: printf '%s\n' 'A1 v24 publication runner started; no manuscript modified by this probe.'
