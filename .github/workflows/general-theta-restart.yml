name: General Theta restart verification
on:
  push:
    branches: [foundation/general-theta-foundations-i-restart-2026-10-06]
    paths: ['.github/workflows/general-theta-restart.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: general-theta-restart-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify canonical restart and extracted v1 realization
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f GENERAL_THETA_RESTART_MANIFEST.json
          test -f GENERAL_THETA_RESTART_INDEX.md
          test -f foundations/general-theta/General_Theta_Foundations_v0.1.md
          test -f foundations/general-theta/RESTART_CHARTER.md
          test -f foundations/general-theta/REALIZATION_REGISTRY.md
          test -d papers/General-Theta-Foundations-I-restart
          test -d papers/realizations/causal-predictive-memory-v1
          test ! -e papers/GTF-I-v1
          python3 papers/realizations/causal-predictive-memory-v1/tools/verify.py > /tmp/cpm1-verify.json
          python3 -O papers/realizations/causal-predictive-memory-v1/tools/verify.py > /tmp/cpm1-verify-opt.json
          cmp /tmp/cpm1-verify.json /tmp/cpm1-verify-opt.json
          git ls-remote --exit-code --tags origin refs/tags/general-theta-foundations-i-restart-v0.2
          git ls-remote --exit-code --tags origin refs/tags/theta-realization-causal-predictive-memory-v1
          git ls-remote --exit-code --heads origin refs/heads/realization/causal-predictive-memory-v1-2026-10-06
          python3 - <<'PY' > /tmp/general-theta-restart-verification.json
          import json, os, subprocess
          print(json.dumps({
            "schema": "general-theta.restart-verification/1",
            "status": "success",
            "verified_head": os.environ["GITHUB_SHA"],
            "canonical_branch": "foundation/general-theta-foundations-i-restart-2026-10-06",
            "historical_seed": "bd2a4d377033d947f76e14291910da17d3de55db",
            "materialization_commit": "29d73bc9a83e1b6c06211b08186fb42b09f0c86d",
            "v1_realization_branch": "realization/causal-predictive-memory-v1-2026-10-06",
            "historical_branches_deleted": False,
            "force_updates_used": False,
            "ordinary_optimized_checks_identical": True
          }, sort_keys=True, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: general-theta-restart-verification-${{ github.sha }}
          path: |
            /tmp/cpm1-verify.json
            /tmp/cpm1-verify-opt.json
            /tmp/general-theta-restart-verification.json
          if-no-files-found: error
