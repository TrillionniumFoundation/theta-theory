name: A2 v25 complete native build
on:
  push:
    branches:
      - revision/a2-v25-observable-calibration-signature-top4-2026-09-12
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a2-v25-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive exact source before checking
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/a2-v25-evidence"
          git rev-parse HEAD > "${RUNNER_TEMP}/a2-v25-evidence/source-commit.txt"
          git status --porcelain=v1 > "${RUNNER_TEMP}/a2-v25-evidence/worktree-status.txt"
          git archive --format=tar.gz HEAD papers/A2-v17-boundary-information-coarsening > "${RUNNER_TEMP}/a2-v25-evidence/native-source.tar.gz"
          sha256sum "${RUNNER_TEMP}/a2-v25-evidence/native-source.tar.gz" > "${RUNNER_TEMP}/a2-v25-evidence/source-archive-sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: a2-v25-source-${{ github.sha }}
          path: ${{ runner.temp }}/a2-v25-evidence
          retention-days: 30
      - name: Install native build dependencies
        id: deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils python3-numpy python3-scipy
      - name: Verify v25 identities and complete source graph
        id: audit
        continue-on-error: true
        run: |
          set -euo pipefail
          /usr/bin/python3 papers/A2-v17-boundary-information-coarsening/tools/check_revision_v25.py > "${RUNNER_TEMP}/a2-v25-evidence/v25-normal.json" 2> "${RUNNER_TEMP}/a2-v25-evidence/v25-normal.stderr"
          /usr/bin/python3 -O papers/A2-v17-boundary-information-coarsening/tools/check_revision_v25.py > "${RUNNER_TEMP}/a2-v25-evidence/v25-optimized.json" 2> "${RUNNER_TEMP}/a2-v25-evidence/v25-optimized.stderr"
          cmp "${RUNNER_TEMP}/a2-v25-evidence/v25-normal.json" "${RUNNER_TEMP}/a2-v25-evidence/v25-optimized.json"
      - name: Build complete companion and article
        id: native
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          /usr/bin/python3 papers/A2-v17-boundary-information-coarsening/tools/build_submission.py --output-dir "${RUNNER_TEMP}/a2-v25-evidence/native-build"
      - name: Retained boundary diagnostics
        id: boundary
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          /usr/bin/python3 papers/A2-v17-boundary-information-coarsening/tools/check_boundary_information.py > "${RUNNER_TEMP}/a2-v25-evidence/boundary-normal.json"
          /usr/bin/python3 -O papers/A2-v17-boundary-information-coarsening/tools/check_boundary_information.py > "${RUNNER_TEMP}/a2-v25-evidence/boundary-optimized.json"
          cmp "${RUNNER_TEMP}/a2-v25-evidence/boundary-normal.json" "${RUNNER_TEMP}/a2-v25-evidence/boundary-optimized.json"
      - name: Record product hashes and execution status
        if: always()
        env:
          AUDIT_STATUS: ${{ steps.audit.outcome }}
          NATIVE_STATUS: ${{ steps.native.outcome }}
          BOUNDARY_STATUS: ${{ steps.boundary.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/a2-v25-evidence"
          printf 'source-audit=%s\nnative-build=%s\nboundary-diagnostics=%s\n' "$AUDIT_STATUS" "$NATIVE_STATUS" "$BOUNDARY_STATUS" > "${RUNNER_TEMP}/a2-v25-evidence/execution-status.txt"
          find "${RUNNER_TEMP}/a2-v25-evidence" -type f -name '*.pdf' -print0 | sort -z | xargs -0 -r sha256sum > "${RUNNER_TEMP}/a2-v25-evidence/pdf-sha256.txt"
          cat "${RUNNER_TEMP}/a2-v25-evidence/execution-status.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a2-v25-build-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/a2-v25-evidence
          retention-days: 30
      - name: Require all checks to have passed
        if: always()
        env:
          AUDIT_STATUS: ${{ steps.audit.outcome }}
          NATIVE_STATUS: ${{ steps.native.outcome }}
          BOUNDARY_STATUS: ${{ steps.boundary.outcome }}
        run: |
          test "$AUDIT_STATUS" = success
          test "$NATIVE_STATUS" = success
          test "$BOUNDARY_STATUS" = success
