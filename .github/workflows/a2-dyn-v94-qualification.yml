name: A2-DYN v94 radial entrance and signed forcing qualification
on:
  push:
    branches:
      - revision/a2-dyn-v94-referee-response-2026-10-12
      - revision/a2-dyn-v94-referee-copy-2026-10-12
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a2-dyn-v94-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify-manuscript:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Pin reviewed sources and exact checkout
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:papers/A2-DYN-v93-referee-response)" = "ef2f30899784526ad41aac95fe88c7417761e558"
          test "$(git rev-parse HEAD:papers/A2-DYN-v94-referee-response/provenance/v93-root)" = "d56ce08199c9177e2a2e7048ea810af911434e83"
          test "$(git rev-parse HEAD:reviews/a2-dyn-v93-external-top4-review-2026-10-12/REFEREE_REPORT.md)" = "7625de487f043ac21dc59fe7d98639284ed8736a"
          mkdir -p papers/A2-DYN-v94-referee-response/evidence
          git archive HEAD papers/A2-DYN-v93-referee-response papers/A2-DYN-v94-referee-response papers/A2-DYN-v88-referee-response papers/A2-DYN-v88-main-preserved reviews/a2-dyn-v93-external-top4-review-2026-10-12 .github/workflows/a2-dyn-v94-qualification.yml A2_DYN_V94_REVISION_INDEX.md > papers/A2-DYN-v94-referee-response/evidence/exact-source.tar
          printf '%s\n%s\n' "$GITHUB_SHA" "$GITHUB_REF" > papers/A2-DYN-v94-referee-response/evidence/exact-checkout.txt
          git rev-parse HEAD:papers/A2-DYN-v94-referee-response >> papers/A2-DYN-v94-referee-response/evidence/exact-checkout.txt
      - name: Install native TeX and diagnostic dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern python3-numpy python3-mpmath python3-sympy python3-scipy poppler-utils
      - name: Preserve sources and compile all 225 proof modules
        env:
          TZ: UTC
        run: bash papers/A2-DYN-v94-referee-response/build.sh
      - name: Upload exact-SHA article and complete archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-dyn-v94-${{ github.sha }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          path: |
            papers/A2-DYN-v94-referee-response/build/*.pdf
            papers/A2-DYN-v94-referee-response/build/*.log
            papers/A2-DYN-v94-referee-response/build/*.fls
            papers/A2-DYN-v94-referee-response/build/*.aux
            papers/A2-DYN-v94-referee-response/build/*-pass*.txt
            papers/A2-DYN-v94-referee-response/build/*.tex
            papers/A2-DYN-v94-referee-response/evidence/*
