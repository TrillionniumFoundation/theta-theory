name: A2-DYN v17 one-time exact source transport
on:
  push:
    branches:
      - revision/a2-dyn-v17-referee-response-2026-10-06
    paths:
      - .github/a2-dyn-v17-transport/**
      - .github/workflows/a2-dyn-v17-assemble.yml
permissions:
  contents: write
jobs:
  assemble:
    if: contains(github.event.head_commit.message, '[assemble-v17]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify source and create immutable paper tree only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 .github/a2-dyn-v17-transport/assemble.py
      - name: Upload exact assembly receipt
        uses: actions/upload-artifact@v4
        with:
          name: a2-dyn-v17-assembly-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: .github/a2-dyn-v17-transport/assembly-receipt.json
