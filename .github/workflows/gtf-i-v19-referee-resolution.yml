name: GTF-I v19 referee publication
on:
  push:
    branches:
      - revision/general-theta-foundations-i-v19-referee-resolution-2026-09-23
    paths:
      - 'papers/GTF-I-v19-referee-resolution/**'
      - '.github/workflows/gtf-i-v19-referee-resolution.yml'
permissions:
  contents: write
concurrency:
  group: gtf-i-v19-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical and typesetting inputs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-extra texlive-fonts-recommended lmodern
          python -m pip install -r papers/GTF-I-v18-continuation-transport/requirements.txt
      - name: Materialize and commit the complete canonical source
        run: |
          set -euo pipefail
          P=papers/GTF-I-v19-referee-resolution
          python "$P/finalize_source.py"
          python "$P/assemble.py"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$P"
          if ! git diff --cached --quiet; then
            git commit -m 'build(GTF-I v19): materialize inspected canonical source and exact inheritance [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "GTF_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Run source-bound diagnostics, typesetting and preservation
        run: |
          set -euo pipefail
          python papers/GTF-I-v19-referee-resolution/build.py | tee "$RUNNER_TEMP/gtf-v19-build-receipt.json"
      - name: Publish only the new revision and its entry point
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('papers/GTF-I-v19-referee-resolution')
          r=json.loads((p/'evidence/BUILD_RECEIPT.json').read_text())
          text='# General Theta Foundations I — v19 referee package\n\n'
          text+='**Continuation Complexity and Stable Causal Certification**\n\n'
          text+=f"Source commit: `{r['source_commit']}`. Build run: `{os.environ['GITHUB_RUN_ID']}`.\n\n"
          text+=f"Canonical article: {r['canonical_pages']} pages. Complete development: {r['complete_pages']} pages, including all {r['inherited_pages_verified']} predecessor pages unchanged.\n\n"
          text+='Directory: `papers/GTF-I-v19-referee-resolution/`. Start with `paper.pdf`, `RESPONSE_TO_REFEREE.md`, and `evidence/BUILD_RECEIPT.json`.\n\n'
          text+='The new results supply a streaming-width obstruction and exact binary audit threshold, a 400-training-reset nineteen-bit microscopic certificate, and global bounded-backward transport. All analytic claims await independent review; the Norberg original proof-level crosswalk remains unverified. Build success is not proof or acceptance.\n'
          Path('GENERAL_THETA_FOUNDATIONS_I_V19_REVIEW_READY.md').write_text(text)
          PY
          git add -f papers/GTF-I-v19-referee-resolution GENERAL_THETA_FOUNDATIONS_I_V19_REVIEW_READY.md
          if ! git diff --cached --quiet; then
            git commit -m 'publish(GTF-I v19): complete manuscript, historical companion and executed evidence [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "PUBLICATION_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: GTF-I-v19-referee-resolution
          path: papers/GTF-I-v19-referee-resolution/
          retention-days: 30
          if-no-files-found: error
      - name: Publication identities
        run: |
          echo "Source: $GTF_SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo "Publication: $PUBLICATION_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo "Build and finite diagnostics are not analytic certification." >> "$GITHUB_STEP_SUMMARY"
