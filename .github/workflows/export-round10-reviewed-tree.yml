name: export-round10-reviewed-tree

on:
  push:
    branches:
      - review/round10-gpt56-pro-harsh-11paper-2026-08-31
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify reviewed head and create source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor b45406b03ab45e70461d36da5d3ee64892a92c8f HEAD
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/review/round10-gpt56-pro-harsh-11paper-2026-08-31)"
          printf '%s\n' "$(git rev-parse HEAD)" > REVIEWED_HEAD.txt
          tar --exclude=.git --exclude='papers/*/main.pdf' -czf /tmp/theta-round10-reviewed-tree.tar.gz .
          sha256sum /tmp/theta-round10-reviewed-tree.tar.gz > REVIEWED_TREE_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: theta-round10-reviewed-tree
          path: |
            /tmp/theta-round10-reviewed-tree.tar.gz
            REVIEWED_HEAD.txt
            REVIEWED_TREE_SHA256.txt
          if-no-files-found: error
