name: GTF-I v35 sharp hidden memory

on:
  push:
    branches:
      - revision/general-theta-foundations-i-v35-sharp-memory-2026-09-25
    paths:
      - 'papers/GTF-I-v35-sharp-memory/**'
      - '.github/workflows/gtf-i-v35-sharp-memory.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gtf-i-v35-sharp-memory
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/revision/general-theta-foundations-i-v35-sharp-memory-2026-09-25'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
          sparse-checkout: |
            papers/GTF-I-v35-sharp-memory
            papers/GTF-I-v34-compatible-dynamics
            papers/GTF-I-v33-compatible-lifts
            papers/GTF-I-v32-causal-width
            papers/GTF-I-v31-compatible-memory
            papers/GTF-I-v30-streaming-geometry
            papers/GTF-I-v29-intrinsic-continuation
            papers/GTF-I-v28-causal-response
            papers/GTF-I-v27-resource-saddle
            papers/GTF-I-v26-controlled-memory-foundations
            papers/GTF-I-v25-controlled-minimax
            papers/GTF-I-v24-structural-resources
            reviews/general-theta-foundations-i-v34-compatible-dynamics-pipeline-harsh-top4-r19-2026-09-25
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind the committed native source
        shell: bash
        run: |
          test -f papers/GTF-I-v35-sharp-memory/main.tex
          test -f papers/GTF-I-v35-sharp-memory/packet-compression.tex
          git fetch --depth=1 origin 6016075083626f7c94cfb07912c49fa256fcf9e0
          test -z "$(git diff --name-only --diff-filter=DMRT 6016075083626f7c94cfb07912c49fa256fcf9e0 HEAD)"
          echo "GTF_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install typesetting and exact arithmetic
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended lmodern
          python -m pip install sympy==1.14.0 PyMuPDF==1.26.7
      - name: Verify and build the full revision
        run: python papers/GTF-I-v35-sharp-memory/build.py
      - name: Verify standalone core sources
        shell: bash
        run: |
          CORE=$(mktemp -d)
          python -c 'import sys,zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' papers/GTF-I-v35-sharp-memory/evidence/CORE_SOURCES.zip "$CORE"
          python "$CORE/GTF-I-v35-sharp-memory/build.py" --core-only
      - name: Publish only the new package and referee-ready branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f papers/GTF-I-v35-sharp-memory GENERAL_THETA_FOUNDATIONS_I_V35_REVIEW_READY.md
          git commit -m 'publish(GTF-I v35): sharp theorem, response, independent core build and preserved archives [skip ci]'
          test -z "$(git diff --name-only --diff-filter=DMRT 6016075083626f7c94cfb07912c49fa256fcf9e0 HEAD)"
          READY='revision/general-theta-foundations-i-v35-referee-ready-2026-09-25'
          if git ls-remote --exit-code --heads origin "$READY"; then
            git fetch origin "$READY"
            git merge-base --is-ancestor FETCH_HEAD HEAD
          fi
          git push origin HEAD:"$GITHUB_REF_NAME" HEAD:"$READY"
      - name: Upload referee artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GTF-I-v35-sharp-memory
          path: papers/GTF-I-v35-sharp-memory/
          retention-days: 30
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GTF-I-v35-diagnostics
          path: |
            papers/GTF-I-v35-sharp-memory/evidence/
            papers/GTF-I-v35-sharp-memory/*.tex
            papers/GTF-I-v35-sharp-memory/*.py
          retention-days: 7
