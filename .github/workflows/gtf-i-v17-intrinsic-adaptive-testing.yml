name: GTF-I v17 intrinsic adaptive testing
on:
  push:
    branches:
      - revision/general-theta-foundations-i-v17-intrinsic-adaptive-testing-2026-09-23
    paths:
      - 'papers/GTF-I-v17-intrinsic-adaptive-testing/RELEASE_MANIFEST.json'
      - '.github/workflows/gtf-i-v17-intrinsic-adaptive-testing.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gtf-i-v17-intrinsic-adaptive-testing
  cancel-in-progress: false
jobs:
  revise-and-verify:
    if: github.ref == 'refs/heads/revision/general-theta-foundations-i-v17-intrinsic-adaptive-testing-2026-09-23'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 32
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and materialize exact revision sources
        shell: bash
        run: |
          git merge-base --is-ancestor b59d8527c8edc0361be3085604bcf3a920dbfbda HEAD
          git fetch --no-tags origin f52d4afe6a688a2c440d4f9f351e3664e1f08a2a
          python - <<'PYCODE'
          import base64, hashlib, json, lzma, pathlib, re
          root = pathlib.Path('papers/GTF-I-v17-intrinsic-adaptive-testing')
          base = 'b59d8527c8edc0361be3085604bcf3a920dbfbda'
          previous = 'fef82d8f0e4be84f149dd9a747b72244551a4153'
          digest = lambda data: hashlib.sha256(data).hexdigest()
          def checked_source(name, expected):
              rel = pathlib.PurePosixPath(name)
              if rel.is_absolute() or '..' in rel.parts or rel.parts[0] != 'papers':
                  raise RuntimeError('Invalid inherited source path: '+name)
              data = pathlib.Path(rel).read_bytes()
              if digest(data) != expected:
                  raise RuntimeError('Inherited source digest mismatch: '+name)
              return data
          manifest = json.loads((root/'RELEASE_MANIFEST.json').read_text())
          if manifest['base_commit'] != base or manifest['compression'] != 'lzma':
              raise RuntimeError('Unexpected source base or codec')
          encoded = []
          for part in manifest['parts']:
              if not re.fullmatch(r'RELEASE_PART_[0-9]{2}\.b64', part['file']):
                  raise RuntimeError('Invalid transport part name')
              data = (root/part['file']).read_bytes()
              if digest(data) != part['sha256']:
                  raise RuntimeError('Transport digest mismatch: '+part['file'])
              encoded.append(data.decode('ascii').strip())
          compressed = base64.b64decode(''.join(encoded), validate=True)
          if digest(compressed) != manifest['compressed_sha256']:
              raise RuntimeError('Compressed digest mismatch')
          raw = lzma.decompress(compressed)
          if digest(raw) != manifest['raw_sha256']:
              raise RuntimeError('Bundle digest mismatch')
          bundle = json.loads(raw)
          if bundle['base_commit'] != base or len(bundle['files']) != manifest['files']:
              raise RuntimeError('Unexpected source bundle')
          for name, specification in bundle['files'].items():
              rel = pathlib.PurePosixPath(name)
              if rel.is_absolute() or len(rel.parts) != 1 or rel.suffix not in {'.tex','.md','.py','.json','.txt'}:
                  raise RuntimeError('Out-of-scope source path: '+name)
              if isinstance(specification, str):
                  text = specification
              elif specification.get('derive') == 'v16-inputs':
                  inherited_name = 'papers/GTF-I-v16-constructive-causal-certification/INHERITED_INPUTS.json'
                  manifest_name = 'papers/GTF-I-v16-constructive-causal-certification/SOURCE_MANIFEST.json'
                  values = {k:checked_source(k,v) for k,v in specification['bases'].items()}
                  files = json.loads(values[inherited_name])['files']
                  files.update(json.loads(values[manifest_name])['files'])
                  files[manifest_name] = digest(values[manifest_name])
                  text = json.dumps({'source_commit':previous,'files':dict(sorted(files.items()))},indent=2)+'\n'
              else:
                  data0 = checked_source(specification['base'], specification['base_sha256'])
                  if specification.get('derive') == 'v16-labels':
                      labels = {m.group(1):{'number':m.group(2),'page':int(m.group(3))} for m in re.finditer(r'\\newlabel\{([^}]+)\}\{\{([^}]*)\}\{(\d+)\}',data0.decode('utf-8'))}
                      text = json.dumps({'source_commit':previous,'labels':labels},indent=2)+'\n'
                  elif 'derive' in specification:
                      raise RuntimeError('Unknown source derivation')
                  else:
                      lines = data0.decode('utf-8').splitlines(keepends=True)
                      pieces = []
                      for op in specification['ops']:
                          if isinstance(op,str):
                              pieces.append(op)
                          elif isinstance(op,list) and len(op)==2 and all(isinstance(i,int) for i in op) and 0 <= op[0] <= op[1] <= len(lines):
                              pieces.append(''.join(lines[op[0]:op[1]]))
                          else:
                              raise RuntimeError('Invalid source delta operation')
                      text = ''.join(pieces)
              data = text.encode('utf-8')
              if digest(data) != bundle['sha256'][name]:
                  raise RuntimeError('Source digest mismatch: '+name)
              (root/name).write_bytes(data)
          print('Validated plaintext revision files:',len(bundle['files']))
          PYCODE
          git config user.name 'GTF revision build'
          git config user.email 'gtf-build@users.noreply.github.com'
          git add papers/GTF-I-v17-intrinsic-adaptive-testing
          if ! git diff --cached --quiet; then
            git commit -m 'revise(GTF-I v17): intrinsic adaptive testing, collision resource gaps and optional stability'
            git push origin HEAD:revision/general-theta-foundations-i-v17-intrinsic-adaptive-testing-2026-09-23
          fi
          echo "GTF_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install verification and typesetting dependencies
        run: |
          python -m pip install -r papers/GTF-I-v17-intrinsic-adaptive-testing/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - name: Verify full diagnostic history and compile exact sources
        run: python papers/GTF-I-v17-intrinsic-adaptive-testing/build.py
      - name: Publish exact-source PDFs and evidence on this branch only
        run: |
          python - <<'PYCODE'
          import json,os,pathlib
          p=pathlib.Path('papers/GTF-I-v17-intrinsic-adaptive-testing/evidence/REMOTE_BUILD.json')
          p.write_text(json.dumps({'source_commit':os.environ['GTF_SOURCE_COMMIT'],'workflow_run':os.environ['GITHUB_RUN_ID'],'branch':os.environ['GITHUB_REF_NAME'],'build_command_completed':True,'scope':'Source and build identity, not an analytic proof certificate or journal approval.'},indent=2)+'\n')
          PYCODE
          git add -f papers/GTF-I-v17-intrinsic-adaptive-testing/paper.pdf papers/GTF-I-v17-intrinsic-adaptive-testing/complete-development.pdf papers/GTF-I-v17-intrinsic-adaptive-testing/evidence
          if ! git diff --cached --quiet; then
            git commit -m 'publish(GTF-I v17): full manuscripts, standalone submission sources and verified evidence'
            git push origin HEAD:revision/general-theta-foundations-i-v17-intrinsic-adaptive-testing-2026-09-23
          fi
      - name: Upload revision package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtf-i-v17-intrinsic-adaptive-testing-${{ github.run_id }}
          path: |
            papers/GTF-I-v17-intrinsic-adaptive-testing
            !papers/GTF-I-v17-intrinsic-adaptive-testing/__pycache__
          retention-days: 30
