name: A2-DYN v83 complete optical and first-exit source qualification
on:
  push:
    branches:
      - revision/a2-dyn-v83-referee-response-2026-10-11
      - revision/a2-dyn-v83-referee-copy-2026-10-11
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a2-dyn-v83-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify-manuscript:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Pin reviewed sources and exact checkout
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:papers/A2-DYN-v82-referee-response)" = "d1908253a6d134b5b1e4c732e84ad111ad4f836a"
          test "$(git rev-parse HEAD:papers/A2-DYN-v81-referee-response)" = "1d68fef5bbd1abc573d8e517e845cf889fe6431c"
          test "$(git rev-parse HEAD:reviews/a2-dyn-v81-external-top4-review-2026-10-11/REFEREE_REPORT.md)" = "818e5932c895aea686da68fe37cec6018d2de759"
          mkdir -p papers/A2-DYN-v83-referee-response/evidence
          git archive HEAD papers/A2-DYN-v72-referee-response papers/A2-DYN-v73-referee-response papers/A2-DYN-v74-referee-response papers/A2-DYN-v75-referee-response papers/A2-DYN-v76-referee-response papers/A2-DYN-v77-referee-response papers/A2-DYN-v78-referee-response papers/A2-DYN-v79-referee-response papers/A2-DYN-v80-referee-response papers/A2-DYN-v81-referee-response papers/A2-DYN-v82-referee-response papers/A2-DYN-v83-referee-response reviews/a2-dyn-v79-external-top4-review-2026-10-11 reviews/a2-dyn-v81-external-top4-review-2026-10-11 .github/workflows/a2-dyn-v83-qualification.yml A2_DYN_V83_REVISION_INDEX.md > papers/A2-DYN-v83-referee-response/evidence/exact-source.tar
          printf '%s\n%s\n' "$GITHUB_SHA" "$GITHUB_REF" > papers/A2-DYN-v83-referee-response/evidence/exact-checkout.txt
          git rev-parse HEAD:papers/A2-DYN-v83-referee-response >> papers/A2-DYN-v83-referee-response/evidence/exact-checkout.txt
      - name: Install native TeX and finite-check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern python3-numpy python3-mpmath python3-sympy python3-scipy poppler-utils
      - name: Preserve sources and compile all 192 proof modules
        env:
          TZ: UTC
        run: bash papers/A2-DYN-v83-referee-response/build.sh
      - name: Upload exact-SHA article and complete-supplement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-dyn-v83-${{ github.sha }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          path: |
            papers/A2-DYN-v83-referee-response/build/*.pdf
            papers/A2-DYN-v83-referee-response/build/*.log
            papers/A2-DYN-v83-referee-response/build/*.fls
            papers/A2-DYN-v83-referee-response/build/*.aux
            papers/A2-DYN-v83-referee-response/build/*-pass*.txt
            papers/A2-DYN-v83-referee-response/build/*.tex
            papers/A2-DYN-v83-referee-response/evidence/*
