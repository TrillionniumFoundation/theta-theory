name: A2 v34 complete native submission
on:
  push:
    branches: [revision/a2-v34-integrated-referee-response-native-evidence-2026-09-13]
    paths:
      - 'papers/A2-v17-boundary-information-coarsening/**/*.tex'
      - 'papers/A2-v17-boundary-information-coarsening/tools/**'
      - '.github/workflows/a2-v34-native-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      P: papers/A2-v17-boundary-information-coarsening
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Preserve immutable full source before installation
        run: |
          mkdir -p "$RUNNER_TEMP/a2-v34"
          git rev-parse HEAD > "$RUNNER_TEMP/a2-v34/source-commit.txt"
          git archive HEAD "$P" README.md reviews/a2-v32-external-harsh-top4-2026-09-12 .github/workflows/a2-v34-native-build.yml | gzip -n > "$RUNNER_TEMP/a2-v34/native-source.tar.gz"
          python3 --version > "$RUNNER_TEMP/a2-v34/python-version.txt"
      - name: Export full source for independent native reproduction
        uses: actions/upload-artifact@v4
        with:
          name: a2-v34-source-${{ github.sha }}
          path: ${{ runner.temp }}/a2-v34
          if-no-files-found: error
      - name: Install native typesetting tools
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended texlive-science lmodern poppler-utils
      - name: Execute v34 exact and preservation diagnostics
        run: |
          python3 "$P/tools/check_revision_v34.py" > "$RUNNER_TEMP/a2-v34/v34-normal.json"
          python3 -O "$P/tools/check_revision_v34.py" > "$RUNNER_TEMP/a2-v34/v34-optimized.json"
          cmp "$RUNNER_TEMP/a2-v34/v34-normal.json" "$RUNNER_TEMP/a2-v34/v34-optimized.json"
      - name: Audit both complete native source graphs
        if: always()
        run: python3 "$P/tools/audit_native_sources_v27.py" --output "$RUNNER_TEMP/a2-v34/native-graph.json"
      - name: Build both complete native entries and preserve failed logs
        if: always()
        run: python3 "$P/tools/build_submission.py" --output-dir "$RUNNER_TEMP/a2-v34/native-build"
      - name: Record all available product hashes
        if: always()
        run: |
          cd "$RUNNER_TEMP/a2-v34"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
      - name: Preserve source, logs, products and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-v34-native-${{ github.sha }}
          path: ${{ runner.temp }}/a2-v34
          if-no-files-found: error
