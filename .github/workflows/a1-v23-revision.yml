name: A1 v23 readable-source validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a1-v23-readable-validation
  cancel-in-progress: false
jobs:
  validate-v23:
    if: github.repository == 'TrillionniumFoundation/theta-theory' && github.ref == 'refs/heads/revision/a1-english-v23-collision-spine-saturated-proof-2026-09-07'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install build dependencies
        run: |
          python -m pip install sympy==1.14.0
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - name: Verify readable sources and execute full validation
        working-directory: papers/A1-english-v23
        run: |
          python manifest.py
          python validate.py
      - name: Package validated article and source dependencies
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          folders=('papers/A1-english-v20','papers/A1-english-v21','papers/A1-english-v22','papers/A1-english-v23','reviews/a1-english-v21-independent-2026-09-07','reviews/a1-english-v22-harsh-independent-2026-09-07')
          with zipfile.ZipFile('A1-v23-complete-referee-package.zip','w',zipfile.ZIP_DEFLATED) as z:
              for folder in folders:
                  for p in sorted(Path(folder).rglob('*')):
                      if p.is_file() and '__pycache__' not in p.parts and p.suffix not in ('.pyc','.aux','.out','.toc'):
                          z.write(p,p.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: A1-v23-complete-referee-package
          path: A1-v23-complete-referee-package.zip
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: A1-v23-validation-diagnostics
          path: |
            papers/A1-english-v23/validation
            papers/A1-english-v23/build
            papers/A1-english-v23/main.log
          if-no-files-found: ignore
