name: General Theta R57 sealed rebuild
on:
  push:
    branches: [foundation/general-theta-restart-r57-role-aware-transfer-research-2026-10-14]
    paths: [.github/workflows/theta-r57-rebuild.yml]
permissions:
  contents: write
concurrency:
  group: theta-r57-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      SOURCE_DATE_EPOCH: '1791849600'
      FORCE_SOURCE_DATE: '1'
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
          python -m pip install numpy==2.3.5 scipy==1.17.0 pypdf==5.9.0
      - name: Seal citation-compatible ordinary source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          D=papers/General-Theta-Foundations-I-restart/r57-role-aware-transfer
          test ! -e "$D/artifacts"
          BEFORE=$(git rev-parse HEAD)
          test "$(git ls-remote origin refs/heads/$GITHUB_REF_NAME | cut -f1)" = "$BEFORE"
          python - <<'PY'
          from pathlib import Path
          import re
          d=Path('papers/General-Theta-Foundations-I-restart/r57-role-aware-transfer')
          changed=[]
          for f in sorted(d.rglob('*.tex')):
              old=f.read_text()
              def separate(match):
                  keys=[x.strip() for x in match.group(1).split(',')]
                  return ', '.join('\\cite{'+x+'}' for x in keys)
              new=re.sub(r'\\cite\{([^}]*,[^}]+)\}',separate,old)
              if new!=old:
                  f.write_text(new);changed.append(str(f.relative_to(d)))
          if not changed: raise RuntimeError('Expected grouped citations to normalize')
          (d/'BUILD_RETRY_NOTE.md').write_text(
              '# Citation-audit rebuild\n\n'
              'The initial hosted run 38514626770 failed its auxiliary-file citation audit after the native 27-page PDF compiled. '
              'Its error was `declared citation CGM97 absent from aux`. CGM97 and GG99 were already cited together in the source. '
              'This follow-up expands grouped native citation commands into individually emitted citation records, preserving every key and all mathematical prose. '
              'It does not remove bibliography entries or weaken any mathematical, source, label, or build check. '
              'The ordinary source is re-sealed before a new immutable source commit; the complete retained build is rerun.\n\n'
              'Changed native inputs: '+', '.join(changed)+'.\n')
          PY
          python "$D/seal.py"
          python "$D/verify.py"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$D"
          git commit -m 'source(theta): preserve all references with individual auxiliary citation records'
          test "$(git ls-remote origin refs/heads/$GITHUB_REF_NAME | cut -f1)" = "$BEFORE"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Complete native and retained mathematical build
        run: >-
          python papers/General-Theta-Foundations-I-restart/r57-role-aware-transfer/build.py
          --source-sha '${{ steps.source.outputs.source_sha }}'
          --prepared-root '${{ github.workspace }}' --retained
          --output '${{ runner.temp }}/theta-r57-build'
      - name: Publish artifacts with source parent
        run: python .github/scripts/theta-r57-publish.py store --build '${{ runner.temp }}/theta-r57-build'
      - uses: actions/upload-artifact@v4
        with:
          name: theta-r57-native-${{ github.run_id }}
          path: ${{ runner.temp }}/theta-r57-build/download/native/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: theta-r57-retained-1-${{ github.run_id }}
          path: ${{ runner.temp }}/theta-r57-build/download/retained-1/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: theta-r57-retained-2-${{ github.run_id }}
          path: ${{ runner.temp }}/theta-r57-build/download/retained-2/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: theta-r57-retained-3-${{ github.run_id }}
          path: ${{ runner.temp }}/theta-r57-build/download/retained-3/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: theta-r57-retained-4-${{ github.run_id }}
          path: ${{ runner.temp }}/theta-r57-build/download/retained-4/
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: theta-r57-retained-5-${{ github.run_id }}
          path: ${{ runner.temp }}/theta-r57-build/download/retained-5/
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: theta-r57-retained-6-${{ github.run_id }}
          path: ${{ runner.temp }}/theta-r57-build/download/retained-6/
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: theta-r57-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/theta-r57-build/
          if-no-files-found: warn
