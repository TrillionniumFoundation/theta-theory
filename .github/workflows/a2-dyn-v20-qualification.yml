name: A2-DYN v20 exact-source qualification
on:
  push:
    branches:
      - revision/a2-dyn-v20-referee-response-2026-10-06
      - revision/a2-dyn-v20-referee-copy-2026-10-06
    paths:
      - papers/A2-DYN-v20-referee-response/**
      - .github/workflows/a2-dyn-v20-qualification.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a2-dyn-v20-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Archive exact source and baseline
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p papers/A2-DYN-v20-referee-response/evidence
          git archive --format=tar HEAD papers/A2-DYN-v20-referee-response papers/A2-DYN-v19-referee-response reviews/a2-dyn-v19-external-top4-review-2026-10-06 .github/workflows/a2-dyn-v20-qualification.yml > papers/A2-DYN-v20-referee-response/evidence/exact-source.tar
      - name: Install native TeX and numerical diagnostics
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra lmodern python3-mpmath python3-numpy
      - name: Verify and build exact source
        env:
          TZ: UTC
        run: bash papers/A2-DYN-v20-referee-response/build.sh
      - name: Upload exact qualification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-dyn-v20-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            papers/A2-DYN-v20-referee-response/build/main.pdf
            papers/A2-DYN-v20-referee-response/build/main.log
            papers/A2-DYN-v20-referee-response/build/main.fls
            papers/A2-DYN-v20-referee-response/build/pass*.txt
            papers/A2-DYN-v20-referee-response/evidence/*
