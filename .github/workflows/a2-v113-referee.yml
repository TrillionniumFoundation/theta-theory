name: A2 v113 source-bound referee build
on:
  push:
    branches:
      - revision/a2-v113-residual-conormal-wall-crossings-2026-09-22
    paths:
      - 'papers/A2-v17-boundary-information-coarsening/article/v113/**.tex'
      - 'papers/A2-v17-boundary-information-coarsening/article/v113/**.py'
      - 'papers/A2-v17-boundary-information-coarsening/article/v113/**.md'
      - 'A2_REVISION_V113_INDEX.md'
      - '.github/workflows/a2-v113-referee.yml'
permissions:
  contents: write
concurrency:
  group: a2-v113-referee-build
  cancel-in-progress: false
jobs:
  referee:
    if: github.ref == 'refs/heads/revision/a2-v113-residual-conormal-wall-crossings-2026-09-22'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ARTICLE: papers/A2-v17-boundary-information-coarsening/article/v113
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 32
          sparse-checkout: |
            papers/A2-v17-boundary-information-coarsening/article/v112
            papers/A2-v17-boundary-information-coarsening/article/v113
            reviews/a2-v112-independent-harsh-top4-r2-2026-09-22
            .github/workflows
      - name: Install TeX and PDF inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - name: Source preservation and finite diagnostics
        run: python3 "$ARTICLE/verify_revision.py" --source-only
      - name: Compile principal manuscript
        run: |
          cd "$ARTICLE"
          mkdir -p evidence
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error paper.tex 2>&1 | tee evidence/latexmk.log
          cp paper.log evidence/paper.log
      - name: Bind receipt to source and PDF
        run: python3 "$ARTICLE/verify_revision.py" --with-pdf
      - name: Commit generated evidence to this revision branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'revision/a2-v113-residual-conormal-wall-crossings-2026-09-22'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$ARTICLE/paper.pdf" "$ARTICLE/evidence"
          if ! git diff --cached --quiet; then
            git commit -m "A2 v113: bind generated PDF and verification to source $GITHUB_SHA"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
      - name: Upload referee bundle and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a2-v113-review-bundle-${{ github.sha }}
          path: |
            papers/A2-v17-boundary-information-coarsening/article/v113
            A2_REVISION_V113_INDEX.md
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
