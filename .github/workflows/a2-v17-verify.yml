name: A2 v17 exact-source full-package verification
on:
  push:
    branches:
      - revision/a2-v17-unregistered-stable-rigidity-2026-09-28
    paths:
      - 'papers/A2-v17-unregistered-stable-rigidity/**'
      - '.github/workflows/a2-v17-verify.yml'
permissions:
  contents: read
jobs:
  manuscript:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            papers/A2-v17-unregistered-stable-rigidity
      - name: Install the mathematical build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended latexmk python3 poppler-utils
      - name: Validate fixed sources and build all submission volumes
        working-directory: papers/A2-v17-unregistered-stable-rigidity
        run: python3 tools/run_validation.py --all-volumes
      - name: Upload actual execution evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: A2-v17-${{ github.sha }}
          path: |
            papers/A2-v17-unregistered-stable-rigidity/verification/current/
            papers/A2-v17-unregistered-stable-rigidity/verification/local/
            papers/A2-v17-unregistered-stable-rigidity/build/
            papers/A2-v17-unregistered-stable-rigidity/SOURCE_PINS.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
