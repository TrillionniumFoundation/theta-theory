name: GTF-I v65 exact-head reconstruction
on:
  push:
    branches:
      - revision/general-theta-foundations-i-v65-positive-instrument-streaming-2026-09-29
    paths:
      - GENERAL_THETA_FOUNDATIONS_I_V65_FINAL_HEAD_REQUEST.json
permissions:
  contents: read
concurrency:
  group: gtf65-exact-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-22.04
    container: debian:13-slim@sha256:a99cfc517144bc59b1978475ec53b46ecabec7e43635402ee5b77cc54cd1b20a
    timeout-minutes: 30
    steps:
      - name: Install fixed Python dependencies and Debian 13 typesetting stack
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates git python3 python3-venv texlive-latex-extra texlive-fonts-recommended lmodern
          python3 -m venv /opt/gtf65-venv
          /opt/gtf65-venv/bin/pip install --disable-pip-version-check PyMuPDF==1.26.7 sympy==1.14.0
      - name: Read-only checkout of the exact final head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - name: Trust only the exact container checkout
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Rebuild exact sources, all PDF pages and exact arithmetic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gtf65-attestation"
          /opt/gtf65-venv/bin/python papers/GTF-I-v65-positive-instrument-streaming/build_revision.py --verify-published > "$RUNNER_TEMP/gtf65-attestation/FINAL_HEAD.json"
          git diff --exit-code
      - name: Independently reconstruct the minimal journal package
        shell: bash
        run: |
          set -euo pipefail
          /opt/gtf65-venv/bin/python - <<'PY'
          import os,pathlib,subprocess,zipfile
          d=pathlib.Path(os.environ['RUNNER_TEMP'])/'gtf65-journal'
          d.mkdir()
          with zipfile.ZipFile('papers/GTF-I-v65-positive-instrument-streaming/evidence/JOURNAL_PACKAGE.zip') as z:
              z.extractall(d)
          r=subprocess.run(['/opt/gtf65-venv/bin/python',str(d/'journal_verify.py')],check=True,capture_output=True)
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'gtf65-attestation/JOURNAL_REBUILD.json').write_bytes(r.stdout)
          PY
      - name: Upload external read-only attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gtf-v65-final-head-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/gtf65-attestation/
          if-no-files-found: error
