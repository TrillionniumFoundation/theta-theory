name: GTF-I v96 R62 source-first revision
on:
  push:
    branches: [revision/general-theta-foundations-i-v96-r62-response-2026-10-06]
    paths:
      - '.github/workflows/gtf-v96-revision.yml'
      - 'papers/GTF-I-v96-referee-resolution/**'
      - 'GENERAL_THETA_FOUNDATIONS_I_V96_FINAL_HEAD_REQUEST.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gtf96-${{ github.ref }}
  cancel-in-progress: false
jobs:
  revision:
    if: ${{ !contains(github.event.head_commit.message, 'verify-final-head') && !startsWith(github.event.head_commit.message, 'publication(') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
          ref: ${{ github.sha }}
      - name: Collect exact report bytes
        run: |
          set -euo pipefail
          mkdir -p /tmp/gtf96-reports
          cp GENERAL_THETA_FOUNDATIONS_I_V94_INDEPENDENT_REFEREE_REPORT_R62.md /tmp/gtf96-reports/FROZEN_R62_REPORT.md
          git fetch --no-tags --depth=1 origin df919e7a2d917d71f5525d2034f524b97809121b a5b01294ce8fe7d4ca3782f762fba71f0cd44509
          git show df919e7a2d917d71f5525d2034f524b97809121b:GENERAL_THETA_FOUNDATIONS_I_V94_REFEREE_REPORT_R61.md > /tmp/gtf96-reports/FROZEN_R61_REPORT.md
          git show a5b01294ce8fe7d4ca3782f762fba71f0cd44509:GENERAL_THETA_FOUNDATIONS_I_V94_PROOF_PIPELINE_AUDIT_R61.md > /tmp/gtf96-reports/FROZEN_R61_PIPELINE_AUDIT.md
      - uses: actions/upload-artifact@v4
        with:
          name: gtf96-controlling-reports-${{ github.run_id }}
          path: /tmp/gtf96-reports
          if-no-files-found: error
      - name: Install manuscript tools
        if: ${{ hashFiles('papers/GTF-I-v96-referee-resolution/build_revision.py') != '' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-extra texlive-fonts-recommended lmodern
          python -m pip install --disable-pip-version-check pymupdf==1.26.7 sympy==1.14.0 numpy==2.3.5
      - name: Qualify already-pushed source and publish artifacts
        if: ${{ hashFiles('papers/GTF-I-v96-referee-resolution/build_revision.py') != '' }}
        env:
          REVISION_BRANCH: revision/general-theta-foundations-i-v96-r62-response-2026-10-06
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/$REVISION_BRANCH | cut -f1)" = "$GITHUB_SHA"
          PAPER=papers/GTF-I-v96-referee-resolution
          python "$PAPER/build_revision.py" --isolated > /tmp/gtf96-build.json
          git config user.name 'GTF revision automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$PAPER/evidence" "$PAPER/paper.pdf" "$PAPER/BINARY_SUPPLEMENT.pdf" "$PAPER/STRUCTURAL_PAPER.pdf" "$PAPER/COMPLETE_REVISION.pdf"
          git commit -m 'publication(GTF-I v96): R62 manuscripts and freshly reconstructed evidence'
          git push origin HEAD:"refs/heads/$REVISION_BRANCH"
          git rev-parse HEAD > /tmp/gtf96-publication-sha.txt
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('papers/GTF-I-v96-referee-resolution/build_revision.py') != '' }}
        with:
          name: gtf96-publication-${{ github.run_id }}
          path: |
            papers/GTF-I-v96-referee-resolution
            /tmp/gtf96-build.json
            /tmp/gtf96-publication-sha.txt
  final-head:
    if: ${{ contains(github.event.head_commit.message, 'verify-final-head') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install read-only reconstruction tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-extra texlive-fonts-recommended lmodern
          python -m pip install --disable-pip-version-check pymupdf==1.26.7 sympy==1.14.0 numpy==2.3.5
      - name: Reconstruct the exact submitted head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python papers/GTF-I-v96-referee-resolution/build_revision.py --verify-published > /tmp/gtf96-FINAL_HEAD.json
          python - <<'PY'
          import json, os
          x=json.load(open('/tmp/gtf96-FINAL_HEAD.json'))
          if x['status']!='success' or not x['read_only'] or x['verified_head']!=os.environ['GITHUB_SHA']:
              raise RuntimeError('Final-head identity or reconstruction failed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gtf96-exact-final-head-${{ github.sha }}
          path: /tmp/gtf96-FINAL_HEAD.json
          if-no-files-found: error
