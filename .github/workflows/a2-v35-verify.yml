name: A2 v35 manuscript qualification
on:
  push:
    branches:
      - revision/a2-v35-self-calibrated-stationary-2026-10-04
    paths:
      - 'papers/A2-v35-self-calibrated-stationary/**'
      - '.github/workflows/a2-v35-verify.yml'
permissions:
  contents: read
jobs:
  manuscript:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install LaTeX and PDF diagnostics
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended latexmk poppler-utils
      - name: Build primary manuscript
        working-directory: papers/A2-v35-self-calibrated-stationary
        run: |
          mkdir -p build
          latexmk -g -pdf -interaction=nonstopmode -halt-on-error -outdir=build main.tex
          pdfinfo build/main.pdf
          if grep -E '(^| )(Warning|undefined|Overfull|Underfull)' build/main.log; then exit 1; fi
      - name: Bind exact source commit
        run: |
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          git status --short
