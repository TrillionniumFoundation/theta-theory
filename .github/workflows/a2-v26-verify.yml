name: A2 v26 exact-source review package
on:
  push:
    branches:
      - revision/a2-v26-collision-certification-2026-10-03
    paths:
      - 'papers/A2-v26-adaptive-recognition/**'
      - '.github/workflows/a2-v26-verify.yml'
permissions:
  contents: read
jobs:
  manuscript:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            papers/A2-v26-adaptive-recognition
      - name: Archive native source and checkout identity
        run: |
          mkdir -p delivery
          git rev-parse HEAD > delivery/commit.txt
          git rev-parse 'HEAD^{tree}' > delivery/tree.txt
          git archive --format=zip --output=delivery/A2-v26-exact-source.zip HEAD papers/A2-v26-adaptive-recognition
          sha256sum delivery/A2-v26-exact-source.zip > delivery/source-archive.sha256
      - name: Install build tools when qualification driver is present
        if: ${{ hashFiles('papers/A2-v26-adaptive-recognition/tools/validate_v26.py') != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-numpy python3-scipy texlive-latex-extra texlive-fonts-recommended latexmk poppler-utils
      - name: Qualify exact source and all declared volumes
        if: ${{ hashFiles('papers/A2-v26-adaptive-recognition/tools/validate_v26.py') != '' }}
        working-directory: papers/A2-v26-adaptive-recognition
        run: python3 tools/validate_v26.py --all-volumes --require-checkout
      - name: Collect available evidence without relabelling bootstrap as qualification
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib, shutil
          root=pathlib.Path('papers/A2-v26-adaptive-recognition')
          receipt=root/'verification/current/receipt.json'
          out=pathlib.Path('delivery');out.mkdir(exist_ok=True)
          if receipt.exists():
              shutil.copy2(receipt,out/'receipt.json')
              for p in root.rglob('*.pdf'):
                  if '/build/' in str(p) or '/verification/' in str(p):
                      target=out/'pdfs'/p.relative_to(root)
                      target.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,target)
              shutil.make_archive(str(out/'execution-evidence'),'zip',root,'verification')
          else:
              (out/'bootstrap-status.json').write_text(json.dumps({'scope':'source_archive_only','full_package_qualified':False},indent=2)+'\n')
          PY
      - name: Upload actual archive and execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: A2-v26-${{ github.sha }}
          path: delivery/
          retention-days: 30
          if-no-files-found: error
