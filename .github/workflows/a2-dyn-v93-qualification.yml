name: A2-DYN v93 signed ancestral upper-source qualification
on:
  push:
    branches:
      - revision/a2-dyn-v93-referee-response-2026-10-12
      - revision/a2-dyn-v93-referee-copy-2026-10-12
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a2-dyn-v93-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify-manuscript:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Pin original source, report and preserved variants
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:papers/A2-DYN-v92-referee-response)" = "21b939b80d61a3ebfbb7620c95fb49dbee622dd5"
          test "$(git rev-parse HEAD:papers/A2-DYN-v93-referee-response/provenance/v92-source)" = "21b939b80d61a3ebfbb7620c95fb49dbee622dd5"
          test "$(git rev-parse HEAD:reviews/a2-dyn-v92-external-top4-review-2026-10-12/REFEREE_REPORT.md)" = "b13997f04b117379c844f5ce237126cb9573990d"
          mkdir -p papers/A2-DYN-v93-referee-response/evidence
          git archive HEAD papers/A2-DYN-v88-referee-response papers/A2-DYN-v88-main-preserved papers/A2-DYN-v92-referee-response papers/A2-DYN-v93-referee-response reviews/a2-dyn-v92-external-top4-review-2026-10-12 .github/workflows/a2-dyn-v93-qualification.yml A2_DYN_V93_REVISION_INDEX.md > papers/A2-DYN-v93-referee-response/evidence/exact-source.tar
          printf '%s\n%s\n' "$GITHUB_SHA" "$GITHUB_REF" > papers/A2-DYN-v93-referee-response/evidence/exact-checkout.txt
          git rev-parse HEAD:papers/A2-DYN-v93-referee-response >> papers/A2-DYN-v93-referee-response/evidence/exact-checkout.txt
      - name: Install native mathematical build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern python3-numpy python3-mpmath python3-sympy python3-scipy poppler-utils
      - name: Preserve all sources and compile all 222 cores
        env:
          TZ: UTC
        run: bash papers/A2-DYN-v93-referee-response/build.sh
      - name: Upload exact-SHA article, archive and checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-dyn-v93-${{ github.sha }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          path: |
            papers/A2-DYN-v93-referee-response/build/*.pdf
            papers/A2-DYN-v93-referee-response/build/*.log
            papers/A2-DYN-v93-referee-response/build/*.fls
            papers/A2-DYN-v93-referee-response/build/*.aux
            papers/A2-DYN-v93-referee-response/build/*-pass*.txt
            papers/A2-DYN-v93-referee-response/build/*.tex
            papers/A2-DYN-v93-referee-response/evidence/*
