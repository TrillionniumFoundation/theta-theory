name: A2-DYN v102 positive paired transverse source qualification
on:
  push:
    branches:
      - revision/a2-dyn-v102-referee-response-2026-10-13
      - revision/a2-dyn-v102-referee-copy-2026-10-13
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a2-dyn-v102-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify-manuscript:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Pin actual author source and both controlling reports
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:papers/A2-DYN-v100-uniform-capacity-referee-response)" = "7b8524304ab2eebc935e4c25f74b30d39f80c995"
          test "$(git rev-parse HEAD:reviews/a2-dyn-v101-submission-state-external-top4-review-2026-10-13/REFEREE_REPORT.md)" = "d64268f21394e8edf9e5b9bd2408ed94360966b6"
          test "$(git rev-parse HEAD:reviews/a2-dyn-v100-uniform-capacity-external-top4-review-2026-10-13/REFEREE_REPORT.md)" = "b44278830cf52568a010a659dc8e38d348b5d1a4"
          mkdir -p papers/A2-DYN-v102-referee-response/evidence
          printf '%s\n%s\n' "$GITHUB_SHA" "$GITHUB_REF" > papers/A2-DYN-v102-referee-response/evidence/exact-checkout.txt
          git rev-parse HEAD:papers/A2-DYN-v102-referee-response >> papers/A2-DYN-v102-referee-response/evidence/exact-checkout.txt
          git archive HEAD papers/A2-DYN-v100-uniform-capacity-referee-response papers/A2-DYN-v102-referee-response reviews/a2-dyn-v101-submission-state-external-top4-review-2026-10-13 reviews/a2-dyn-v100-uniform-capacity-external-top4-review-2026-10-13 .github/workflows/a2-dyn-v102-qualification.yml A2_DYN_V102_REVISION_INDEX.md | gzip -1 > papers/A2-DYN-v102-referee-response/evidence/active-and-baseline-source.tar.gz
      - name: Install native TeX and finite-check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern python3-numpy python3-mpmath python3-sympy python3-scipy poppler-utils
      - name: Preserve sources and compile all 246 proof modules
        env:
          TZ: UTC
        run: bash papers/A2-DYN-v102-referee-response/build.sh
      - name: Upload exact-SHA article and complete-archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-dyn-v102-${{ github.sha }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
          path: |
            papers/A2-DYN-v102-referee-response/build/*.pdf
            papers/A2-DYN-v102-referee-response/build/*.log
            papers/A2-DYN-v102-referee-response/build/*.fls
            papers/A2-DYN-v102-referee-response/build/*.aux
            papers/A2-DYN-v102-referee-response/build/*-pass*.txt
            papers/A2-DYN-v102-referee-response/build/*.tex
            papers/A2-DYN-v102-referee-response/evidence/*
