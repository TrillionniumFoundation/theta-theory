name: A2-DYN v115 exact-source and native manuscript qualification
on:
  push:
    branches: [revision/a2-dyn-v115-double-clearance-transversality-2026-10-15]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a2-dyn-v115-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-math-and-native-article:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 5
          persist-credentials: false
          sparse-checkout: |
            papers/A2-DYN-v115-double-clearance-author-revision
      - name: Exact SHA, v114/v112 retention and Git isolation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p /tmp/a2-dyn-v115-evidence
          python3 papers/A2-DYN-v115-double-clearance-author-revision/tools/check_source.py --repository | tee /tmp/a2-dyn-v115-evidence/exact-source.json
          git rev-parse HEAD:papers/A2-DYN-v115-double-clearance-author-revision/provenance/v114-frozen > /tmp/a2-dyn-v115-evidence/v114-frozen-tree.txt
          printf '%s\n%s\n' "$GITHUB_SHA" "$GITHUB_REF" > /tmp/a2-dyn-v115-evidence/exact-checkout.txt
      - name: Install native math and manuscript dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-numpy python3-sympy texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - name: Execute all original and v115 checks, rebuild original v112 and v115
        run: |
          set -euo pipefail
          bash papers/A2-DYN-v115-double-clearance-author-revision/build.sh 2>&1 | tee /tmp/a2-dyn-v115-evidence/build.txt
          python3 papers/A2-DYN-v115-double-clearance-author-revision/tools/check_source.py --repository > /tmp/a2-dyn-v115-evidence/after-build-source.json
      - name: Preserve exact source, native PDF, mathematical diagnostics and build evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/a2-dyn-v115-evidence
          git ls-tree -r HEAD:papers/A2-DYN-v115-double-clearance-author-revision > /tmp/a2-dyn-v115-evidence/full-article-tree.txt
          tar --exclude='./provenance/v114-frozen' --exclude='./build/baseline-rebuild' --exclude='*/__pycache__' -czf /tmp/a2-dyn-v115-evidence/active-source-and-ledger.tar.gz -C papers/A2-DYN-v115-double-clearance-author-revision .
      - name: Upload actual exact-SHA qualification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-dyn-v115-${{ github.sha }}-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: |
            /tmp/a2-dyn-v115-evidence/*
            papers/A2-DYN-v115-double-clearance-author-revision/manuscript/*.pdf
            papers/A2-DYN-v115-double-clearance-author-revision/build/*.log
            papers/A2-DYN-v115-double-clearance-author-revision/build/*.json
            papers/A2-DYN-v115-double-clearance-author-revision/build/*pass*.txt
            papers/A2-DYN-v115-double-clearance-author-revision/evidence/current/*.json
