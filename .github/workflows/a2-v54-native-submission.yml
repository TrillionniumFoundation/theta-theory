name: A2 v54 finite-flight transfer and charged stopped experiments
on:
  push:
    branches:
      - revision/a2-v54-stopped-window-experiments-2026-09-15
    paths:
      - papers/A2-v17-boundary-information-coarsening/**/*.tex
      - papers/A2-v17-boundary-information-coarsening/tools/**
      - .github/workflows/a2-v54-native-submission.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions:
      contents: write
    outputs:
      source_commit: ${{ steps.source.outputs.source_commit }}
    steps:
      - name: Check out the exact preparation commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Materialize the complete manuscript and preserve the reviewed source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = revision/a2-v54-stopped-window-experiments-2026-09-15
          P=papers/A2-v17-boundary-information-coarsening
          python3 -B "$P/tools/materialize_revision_v54.py" > "$RUNNER_TEMP/materialization-v54.json"
          A="$P/history/v53-review-baseline"
          test -e "$A/REPOSITORY_README.md" || cp README.md "$A/REPOSITORY_README.md"
          test -e "$A/README.md" || cp "$P/README.md" "$A/README.md"
          cat > README.md <<'EOF'
          # Theta-Theory: A2 revision 54

          **Boundary laws and rigidity of periodic dispersing billiards** — Qian Qi, September 15, 2026.

          [Complete main source](papers/A2-v17-boundary-information-coarsening/main.tex) · [Complete companion](papers/A2-v17-boundary-information-coarsening/two_collision.tex) · [Response to the latest v53 report](papers/A2-v17-boundary-information-coarsening/RESPONSE_TO_REFEREE_V54.md) · [Historical derivation audit](papers/A2-v17-boundary-information-coarsening/HISTORICAL_DERIVATION_AUDIT_V54.md) · [Primary literature check](papers/A2-v17-boundary-information-coarsening/LITERATURE_CHECK_V54.md).

          Author branch: `revision/a2-v54-stopped-window-experiments-2026-09-15`. Latest report head: `000ce24f65f8381d2180cbd1f080d3d8470c8157`; actual reviewed mathematical source: `42cc62f230473c34d78af1d06b9ca5c2651ae86d`.

          Corollary 23.3 is strengthened in place by a quadratic Hellinger bound and square-root product comparison, with a separate direct finite-flight mean-test bound. In the same Section 23, Theorem 23.4 compares the first accepted mark and its waiting transcript on the actual two-table family, proves the reverse binary deficiency limit one half, and gives the exact limiting optimal risk and consistency criterion under a deterministic preparation cap. These are specified-pair experiments, not unrestricted nuisance estimators or universal preparation-complexity bounds.

          All 111 inherited active inputs remain active: 107 unchanged in place and four exact archived originals. Of 544 inherited statement/proof blocks, 542 remain verbatim; the only replaced pair is the strengthened corollary and proof, with all old conclusions retained as consequences. One theorem and proof are added. Theorems A/B, all other old proofs, the companion and the compiled catalogue remain unchanged in scope. A1 and unrelated workstreams are unchanged.

          The version-scoped workflow builds both complete entries and publishes products under `deliveries/a2-v54/<actual-source-commit>/` on a new `revision/a2-v54-native-products-<run>-<attempt>` branch. Consult the final review-ready entry for completed identities. This source entry does not claim an unfinished workflow succeeded.
          EOF
          cat > "$P/README.md" <<'EOF'
          # A2 revision 54 — complete manuscript

          [Main source](main.tex) · [Complete companion](two_collision.tex) · [Response to v53](RESPONSE_TO_REFEREE_V54.md) · [Historical audit](HISTORICAL_DERIVATION_AUDIT_V54.md) · [Literature check](LITERATURE_CHECK_V54.md).

          The historical directory name `A2-v17` is not the current revision number. The existing [Section 23](article/18g_realized_window_information_v53.tex) now contains the strengthened finite-flight comparison and the precise accepted-mark, waiting-count and capped-preparation experiments. The physical table/profile pair is unchanged. The original h^(-8) successful-record theorem and all structural geometry remain in their original scope.

          The baseline v53 report is pinned at `000ce24f65f8381d2180cbd1f080d3d8470c8157`, its compiled source at `42cc62f230473c34d78af1d06b9ca5c2651ae86d`. Exact amended-file originals and the native manifest are in [the v53 archive](history/v53-review-baseline/). The two replaced statement/proof blocks belong only to Corollary 23.3, which is strengthened; they are not incorrectly reported as verbatim. Every other old statement/proof and all 111 active inputs remain compiled.

          The native workflow builds the complete companion first and complete main second from the actual committed source, then retains and verifies both PDFs, source and evidence as Git objects. The final review-ready ledger gives completed product identities and actual visual coverage. Neither compilation nor finite diagnostics certifies a theorem or decides journal significance.
          EOF
          git switch -C "$GITHUB_REF_NAME"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md "$P"
          if ! git diff --cached --quiet; then
            git commit -m 'A2 v54: materialize complete strengthened finite-flight and charged-stop manuscript with exact v53 originals'
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
          SOURCE=$(git rev-parse HEAD)
          echo "source_commit=$SOURCE" >> "$GITHUB_OUTPUT"
          printf 'Preparation: `%s`\n\nActual mathematical source: `%s`\n' "$GITHUB_SHA" "$SOURCE" >> "$GITHUB_STEP_SUMMARY"
      - name: Install the native toolchain and diagnostic libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils python3-numpy python3-scipy python3-sympy
      - name: Verify preservation and finite controls in both Python modes
        shell: bash
        run: |
          set -euo pipefail
          P=papers/A2-v17-boundary-information-coarsening
          for script in check_revision_v54 check_quantized_v46 check_adaptive check_revision_v32 check_revision_v38; do
            /usr/bin/python3 -B "$P/tools/$script.py" > "$RUNNER_TEMP/$script-normal.json"
            /usr/bin/python3 -O -B "$P/tools/$script.py" > "$RUNNER_TEMP/$script-optimized.json"
            cmp "$RUNNER_TEMP/$script-normal.json" "$RUNNER_TEMP/$script-optimized.json"
          done
      - name: Compile both complete entries from actual source Git objects
        env:
          SOURCE: ${{ steps.source.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          /usr/bin/python3 -B papers/A2-v17-boundary-information-coarsening/tools/build_submission.py --output-dir "$RUNNER_TEMP/a2-v54-native-$SOURCE"
          cp "$RUNNER_TEMP"/check_*-normal.json "$RUNNER_TEMP"/check_*-optimized.json "$RUNNER_TEMP/a2-v54-native-$SOURCE/"
          cp "$RUNNER_TEMP/materialization-v54.json" "$RUNNER_TEMP/a2-v54-native-$SOURCE/"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/a2-v54-native-$SOURCE/workflow-preparation-commit.txt"
      - name: Retain products and raw evidence
        if: always() && steps.source.outputs.source_commit != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a2-v54-native-${{ steps.source.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a2-v54-native-${{ steps.source.outputs.source_commit }}/
          if-no-files-found: error
          retention-days: 90
  publish-verified-products:
    needs: native
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.native.outputs.source_commit }}
          fetch-depth: 1
          persist-credentials: true
      - name: Retrieve and validate source-matched native products
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ needs.native.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          P=papers/A2-v17-boundary-information-coarsening
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "a2-v54-native-$SOURCE-$GITHUB_RUN_ATTEMPT" --dir "$RUNNER_TEMP/v54"
          python3 -B "$P/tools/retain_native_v54.py" prepare --evidence "$RUNNER_TEMP/v54" --destination "deliveries/a2-v54/$SOURCE" --source-commit "$SOURCE" --run-id "$GITHUB_RUN_ID"
      - name: Publish on a new products branch and verify fetched Git objects
        env:
          SOURCE: ${{ needs.native.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          P=papers/A2-v17-boundary-information-coarsening
          D="deliveries/a2-v54/$SOURCE"
          branch="revision/a2-v54-native-products-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$D"
          python3 -B "$P/tools/retain_native_v54.py" verify --destination "$D" --ref INDEX
          git commit -m 'A2 v54: retain both complete native manuscripts and source-matched evidence'
          git push origin "HEAD:refs/heads/$branch"
          git fetch origin "refs/heads/$branch"
          python3 -B "$P/tools/retain_native_v54.py" verify --destination "$D" --ref FETCH_HEAD --attestation
          git add -- "$D/COMMITTED_OBJECTS_VERIFIED.json"
          git commit -m 'A2 v54: attest the fetched published native Git objects'
          git push origin "HEAD:refs/heads/$branch"
          git fetch origin "refs/heads/$branch"
          python3 -B "$P/tools/retain_native_v54.py" verify --destination "$D" --ref FETCH_HEAD
          printf 'Source: `%s`\n\nProducts branch: `%s`\n\nVerified final head: `%s`\n' "$SOURCE" "$branch" "$(git rev-parse FETCH_HEAD)" >> "$GITHUB_STEP_SUMMARY"
