name: Verify Round 35 immutable sources
on:
  push:
    branches: ['revision/round35-*']
  pull_request:
    paths: ['round35/**', 'ROUND35*', 'tools/*round35*', 'tools/mechanical_benchmark.py', 'tests/test_round35.py', '.github/workflows/verify-round35.yml', 'papers/**/ROUND35_REVISION.tex', 'papers/**/main.tex']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the declared local verification dependencies
        run: |
          python -m pip install -r round35/requirements.txt
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - name: Verify without modifying submitted source
        env:
          OPENBLAS_NUM_THREADS: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python tools/verify_round35.py
      - uses: actions/upload-artifact@v4
        with:
          name: round35-build-and-verification
          path: build/round35/
          if-no-files-found: error
