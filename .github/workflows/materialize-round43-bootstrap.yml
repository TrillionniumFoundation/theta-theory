name: Materialize immutable Round 43 revision

on:
  push:
    branches:
      - 'revision/round43-referee-positive-closure-gpt56pro-2026-09-04'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: round43-materialization-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          clean: true

      - name: Freeze the stored Round 41 construction inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          generator = Path('tools/materialize_round41.py')
          text = generator.read_text(encoding='utf-8')
          old = 'r"""The true transient cross term is at most\n'
          new = 'r"""The\ntrue transient cross term is at most\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Round 41 frozen-source anchor not found')
          generator.write_text(text, encoding='utf-8')

          hardener = Path('tools/harden_round41_ldp.py')
          text = hardener.read_text(encoding='utf-8')
          old = '\nrac1n\\log'
          new = '\n \\frac1n\\log'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Round 41 denominator typo anchor not found')
          hardener.write_text(text, encoding='utf-8')
          PY

      - name: Restore and validate the deterministic Round 43 materializer
        shell: bash
        run: |
          set -euo pipefail
          cat .round43_payload/part*.b64 > /tmp/materialize_round43.py.gz.b64
          test "$(sha256sum /tmp/materialize_round43.py.gz.b64 | cut -d' ' -f1)" = "e5a60fc31aea1f860bc1c0b2b604ed7e8f6173bf848899935b3b4d115a55bb6d"
          base64 --decode /tmp/materialize_round43.py.gz.b64 | gzip -dc > tools/materialize_round43.py
          chmod +x tools/materialize_round43.py
          test "$(sha256sum tools/materialize_round43.py | cut -d' ' -f1)" = "af440e952aa27937786a01bc8cf39b66430165d4312779550dafe9f2501a207c"
          python3 -m py_compile tools/materialize_round41.py tools/harden_round41_ldp.py tools/materialize_round43.py

      - name: Materialize ordinary manuscript sources
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/materialize_round41.py
          python3 tools/harden_round41_ldp.py
          python3 tools/materialize_round43.py

      - name: Remove staging payload and every write-enabled legacy workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .round43_payload
          python3 - <<'PY'
          from pathlib import Path
          keep = {'materialize-round43-bootstrap.yml', 'verify-round43.yml'}
          for path in Path('.github/workflows').glob('*'):
              if path.name in keep or not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              if 'contents: write' in text or 'git push' in text:
                  path.unlink()
                  print(f'removed write-enabled workflow: {path}')
          PY

      - name: Install TeX dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern

      - name: Run exact source and algebra tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests/test_round41.py
          python3 -m unittest -v tests/test_round43.py

      - name: Build the exact materialized manuscript twice
        shell: bash
        run: |
          set -euo pipefail
          pdflatex -interaction=nonstopmode -halt-on-error ROUND43_REVISION.tex
          pdflatex -interaction=nonstopmode -halt-on-error ROUND43_REVISION.tex

      - name: Refresh manifest and write verification record
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_round43.py --refresh-manifest --check-manifest --check-build --json ROUND43_LOCAL_VERIFICATION.json
          python3 tools/verify_round43.py --check-manifest --check-build

      - name: Freeze source and reviewer packet in one commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/materialize-round43-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'revision(round43): materialize effective Jacobi closure for re-review'
          git push origin HEAD:${{ github.ref_name }}
