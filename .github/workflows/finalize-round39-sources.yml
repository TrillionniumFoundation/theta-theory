name: Finalize Round 39 source invariants

on:
  push:
    branches:
      - 'revision/round39-adaptive-jacobi-identification-gpt56pro-2026-09-04'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Wait for any earlier manifest-only run and refresh the branch
        run: |
          sleep 75
          git fetch origin "${{ github.ref_name }}"
          git reset --hard "origin/${{ github.ref_name }}"

      - name: Apply final source-level clarifications
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              source = Path(path)
              text = source.read_text(encoding='utf-8')
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement target, found {count}')
              source.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'round39/infinite_jacobi.tex',
              r'''Fix constants \(0<a_-<a_+<\infty\), \(c_->0\), and
\(b_->2a_+\).  Let''',
              r'''Fix constants \(0<a_-<a_+<\infty\), \(0<c_-<c_+<\infty\), and
\(2a_+<b_-<b_+<\infty\).  Let''',
          )

          replace_once(
              'round39/triangular.tex',
              r'''The true transient cross term is at most
\(B\sum_i d_i\abs{\theta-\theta_0}\), and''',
              r'''Because \(\abs{d_i(\theta)}\le B\abs{\theta-\theta_0}\), the true
transient cross term is at most
\(B(\sum_{i\ge1}d_i)\abs{\theta-\theta_0}\), where the \(d_i\)'s inside
the summation are the deterministic transient envelope from
Assumption~\ref{ass:triangular}, not the mean increment \(d_i(\theta)\).  Also,''',
          )

          replace_once(
              'round39/lattice.tex',
              r'''Fix a bounded force amplitude \(a>0\) and a calibration density
\(\rho\in(0,1]\).  A policy may use arbitrary bounded force-duration actions
on exploitation blocks.  It must also specify a predictable sequence of
calibration slots with lower density \(\rho\), partitioned into consecutive
windows of six slots.  Conditional on the observed past, the six durations in
a window are a possibly data-dependent permutation of
\(\{\tau,2\tau,\ldots,6\tau\}\).  At each calibration slot, after the
duration is chosen, an independent Rademacher sign \(S_i\) is drawn and force
\(aS_i\) is held for that duration.  The observation noise is drawn only after
the sign and action have been fixed.''',
              r'''Fix a bounded force amplitude \(a>0\), an exploitation-force bound
\(U<\infty\), exploitation-duration bounds
\(0<\tau_{\min}\le\tau_{\max}<\infty\), and a calibration density
\(\rho\in(0,1]\).  Exploitation blocks may use arbitrary feedback actions
whose force is bounded by \(U\) and whose duration lies in
\([\tau_{\min},\tau_{\max}]\).  The policy must also specify calibration
slots whose counting function satisfies
\(N_{\rm cal}(n)\ge\rho n-C_{\rm cal}\) for every \(n\), with one fixed
\(C_{\rm cal}<\infty\), and partition them into consecutive windows of six
slots.  At a calibration slot the duration \(s_i\) is
\(\cF_{i-1}\)-measurable; adaptively choosing it from the durations not yet
used in the current window makes the six realized durations a permutation of
\(\{\tau,2\tau,\ldots,6\tau\}\).  After \(s_i\) is fixed, an independent
Rademacher sign \(S_i\) is drawn and force \(aS_i\) is held for that duration.
The observation noise is drawn only after the sign and action have been
fixed.''',
          )

          replace_once(
              'round39/lattice.tex',
              r'''Every duration is bounded below by \(\tau\), so
Lemma~\ref{lem:five-energy} gives
\[
 \sup_{\vartheta,\norm z\le R}
 \abs{\partial_\vartheta^\alpha b_i^\vartheta(z)}
 \le C_re^{-\lambda_ri\tau}.
\]''',
              r'''Every block duration is bounded below by
\(\underline\tau=\min(\tau,\tau_{\min})>0\), so
Lemma~\ref{lem:five-energy} gives
\[
 \sup_{\vartheta,\norm z\le R}
 \abs{\partial_\vartheta^\alpha b_i^\vartheta(z)}
 \le C_re^{-\lambda_ri\underline\tau}.
\]''',
          )

          response = Path('AUTHOR_RESPONSE_ROUND38.md')
          text = response.read_text(encoding='utf-8')
          substitutions = {
              'Definition 2.1 introduces': 'Definition `def:triangular` introduces',
              'Proposition 4.7 uses': 'Proposition `prop:balanced-contrast` uses',
              'Definition 2.2 defines': 'Definition `def:uniform-orders` defines',
              'Lemma 2.4 supplies': 'Lemma `lem:nuisance-budget` supplies',
              'Lemma 2.8 is': 'Lemma `lem:random-laplace` is',
              'Theorem 2.9 then proves': 'Theorem `thm:abstract-bvm` then proves',
              'Proposition 2.5 proves': 'Proposition `prop:pseudotrue` proves',
              'Section 5 defines': '`round39/filter_memory.tex` defines',
              'Corollary 5.3 calls': 'Corollary `cor:state-image` calls',
              'Section 8 declares': 'Section `sec:preparations` declares',
              'Section 9 states': 'Section `sec:verification` states',
          }
          for old, new in substitutions.items():
              text = text.replace(old, new)
          response.write_text(text, encoding='utf-8')
          PY

      - name: Regenerate exact manifest after the clarifications
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          paths = [
              'ROUND39_REVISION.tex',
              'round39/preamble.tex',
              'round39/introduction.tex',
              'round39/triangular.tex',
              'round39/lattice.tex',
              'round39/filter_memory.tex',
              'round39/infinite_jacobi.tex',
              'round39/preparations_verification.tex',
              'round39/appendix_uniformity.tex',
              'round39/references.tex',
              'AUTHOR_RESPONSE_ROUND38.md',
              'ROUND39_REVIEW_INDEX.md',
              'ROUND39_READY_FOR_REVIEW.md',
              'round39/HISTORICAL_REUSE.md',
              'round39/PROOF_LEDGER.json',
              'ROUND39_LOCAL_VERIFICATION.json',
              'tools/verify_round39.py',
              'tests/test_round39.py',
              '.github/workflows/verify-round39.yml',
              '.github/workflows/sync-round39-manifest.yml',
              '.github/workflows/finalize-round39-sources.yml',
          ]
          entries = []
          for relative in paths:
              data = Path(relative).read_bytes()
              entries.append({
                  'path': relative,
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })
          manifest = {
              'source_set': 'round39-positive-revision',
              'base_revision': 'revision/round35-mechanical-identification-2026-09-03',
              'controlling_report': 'REFEREE_REPORT_ROUND38_GPT56_PRO_ADVERSARIAL.md',
              'reviewed_head': 'bca291f85e47916cc5f089c0c01350f0c0c6f3b0',
              'review_commit': '39d9622406d4a50680992836ee1f70e970d6d627',
              'hash': 'sha256',
              'generated_by': '.github/workflows/finalize-round39-sources.yml',
              'files': entries,
          }
          Path('round39/SOURCE_MANIFEST.json').write_text(
              json.dumps(manifest, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Run exact algebra and source-integrity tests
        run: python3 -m unittest -v tests/test_round39.py

      - name: Commit finalized sources and exact manifest
        run: |
          if git diff --quiet; then
            echo 'Sources already finalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add round39/infinite_jacobi.tex round39/triangular.tex round39/lattice.tex AUTHOR_RESPONSE_ROUND38.md round39/SOURCE_MANIFEST.json
          git commit -m 'revision(round39): finalize assumptions and proof notation'
          git push origin HEAD:${{ github.ref_name }}
