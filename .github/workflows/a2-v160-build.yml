name: A2 v160 complete revision publication
on:
  push:
    branches: [revision/a2-v160-intrinsic-blowup-boundary-2026-09-25]
    paths:
      - .github/workflows/a2-v160-build.yml
      - papers/A2-v17-boundary-information-coarsening/article/v160/incidence-blowup-v160.tex
      - papers/A2-v17-boundary-information-coarsening/article/v160/frontmatter_v160.py
      - papers/A2-v17-boundary-information-coarsening/article/v160/assemble_v160.py
      - papers/A2-v17-boundary-information-coarsening/article/v160/check_v160.py
      - papers/A2-v17-boundary-information-coarsening/article/v160/publish_v160.py
permissions:
  contents: write
concurrency:
  group: a2-v160-complete-publication
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify inspected mathematical inputs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('papers/A2-v17-boundary-information-coarsening/article/v160')
          expected={
            'incidence-blowup-v160.tex':'0c52a6a640caaf1a25511729eee65947e8474f6358f401310f2de3acf4c1305e',
            'frontmatter_v160.py':'72a0a7a3b9b048297d1d5780b308ae7abb3b3c5da5089308a87b7dd420a1274e',
            'assemble_v160.py':'ce86fc4ca9dd033be2f659a2cf1bcc42788a75e2faf9ff49633af2a692f1a599',
            'check_v160.py':'9c5318470a090b882c82bfce475a9199624c2fd37c6fc40e7a61cdac244f1fae',
          }
          for name,h in expected.items():
              actual=hashlib.sha256((p/name).read_bytes()).hexdigest()
              assert actual==h,(name,actual,h)
          print('All four inspected mathematical input hashes agree.')
          PY
      - name: Install compilation and exact algebra tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils python3-venv
          python3 -m venv /tmp/a2-v160-env
          /tmp/a2-v160-env/bin/pip install 'sympy==1.14.0'
      - name: Run exact v160 checks and the complete inherited chain
        run: |
          /tmp/a2-v160-env/bin/python papers/A2-v17-boundary-information-coarsening/article/v160/check_v160.py
      - name: Compile all complete manuscripts and check preservation
        run: |
          /tmp/a2-v160-env/bin/python papers/A2-v17-boundary-information-coarsening/article/v160/assemble_v160.py --build
      - name: Prepare source-bound review entry and render the new results
        run: |
          /tmp/a2-v160-env/bin/python papers/A2-v17-boundary-information-coarsening/article/v160/publish_v160.py
          p=papers/A2-v17-boundary-information-coarsening/article/v160
          { python3 --version; /tmp/a2-v160-env/bin/python -c 'import sympy; print("SymPy",sympy.__version__)'; pdflatex --version | head -2; echo "Source $GITHUB_SHA"; echo "Run $GITHUB_RUN_ID"; } > "$p/BUILD_ENVIRONMENT.txt"
      - name: Preserve complete build outputs even if publication fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a2-v160-complete-review-build
          path: papers/A2-v17-boundary-information-coarsening/article/v160
          retention-days: 30
          if-no-files-found: error
      - name: Publish only the complete v160 objects and root entry
        env:
          GH_PUBLICATION_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = revision/a2-v160-intrinsic-blowup-boundary-2026-09-25
          p=papers/A2-v17-boundary-information-coarsening/article/v160
          auth=$(printf 'x-access-token:%s' "$GH_PUBLICATION_TOKEN" | base64 -w0)
          head=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          test "$head" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$p"/*.tex "$p"/*.pdf "$p"/*.json "$p"/*.md "$p"/BUILD_ENVIRONMENT.txt "$p"/render-audit/*.png CURRENT_REVIEW_ENTRY.md
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess
          p=Path('papers/A2-v17-boundary-information-coarsening/article/v160')
          r=json.loads((p/'BUILD_RECEIPT_V160.json').read_text())
          c=json.loads((p/'EXACT_CHECKS_V160.json').read_text())
          assert r['compiled'] and r['all_predecessor_math_blocks_retained_byte_for_byte']
          assert r['current_labels']==421 and r['current_math_blocks']==277
          assert c['all_checks_pass'] and c['inherited_v159_suite_rerun']
          assert all(v['clean_references_and_no_overfull_hboxes'] for v in r['outputs'].values())
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert paths,'Expected materialized outputs'
          assert all(x.startswith(str(p)+'/') or x=='CURRENT_REVIEW_ENTRY.md' for x in paths),paths
          for name in ('reconstruction','divisor-geometry','geometry'):
              assert str(p/(name+'.pdf')) in paths
          print('Complete manuscripts, full inherited checks and isolated publication paths verified.')
          PY
          git commit -m 'A2 v160: materialize complete paired manuscripts and verified PDFs [skip ci]'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
