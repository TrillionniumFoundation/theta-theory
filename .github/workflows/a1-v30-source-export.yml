name: A1 v30 source export
on:
  push:
    branches:
      - revision/a1-english-v30-causal-compatibility-2026-09-08
    paths:
      - .github/workflows/a1-v30-source-export.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            papers/A1-english-v29
            reviews/a1-english-v29-harsh-independent-2026-09-08
      - uses: actions/upload-artifact@v4
        with:
          name: a1-v30-pinned-inputs
          path: |
            papers/A1-english-v29
            reviews/a1-english-v29-harsh-independent-2026-09-08
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
