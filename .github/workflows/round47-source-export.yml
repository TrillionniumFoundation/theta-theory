name: Round 47 frozen text source export
on:
  push:
    branches: ['revision/round47-sharp-boundary-depth-2026-09-05']
    paths: ['.github/workflows/round47-source-export.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source text without executing repository code
        run: |
          set -eu
          git ls-files -z '*.tex' '*.md' '*.py' '*.json' '*.yml' '*.yaml' '*.bib' 'Makefile' > "$RUNNER_TEMP/round47-paths"
          tar --null -T "$RUNNER_TEMP/round47-paths" -czf ROUND47_SOURCE_SNAPSHOT.tar.gz
          git rev-parse HEAD > ROUND47_SNAPSHOT_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: round47-frozen-text-snapshot
          path: |
            ROUND47_SOURCE_SNAPSHOT.tar.gz
            ROUND47_SNAPSHOT_COMMIT.txt
          if-no-files-found: error
