name: A2-DYN grazing-resolvent source and qualification
on:
  push:
    branches: ['revision/a2-dyn-grazing-resolvent-2026-10-16']
    paths:
      - '.github/workflows/a2-dyn-grazing-resolvent-20261016.yml'
      - 'papers/A2-DYN-grazing-resolvent-author-revision/**'
permissions:
  contents: read
jobs:
  source-and-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Freeze exact source and all A2-DYN branch heads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/a2-dyn-resolvent-evidence
          git rev-parse HEAD > /tmp/a2-dyn-resolvent-evidence/exact-checkout.txt
          git ls-remote --heads origin > /tmp/a2-dyn-resolvent-evidence/all-remote-heads.tsv
          python3 - <<'PY'
          import pathlib,subprocess,json,hashlib,datetime,tarfile
          out=pathlib.Path('/tmp/a2-dyn-resolvent-evidence')
          selected=[]
          for line in (out/'all-remote-heads.tsv').read_text().splitlines():
              sha,ref=line.split()
              if 'a2-dyn' in ref.lower() or 'a2_dyn' in ref.lower(): selected.append((sha,ref))
          # Fetch precisely the frozen SHA, not a branch name which can move.
          with (out/'fetch.log').open('w') as log:
              for start in range(0,len(selected),40):
                  batch=selected[start:start+40]
                  subprocess.run(['git','fetch','--no-tags','--depth=1','origin']+[sha+':refs/census/'+str(start+i) for i,(sha,ref) in enumerate(batch)],stdout=log,stderr=subprocess.STDOUT,check=True)
          objects=out/'history'/'blobs';objects.mkdir(parents=True)
          commits=out/'history'/'commits';commits.mkdir()
          records=[];seen=set()
          for sha,ref in selected:
              raw=subprocess.check_output(['git','cat-file','commit',sha]);(commits/sha).write_bytes(raw)
              entries=subprocess.check_output(['git','ls-tree','-r','-z',sha]).split(b'\0')
              kept=[]
              for entry in entries:
                  if not entry:continue
                  meta,path=entry.split(b'\t',1);mode,kind,blob=meta.decode().split();path=path.decode()
                  key=path.lower()
                  if kind!='blob' or not ('a2-dyn' in key or 'a2_dyn' in key):continue
                  if blob not in seen:
                      data=subprocess.check_output(['git','cat-file','blob',blob])
                      expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
                      if expected!=blob:raise RuntimeError('Git blob identity mismatch')
                      (objects/blob).write_bytes(data);seen.add(blob)
                  kept.append({'path':path,'mode':mode,'blob':blob})
              tree=raw.splitlines()[0].decode().split()[1]
              records.append({'ref':ref,'commit':sha,'tree':tree,'entries':kept})
          index={'captured_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'scope':'all frozen A2-DYN-named branch heads; all A2-DYN-named paths at those heads; not every intermediate commit','branches':records,'unique_blobs':len(seen),'mathematical_proof_certificate':False}
          (out/'history'/'INDEX.json').write_text(json.dumps(index,indent=2)+'\n')
          with tarfile.open(out/'a2-dyn-historical-source.tar.xz','w:xz') as archive:archive.add(out/'history',arcname='history')
          (out/'historical-summary.json').write_text(json.dumps({'branch_count':len(selected),'unique_blobs':len(seen),'archive_sha256':hashlib.sha256((out/'a2-dyn-historical-source.tar.xz').read_bytes()).hexdigest()},indent=2)+'\n')
          PY
      - name: Install native mathematical build dependencies
        if: ${{ hashFiles('papers/A2-DYN-grazing-resolvent-author-revision/tools/qualify_revision.py') != '' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended texlive-science lmodern
          python3 -m pip install numpy==2.3.5 sympy==1.14.0
      - name: Qualify actual native source when present
        if: ${{ hashFiles('papers/A2-DYN-grazing-resolvent-author-revision/tools/qualify_revision.py') != '' }}
        working-directory: papers/A2-DYN-grazing-resolvent-author-revision
        run: python3 tools/qualify_revision.py all
      - name: Preserve actual source and execution state
        if: always()
        run: |
          if test -d papers/A2-DYN-grazing-resolvent-author-revision; then
            tar -czf /tmp/a2-dyn-resolvent-evidence/active-source.tar.gz -C papers/A2-DYN-grazing-resolvent-author-revision .
          fi
          git status --porcelain=v1 > /tmp/a2-dyn-resolvent-evidence/post-run-status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a2-dyn-grazing-resolvent-${{ github.sha }}-${{ github.run_id }}
          path: |
            /tmp/a2-dyn-resolvent-evidence/*.txt
            /tmp/a2-dyn-resolvent-evidence/*.tsv
            /tmp/a2-dyn-resolvent-evidence/*.json
            /tmp/a2-dyn-resolvent-evidence/*.log
            /tmp/a2-dyn-resolvent-evidence/*.tar.*
          if-no-files-found: error
