name: A2-DYN grazing-resolvent source and qualification
on:
  push:
    branches: ['revision/a2-dyn-grazing-resolvent-2026-10-16']
    paths:
      - '.github/workflows/a2-dyn-grazing-resolvent-20261016.yml'
      - 'papers/A2-DYN-grazing-resolvent-author-revision/**'
permissions:
  contents: read
jobs:
  source-and-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          sparse-checkout: |
            papers/A2-DYN-grazing-resolvent-author-revision
          sparse-checkout-cone-mode: true
      - name: Freeze A2-DYN source DAG without expanding historical copies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/a2-dyn-resolvent-evidence
          git rev-parse HEAD > /tmp/a2-dyn-resolvent-evidence/exact-checkout.txt
          git ls-remote --heads origin > /tmp/a2-dyn-resolvent-evidence/all-remote-heads.tsv
          python3 -u - <<'PY'
          import pathlib,subprocess,json,hashlib,datetime,tarfile
          out=pathlib.Path('/tmp/a2-dyn-resolvent-evidence'); history=out/'history'; history.mkdir()
          def relevant(s): return 'a2-dyn' in s.lower() or 'a2_dyn' in s.lower()
          selected=[line.split() for line in (out/'all-remote-heads.tsv').read_text().splitlines() if relevant(line)]
          unique=list(dict.fromkeys(x[0] for x in selected))
          with (out/'fetch.log').open('w') as log:
              for start in range(0,len(unique),32):
                  batch=unique[start:start+32]
                  print('Fetching frozen commits',start,len(unique),flush=True)
                  subprocess.run(['git','fetch','--no-tags','--depth=1','origin']+[s+':refs/census/'+s for s in batch],stdout=log,stderr=subprocess.STDOUT,check=True)
          trees={}; marked=set(); scans={}; blobset=set(); commits={}; roots=[]
          def tree(sha):
              if sha in trees:return trees[sha]
              entries=[]
              for item in subprocess.check_output(['git','ls-tree','-z',sha]).split(b'\0'):
                  if not item:continue
                  meta,name=item.split(b'\t',1);mode,kind,obj=meta.decode().split()
                  entries.append({'name':name.decode(),'mode':mode,'type':kind,'sha':obj})
              trees[sha]=entries
              return entries
          def keep(sha):
              if sha in marked:return
              marked.add(sha)
              for entry in tree(sha):
                  if entry['type']=='tree':keep(entry['sha'])
                  elif entry['type']=='blob':blobset.add(entry['sha'])
          def scan(sha):
              if sha in scans:return scans[sha]
              hits=[]
              for entry in tree(sha):
                  name=entry['name'];obj=entry['sha']
                  if relevant(name):
                      hits.append({'path':name,**entry})
                      if entry['type']=='tree':keep(obj)
                      elif entry['type']=='blob':blobset.add(obj)
                  elif entry['type']=='tree':
                      for hit in scan(obj):hits.append({**hit,'path':name+'/'+hit['path']})
              scans[sha]=hits
              return hits
          for number,(sha,ref) in enumerate(selected):
              if sha not in commits:
                  raw=subprocess.check_output(['git','cat-file','commit',sha]);commits[sha]=raw.decode()
              root=commits[sha].splitlines()[0].split()[1]
              hits=scan(root)
              roots.append({'ref':ref,'commit':sha,'tree':root,'a2_dyn_roots':hits})
              if number%20==0:print('Indexed',number,'refs;',len(trees),'unique trees;',len(blobset),'unique scoped blobs',flush=True)
          (history/'INDEX.json').write_text(json.dumps({'captured_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'scope':'all named A2-DYN branch HEADs and all A2-DYN-named paths reachable from those trees, retained as a DAG; not every intermediate commit; no independent mathematical certification','refs':roots,'commits':commits,'trees':{sha:trees[sha] for sha in marked}},separators=(',',':'))+'\n')
          blobs=history/'blobs';blobs.mkdir()
          proc=subprocess.Popen(['git','cat-file','--batch'],stdin=subprocess.PIPE,stdout=subprocess.PIPE)
          for i,sha in enumerate(sorted(blobset)):
              proc.stdin.write((sha+'\n').encode());proc.stdin.flush()
              header=proc.stdout.readline().split()
              if len(header)!=3 or header[1]!=b'blob':raise RuntimeError('missing blob '+sha)
              size=int(header[2]);data=proc.stdout.read(size)
              if proc.stdout.read(1)!=b'\n':raise RuntimeError('batch delimiter')
              if len(data)!=size or hashlib.sha1(b'blob '+str(size).encode()+b'\0'+data).hexdigest()!=sha:raise RuntimeError('blob mismatch '+sha)
              (blobs/sha).write_bytes(data)
              if i%1000==0:print('Saved scoped blobs',i,len(blobset),flush=True)
          proc.stdin.close();proc.wait()
          with tarfile.open(out/'a2-dyn-historical-source.tar.gz','w:gz',compresslevel=4) as archive:archive.add(history,arcname='history')
          summary={'branch_count':len(selected),'unique_commits':len(commits),'unique_scoped_trees':len(marked),'unique_scoped_blobs':len(blobset),'archive_sha256':hashlib.sha256((out/'a2-dyn-historical-source.tar.gz').read_bytes()).hexdigest(),'full_intermediate_history_read':False,'mathematical_validation':False}
          (out/'historical-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary),flush=True)
          PY
      - name: Install native mathematical build dependencies
        if: ${{ hashFiles('papers/A2-DYN-grazing-resolvent-author-revision/tools/qualify_revision.py') != '' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended texlive-science lmodern
          python3 -m pip install numpy==2.3.5 sympy==1.14.0
      - name: Qualify actual native source when present
        if: ${{ hashFiles('papers/A2-DYN-grazing-resolvent-author-revision/tools/qualify_revision.py') != '' }}
        working-directory: papers/A2-DYN-grazing-resolvent-author-revision
        run: python3 tools/qualify_revision.py all
      - name: Preserve actual source and execution state
        if: always()
        run: |
          if test -d papers/A2-DYN-grazing-resolvent-author-revision; then
            tar -czf /tmp/a2-dyn-resolvent-evidence/active-source.tar.gz -C papers/A2-DYN-grazing-resolvent-author-revision .
          fi
          git status --porcelain=v1 > /tmp/a2-dyn-resolvent-evidence/post-run-status.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: a2-dyn-grazing-resolvent-${{ github.sha }}-${{ github.run_id }}
          path: |
            /tmp/a2-dyn-resolvent-evidence/*.txt
            /tmp/a2-dyn-resolvent-evidence/*.tsv
            /tmp/a2-dyn-resolvent-evidence/*.json
            /tmp/a2-dyn-resolvent-evidence/*.log
            /tmp/a2-dyn-resolvent-evidence/*.tar.*
          if-no-files-found: error
