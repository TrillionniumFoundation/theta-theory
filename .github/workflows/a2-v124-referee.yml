name: A2 v124 intrinsic nilpotent referee build

on:
  push:
    branches:
      - revision/a2-v124-intrinsic-nilpotent-reye-boundary-2026-09-23
    paths:
      - 'A2_REVISION_V124_INDEX.md'
      - 'papers/A2-v17-boundary-information-coarsening/article/v124/**'
      - '.github/workflows/a2-v124-referee.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: a2-v124-referee-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      REVISION: papers/A2-v17-boundary-information-coarsening/article/v124
      V123: papers/A2-v17-boundary-information-coarsening/article/v123
      REVIEW_BASE: origin/review/a2-v123-independent-harsh-top4-2026-09-23
      TARGET_BRANCH: revision/a2-v124-intrinsic-nilpotent-reye-boundary-2026-09-23
      SOURCE_COMMIT_SHA: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch controlling review ref
        run: git fetch origin review/a2-v123-independent-harsh-top4-2026-09-23

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mathematical build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern
          python -m pip install 'sympy==1.14.0' 'numpy==2.3.5' 'PyMuPDF==1.26.7'

      - name: Confirm reviewed v123 sources remain byte-identical
        run: |
          git diff --exit-code "$REVIEW_BASE" -- "$V123"
          git diff --exit-code "$REVIEW_BASE" -- reviews/a2-v123-independent-harsh-top4-2026-09-23/REFEREE_REPORT.md

      - name: Run exact witnesses and compile the single principal article
        run: bash "$REVISION/build.sh"

      - name: Publish source-bound PDF and evidence on v124 only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$REVISION/geometry.pdf" "$REVISION/evidence"
          if git diff --cached --quiet; then
            echo 'No generated publication changes to commit.'
          else
            git commit -m "A2 v124: source-bound referee PDF and evidence from $SOURCE_COMMIT_SHA [skip ci]"
            git push origin "HEAD:$TARGET_BRANCH"
          fi

      - name: Package referee bundle
        run: |
          tar -czf a2-v124-referee-bundle.tar.gz             A2_REVISION_V124_INDEX.md             reviews/a2-v123-independent-harsh-top4-2026-09-23/REFEREE_REPORT.md             "$REVISION"

      - uses: actions/upload-artifact@v4
        with:
          name: a2-v124-referee-bundle
          path: a2-v124-referee-bundle.tar.gz
          retention-days: 30
