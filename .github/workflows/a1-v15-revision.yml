name: A1 v15 positive-history referee response
on:
  push:
    branches:
      - revision/a1-english-v15-positive-history-2026-09-06
    paths:
      - .github/workflows/a1-v15-revision.yml
      - .github/scripts/prepare-a1-v15.py
      - .github/scripts/a1-v15-inputs/**
permissions:
  contents: write
concurrency:
  group: a1-v15-positive-history-response
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install mathematical typesetting tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra lmodern poppler-utils
      - name: Materialize and anchor the complete revised source
        run: python .github/scripts/prepare-a1-v15.py
      - name: Execute six author suites, the pinned v14 referee probe, and the full build
        working-directory: papers/A1-english-v15
        run: python validate.py --prior-review
      - name: Publish the complete manuscript and actual execution receipts
        run: |
          git diff --exit-code -- papers/A1-english-v14 reviews
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- papers/A1-english-v15
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m 'Publish A1 v15: positive-history theorem, circular classification, complete retained proofs and verified PDF'
            git push origin HEAD:revision/a1-english-v15-positive-history-2026-09-06
          fi
          git rev-parse HEAD
      - name: Deposit reproducible referee package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A1-v15-positive-history-referee-ready
          include-hidden-files: true
          path: |
            papers/A1-english-v15/
            !papers/A1-english-v15/build/
            !papers/A1-english-v15/**/__pycache__/
            !papers/A1-english-v15/*.aux
            !papers/A1-english-v15/*.log
            !papers/A1-english-v15/*.out
          if-no-files-found: error
