name: A2-DYN v89 critical distribution and two-variant source qualification
on:
  push:
    branches:
      - revision/a2-dyn-v89-referee-response-2026-10-12
      - revision/a2-dyn-v89-referee-copy-2026-10-12
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a2-dyn-v89-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify-manuscript:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Pin both source variants, both reports and exact checkout
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:papers/A2-DYN-v88-referee-response)" = "af3d5707cc0ccad7fc20a6a67887cc0dc0e58ef6"
          test "$(git rev-parse HEAD:papers/A2-DYN-v88-main-preserved)" = "1c3e7c85c15f7265f66f8ee96ce6617d2f65488d"
          test "$(git rev-parse HEAD:reviews/a2-dyn-v88-weaklp-external-top4-review-2026-10-12/REFEREE_REPORT.md)" = "90affffc4882c6312707aea59b0d2c51d6f4be28"
          test "$(git rev-parse HEAD:reviews/a2-dyn-v88-external-top4-review-2026-10-12/REFEREE_REPORT.md)" = "874290c1568d86c93d7e93606b05fc8439d6662f"
          p=papers/A2-DYN-v89-referee-response
          mkdir -p "$p/evidence"
          git archive HEAD papers/A2-DYN-v88-referee-response papers/A2-DYN-v88-main-preserved "$p" reviews/a2-dyn-v88-weaklp-external-top4-review-2026-10-12 reviews/a2-dyn-v88-external-top4-review-2026-10-12 .github/workflows/a2-dyn-v89-qualification.yml A2_DYN_V89_REVISION_INDEX.md > "$p/evidence/exact-source.tar"
          printf '%s\n%s\n' "$GITHUB_SHA" "$GITHUB_REF" > "$p/evidence/exact-checkout.txt"
          git rev-parse HEAD:"$p" >> "$p/evidence/exact-checkout.txt"
      - name: Install native TeX and finite-check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern python3-numpy python3-mpmath python3-sympy python3-scipy poppler-utils
      - name: Preserve both variants and compile all 210 active proof modules
        env:
          TZ: UTC
        run: bash papers/A2-DYN-v89-referee-response/build.sh
      - name: Upload exact-SHA manuscript and complete-archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-dyn-v89-${{ github.sha }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          path: |
            papers/A2-DYN-v89-referee-response/build/*.pdf
            papers/A2-DYN-v89-referee-response/build/*.log
            papers/A2-DYN-v89-referee-response/build/*.fls
            papers/A2-DYN-v89-referee-response/build/*.aux
            papers/A2-DYN-v89-referee-response/build/*-pass*.txt
            papers/A2-DYN-v89-referee-response/build/*.tex
            papers/A2-DYN-v89-referee-response/evidence/*
