name: A2-DYN v18 one-time exact source transport
on:
  push:
    branches: [revision/a2-dyn-v18-referee-response-2026-10-06]
    paths:
      - .github/a2-dyn-v18-transport/**
      - .github/workflows/a2-dyn-v18-assemble.yml
permissions:
  contents: write
jobs:
  assemble:
    if: startsWith(github.event.head_commit.message, '[assemble-v18]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify frozen source and create immutable Git objects only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/a2-dyn-v18-transport/assemble.py
      - name: Upload exact source transport receipt
        uses: actions/upload-artifact@v4
        with:
          name: a2-dyn-v18-assembly-${{ github.sha }}
          path: assembly-receipt.json
          if-no-files-found: error
          retention-days: 90
