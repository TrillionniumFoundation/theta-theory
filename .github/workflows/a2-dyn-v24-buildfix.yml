name: A2-DYN v24 evidence-name repair
on:
  push:
    branches: [revision/a2-dyn-v24-referee-response-2026-10-06]
    paths:
      - .github/a2-dyn-v24-buildfix.py
      - .github/workflows/a2-dyn-v24-buildfix.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Create exact repaired immutable paper objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/a2-dyn-v24-buildfix.py
      - uses: actions/upload-artifact@v4
        with:
          name: a2-dyn-v24-buildfix-${{ github.sha }}
          path: v24-buildfix-receipt.json
          if-no-files-found: error
