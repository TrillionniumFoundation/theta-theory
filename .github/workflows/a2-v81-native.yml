name: A2 v81 native manuscript
on:
  workflow_dispatch:
  push:
    branches:
      - revision/a2-v81-blind-clock-pencils-2026-09-18
    paths:
      - papers/A2-v17-boundary-information-coarsening/article/v81/**
      - papers/A2-v17-boundary-information-coarsening/rigidity_v81*.tex
      - tools/build_a2_v81.sh
      - tools/test_a2_v81.py
      - .github/workflows/a2-v81-native.yml
permissions:
  contents: read
jobs:
  latex:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern python3-numpy
      - name: Build both manuscripts and test the inverse
        run: bash tools/build_a2_v81.sh
      - name: Publish source-matched native products and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-v81-native-${{ github.sha }}
          path: build/a2-v81/
          if-no-files-found: error
          retention-days: 30
