name: A2 v171 complete manuscript publication
on:
  push:
    branches: [revision/a2-v171-duality-conductor-base-change-2026-09-27]
    paths:
      - .github/workflows/a2-v171-build.yml
      - papers/A2-v17-boundary-information-coarsening/article/v171/source-part-*.b64
      - papers/A2-v17-boundary-information-coarsening/article/v171/*.py
      - papers/A2-v17-boundary-information-coarsening/article/v171/*-v171.tex
permissions:
  contents: write
concurrency:
  group: a2-v171-manuscript-publication
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Validate isolated branch and materialize authored sources
        run: |
          test "$GITHUB_REPOSITORY" = TrillionniumFoundation/theta-theory
          test "$GITHUB_REF_NAME" = revision/a2-v171-duality-conductor-base-change-2026-09-27
          python3 - <<'PY'
          from pathlib import Path
          import ast,base64,hashlib,json,lzma
          p=Path('papers/A2-v17-boundary-information-coarsening/article/v171')
          data=base64.b64decode(''.join((p/f'source-part-{i:02d}.b64').read_text().strip() for i in range(4)),validate=True)
          assert hashlib.sha256(data).hexdigest()=='8c4203aa7c3798449a40d1332da6e7addc53594b9f840def5f3e19a880bc53e3'
          bundle=json.loads(lzma.decompress(data))
          assert bundle['revision']==171 and len(bundle['source_files'])==11
          assert bundle['complete_predecessor_commit']=='b8c3c1d7e59591b4e402272773d9bed5ae7c88ba'
          assert bundle['controlling_review_commit']=='35b33cd5b0eda133137c9baa7e2a1ef0591dc58b'
          present=[(p/n).exists() for n in bundle['source_files']]
          assert all(present) or not any(present),'Partial authored-source materialization'
          for name,text in bundle['source_files'].items():
              assert Path(name).name==name and Path(name).suffix in ('.py','.tex','.md')
              assert hashlib.sha256(text.encode()).hexdigest()==bundle['sha256'][name]
              if not any(present):(p/name).write_text(text)
              if name.endswith('.py'):ast.parse((p/name).read_text(),filename=name)
          (p/'AUTHORED_SOURCE_HASHES_V171.json').write_text(json.dumps({n:hashlib.sha256((p/n).read_bytes()).hexdigest() for n in bundle['source_files']},indent=2)+'\n')
          print('Eleven complete authored sources materialized; the final SHA receives a separate read-only qualification.')
          PY
      - name: Install LaTeX and exact algebra environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils python3-venv
          python3 -m venv /tmp/a2-v171-env
          /tmp/a2-v171-env/bin/pip install 'sympy==1.14.0'
      - name: Run all inherited checks and new conductor and tangent-cover checks
        run: /tmp/a2-v171-env/bin/python papers/A2-v17-boundary-information-coarsening/article/v171/check_v171.py
      - name: Build both papers, complete technical supplement and archival master
        run: /tmp/a2-v171-env/bin/python papers/A2-v17-boundary-information-coarsening/article/v171/assemble_v171.py --build
      - name: Record build environment
        if: always()
        run: |
          p=papers/A2-v17-boundary-information-coarsening/article/v171
          { python3 --version; /tmp/a2-v171-env/bin/python -c 'import sympy; print("SymPy",sympy.__version__)'; pdflatex --version | head -2; echo "Source $GITHUB_SHA"; echo "Run $GITHUB_RUN_ID"; echo 'This is a materialization build, not qualification of the eventual submission tip.'; } > "$p/BUILD_ENVIRONMENT.txt"
      - name: Archive complete build before publication
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a2-v171-complete-review-build
          path: papers/A2-v17-boundary-information-coarsening/article/v171
          retention-days: 30
          if-no-files-found: error
      - name: Publish only the new complete revision and current root entries
        env:
          GH_PUBLICATION_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = revision/a2-v171-duality-conductor-base-change-2026-09-27
          p=papers/A2-v17-boundary-information-coarsening/article/v171
          auth=$(printf 'x-access-token:%s' "$GH_PUBLICATION_TOKEN" | base64 -w0)
          remote=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$p"/*.tex "$p"/*.pdf "$p"/*.py "$p"/*.json "$p"/*.md "$p"/BUILD_ENVIRONMENT.txt "$p"/render-audit/*.png CURRENT_REVIEW_ENTRY.md A2_REVISION_V171_INDEX.md README.md
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,subprocess
          p=Path('papers/A2-v17-boundary-information-coarsening/article/v171')
          r=json.loads((p/'BUILD_RECEIPT_V171.json').read_text())
          c=json.loads((p/'EXACT_CHECKS_V171.json').read_text())
          assert r['compiled'] and r['report_bytes_validated']
          assert r['predecessor_math_blocks']==487 and r['predecessor_labels']==706
          assert r['all_predecessor_math_blocks_retained_byte_for_byte']
          assert r['paper_I_proofbody_retained_byte_for_byte'] and r['paper_II_predecessor_retained_in_complete_supplement']
          assert r['papers_plus_supplement_partition_master'] and not r['historical_sources_modified']
          assert not r['missing_labels'] and not r['duplicate_labels']
          assert c['all_checks_pass'] and c['inherited_v170_full_chain_rerun']
          assert r['inherited_v170_full_chain_rerun'] and r['external_references_stabilized']
          for name,value in r['outputs'].items():
              assert value['clean_references_and_no_overfull_hboxes']
              for ext in ('tex','pdf'):
                  assert hashlib.sha256((p/(name+'.'+ext)).read_bytes()).hexdigest()==value[ext+'_sha256']
          changes=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          allowed={'CURRENT_REVIEW_ENTRY.md','A2_REVISION_V171_INDEX.md','README.md'}
          assert changes and all(x.startswith(str(p)+'/') or x in allowed for x in changes),changes
          assert not subprocess.check_output(['git','diff','--cached','--name-only','--diff-filter=D'],text=True).strip()
          for name in ('reconstruction','divisor-geometry','technical-supplement','geometry'):
              assert str(p/(name+'.tex')) in changes and str(p/(name+'.pdf')) in changes
          print('Four complete manuscripts, all predecessor proof blocks, exact hashes and isolated publication verified.')
          PY
          git commit -m 'A2 v171: publish complete conductor-duality manuscripts, nonmonomial boundary theorem, full supplement and 25-point response [skip ci]'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
