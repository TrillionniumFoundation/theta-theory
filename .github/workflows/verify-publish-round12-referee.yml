name: verify-publish-round12-referee

on:
  push:
    branches:
      - revision/round12-referee-positive-closure-11paper-2026-08-31
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-publish-round12-referee
  cancel-in-progress: true

jobs:
  verify-build-publish:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Capture current main and merge locked Round-Eleven reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name theta-theory-revision-bot
          git config user.email revision-bot@users.noreply.github.com
          git fetch origin main review/round11-gpt56-pro-harsh-11paper-2026-08-31 --tags
          PRE_MAIN="$(git rev-parse origin/main)"
          git merge --no-edit origin/main
          git merge --no-edit 8605a0b68c8bb99c2e49e4d5d177d1ff67bdf958
          git merge-base --is-ancestor 8605a0b68c8bb99c2e49e4d5d177d1ff67bdf958 HEAD
          echo "PRE_MAIN=$PRE_MAIN" >> "$GITHUB_ENV"

      - name: Restore checksum-pinned Round-Twelve payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .round12 -maxdepth 1 -name 'payload.part-*' -type f | wc -l)" -eq 5
          cat .round12/payload.part-* | tr -d '\r\n' | base64 --decode > /tmp/round12-payload.tar.xz
          echo 'f5f1d51fdf531ddac6c2c32114bc952a186768cea7efa6a472a5e50323f4e38a  /tmp/round12-payload.tar.xz' | sha256sum --check
          tar -xJf /tmp/round12-payload.tar.xz
          rm -rf .round12
          chmod +x tools/materialize_round12_referee.py tools/verify_round12_referee.py tools/hostile_rereview_round12.py tools/build_round12.py tools/write_round12_certificate.py

      - name: Syntax-check and materialize
        run: |
          python -m py_compile tools/materialize_round12_referee.py tools/verify_round12_referee.py tools/hostile_rereview_round12.py tools/build_round12.py tools/write_round12_certificate.py
          python tools/materialize_round12_referee.py

      - name: Run exact-source and counterexample gates
        run: |
          python tools/verify_round12_referee.py
          python tools/hostile_rereview_round12.py

      - name: Install TeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk biber poppler-utils texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra

      - name: Clean-build all eleven papers
        run: python tools/build_round12.py

      - name: Re-run gates after build
        run: |
          python tools/verify_round12_referee.py
          python tools/hostile_rereview_round12.py

      - name: Commit verified mathematical tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git add -f papers/*/main.pdf
          if git diff --cached --quiet; then echo 'No Round-Twelve changes.' >&2; exit 1; fi
          git commit -m 'Materialize round-twelve positive referee closure for all eleven papers [skip ci]'
          echo "MATHEMATICAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:revision/round12-referee-positive-closure-11paper-2026-08-31

      - name: Write certificate and publication record
        shell: bash
        run: |
          set -euo pipefail
          python tools/write_round12_certificate.py --mathematical-sha "$MATHEMATICAL_SHA" --pre-main "$PRE_MAIN" --workflow-run "$GITHUB_RUN_ID"
          git add ROUND12_FINAL_CERTIFICATE.json ROUND12_PUBLICATION_RECORD.json ROUND12_REVISION_STATUS.md
          git commit -m 'Record exact round-twelve verification and publication metadata [skip ci]'
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:revision/round12-referee-positive-closure-11paper-2026-08-31

      - name: Archive old main and atomically publish
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE='archive/main-pre-round12-positive-closure-2026-08-31'
          TAG='round12-positive-closure-verified-2026-08-31'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$PRE_MAIN"
          git merge-base --is-ancestor "$PRE_MAIN" HEAD
          if git ls-remote --exit-code --heads origin "refs/heads/$ARCHIVE" >/tmp/r12archive 2>/dev/null; then
            test "$(cut -f1 /tmp/r12archive)" = "$PRE_MAIN"
          else
            git push origin "$PRE_MAIN:refs/heads/$ARCHIVE"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then echo 'Round-Twelve tag already exists.' >&2; exit 1; fi
          git tag -a "$TAG" -m 'Verified round-twelve positive referee closure for eleven papers' HEAD
          git push --atomic --force-with-lease="refs/heads/main:$PRE_MAIN" origin HEAD:refs/heads/main "refs/tags/$TAG"

      - name: Verify remote topology and immutable math tree
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE='archive/main-pre-round12-positive-closure-2026-08-31'
          TAG='round12-positive-closure-verified-2026-08-31'
          git fetch origin main "$ARCHIVE" "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse origin/main)" = "$FINAL_SHA"
          test "$(git rev-parse "origin/$ARCHIVE")" = "$PRE_MAIN"
          test "$(git rev-list -n1 "$TAG")" = "$FINAL_SHA"
          git diff --exit-code "$MATHEMATICAL_SHA" "$FINAL_SHA" -- papers revision/round12-referee-final tools/materialize_round12_referee.py tools/verify_round12_referee.py tools/hostile_rereview_round12.py tools/build_round12.py ROUND12_HISTORICAL_DERIVATION_AUDIT.md ROUND12_PROOF_DEPENDENCY_LEDGER.md ROUND12_REFEREE_INVENTORY.md ROUND12_REFEREE_INVENTORY.json REFEREE_ROUND12_RESPONSE.md
          echo "ROUND12_REMOTE_PUBLICATION_PASS main=$FINAL_SHA archive=$PRE_MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: theta-theory-round12-verified-papers-and-audit
          path: |
            papers/*/main.pdf
            ROUND12_FINAL_CERTIFICATE.json
            ROUND12_PUBLICATION_RECORD.json
            ROUND12_REVISION_STATUS.md
            ROUND12_BUILD_SUMMARY.json
            ROUND12_STRUCTURAL_VERIFICATION.json
            ROUND12_HOSTILE_REREVIEW.json
            ROUND12_INTERNAL_HARSH_REREVIEW.md
            ROUND12_HISTORICAL_DERIVATION_AUDIT.md
            ROUND12_PROOF_DEPENDENCY_LEDGER.md
            ROUND12_REFEREE_INVENTORY.md
            ROUND12_REFEREE_INVENTORY.json
            REFEREE_ROUND12_RESPONSE.md
          if-no-files-found: error
