name: archived-unpack-helper-disabled

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Explain why automatic unpacking is disabled on the review branch
        run: |
          echo "Automatic unpacking is intentionally disabled on the referee-report branch."
          echo "The pinned source archive remains in the branch, but review files must never be deleted by rsync."
