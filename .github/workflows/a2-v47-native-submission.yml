name: A2 v47 calibration-aware histograms and verified native retention
on:
  push:
    branches:
      - revision/a2-v47-calibration-aware-histograms-2026-09-14
    paths:
      - papers/A2-v17-boundary-information-coarsening/**/*.tex
      - papers/A2-v17-boundary-information-coarsening/tools/**
      - .github/workflows/a2-v47-native-submission.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions:
      contents: write
    outputs:
      source_commit: ${{ steps.source.outputs.source_commit }}
    steps:
      - name: Checkout the exact preparation commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Materialize and commit the additive complete manuscript
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = revision/a2-v47-calibration-aware-histograms-2026-09-14
          P=papers/A2-v17-boundary-information-coarsening
          python3 -B "$P/tools/materialize_revision_v47.py" > "$RUNNER_TEMP/materialization-v47.json"
          cat > README.md <<'EOF'
          # Theta-Theory: A2 revision 47

          **Boundary laws, intrinsic periodic rigidity, and global physical reconstruction in dispersing billiards** — Qian Qi, September 14, 2026.

          [Complete main source](papers/A2-v17-boundary-information-coarsening/main.tex) · [Complete companion](papers/A2-v17-boundary-information-coarsening/two_collision.tex) · [Response to the latest v46 referee](papers/A2-v17-boundary-information-coarsening/RESPONSE_TO_REFEREE_V47.md) · [Historical derivation audit](papers/A2-v17-boundary-information-coarsening/HISTORICAL_DERIVATION_AUDIT_V47.md).

          Author branch: `revision/a2-v47-calibration-aware-histograms-2026-09-14`. Review baseline: `45b42eee377c7fd3cff81c24c95acb91d6f46ab6`.

          The exact-offset confidence radius now explicitly separates finite-flight bias from timing and chart error. The complete new Section 19.7–19.9 proves offset continuity, hard-cell perturbation bounds, calibration-aware histogram reconstruction, and a finite joint grid/pilot/sample prescription using the existing same-flight physical pilot. The unknown marked lattice remains part of the reconstruction.

          Every inherited theorem and proof remains active. Exact amended-file originals and the previous entry points are retained in `papers/A2-v17-boundary-information-coarsening/history/v46-review-baseline/`. The three main mathematical parts, full auxiliary material and companion are preserved. A1 and the other historical workstreams are unchanged.

          Native evidence is produced by the version-scoped workflow and published on a new `revision/a2-v47-native-products-<run>-<attempt>` branch under `deliveries/a2-v47/<actual-source-commit>/`. The workflow preparation commit and the actual compiled source are recorded separately. The final review-ready entry will identify the completed products; this source entry does not assert that an unfinished workflow succeeded.
          EOF
          cat > "$P/README.md" <<'EOF'
          # A2 revision 47 — complete manuscript

          [Main source](main.tex) · [Full companion source](two_collision.tex) · [Response to v46](RESPONSE_TO_REFEREE_V47.md) · [Historical audit](HISTORICAL_DERIVATION_AUDIT_V47.md).

          Revision 47 adds a calibration-aware acquisition theorem and an explicit finite prescription for hard transverse histograms, while preserving the entire v46 inverse and all other active mathematics. The historical directory name `A2-v17` is not the current revision number.

          The baseline report is pinned at `45b42eee377c7fd3cff81c24c95acb91d6f46ab6`. Exact original amended files and entry points are in [the v46 archive](history/v46-review-baseline/). The new mathematical module is [Section 19.7–19.9](article/23l_calibrated_histograms_v47.tex).

          The version-scoped native workflow compiles the complete companion first and the complete main second. Its product branch contains both PDFs, full source ZIP, active-source manifest, logs, diagnostics, build report, and fetched-Git-object verification. Consult the final v47 review-ready entry for the completed product identity rather than an earlier v46 PDF.
          EOF
          git switch -C "$GITHUB_REF_NAME"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md "$P"
          if ! git diff --cached --quiet; then
            git commit -m 'A2 v47: materialize the full additive calibration-aware manuscript and preserve the exact v46 baseline'
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
          SOURCE=$(git rev-parse HEAD)
          echo "source_commit=$SOURCE" >> "$GITHUB_OUTPUT"
          printf 'Preparation: `%s`\n\nActual mathematical source: `%s`\n' "$GITHUB_SHA" "$SOURCE" >> "$GITHUB_STEP_SUMMARY"
      - name: Install the native toolchain and diagnostic libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils python3-numpy python3-scipy python3-sympy
      - name: Verify full preservation and finite diagnostic reproducibility
        shell: bash
        run: |
          set -euo pipefail
          P=papers/A2-v17-boundary-information-coarsening
          for script in check_revision_v47 check_quantized_v46 check_adaptive check_revision_v32 check_revision_v38; do
            /usr/bin/python3 -B "$P/tools/$script.py" > "$RUNNER_TEMP/$script-normal.json"
            /usr/bin/python3 -O -B "$P/tools/$script.py" > "$RUNNER_TEMP/$script-optimized.json"
            cmp "$RUNNER_TEMP/$script-normal.json" "$RUNNER_TEMP/$script-optimized.json"
          done
      - name: Compile both complete native entries from actual source Git objects
        env:
          SOURCE: ${{ steps.source.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          /usr/bin/python3 -B papers/A2-v17-boundary-information-coarsening/tools/build_submission.py --output-dir "$RUNNER_TEMP/a2-v47-native-$SOURCE"
          cp "$RUNNER_TEMP"/check_*-normal.json "$RUNNER_TEMP"/check_*-optimized.json "$RUNNER_TEMP/a2-v47-native-$SOURCE/"
          cp "$RUNNER_TEMP/materialization-v47.json" "$RUNNER_TEMP/a2-v47-native-$SOURCE/"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/a2-v47-native-$SOURCE/workflow-preparation-commit.txt"
      - name: Retain actual products and raw evidence
        if: always() && steps.source.outputs.source_commit != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a2-v47-native-${{ steps.source.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a2-v47-native-${{ steps.source.outputs.source_commit }}/
          if-no-files-found: error
          retention-days: 90
  publish-verified-products:
    needs: native
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.native.outputs.source_commit }}
          fetch-depth: 1
          persist-credentials: true
      - name: Retrieve and validate the source-matched native products
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ needs.native.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          P=papers/A2-v17-boundary-information-coarsening
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "a2-v47-native-$SOURCE-$GITHUB_RUN_ATTEMPT" --dir "$RUNNER_TEMP/v47"
          python3 -B "$P/tools/retain_native_v47.py" prepare --evidence "$RUNNER_TEMP/v47" --destination "deliveries/a2-v47/$SOURCE" --source-commit "$SOURCE" --run-id "$GITHUB_RUN_ID"
      - name: Publish on a new products branch and verify fetched Git objects
        env:
          SOURCE: ${{ needs.native.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          P=papers/A2-v17-boundary-information-coarsening
          D="deliveries/a2-v47/$SOURCE"
          branch="revision/a2-v47-native-products-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$D"
          python3 -B "$P/tools/retain_native_v47.py" verify --destination "$D" --ref INDEX
          git commit -m 'A2 v47: retain both complete native manuscripts and full source-matched evidence'
          git push origin "HEAD:refs/heads/$branch"
          git fetch origin "refs/heads/$branch"
          python3 -B "$P/tools/retain_native_v47.py" verify --destination "$D" --ref FETCH_HEAD --attestation
          git add -- "$D/COMMITTED_OBJECTS_VERIFIED.json"
          git commit -m 'A2 v47: attest the fetched published native Git objects'
          git push origin "HEAD:refs/heads/$branch"
          git fetch origin "refs/heads/$branch"
          python3 -B "$P/tools/retain_native_v47.py" verify --destination "$D" --ref FETCH_HEAD
          printf 'Source: `%s`\n\nProducts branch: `%s`\n\nVerified final head: `%s`\n' "$SOURCE" "$branch" "$(git rev-parse FETCH_HEAD)" >> "$GITHUB_STEP_SUMMARY"
