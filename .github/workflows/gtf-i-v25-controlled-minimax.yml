name: GTF-I v25 controlled minimax

on:
  push:
    branches:
      - revision/general-theta-foundations-i-v25-controlled-minimax-2026-09-24
    paths:
      - 'papers/GTF-I-v25-controlled-minimax/**'
      - '.github/workflows/gtf-i-v25-controlled-minimax.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gtf-i-v25-controlled-minimax
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/revision/general-theta-foundations-i-v25-controlled-minimax-2026-09-24'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
          sparse-checkout: |
            papers/GTF-I-v25-controlled-minimax
            papers/GTF-I-v24-structural-resources
            reviews/general-theta-foundations-i-v24-external-harsh-top4-r8-2026-09-24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install typesetting and exact arithmetic
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended texlive-pictures lmodern
          python -m pip install sympy==1.14.0 PyMuPDF==1.26.7
      - name: Verify additive revision ancestry
        run: |
          git fetch --depth=1 origin c5c1a0d64f830bc3f036292357d8bbe2dbd04ca6
          test -z "$(git diff --name-only --diff-filter=DMRT c5c1a0d64f830bc3f036292357d8bbe2dbd04ca6 HEAD)"
      - name: Execute proofs' regressions and compile full package
        env:
          GTF_SOURCE_COMMIT: ${{ github.sha }}
        run: python papers/GTF-I-v25-controlled-minimax/build.py
      - name: Publish only the new revision package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f papers/GTF-I-v25-controlled-minimax GENERAL_THETA_FOUNDATIONS_I_V25_REVIEW_READY.md
          git commit -m 'publish(GTF-I v25): exact marked minimax, controlled dual, self-contained physical bridge and full volumes [skip ci]'
          test -z "$(git diff --name-only --diff-filter=DMRT c5c1a0d64f830bc3f036292357d8bbe2dbd04ca6 HEAD)"
          READY='revision/general-theta-foundations-i-v25-referee-ready-2026-09-24'
          if git ls-remote --exit-code --heads origin "$READY"; then
            git fetch origin "$READY"
            git merge-base --is-ancestor FETCH_HEAD HEAD
          fi
          git push origin HEAD:"$GITHUB_REF_NAME" HEAD:"$READY"
      - name: Upload referee package
        uses: actions/upload-artifact@v4
        with:
          name: GTF-I-v25-controlled-minimax
          path: papers/GTF-I-v25-controlled-minimax/
          retention-days: 30
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GTF-I-v25-diagnostics
          path: |
            papers/GTF-I-v25-controlled-minimax/evidence/
            papers/GTF-I-v25-controlled-minimax/main.tex
          retention-days: 7
