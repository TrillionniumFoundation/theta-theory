name: A2-DYN v26 one-time exact-source transport
on:
  push:
    branches:
      - revision/a2-dyn-v26-referee-response-2026-10-07
    paths:
      - .github/a2-dyn-v26-transport/**
      - .github/workflows/a2-dyn-v26-assemble.yml
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate packet and create immutable paper tree only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p v26-assembly-evidence
          python3 .github/a2-dyn-v26-transport/assemble.py 2>&1 | tee v26-assembly-evidence/assembly.log
      - name: Upload transport and immutable-tree evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-dyn-v26-assembly-${{ github.sha }}
          retention-days: 7
          path: v26-assembly-evidence/*
