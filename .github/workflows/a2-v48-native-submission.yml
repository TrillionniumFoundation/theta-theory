name: A2 v48 structural and infinitesimal rigidity native submission
on:
  push:
    branches:
      - revision/a2-v48-infinitesimal-rigidity-2026-09-14
    paths:
      - papers/A2-v17-boundary-information-coarsening/**/*.tex
      - papers/A2-v17-boundary-information-coarsening/tools/**
      - .github/workflows/a2-v48-native-submission.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions:
      contents: write
    outputs:
      source_commit: ${{ steps.source.outputs.source_commit }}
    steps:
      - name: Check out the exact preparation commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Materialize the complete manuscript and preserve the reviewed source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = revision/a2-v48-infinitesimal-rigidity-2026-09-14
          P=papers/A2-v17-boundary-information-coarsening
          python3 -B "$P/tools/materialize_revision_v48.py" > "$RUNNER_TEMP/materialization-v48.json"
          A="$P/history/v47-review-baseline"
          test -e "$A/REPOSITORY_README.md" || cp README.md "$A/REPOSITORY_README.md"
          test -e "$A/README.md" || cp "$P/README.md" "$A/README.md"
          cat > README.md <<'EOF'
          # Theta-Theory: A2 revision 48

          **Boundary laws and rigidity of periodic dispersing billiards** — Qian Qi, September 14, 2026.

          [Complete main source](papers/A2-v17-boundary-information-coarsening/main.tex) · [Complete companion](papers/A2-v17-boundary-information-coarsening/two_collision.tex) · [Response to the latest v47 referee](papers/A2-v17-boundary-information-coarsening/RESPONSE_TO_REFEREE_V48.md) · [Historical derivation audit](papers/A2-v17-boundary-information-coarsening/HISTORICAL_DERIVATION_AUDIT_V48.md).

          Author branch: `revision/a2-v48-infinitesimal-rigidity-2026-09-14`. Latest review baseline: `757f2ee4e3bf766d2eb56d972e6d2f621b3fd2a6`; reviewed mathematical source: `219b39e94b14187561dc3b7e5bdbae49dbd92cc2`.

          Theorem A organizes the complete single-offset periodic inverse. New Section 20 proves its infinitesimal version for common-strip analytic-support variations with movable contacts and lattice, followed by finite scalar local coordinates on every immersed finite-dimensional model. The full analytic-class rigidity, quantized inverse, calibration-aware acquisition, local information results and position benchmarks remain active and unchanged.

          All 103 inherited active inputs remain active. Exact originals of the two editorially amended files are archived; 101 inherited inputs remain byte-identical in place. The companion, A1 and all other historical workstreams are unchanged.

          Native products are published by the version-scoped workflow on `revision/a2-v48-native-products-<run>-<attempt>` under `deliveries/a2-v48/<actual-source-commit>/`. The final review-ready entry will name the verified products. This source entry does not claim that an unfinished workflow succeeded.
          EOF
          cat > "$P/README.md" <<'EOF'
          # A2 revision 48 — complete manuscript

          [Main source](main.tex) · [Full companion](two_collision.tex) · [Response to v47](RESPONSE_TO_REFEREE_V48.md) · [Historical audit](HISTORICAL_DERIVATION_AUDIT_V48.md).

          The historical directory name `A2-v17` is not the current version number. The article is organized around [Theorem A](article/00_structural_introduction_v48.tex); [Section 20](article/23m_differential_rigidity_v48.tex) proves the full single-offset derivative kernel and finite-observable local coordinates on immersed models. The new differential hypotheses do not narrow the inherited exact or quantitative classes.

          The latest reviewed v47 source is frozen at `219b39e94b14187561dc3b7e5bdbae49dbd92cc2`, with report at `757f2ee4e3bf766d2eb56d972e6d2f621b3fd2a6`. Its [exact amended-file originals](history/v47-review-baseline/) and active-source manifest are retained. Every inherited mathematical statement and proof remains active, including all v47 hard-cell calibration results.

          The native workflow compiles the full companion and then the full main from the actual committed source, retains both PDFs and complete source/evidence, and verifies the pushed Git objects. Refer to the final v48 review-ready entry for completed build identities and actual visual coverage.
          EOF
          git switch -C "$GITHUB_REF_NAME"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md "$P"
          if ! git diff --cached --quiet; then
            git commit -m 'A2 v48: materialize the complete structural manuscript and preserve the exact reviewed v47 baseline'
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
          SOURCE=$(git rev-parse HEAD)
          echo "source_commit=$SOURCE" >> "$GITHUB_OUTPUT"
          printf 'Preparation: `%s`\n\nActual mathematical source: `%s`\n' "$GITHUB_SHA" "$SOURCE" >> "$GITHUB_STEP_SUMMARY"
      - name: Install the native toolchain and diagnostic libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils python3-numpy python3-scipy python3-sympy
      - name: Verify preservation and finite controls in both Python modes
        shell: bash
        run: |
          set -euo pipefail
          P=papers/A2-v17-boundary-information-coarsening
          for script in check_revision_v48 check_quantized_v46 check_adaptive check_revision_v32 check_revision_v38; do
            /usr/bin/python3 -B "$P/tools/$script.py" > "$RUNNER_TEMP/$script-normal.json"
            /usr/bin/python3 -O -B "$P/tools/$script.py" > "$RUNNER_TEMP/$script-optimized.json"
            cmp "$RUNNER_TEMP/$script-normal.json" "$RUNNER_TEMP/$script-optimized.json"
          done
      - name: Compile both complete entries from actual source Git objects
        env:
          SOURCE: ${{ steps.source.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          /usr/bin/python3 -B papers/A2-v17-boundary-information-coarsening/tools/build_submission.py --output-dir "$RUNNER_TEMP/a2-v48-native-$SOURCE"
          cp "$RUNNER_TEMP"/check_*-normal.json "$RUNNER_TEMP"/check_*-optimized.json "$RUNNER_TEMP/a2-v48-native-$SOURCE/"
          cp "$RUNNER_TEMP/materialization-v48.json" "$RUNNER_TEMP/a2-v48-native-$SOURCE/"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/a2-v48-native-$SOURCE/workflow-preparation-commit.txt"
      - name: Retain products and raw evidence
        if: always() && steps.source.outputs.source_commit != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a2-v48-native-${{ steps.source.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a2-v48-native-${{ steps.source.outputs.source_commit }}/
          if-no-files-found: error
          retention-days: 90
  publish-verified-products:
    needs: native
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.native.outputs.source_commit }}
          fetch-depth: 1
          persist-credentials: true
      - name: Retrieve and validate source-matched native products
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ needs.native.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          P=papers/A2-v17-boundary-information-coarsening
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "a2-v48-native-$SOURCE-$GITHUB_RUN_ATTEMPT" --dir "$RUNNER_TEMP/v48"
          python3 -B "$P/tools/retain_native_v48.py" prepare --evidence "$RUNNER_TEMP/v48" --destination "deliveries/a2-v48/$SOURCE" --source-commit "$SOURCE" --run-id "$GITHUB_RUN_ID"
      - name: Publish on a new products branch and verify fetched Git objects
        env:
          SOURCE: ${{ needs.native.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          P=papers/A2-v17-boundary-information-coarsening
          D="deliveries/a2-v48/$SOURCE"
          branch="revision/a2-v48-native-products-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$D"
          python3 -B "$P/tools/retain_native_v48.py" verify --destination "$D" --ref INDEX
          git commit -m 'A2 v48: retain both complete native manuscripts and all source-matched evidence'
          git push origin "HEAD:refs/heads/$branch"
          git fetch origin "refs/heads/$branch"
          python3 -B "$P/tools/retain_native_v48.py" verify --destination "$D" --ref FETCH_HEAD --attestation
          git add -- "$D/COMMITTED_OBJECTS_VERIFIED.json"
          git commit -m 'A2 v48: attest the fetched published native Git objects'
          git push origin "HEAD:refs/heads/$branch"
          git fetch origin "refs/heads/$branch"
          python3 -B "$P/tools/retain_native_v48.py" verify --destination "$D" --ref FETCH_HEAD
          printf 'Source: `%s`\n\nProducts branch: `%s`\n\nVerified final head: `%s`\n' "$SOURCE" "$branch" "$(git rev-parse FETCH_HEAD)" >> "$GITHUB_STEP_SUMMARY"
