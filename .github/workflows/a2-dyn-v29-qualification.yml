name: A2-DYN v29 exact-source qualification
on:
  push:
    branches:
      - revision/a2-dyn-v29-referee-response-2026-10-07
      - revision/a2-dyn-v29-referee-copy-2026-10-07
    paths:
      - papers/A2-DYN-v29-referee-response/**
      - .github/workflows/a2-dyn-v29-qualification.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a2-dyn-v29-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Archive exact article, baseline and controlling report
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p papers/A2-DYN-v29-referee-response/evidence
          git archive HEAD papers/A2-DYN-v29-referee-response papers/A2-DYN-v27-referee-response papers/A2-DYN-v26-referee-response reviews/a2-dyn-v26-external-top4-review-2026-10-07 .github/workflows/a2-dyn-v29-qualification.yml > papers/A2-DYN-v29-referee-response/evidence/exact-source.tar
      - name: Install native TeX and finite-check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra lmodern python3-numpy python3-mpmath python3-sympy poppler-utils
      - name: Verify exact source and compile the complete article
        env:
          TZ: UTC
        run: bash papers/A2-DYN-v29-referee-response/build.sh
      - name: Render the new proof pages and record PDF identity
        run: python3 papers/A2-DYN-v29-referee-response/tools/render_v29.py
      - name: Upload exact-source qualification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-dyn-v29-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            papers/A2-DYN-v29-referee-response/build/main.pdf
            papers/A2-DYN-v29-referee-response/build/main.log
            papers/A2-DYN-v29-referee-response/build/main.fls
            papers/A2-DYN-v29-referee-response/build/main.aux
            papers/A2-DYN-v29-referee-response/build/pass*.txt
            papers/A2-DYN-v29-referee-response/evidence/*
