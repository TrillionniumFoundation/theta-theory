name: A2-DYN v25 one-time exact source transport
on:
  push:
    branches:
      - revision/a2-dyn-v25-referee-response-2026-10-07
    paths:
      - .github/a2-dyn-v25-transport/**
      - .github/workflows/a2-dyn-v25-assemble.yml
permissions:
  contents: write
jobs:
  assemble:
    if: contains(github.event.head_commit.message, '[assemble-v25]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify the exact packet and create immutable paper objects only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/a2-dyn-v25-transport/assemble.py
      - name: Upload assembly receipt
        uses: actions/upload-artifact@v4
        with:
          name: a2-dyn-v25-assembly-${{ github.sha }}
          path: assembly-receipt.json
          if-no-files-found: error
          retention-days: 90
