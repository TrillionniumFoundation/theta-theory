name: Theta R47 source and mathematical verification
on:
  push:
    branches:
      - foundation/general-theta-restart-r47-stopping-transfer-research-2026-10-13
    paths:
      - '.github/workflows/theta-r47-verify.yml'
      - 'papers/General-Theta-Foundations-I-restart/r47-stopping-transfer/**'
      - '!papers/General-Theta-Foundations-I-restart/r47-stopping-transfer/evidence/**'
      - '!papers/General-Theta-Foundations-I-restart/r47-stopping-transfer/artifacts/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Export immutable committed input
        run: |
          mkdir -p "$RUNNER_TEMP/r47-input"
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/r47-input/checkout.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/r47-input/SOURCE_SHA.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/r47-input/GIT_TREE.txt"
          sha256sum "$RUNNER_TEMP/r47-input/checkout.tar.gz" > "$RUNNER_TEMP/r47-input/ARCHIVE_SHA256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: theta-r47-input-${{ github.sha }}
          path: ${{ runner.temp }}/r47-input
          retention-days: 30
      - name: Install build dependencies
        if: hashFiles('papers/General-Theta-Foundations-I-restart/r47-stopping-transfer/build.py') != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended lmodern cm-super poppler-utils python3-venv
          python3 -m venv "$RUNNER_TEMP/r47-venv"
          "$RUNNER_TEMP/r47-venv/bin/pip" install numpy scipy pypdf mpmath
      - name: Build and verify source without modification
        if: hashFiles('papers/General-Theta-Foundations-I-restart/r47-stopping-transfer/build.py') != ''
        run: |
          "$RUNNER_TEMP/r47-venv/bin/python" papers/General-Theta-Foundations-I-restart/r47-stopping-transfer/build.py --source-sha "$GITHUB_SHA" --output "$RUNNER_TEMP/r47-output" --retained
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('papers/General-Theta-Foundations-I-restart/r47-stopping-transfer/build.py') != ''
        with:
          name: theta-r47-build-${{ github.sha }}
          path: ${{ runner.temp }}/r47-output
          if-no-files-found: warn
          retention-days: 30
