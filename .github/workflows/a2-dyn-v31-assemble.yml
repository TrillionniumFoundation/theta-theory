name: A2-DYN v31 one-time exact source transport
on:
  push:
    branches: [revision/a2-dyn-v31-referee-response-2026-10-07]
    paths:
      - .github/a2-dyn-v31-transport/**
      - .github/workflows/a2-dyn-v31-assemble.yml
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Replay exact edits and create immutable Git objects only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/a2-dyn-v31-transport/assemble.py
      - uses: actions/upload-artifact@v4
        with:
          name: a2-dyn-v31-assembly-${{ github.sha }}
          path: ${{ runner.temp }}/a2-v31-assembly/*
          retention-days: 90
