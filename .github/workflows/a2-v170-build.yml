name: A2 v170 complete ramified-boundary revision publication
on:
  push:
    branches: [revision/a2-v170-ramified-contact-boundary-2026-09-26]
    paths:
      - .github/workflows/a2-v170-build.yml
      - papers/A2-v17-boundary-information-coarsening/article/v170/source-part-*.b64
      - papers/A2-v17-boundary-information-coarsening/article/v170/*.py
      - papers/A2-v17-boundary-information-coarsening/article/v170/*-v170.tex
permissions:
  contents: write
concurrency:
  group: a2-v170-complete-publication
  cancel-in-progress: true
jobs:
  build-and-publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Validate isolated branch and materialize authored proof sources
        run: |
          test "$GITHUB_REPOSITORY" = TrillionniumFoundation/theta-theory
          test "$GITHUB_REF_NAME" = revision/a2-v170-ramified-contact-boundary-2026-09-26
          python3 - <<'PY'
          from pathlib import Path
          import ast, base64, hashlib, json, lzma
          p=Path('papers/A2-v17-boundary-information-coarsening/article/v170')
          encoded=''.join((p/f'source-part-{i:02d}.b64').read_text().strip() for i in range(4))
          data=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(data).hexdigest()=='97e2053f1219035afc04a9d7ff6fcd8858a13e974c438099851978d7ff92fd67','Source payload checksum mismatch'
          bundle=json.loads(lzma.decompress(data))
          assert bundle['revision']==170 and len(bundle['source_files'])==8
          assert bundle['complete_predecessor_commit']=='81e0870e31078a3aaac6006b676ca54667e6d77a'
          present=[(p/name).exists() for name in bundle['source_files']]
          assert all(present) or not any(present),'Partial authored-source materialization'
          for name,text in bundle['source_files'].items():
              assert Path(name).name==name and Path(name).suffix in ('.py','.tex','.md')
              assert hashlib.sha256(text.encode()).hexdigest()==bundle['sha256'][name]
              if not any(present): (p/name).write_text(text)
              if name.endswith('.py'): ast.parse((p/name).read_text(),filename=name)
          hashes={name:hashlib.sha256((p/name).read_bytes()).hexdigest() for name in bundle['source_files']}
          (p/'AUTHORED_SOURCE_HASHES_V170.json').write_text(json.dumps(hashes,indent=2)+'\n')
          print('Eight authored source files validated; publication is confined to the new revision branch.')
          PY
      - name: Install LaTeX and exact algebra tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils python3-venv
          python3 -m venv /tmp/a2-v170-env
          /tmp/a2-v170-env/bin/pip install 'sympy==1.14.0'
      - name: Rerun full inherited v169 chain and new conductor and fibre checks
        run: |
          /tmp/a2-v170-env/bin/python papers/A2-v17-boundary-information-coarsening/article/v170/check_v170.py
      - name: Compile complete manuscripts and verify every predecessor proof block
        run: |
          /tmp/a2-v170-env/bin/python papers/A2-v17-boundary-information-coarsening/article/v170/assemble_v170.py --build
      - name: Record actual build environment
        if: always()
        run: |
          p=papers/A2-v17-boundary-information-coarsening/article/v170
          { uname -m; python3 --version; /tmp/a2-v170-env/bin/python -c 'import sympy; print("SymPy",sympy.__version__)'; pdflatex --version | head -2; echo "Source $GITHUB_SHA"; echo "Run $GITHUB_RUN_ID"; } > "$p/BUILD_ENVIRONMENT.txt"
      - name: Archive complete review build
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a2-v170-complete-review-build
          path: papers/A2-v17-boundary-information-coarsening/article/v170
          retention-days: 30
          if-no-files-found: error
      - name: Publish complete plain sources and PDFs to the isolated revision branch
        env:
          GH_PUBLICATION_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = revision/a2-v170-ramified-contact-boundary-2026-09-26
          p=papers/A2-v17-boundary-information-coarsening/article/v170
          auth=$(printf 'x-access-token:%s' "$GH_PUBLICATION_TOKEN" | base64 -w0)
          head=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          test "$head" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$p"/*.tex "$p"/*.pdf "$p"/*.py "$p"/*.json "$p"/*.md "$p"/BUILD_ENVIRONMENT.txt "$p"/render-audit/*.png CURRENT_REVIEW_ENTRY.md A2_REVISION_V170_INDEX.md README.md
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,subprocess
          p=Path('papers/A2-v17-boundary-information-coarsening/article/v170')
          r=json.loads((p/'BUILD_RECEIPT_V170.json').read_text())
          c=json.loads((p/'EXACT_CHECKS_V170.json').read_text())
          assert r['compiled'] and all(r['report_bytes_validated'].values())
          assert r['all_predecessor_math_blocks_retained_byte_for_byte'] and r['per_paper_math_blocks_retained']
          assert r['body_partitioned_exactly_once'] and r['all_three_predecessor_frontmatters_archived']
          assert r['predecessor_math_blocks']==465 and r['predecessor_labels']==682
          assert not r['missing_labels'] and not r['duplicate_labels']
          assert c['all_checks_pass'] and c['inherited_v169_full_chain_rerun']
          assert r['inherited_v169_full_chain_rerun'] and r['companion_references_stabilized']
          for name,value in r['outputs'].items():
              assert value['clean_references_and_no_overfull_hboxes']
              assert hashlib.sha256((p/(name+'.pdf')).read_bytes()).hexdigest()==value['pdf_sha256']
              assert hashlib.sha256((p/(name+'.tex')).read_bytes()).hexdigest()==value['tex_sha256']
          changed=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          allowed={'CURRENT_REVIEW_ENTRY.md','A2_REVISION_V170_INDEX.md','README.md'}
          assert changed and all(x.startswith(str(p)+'/') or x in allowed for x in changed),changed
          assert not subprocess.check_output(['git','diff','--cached','--name-only','--diff-filter=D'],text=True).strip()
          for name in ('reconstruction','divisor-geometry','geometry'):
              assert str(p/(name+'.pdf')) in changed and str(p/(name+'.tex')) in changed
          print('Complete manuscript PDFs, both reports, all inherited checks and exact proof preservation verified.')
          PY
          git commit -m 'A2 v170: publish complete ramified-boundary manuscripts, conductor proofs, PDFs and both referee responses [skip ci]'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
