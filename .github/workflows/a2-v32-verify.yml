name: A2 v32 exact-source fifteen-document qualification
on:
  push:
    branches:
      - revision/a2-v32-adaptive-scalar-boundary-2026-10-04
    paths:
      - 'papers/A2-v32-adaptive-scalar-boundary/**'
      - '.github/workflows/a2-v32-verify.yml'
permissions:
  contents: read
jobs:
  manuscript:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Check out the exact triggering source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            papers/A2-v32-adaptive-scalar-boundary
      - name: Require current and retained entry points
        working-directory: papers/A2-v32-adaptive-scalar-boundary
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f SOURCE_PINS.json
          test -f tools/validate_v32.py
          test -f tools/verify_v32.py
          test -f tools/test_contract.py
          test -f retained/v31/tools/validate_v31.py
      - name: Install mathematical build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended latexmk python3 python3-numpy python3-scipy poppler-utils
      - name: Qualify all fifteen documents at this SHA
        working-directory: papers/A2-v32-adaptive-scalar-boundary
        run: python3 tools/validate_v32.py --all-volumes --require-checkout --expected-commit "$GITHUB_SHA"
      - name: Archive native sources and actual evidence including failures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a2-v32-delivery"
          git archive --format=zip --output="$RUNNER_TEMP/a2-v32-delivery/A2-v32-exact-source.zip" HEAD papers/A2-v32-adaptive-scalar-boundary .github/workflows/a2-v32-verify.yml
          python3 - <<'PY'
          import hashlib,json,os,shutil,zipfile
          from pathlib import Path
          root=Path('papers/A2-v32-adaptive-scalar-boundary')
          out=Path(os.environ['RUNNER_TEMP'])/'a2-v32-delivery'
          with zipfile.ZipFile(out/'A2-v32-actual-evidence.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file() and p.suffix in ('.pdf','.json','.log','.fls'):
                      rel=p.relative_to(root)
                      if any(s in ('build','current') or s.endswith('-requalification') for s in rel.parts):
                          z.write(p,str(rel))
              for p in [root/'SOURCE_PINS.json',*root.glob('*.md')]:
                  if p.is_file(): z.write(p,str(p.relative_to(root)))
          for src,dst in [(root/'verification/current/receipt.json','receipt.json'),(root/'build/main.pdf','A2-v32-primary.pdf')]:
              if src.is_file(): shutil.copy2(src,out/dst)
          binding={'github_sha':os.environ.get('GITHUB_SHA'),'github_run_id':os.environ.get('GITHUB_RUN_ID'),
              'files':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in out.iterdir() if p.is_file()},
              'archive_is_not_a_qualification_claim':True}
          (out/'artifact-binding.json').write_text(json.dumps(binding,indent=2,sort_keys=True)+'\n')
          PY
      - name: Upload exact-source results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: A2-v32-${{ github.sha }}
          path: ${{ runner.temp }}/a2-v32-delivery/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
