name: A2 v118 build and publish
on:
  push:
    branches:
      - revision/a2-v118-higher-defect-nonreduced-generators-2026-09-22
    paths:
      - papers/A2-v17-boundary-information-coarsening/article/v118/**
      - .github/workflows/a2-v118-build-publish.yml
permissions:
  contents: write
concurrency:
  group: a2-v118-${{ github.ref }}
  cancel-in-progress: false
jobs:
  manuscript:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      P: papers/A2-v17-boundary-information-coarsening/article/v118
      BRANCH: revision/a2-v118-higher-defect-nonreduced-generators-2026-09-22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install reproducible build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern python3-sympy
          echo /usr/bin >> "$GITHUB_PATH"
      - name: Materialize and freeze mathematical sources
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          if [[ ! -f "$P/geometry.tex" ]]; then
            python3 "$P/prepare_revision.py"
            git add "$P"
            git commit -m 'source(a2): freeze v118 conductor-strata and nonreduced manuscript'
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          echo "MATHEMATICAL_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Exact checks and all reading editions
        run: |
          set -euo pipefail
          export GITHUB_SHA="$MATHEMATICAL_SOURCE_SHA"
          bash "$P/build.sh"
          git diff --exit-code -- "$P/geometry.tex" "$P/paper.tex" "$P/applications.tex" "$P/parts" "$P/*.py" "$P/*.sh"
          git diff --exit-code -- papers/A2-v17-boundary-information-coarsening/article/v117 reviews
      - name: Publish products without overwriting concurrent work
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$MATHEMATICAL_SOURCE_SHA"
          git add -f -- "$P/geometry.pdf" "$P/paper.pdf" "$P/applications.pdf" "$P/evidence" "$P/crossrefs" "$P/geometry.log" "$P/paper.log" "$P/applications.log"
          if ! git diff --cached --quiet; then
            git commit -m 'build(a2): publish v118 source-bound PDFs and exact-check receipts'
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          mkdir -p /tmp/a2-v118-artifact
          echo "$MATHEMATICAL_SOURCE_SHA" > /tmp/a2-v118-artifact/source_commit.txt
          git rev-parse HEAD > /tmp/a2-v118-artifact/published_head.txt
          git ls-remote origin "refs/heads/$BRANCH" > /tmp/a2-v118-artifact/remote_ref.txt
          git diff --name-only 2c6f180fa0baf23386e0a46a64abe7503ea65b00 HEAD > /tmp/a2-v118-artifact/changed_paths.txt
          tar -czf /tmp/a2-v118-artifact/a2-v118-review-bundle.tar.gz "$P"
          sha256sum /tmp/a2-v118-artifact/a2-v118-review-bundle.tar.gz > /tmp/a2-v118-artifact/bundle.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: a2-v118-source-bound-review
          path: /tmp/a2-v118-artifact/
          retention-days: 30
