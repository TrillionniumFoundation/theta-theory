name: A2 v31 complete native submission
on:
  push:
    branches: [revision/a2-v31-native-complete-build-top4-2026-09-12]
    paths:
      - 'papers/A2-v17-boundary-information-coarsening/**/*.tex'
      - 'papers/A2-v17-boundary-information-coarsening/tools/**'
      - '.github/workflows/a2-v31-native-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      P: papers/A2-v17-boundary-information-coarsening
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve complete immutable source before building
        run: |
          mkdir -p "$RUNNER_TEMP/a2-v31"
          git rev-parse HEAD > "$RUNNER_TEMP/a2-v31/source-commit.txt"
          git archive HEAD "$P" reviews/a2-v30-external-harsh-top4-2026-09-12 .github/workflows/a2-v31-native-build.yml | gzip -n > "$RUNNER_TEMP/a2-v31/native-source.tar.gz"
          python3 --version > "$RUNNER_TEMP/a2-v31/python-version.txt"
      - name: Export full source for independent native reproduction
        uses: actions/upload-artifact@v4
        with:
          name: a2-v31-source-${{ github.sha }}
          path: ${{ runner.temp }}/a2-v31
          if-no-files-found: error
      - name: Install native typesetting tools
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended texlive-science lmodern poppler-utils
      - name: Execute inherited exact finite diagnostics
        run: |
          for VERSION in 27 28 29; do
            python3 "$P/tools/check_revision_v${VERSION}.py" > "$RUNNER_TEMP/a2-v31/v${VERSION}-normal.json"
            python3 -O "$P/tools/check_revision_v${VERSION}.py" > "$RUNNER_TEMP/a2-v31/v${VERSION}-optimized.json"
            cmp "$RUNNER_TEMP/a2-v31/v${VERSION}-normal.json" "$RUNNER_TEMP/a2-v31/v${VERSION}-optimized.json"
          done
          python3 reviews/a2-v30-external-harsh-top4-2026-09-12/independent_checks.py > "$RUNNER_TEMP/a2-v31/v30-referee-normal.json"
          python3 -O reviews/a2-v30-external-harsh-top4-2026-09-12/independent_checks.py > "$RUNNER_TEMP/a2-v31/v30-referee-optimized.json"
          cmp "$RUNNER_TEMP/a2-v31/v30-referee-normal.json" "$RUNNER_TEMP/a2-v31/v30-referee-optimized.json"
      - name: Audit both complete native source graphs
        if: always()
        run: python3 "$P/tools/audit_native_sources_v27.py" --output "$RUNNER_TEMP/a2-v31/native-graph.json"
      - name: Build both complete native manuscripts
        if: always()
        run: python3 "$P/tools/build_submission.py" --output-dir "$RUNNER_TEMP/a2-v31/native-build"
      - name: Record product hashes
        if: always()
        run: |
          cd "$RUNNER_TEMP/a2-v31"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
      - name: Preserve source, logs, products and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-v31-native-${{ github.sha }}
          path: ${{ runner.temp }}/a2-v31
          if-no-files-found: error
