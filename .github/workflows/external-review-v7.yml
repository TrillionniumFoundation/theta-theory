name: external-review-v7
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            papers/paper-I-specular-ensembles/main.tex
            papers/paper-II-specular-homogenization/main.tex
            papers/paper-III-specular-theta/main.tex
            papers/paper-IV-specular-control/main.tex
            papers/paper-V-specular-rigidity/main.tex
      - run: python tools/verify_v7.py
      - run: python tools/verify_v7_deep.py
