name: GTF-I v22 sample-memory revision

on:
  push:
    branches:
      - revision/general-theta-foundations-i-v22-sample-memory-frontier-2026-09-24
    paths:
      - 'papers/GTF-I-v22-sample-memory-frontier/**'
      - 'GENERAL_THETA_FOUNDATIONS_I_V22_REVIEW_READY.md'
      - '.github/workflows/gtf-i-v22-sample-memory-frontier.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gtf-i-v22-sample-memory-publication
  cancel-in-progress: false

jobs:
  revision:
    if: github.ref == 'refs/heads/revision/general-theta-foundations-i-v22-sample-memory-frontier-2026-09-24'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install typesetting and verification dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended texlive-pictures lmodern
          python -m pip install PyMuPDF==1.26.7
      - name: Restore the reviewed source package
        run: python papers/GTF-I-v22-sample-memory-frontier/bootstrap/materialize.py
      - name: Freeze and push the mathematical source revision
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f papers/GTF-I-v22-sample-memory-frontier
          git commit -m 'revise(GTF-I v22): multicut sample-memory frontier, physical construction and complete referee response [skip ci]'
          git push origin HEAD:"$GITHUB_REF_NAME"
          echo "GTF_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Execute diagnostics, compile and preserve the full development
        run: python papers/GTF-I-v22-sample-memory-frontier/build.py
      - name: Publish article, response and executed evidence
        run: |
          python papers/GTF-I-v22-sample-memory-frontier/bootstrap/publish_manifest.py
          git add -f papers/GTF-I-v22-sample-memory-frontier GENERAL_THETA_FOUNDATIONS_I_V22_REVIEW_READY.md
          git commit -m 'publish(GTF-I v22): full English article, preserved development and executed evidence [skip ci]'
          git push origin HEAD:"$GITHUB_REF_NAME"
      - name: Archive the referee package
        uses: actions/upload-artifact@v4
        with:
          name: GTF-I-v22-sample-memory-frontier
          path: papers/GTF-I-v22-sample-memory-frontier/
          retention-days: 30
