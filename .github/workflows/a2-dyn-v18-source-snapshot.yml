name: A2-DYN v18 frozen baseline snapshot
on:
  push:
    branches: [revision/a2-dyn-v18-referee-response-2026-10-06]
    paths: [.github/workflows/a2-dyn-v18-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Archive frozen A2-DYN sources
        run: |
          git archive HEAD papers/A2-DYN-v17-referee-response papers/A2-DYN-v16-referee-response papers/A2-DYN-v15-referee-response papers/A2-DYN-v14-referee-response papers/A2-DYN-v13-referee-response papers/A2-DYN-v12-referee-response papers/A2-DYN-v11-referee-response papers/A2-DYN-v10-referee-response reviews/a2-dyn-v16-external-top4-review-2026-10-06 .github/workflows/a2-dyn-v17-qualification.yml > baseline.tar
          sha256sum baseline.tar > baseline.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: a2-dyn-v18-baseline-${{ github.sha }}
          path: baseline.*
          retention-days: 30
