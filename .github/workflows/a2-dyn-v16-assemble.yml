name: A2-DYN v16 one-time exact source transport
on:
  push:
    branches:
      - revision/a2-dyn-v16-referee-response-2026-10-06
    paths:
      - .github/a2-dyn-v16-transport/**
      - .github/workflows/a2-dyn-v16-assemble.yml
permissions:
  contents: write
jobs:
  assemble:
    if: contains(github.event.head_commit.message, '[assemble-v16]')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Create and verify immutable paper tree only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 .github/a2-dyn-v16-transport/assemble.py
      - uses: actions/upload-artifact@v4
        with:
          name: a2-dyn-v16-assembly-${{ github.sha }}
          path: assembly-evidence/receipt.json
          if-no-files-found: error
          retention-days: 90
