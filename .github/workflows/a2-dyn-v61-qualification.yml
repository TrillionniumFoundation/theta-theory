name: A2-DYN v61 complete-manuscript qualification
on:
  push:
    branches:
      - revision/a2-dyn-v61-referee-response-2026-10-10
      - revision/a2-dyn-v61-referee-copy-2026-10-10
    paths:
      - papers/A2-DYN-v61-referee-response/**
      - .github/workflows/a2-dyn-v61-qualification.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a2-dyn-v61-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify-manuscript:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Archive exact complete source and frozen reports
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p papers/A2-DYN-v61-referee-response/evidence
          git archive HEAD papers/A2-DYN-v60-referee-response .github/workflows/a2-dyn-v60-qualification.yml reviews/a2-dyn-v60-external-top4-review-2026-10-09 papers/A2-DYN-v59-referee-response .github/workflows/a2-dyn-v59-qualification.yml reviews/a2-dyn-v59-external-top4-review-2026-10-09 papers/A2-DYN-v58-referee-response .github/workflows/a2-dyn-v58-qualification.yml reviews/a2-dyn-v58-external-top4-review-2026-10-09 papers/A2-DYN-v57-referee-response .github/workflows/a2-dyn-v57-qualification.yml reviews/a2-dyn-v57-external-top4-review-2026-10-09 papers/A2-DYN-v56-referee-response .github/workflows/a2-dyn-v56-qualification.yml reviews/a2-dyn-v56-external-top4-review-2026-10-09 papers/A2-DYN-v48-referee-response papers/A2-DYN-v49-referee-response papers/A2-DYN-v50-referee-response papers/A2-DYN-v51-referee-response papers/A2-DYN-v52-referee-response papers/A2-DYN-v53-referee-response papers/A2-DYN-v54-referee-response papers/A2-DYN-v55-referee-response papers/A2-DYN-v61-referee-response .github/workflows/a2-dyn-v49-qualification.yml .github/workflows/a2-dyn-v50-qualification.yml .github/workflows/a2-dyn-v51-qualification.yml .github/workflows/a2-dyn-v52-qualification.yml .github/workflows/a2-dyn-v53-qualification.yml .github/workflows/a2-dyn-v54-qualification.yml .github/workflows/a2-dyn-v55-qualification.yml .github/workflows/a2-dyn-v61-qualification.yml reviews/a2-dyn-v48-external-top4-review-2026-10-09 reviews/a2-dyn-v49-external-top4-review-2026-10-09 reviews/a2-dyn-v50-external-top4-review-2026-10-09 reviews/a2-dyn-v51-external-top4-review-2026-10-09 reviews/a2-dyn-v52-external-top4-review-2026-10-09 reviews/a2-dyn-v54-external-top4-review-2026-10-09 reviews/a2-dyn-v55-external-top4-review-2026-10-09 > papers/A2-DYN-v61-referee-response/evidence/exact-source.tar
      - name: Install native TeX and finite-check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern python3-numpy python3-mpmath python3-sympy python3-scipy poppler-utils
      - name: Verify exact manuscript and build all retained mathematics
        env:
          TZ: UTC
        run: bash papers/A2-DYN-v61-referee-response/build.sh
      - name: Render theorem pages from actual labels
        run: python3 papers/A2-DYN-v61-referee-response/tools/render_v61.py
      - name: Upload exact-source manuscript artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-dyn-v61-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            papers/A2-DYN-v61-referee-response/build/main.pdf
            papers/A2-DYN-v61-referee-response/build/main.log
            papers/A2-DYN-v61-referee-response/build/main.fls
            papers/A2-DYN-v61-referee-response/build/main.aux
            papers/A2-DYN-v61-referee-response/build/pass*.txt
            papers/A2-DYN-v61-referee-response/evidence/*
