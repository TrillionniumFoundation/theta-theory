name: A2 v4 scoped source export
on:
  push:
    branches:
      - revision/a2-v4-nonlinear-boundary-laws-2026-09-09
    paths:
      - .github/workflows/a2-v4-source-export.yml
      - papers/A2-v4-nonlinear-boundary-laws/**
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package the frozen source basis and new manuscript
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          paths=(papers/A2-geometric-thresholds-v3-observability reviews/a2-geometric-thresholds-v3-harsh-independent-2026-09-09)
          if test -d papers/A2-v4-nonlinear-boundary-laws; then paths+=(papers/A2-v4-nonlinear-boundary-laws); fi
          tar -czf export/a2-v4-source.tar.gz "${paths[@]}"
          git rev-parse HEAD > export/commit.txt
          sha256sum export/a2-v4-source.tar.gz > export/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: a2-v4-source
          path: export/
          retention-days: 14
