name: CM2 unified-tree integrity
on:
  push:
    branches: [main]
    paths: ['canonical/CM2_*','cm2/canonical/v83/**','provenance/cm2-unified-tree-2026-08-28/**','tools/cm2-scripts/verify_unified_tree.py','.github/workflows/cm2-unified-tree.yml']
  pull_request:
    paths: ['canonical/CM2_*','cm2/canonical/v83/**','provenance/cm2-unified-tree-2026-08-28/**','tools/cm2-scripts/verify_unified_tree.py','.github/workflows/cm2-unified-tree.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 tools/cm2-scripts/verify_unified_tree.py --repo .
      - run: git diff --check
