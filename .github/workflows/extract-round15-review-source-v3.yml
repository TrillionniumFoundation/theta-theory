name: extract-round15-review-source-v3

on:
  push:
    branches:
      - review/round15-payload-rescue-2026-09-01
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download validated historical-corpus artifact
        uses: actions/download-artifact@v4
        with:
          name: theta-round15-historical-corpus
          path: /tmp/r15-expanded
          github-token: ${{ github.token }}
          repository: TrillionniumFoundation/theta-theory
          run-id: 33459091399

      - name: Locate registered Round Fifteen sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r15-unpacked
          find /tmp/r15-expanded -type f \( -name '*.tar.xz' -o -name '*.tar.gz' -o -name '*.tgz' -o -name '*.tar' -o -name '*.zip' \) -print0 | while IFS= read -r -d '' archive; do
            dest="/tmp/r15-unpacked/$(basename "$archive" | tr '. ' '__')"
            mkdir -p "$dest"
            case "$archive" in
              *.tar.xz) tar -xJf "$archive" -C "$dest" ;;
              *.tar.gz|*.tgz) tar -xzf "$archive" -C "$dest" ;;
              *.tar) tar -xf "$archive" -C "$dest" ;;
              *.zip) unzip -q "$archive" -d "$dest" ;;
            esac
          done
          SRC="$(find /tmp/r15-expanded /tmp/r15-unpacked -type d -path '*/revision/round15-referee-final' | head -1)"
          test -n "$SRC"
          ROOT="${SRC%/revision/round15-referee-final}"
          echo "SRC=$SRC" >> "$GITHUB_ENV"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          find "$SRC" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Commit compact source mirror
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .round15-review-source
          mkdir -p .round15-review-source/revision .round15-review-source/tools
          cp -a "$SRC" .round15-review-source/revision/
          find "$ROOT/tools" -maxdepth 1 -type f -name '*round15*' -exec cp -a {} .round15-review-source/tools/ \;
          for f in "$ROOT"/ROUND15_*.json "$ROOT"/ROUND15_*.md "$ROOT"/REFEREE_ROUND15_RESPONSE.md; do
            [ -e "$f" ] && cp -a "$f" .round15-review-source/
          done
          find .round15-review-source -type f -exec sha256sum {} + | sort > .round15-review-source/SHA256SUMS
          test "$(find .round15-review-source/revision/round15-referee-final -maxdepth 1 -type f -name '*.tex' | wc -l)" -eq 11
          git config user.name theta-review-source-rescue
          git config user.email review-source-rescue@users.noreply.github.com
          git add .round15-review-source
          git commit -m 'Recover compact Round Fifteen registered review sources [skip ci]'
          git push origin HEAD:review/round15-payload-rescue-2026-09-01
