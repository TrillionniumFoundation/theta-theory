name: A2-DYN v24 exact layout inspection
on:
  push:
    branches: [revision/a2-dyn-v24-referee-response-2026-10-06]
    paths: [.github/workflows/a2-dyn-v24-layout-inspect.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read only the exact failed qualification archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import io,json,os,urllib.request,zipfile
          url='https://api.github.com/repos/TrillionniumFoundation/theta-theory/actions/artifacts/11428450868/zip'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'a2-dyn-layout-inspection'})
          with urllib.request.urlopen(req,timeout=60) as r: data=r.read()
          z=zipfile.ZipFile(io.BytesIO(data))
          name=next(n for n in z.namelist() if n.endswith('build/main.log'))
          log=z.read(name).decode().splitlines()
          for i,line in enumerate(log):
              if 'Overfull' in line:
                  print('\nEXACT OVERFLOW CONTEXT:')
                  for j in range(max(0,i-14),min(len(log),i+15)):
                      print(f'{j+1}: {log[j]}')
          aux=z.read(next(n for n in z.namelist() if n.endswith('build/main.aux'))).decode()
          for line in aux.splitlines():
              if any(x in line for x in ['intro-multiscale','multiscale-stopping','rate-preserving-band','all-marked-gaussian','quarter-stopping']): print(line)
          print('FILES:',json.dumps(z.namelist()))
          PY
