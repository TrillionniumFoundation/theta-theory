name: A2-DYN v24 exact layout inspection
on:
  push:
    branches: [revision/a2-dyn-v24-referee-response-2026-10-06]
    paths: [.github/workflows/a2-dyn-v24-layout-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install native TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra lmodern
      - name: Compile unchanged source and print exact overflow locations
        run: |
          cd papers/A2-DYN-v24-referee-response
          mkdir -p build
          for pass in 1 2 3; do
            pdflatex -no-shell-escape -interaction=nonstopmode -halt-on-error -file-line-error -recorder -output-directory=build main.tex > build/layout-pass${pass}.txt
          done
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('build/main.log').read_text().splitlines()
          for i,line in enumerate(lines):
              if 'Overfull' in line:
                  print('\nEXACT OVERFLOW CONTEXT:')
                  for j in range(max(0,i-16),min(len(lines),i+16)):
                      print(f'{j+1}: {lines[j]}')
          for line in Path('build/main.aux').read_text().splitlines():
              if any(x in line for x in ['intro-multiscale','multiscale-stopping','rate-preserving-band','all-marked-gaussian','quarter-stopping']):print(line)
          print('END LAYOUT DIAGNOSTICS; no qualification asserted')
          PY
