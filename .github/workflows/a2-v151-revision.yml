name: A2 v151 isolated revision verification
on:
  push:
    branches: [revision/a2-v151-canonical-gcd-boundary-normalization-2026-09-24]
    paths:
      - '.github/workflows/a2-v151-revision.yml'
      - '.revision-bootstrap/a2-v151-2026-09-24/**'
      - 'papers/A2-v17-boundary-information-coarsening/article/v151/**'
permissions:
  contents: write
concurrency:
  group: a2-v151-isolated-publication
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      P: papers/A2-v17-boundary-information-coarsening/article/v151
      PREDECESSOR: ddcef32b3cf491aacb293e466c393ec4af3caecd
      TARGET_BRANCH: revision/a2-v151-canonical-gcd-boundary-normalization-2026-09-24
      OPENBLAS_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preserve exact source transport
        uses: actions/upload-artifact@v4
        with:
          name: a2-v151-source-transfer
          path: .revision-bootstrap/a2-v151-2026-09-24/
          retention-days: 7
      - name: Verify and reconstruct source against the controlling review
        run: |
          git fetch --no-tags --depth=1 origin "$PREDECESSOR"
          git diff --exit-code "$PREDECESSOR" -- papers/A2-v17-boundary-information-coarsening/article/v149 reviews/a2-v149-independent-harsh-top4-2026-09-24/REFEREE_REPORT.md
          python - <<'PY'
          import base64,hashlib,json,lzma,os
          from pathlib import Path,PurePosixPath
          root=Path('.revision-bootstrap/a2-v151-2026-09-24')
          expected=['3defdeddc606ab99c56a004c43c7a89f7c4752c4','24cd38ffa7c28dde079ceeb46c2189245212e1a9','5e66442cdd587100130b3a284c5f317864b3fe81','226fbfe32e5d152526059170f93d7fa2d90f9686']
          chunks=[]
          for i,want in enumerate(expected,1):
              b=(root/f'payload-{i:02}.b64').read_text().strip().encode()
              got=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
              if got!=want: raise SystemExit(f'Transport hash mismatch: chunk {i}')
              chunks.append(b)
          compressed=base64.b64decode(b''.join(chunks),validate=True)
          if hashlib.sha256(compressed).hexdigest()!='f544101e660c99dab82ce584648707427b758cf3c1e33e9af031230896715cfb':
              raise SystemExit('Compressed source SHA256 mismatch')
          raw=lzma.decompress(compressed)
          if hashlib.sha256(raw).hexdigest()!='0a47db2839ab3db815268206a78d29637e12b2d979b6f57fabfa913b75f912c2':
              raise SystemExit('Uncompressed source SHA256 mismatch')
          source=json.loads(raw);p=Path(os.environ['P']);base=p.parent/'v149';p.mkdir(parents=True,exist_ok=True)
          def safe(name):
              rel=PurePosixPath(name)
              if rel.is_absolute() or '..' in rel.parts or rel.suffix not in {'.tex','.py','.sh','.md','.json'}:
                  raise SystemExit('Unsafe source path: '+name)
              return rel
          for name,value in source.items():
              safe(name)
              if isinstance(value,str): text=value
              else:
                  path=base/safe(value['base']);old=path.read_bytes()
                  if hashlib.sha256(old).hexdigest()!=value['base_sha256']: raise SystemExit('Predecessor hash mismatch: '+str(path))
                  lines=old.decode().splitlines(keepends=True);edits=value['edits'];last=0
                  for i,j,t in edits:
                      if not(isinstance(i,int) and isinstance(j,int) and isinstance(t,str) and last<=i<=j<=len(lines)):
                          raise SystemExit('Invalid source edit: '+name)
                      last=j
                  for i,j,t in reversed(edits): lines[i:j]=[t]
                  text=''.join(lines)
              dest=p/name;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_text(text)
          print('Verified and reconstructed',len(source),'source files.')
          PY
      - name: Assemble and publish complete native source
        run: |
          python "$P/revision_v151.py" assemble
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$P" CURRENT_REVIEW_ENTRY.md
          python - <<'PY'
          import os,subprocess
          names=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          if any(not(n.startswith(os.environ['P']+'/') or n=='CURRENT_REVIEW_ENTRY.md') for n in names):
              raise SystemExit('Unexpected staged path; refusing source publication')
          PY
          if ! git diff --cached --quiet; then
            git commit -m 'source(A2 v151): canonical divisor boundary, normalization and pencil specialization [skip ci]'
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
          echo "A2_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install native mathematics build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
          python -m pip install sympy==1.14.0 numpy==2.3.5
      - name: Run all exact regressions and native PDF builds
        run: |
          python "$P/revision_v151.py" build
          python - <<'PY'
          import json,os,platform,subprocess,sys
          from pathlib import Path
          import sympy,numpy
          p=Path(os.environ['P'])/'evidence'
          data={'source_commit':os.environ['A2_SOURCE_COMMIT'],'workflow_run_id':os.environ['GITHUB_RUN_ID'],
                'python':sys.version,'platform':platform.platform(),'sympy':sympy.__version__,'numpy':numpy.__version__,
                'pdflatex':subprocess.check_output(['pdflatex','--version'],text=True).splitlines()[:2]}
          (p/'BUILD_ENVIRONMENT_V151.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Publish verified PDFs and source-bound evidence
        run: |
          git diff --exit-code "$PREDECESSOR" -- papers/A2-v17-boundary-information-coarsening/article/v149 reviews/a2-v149-independent-harsh-top4-2026-09-24/REFEREE_REPORT.md
          git add -f "$P/geometry.pdf" "$P/applications.pdf" "$P/archive-v144.pdf"
          git add -f "$P/geometry-labels.aux" "$P/applications-labels.aux" "$P/archive-v144-labels.aux"
          git add -f "$P/evidence" "$P/SOURCE_LOCK_V151.json" "$P/NONDELETION_V151.json" "$P/PROVENANCE_MANIFEST_V151.json" CURRENT_REVIEW_ENTRY.md
          python - <<'PY'
          import os,subprocess
          names=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          if any(not(n.startswith(os.environ['P']+'/') or n=='CURRENT_REVIEW_ENTRY.md') for n in names):
              raise SystemExit('Unexpected staged path; refusing PDF publication')
          PY
          if ! git diff --cached --quiet; then
            git commit -m "build(A2 v151): verified 27 regressions and native PDFs from $A2_SOURCE_COMMIT [skip ci]"
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
          mkdir -p publication
          git archive HEAD "$P" CURRENT_REVIEW_ENTRY.md | tar -x -C publication
          printf 'source_commit=%s\npublication_commit=%s\n' "$A2_SOURCE_COMMIT" "$(git rev-parse HEAD)" > publication/REMOTE_COMMITS.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: a2-v151-verified-native-publication
          path: publication
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: a2-v151-failure-diagnostics
          path: papers/A2-v17-boundary-information-coarsening/article/v151/evidence
          if-no-files-found: ignore
          retention-days: 7
