name: GTF-I v83 native-source qualification and publication
on:
  push:
    branches:
      - revision/general-theta-foundations-i-v83-r52-response-2026-10-05
    paths:
      - .github/workflows/gtf-i-v83-stage-build-publish.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gtf83-revision-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PAPER: papers/GTF-I-v83-coupled-boundary-geometry
      RESPONSE: revision/general-theta-foundations-i-v83-r52-response-2026-10-05
      NATIVE: revision/general-theta-foundations-i-v83-coupled-boundary-native-2026-10-05
      PUBLICATION: revision/general-theta-foundations-i-v83-coupled-boundary-publication-2026-10-05
    steps:
      - name: Check out this revision anchor and the immutable predecessor
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 20
          sparse-checkout: |
            .github
            papers/GTF-I-v82-finite-outcome-geometry
            papers/GTF-I-v83-coupled-boundary-geometry
      - name: Fetch the two immutable controlling reports
        run: |
          git fetch --no-tags --depth=1 origin 5bb27a43c0f78ba99020f605a0489bcbd403e236 7d5b1033f31c348ae60ebfb04e8b8d57b3b9e75e
      - name: Install typesetting and pinned exact-arithmetic dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-venv texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
          python3 -m venv "$RUNNER_TEMP/gtf83-venv"
          "$RUNNER_TEMP/gtf83-venv/bin/pip" install --disable-pip-version-check -r papers/GTF-I-v82-finite-outcome-geometry/requirements.txt
      - name: Expand the checked delta and verify complete proof preservation
        run: |
          "$RUNNER_TEMP/gtf83-venv/bin/python" .github/gtf83/stage_revision.py > "$RUNNER_TEMP/gtf83-STAGING.json"
          "$RUNNER_TEMP/gtf83-venv/bin/python" "$PAPER/build_revision.py" --check-source > "$RUNNER_TEMP/gtf83-SOURCE_CHECK.json"
      - name: Commit and push the actual native source without force or earlier-branch changes
        run: |
          test "$(git ls-remote origin "refs/heads/$RESPONSE" | cut -f1)" = "$GITHUB_SHA"
          test -z "$(git ls-remote origin "refs/heads/$NATIVE")"
          test -z "$(git ls-remote origin "refs/heads/$PUBLICATION")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'GTF-I v83: prove closed-body covariance upper bounds, noise crossover and polynomial affine legalization; respond to R52'
          git rev-parse HEAD > "$RUNNER_TEMP/gtf83-NATIVE_SHA.txt"
          git push --atomic origin "HEAD:refs/heads/$RESPONSE" "HEAD:refs/heads/$NATIVE"
      - name: Build three manuscripts and 21 exact suites; reconstruct full source and standalone journal package
        run: |
          "$RUNNER_TEMP/gtf83-venv/bin/python" "$PAPER/build_revision.py" --isolated > "$RUNNER_TEMP/gtf83-BUILD.json"
          "$RUNNER_TEMP/gtf83-venv/bin/python" "$PAPER/publish_revision.py" > "$RUNNER_TEMP/gtf83-PUBLICATION_PLAN.json"
      - name: Commit qualified artifacts directly on their native-source parent
        run: |
          "$RUNNER_TEMP/gtf83-venv/bin/python" - <<'PY'
          from pathlib import Path
          import json, os, subprocess
          root=Path(os.environ['PAPER'])
          receipt=json.loads((root/'evidence/BUILD_RECEIPT.json').read_text())
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          if receipt['source_commit']!=head or not all(receipt[x] for x in
              ['qualified_git_source','isolated_native_rebuild','standalone_journal_rebuild']):
              raise RuntimeError('native qualification missing')
          names=list(json.loads((root/'evidence/PACKAGE_MANIFEST.json').read_text()))
          names.append('evidence/PACKAGE_MANIFEST.json')
          allowed={'paper.pdf','STRUCTURAL_PAPER.pdf','COMPLETE_REVISION.pdf'}
          for name in names:
              path=Path(name)
              if path.is_absolute() or '..' in path.parts or not(name.startswith('evidence/') or name in allowed):
                  raise RuntimeError('invalid publication path')
          meta={k:receipt[k] for k in ['source_commit','source_git_tree','base_commit','documents',
              'source_files','regression_suites','normal_optimized_identical','isolated_native_rebuild',
              'standalone_journal_rebuild','preservation','physical_learner_executed',
              'independent_human_priority_clearance']}
          meta.update(schema='gtf83.publication/1',publication_identity='The commit containing this file',
              controlling_reports={'external':'5bb27a43c0f78ba99020f605a0489bcbd403e236',
              'pipeline':'7d5b1033f31c348ae60ebfb04e8b8d57b3b9e75e'},
              primary_directory=str(root),external_referee_approval_claimed=False)
          marker=Path('GENERAL_THETA_FOUNDATIONS_I_V83_BUILD_AND_REVIEW.json')
          marker.write_text(json.dumps(meta,indent=2,sort_keys=True)+'\n')
          subprocess.run(['git','add','-f','--',*[str(root/n) for n in names],str(marker)],check=True)
          staged=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          if set(staged)!={str(root/n) for n in names}|{str(marker)}:
              raise RuntimeError('publication contains unintended changes')
          PY
          git commit -m 'GTF-I v83: publish three referee manuscripts and source-qualified exact reconstruction evidence'
          test "$(git rev-parse HEAD^)" = "$(cat "$RUNNER_TEMP/gtf83-NATIVE_SHA.txt")"
          git rev-parse HEAD > "$RUNNER_TEMP/gtf83-PUBLICATION_SHA.txt"
          git push --atomic origin "HEAD:refs/heads/$RESPONSE" "HEAD:refs/heads/$PUBLICATION"
      - name: Verify the exact publication head read-only
        run: |
          "$RUNNER_TEMP/gtf83-venv/bin/python" "$PAPER/build_revision.py" --verify-published > "$RUNNER_TEMP/gtf83-PUBLICATION_HEAD.json"
      - name: Preserve manuscripts, native packages and execution receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gtf-v83-publication-${{ github.run_id }}
          path: |
            ${{ env.PAPER }}/*.pdf
            ${{ env.PAPER }}/evidence/
            ${{ runner.temp }}/gtf83-*.json
            ${{ runner.temp }}/gtf83-*_SHA.txt
          if-no-files-found: warn
