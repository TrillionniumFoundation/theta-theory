name: verify-publish-round7-referee

on:
  push:
    branches:
      - revision/round7-referee-positive-closure-11paper-2026-08-31
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-publish-round7-referee
  cancel-in-progress: true

jobs:
  verify-build-publish:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Capture immutable publication inputs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          echo "PRE_MAIN=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          echo "REVISION_SOURCE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Repair audited source and gate details
        run: |
          python tools/repair_round7_sources.py
          python tools/repair_round7_gate_tokens.py

      - name: Syntax-check all round-seven tooling
        run: |
          python -m py_compile \
            tools/repair_round7_sources.py \
            tools/repair_round7_gate_tokens.py \
            tools/apply_round7_referee_fixes.py \
            tools/verify_round7_referee.py \
            tools/hostile_rereview_round7.py \
            tools/build_round7.py \
            tools/write_round7_certificate.py

      - name: Materialize all eleven controlling manuscripts
        run: python tools/apply_round7_referee_fixes.py

      - name: Run exact-source structural and hostile proof gates
        run: |
          python tools/verify_round7_referee.py
          python tools/hostile_rereview_round7.py

      - name: Install TeX and PDF inspection toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk biber poppler-utils \
            texlive-latex-base texlive-latex-extra \
            texlive-fonts-recommended texlive-bibtex-extra

      - name: Clean-build all eleven round-seven papers
        run: python tools/build_round7.py

      - name: Check final-pass references citations and PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          logs = sorted(Path('papers').glob('*/main.log'))
          if len(logs) != 11:
              raise SystemExit(f'expected 11 final main.log files, found {len(logs)}')
          pattern = re.compile(
              r'LaTeX Warning: (?:Reference|Citation).*undefined|'
              r'There were undefined references|'
              r'There were undefined citations|'
              r'Please \(re\)run Biber',
              re.IGNORECASE,
          )
          failures = []
          for log in logs:
              text = log.read_text(encoding='utf-8', errors='replace')
              lines = [line for line in text.splitlines() if pattern.search(line)]
              if lines:
                  failures.append((str(log), lines[:30]))
          if failures:
              for path, lines in failures:
                  print(f'ROUND7_FINAL_REFERENCE_FAILURE {path}')
                  for line in lines:
                      print(line)
              raise SystemExit('undefined reference/citation remains in a final-pass log')
          print('ROUND7_FINAL_LATEX_REFERENCE_PASS logs=11')
          PY
          test "$(find papers -mindepth 2 -maxdepth 2 -name main.pdf -type f -size +0c | wc -l)" -eq 11
          for pdf in papers/*/main.pdf; do
            pages="$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')"
            test -n "$pages"
            test "$pages" -ge 1
          done
          echo 'ROUND7_FINAL_PDF_PASS pdfs=11'

      - name: Re-run exact-byte and counterexample gates after build
        run: |
          python tools/verify_round7_referee.py
          python tools/hostile_rereview_round7.py

      - name: Commit verified mathematical tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name theta-theory-revision-bot
          git config user.email revision-bot@users.noreply.github.com
          git add -A
          git add -f papers/*/main.pdf
          if git diff --cached --quiet; then
            echo 'Materializer and build produced no uncommitted changes.'
          else
            git commit -m 'Materialize round-seven positive referee closure for all eleven papers [skip ci]'
          fi
          echo "MATHEMATICAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:revision/round7-referee-positive-closure-11paper-2026-08-31

      - name: Write exact-source build and publication certificate
        shell: bash
        run: |
          set -euo pipefail
          python tools/write_round7_certificate.py \
            --mathematical-sha "$MATHEMATICAL_SHA" \
            --pre-main "$PRE_MAIN" \
            --workflow-run "$GITHUB_RUN_ID"

      - name: Commit certificate and publication record
        shell: bash
        run: |
          set -euo pipefail
          git add \
            ROUND7_FINAL_CERTIFICATE.json \
            ROUND7_PUBLICATION_RECORD.json \
            ROUND7_BUILD_SUMMARY.json \
            ROUND7_REVISION_STATUS.md
          git commit -m 'Record exact round-seven verification and publication metadata [skip ci]'
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:revision/round7-referee-positive-closure-11paper-2026-08-31

      - name: Archive old main and atomically publish verified tree
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE='archive/main-pre-round7-positive-closure-2026-08-31'
          TAG='round7-positive-closure-verified-2026-08-31'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$PRE_MAIN"
          git merge-base --is-ancestor "$PRE_MAIN" HEAD

          if git ls-remote --exit-code --heads origin "refs/heads/$ARCHIVE" >/tmp/round7-archive-ref 2>/dev/null; then
            existing="$(cut -f1 /tmp/round7-archive-ref)"
            test "$existing" = "$PRE_MAIN"
          else
            git push origin "$PRE_MAIN:refs/heads/$ARCHIVE"
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo 'Round-seven publication tag already exists before publication.' >&2
            exit 1
          fi
          git tag -a "$TAG" -m 'Verified round-seven positive referee closure for eleven papers' HEAD
          git push --atomic \
            --force-with-lease="refs/heads/main:$PRE_MAIN" \
            origin \
            HEAD:refs/heads/main \
            "refs/tags/$TAG"

      - name: Verify remote main archive and tag topology
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE='archive/main-pre-round7-positive-closure-2026-08-31'
          TAG='round7-positive-closure-verified-2026-08-31'
          git fetch origin \
            main \
            "$ARCHIVE" \
            "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse origin/main)" = "$FINAL_SHA"
          test "$(git rev-parse "origin/$ARCHIVE")" = "$PRE_MAIN"
          test "$(git rev-list -n1 "$TAG")" = "$FINAL_SHA"
          git diff --exit-code "$MATHEMATICAL_SHA" "$FINAL_SHA" -- \
            papers \
            revision/round7-referee-final \
            tools/repair_round7_sources.py \
            tools/repair_round7_gate_tokens.py \
            tools/apply_round7_referee_fixes.py \
            tools/verify_round7_referee.py \
            tools/hostile_rereview_round7.py
          echo "ROUND7_REMOTE_PUBLICATION_PASS main=$FINAL_SHA archive=$PRE_MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: theta-theory-round7-verified-papers-and-audit
          path: |
            papers/*/main.pdf
            ROUND7_FINAL_CERTIFICATE.json
            ROUND7_PUBLICATION_RECORD.json
            ROUND7_REVISION_STATUS.md
            ROUND7_STRUCTURAL_VERIFICATION.json
            ROUND7_HOSTILE_REREVIEW.json
            ROUND7_INTERNAL_HARSH_REREVIEW.md
            ROUND7_HISTORICAL_DERIVATION_AUDIT.md
            ROUND7_PROOF_DEPENDENCY_LEDGER.md
            REFEREE_ROUND7_RESPONSE.md
          if-no-files-found: error
