name: General Theta R64 source-bound native verification
on:
  push:
    branches:
      - revision/general-theta-r64-primal-dual-risk-20261015
    paths:
      - papers/General-Theta-Foundations-I-restart/r64-primal-dual-risk/**
      - papers/General-Theta-Foundations-I-restart/r64-primal-dual-risk-publication/**
      - .github/workflows/general-theta-r64-primal-dual-risk.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout the exact source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: papers/General-Theta-Foundations-I-restart/r64-primal-dual-risk
      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-venv texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern poppler-utils
          python3 -m venv "$RUNNER_TEMP/r64-env"
          "$RUNNER_TEMP/r64-env/bin/python" -m pip install -r papers/General-Theta-Foundations-I-restart/r64-primal-dual-risk/requirements.txt
      - name: Verify source, exact diagnostics and all native documents
        shell: bash
        run: |
          set -euo pipefail
          P=papers/General-Theta-Foundations-I-restart/r64-primal-dual-risk
          mkdir -p "$RUNNER_TEMP/r64-result"
          "$RUNNER_TEMP/r64-env/bin/python" "$P/verify.py" --out "$RUNNER_TEMP/r64-result" --source-commit "$GITHUB_SHA"
          cp -a "$P" "$RUNNER_TEMP/r64-result/source"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/r64-result/SOURCE_COMMIT.txt"
      - name: Upload source-bound documents and verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: general-theta-r64-independent-${{ github.sha }}
          path: ${{ runner.temp }}/r64-result
          if-no-files-found: warn
          retention-days: 90
