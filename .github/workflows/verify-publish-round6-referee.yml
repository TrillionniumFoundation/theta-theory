name: verify-publish-round6-referee

on:
  push:
    branches:
      - revision/round6-referee-positive-closure-11paper-2026-08-31
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-publish-round6-referee
  cancel-in-progress: true

jobs:
  verify-build-publish:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Capture immutable publication inputs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          echo "PRE_MAIN=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          echo "REVISION_SOURCE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Repair materializer and verifier semantics
        run: |
          python tools/repair_round6_materializer.py
          python tools/repair_round6_verifier.py
          python tools/repair_round6_hostile.py

      - name: Syntax-check all round-six tooling
        run: |
          python -m py_compile \
            tools/repair_round6_materializer.py \
            tools/repair_round6_verifier.py \
            tools/repair_round6_hostile.py \
            tools/repair_round6_source_controls.py \
            tools/apply_round6_referee_fixes.py \
            tools/verify_round6_referee.py \
            tools/hostile_rereview_round6.py \
            tools/write_round6_certificate.py \
            tools/build_round3.py

      - name: Repair JSON-escaped TeX command prefixes
        run: python tools/repair_round6_source_controls.py

      - name: Materialize all eleven controlling manuscripts
        run: python tools/apply_round6_referee_fixes.py

      - name: Run source identity structural and hostile proof gates
        run: |
          python tools/verify_round6_referee.py
          python tools/hostile_rereview_round6.py

      - name: Install TeX and PDF inspection toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk biber poppler-utils \
            texlive-latex-base texlive-latex-extra \
            texlive-fonts-recommended texlive-bibtex-extra

      - name: Clean-build all eleven round-six papers
        run: python tools/build_round3.py

      - name: Check final-pass references citations and PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          logs = sorted(Path('papers').glob('*/main.log'))
          if len(logs) != 11:
              raise SystemExit(f'expected 11 final main.log files, found {len(logs)}')

          pattern = re.compile(
              r'LaTeX Warning: (?:Reference|Citation).*undefined|'
              r'There were undefined references|'
              r'There were undefined citations|'
              r'Please \(re\)run Biber',
              re.IGNORECASE,
          )
          failures = []
          for log in logs:
              text = log.read_text(encoding='utf-8', errors='replace')
              matches = sorted(set(pattern.findall(text)))
              if pattern.search(text):
                  lines = [line for line in text.splitlines() if pattern.search(line)]
                  failures.append((str(log), lines[:20]))
          if failures:
              for path, lines in failures:
                  print(f'FINAL_LATEX_REFERENCE_FAILURE {path}')
                  for line in lines:
                      print(line)
              raise SystemExit('undefined reference/citation remains in a final-pass LaTeX log')
          print('ROUND6_FINAL_LATEX_REFERENCE_PASS logs=11')
          PY
          test "$(find papers -mindepth 2 -maxdepth 2 -name main.pdf -type f -size +0c | wc -l)" -eq 11
          for pdf in papers/*/main.pdf; do
            pages="$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')"
            test -n "$pages"
            test "$pages" -ge 1
          done
          echo 'ROUND6_FINAL_PDF_PASS pdfs=11'

      - name: Re-run exact-byte and counterexample-aware gates after build
        run: |
          python tools/verify_round6_referee.py
          python tools/hostile_rereview_round6.py

      - name: Commit verified mathematical tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name theta-theory-revision-bot
          git config user.email revision-bot@users.noreply.github.com
          git add -A
          git add -f papers/*/main.pdf
          if git diff --cached --quiet; then
            echo 'Materializer and build produced no uncommitted changes.'
          else
            git commit -m 'Materialize round-six positive referee closure for all eleven papers [skip ci]'
          fi
          echo "MATHEMATICAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:revision/round6-referee-positive-closure-11paper-2026-08-31

      - name: Write exact-source build and publication certificate
        shell: bash
        run: |
          set -euo pipefail
          python tools/write_round6_certificate.py \
            --mathematical-sha "$MATHEMATICAL_SHA" \
            --pre-main "$PRE_MAIN" \
            --workflow-run "$GITHUB_RUN_ID"

      - name: Commit certificate and publication record
        shell: bash
        run: |
          set -euo pipefail
          git add \
            ROUND6_FINAL_CERTIFICATE.json \
            ROUND6_PUBLICATION_RECORD.json \
            ROUND6_BUILD_SUMMARY.json \
            ROUND6_REVISION_STATUS.md
          git commit -m 'Record exact round-six verification and publication metadata [skip ci]'
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:revision/round6-referee-positive-closure-11paper-2026-08-31

      - name: Archive old main and atomically publish verified tree
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE='archive/main-pre-round6-positive-closure-2026-08-31'
          TAG='round6-positive-closure-verified-2026-08-31'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$PRE_MAIN"
          git merge-base --is-ancestor "$PRE_MAIN" HEAD

          if git ls-remote --exit-code --heads origin "refs/heads/$ARCHIVE" >/tmp/round6-archive-ref 2>/dev/null; then
            existing="$(cut -f1 /tmp/round6-archive-ref)"
            test "$existing" = "$PRE_MAIN"
          else
            git push origin "$PRE_MAIN:refs/heads/$ARCHIVE"
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Publication tag already exists before publication." >&2
            exit 1
          fi
          git tag -a "$TAG" -m "Verified round-six positive referee closure for eleven papers" HEAD
          git push --atomic \
            --force-with-lease="refs/heads/main:$PRE_MAIN" \
            origin \
            HEAD:refs/heads/main \
            "refs/tags/$TAG"

      - name: Verify remote main archive and tag topology
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE='archive/main-pre-round6-positive-closure-2026-08-31'
          TAG='round6-positive-closure-verified-2026-08-31'
          git fetch origin \
            main \
            "$ARCHIVE" \
            "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse origin/main)" = "$FINAL_SHA"
          test "$(git rev-parse "origin/$ARCHIVE")" = "$PRE_MAIN"
          test "$(git rev-list -n1 "$TAG")" = "$FINAL_SHA"
          git diff --exit-code "$MATHEMATICAL_SHA" "$FINAL_SHA" -- \
            papers \
            revision/round6-referee-final \
            tools/repair_round6_materializer.py \
            tools/repair_round6_verifier.py \
            tools/repair_round6_hostile.py \
            tools/repair_round6_source_controls.py \
            tools/apply_round6_referee_fixes.py \
            tools/verify_round6_referee.py \
            tools/hostile_rereview_round6.py
          echo "ROUND6_REMOTE_PUBLICATION_PASS main=$FINAL_SHA archive=$PRE_MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: theta-theory-round6-verified-papers-and-audit
          path: |
            papers/*/main.pdf
            ROUND6_FINAL_CERTIFICATE.json
            ROUND6_PUBLICATION_RECORD.json
            ROUND6_REVISION_STATUS.md
            ROUND6_STRUCTURAL_VERIFICATION.json
            ROUND6_HOSTILE_REREVIEW.json
            ROUND6_INTERNAL_HARSH_REREVIEW.md
            ROUND6_HISTORICAL_DERIVATION_AUDIT.md
            REFEREE_ROUND6_RESPONSE.md
          if-no-files-found: error
