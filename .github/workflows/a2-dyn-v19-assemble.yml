name: A2-DYN v19 one-time exact source transport
on:
  push:
    branches: [revision/a2-dyn-v19-referee-response-2026-10-06]
    paths:
      - .github/a2-dyn-v19-transport/**
      - .github/workflows/a2-dyn-v19-assemble.yml
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact source and create immutable objects only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/a2-dyn-v19-transport/assemble.py
      - uses: actions/upload-artifact@v4
        with:
          name: a2-dyn-v19-assembly-${{ github.sha }}
          path: assembly-receipt.json
          if-no-files-found: error
          retention-days: 90
