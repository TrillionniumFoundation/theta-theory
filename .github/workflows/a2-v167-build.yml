name: A2 v167 complete revision publication
on:
  push:
    branches: [revision/a2-v167-determinantal-hilbert-states-2026-09-26]
    paths:
      - .github/workflows/a2-v167-build.yml
      - papers/A2-v17-boundary-information-coarsening/article/v167/source-part-*.b64
      - papers/A2-v17-boundary-information-coarsening/article/v167/*.py
      - papers/A2-v17-boundary-information-coarsening/article/v167/*-v167.tex
permissions:
  contents: write
concurrency:
  group: a2-v167-complete-publication
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Validate isolated branch and materialize authored sources
        run: |
          test "$GITHUB_REF_NAME" = revision/a2-v167-determinantal-hilbert-states-2026-09-26
          python3 - <<'PY'
          from pathlib import Path
          import ast, base64, hashlib, json, lzma
          p=Path('papers/A2-v17-boundary-information-coarsening/article/v167')
          encoded=''.join((p/f'source-part-{i:02d}.b64').read_text().strip() for i in range(5))
          data=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(data).hexdigest()=='21f5a775029e7a5a7580909cb394b24c53b0d6aa3e37dd0e67eb862b5d675d97','Source payload checksum mismatch'
          bundle=json.loads(lzma.decompress(data))
          assert bundle['revision']==167 and len(bundle['source_files'])==12
          for name,text in bundle['source_files'].items():
              assert Path(name).name==name and Path(name).suffix in ('.py','.tex','.md')
              assert hashlib.sha256(text.encode()).hexdigest()==bundle['sha256'][name]
              if name.endswith('.py'): ast.parse(text,filename=name)
              (p/name).write_text(text)
          (p/'AUTHORED_SOURCE_HASHES_V167.json').write_text(json.dumps(bundle['sha256'],indent=2)+'\n')
          print('Twelve authored source files validated and materialized on the isolated revision branch.')
          PY
      - name: Install LaTeX and exact algebra tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils python3-venv
          python3 -m venv /tmp/a2-v167-env
          /tmp/a2-v167-env/bin/pip install 'sympy==1.14.0'
      - name: Rerun all inherited checks and new exact Hilbert-state checks
        run: |
          /tmp/a2-v167-env/bin/python papers/A2-v17-boundary-information-coarsening/article/v167/check_v167.py
      - name: Compile all complete manuscripts and validate report and proof preservation
        run: |
          /tmp/a2-v167-env/bin/python papers/A2-v17-boundary-information-coarsening/article/v167/assemble_v167.py --build
      - name: Record actual build environment
        if: always()
        run: |
          p=papers/A2-v17-boundary-information-coarsening/article/v167
          { python3 --version; /tmp/a2-v167-env/bin/python -c 'import sympy; print("SymPy",sympy.__version__)'; pdflatex --version | head -2; echo "Source $GITHUB_SHA"; echo "Run $GITHUB_RUN_ID"; } > "$p/BUILD_ENVIRONMENT.txt"
      - name: Archive complete review build
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a2-v167-complete-review-build
          path: papers/A2-v17-boundary-information-coarsening/article/v167
          retention-days: 30
          if-no-files-found: error
      - name: Publish complete sources and PDFs to the new revision branch only
        env:
          GH_PUBLICATION_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = revision/a2-v167-determinantal-hilbert-states-2026-09-26
          p=papers/A2-v17-boundary-information-coarsening/article/v167
          auth=$(printf 'x-access-token:%s' "$GH_PUBLICATION_TOKEN" | base64 -w0)
          head=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          test "$head" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$p"/*.tex "$p"/*.pdf "$p"/*.py "$p"/*.json "$p"/*.md "$p"/BUILD_ENVIRONMENT.txt "$p"/render-audit/*.png CURRENT_REVIEW_ENTRY.md A2_REVISION_V167_INDEX.md README.md
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,subprocess
          p=Path('papers/A2-v17-boundary-information-coarsening/article/v167')
          r=json.loads((p/'BUILD_RECEIPT_V167.json').read_text())
          c=json.loads((p/'EXACT_CHECKS_V167.json').read_text())
          assert r['compiled'] and r['controlling_report_bytes_validated']
          assert r['all_predecessor_math_blocks_retained_byte_for_byte'] and r['body_partitioned_exactly_once']
          assert r['predecessor_math_blocks']==390 and r['predecessor_labels']==585
          assert not r['missing_labels'] and not r['duplicate_labels']
          assert c['all_checks_pass'] and c['inherited_v166_full_chain_rerun']
          for name,value in r['outputs'].items():
              assert value['clean_references_and_no_overfull_hboxes']
              assert hashlib.sha256((p/(name+'.pdf')).read_bytes()).hexdigest()==value['pdf_sha256']
              assert hashlib.sha256((p/(name+'.tex')).read_bytes()).hexdigest()==value['tex_sha256']
          changed=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          allowed={'CURRENT_REVIEW_ENTRY.md','A2_REVISION_V167_INDEX.md','README.md'}
          assert changed and all(x.startswith(str(p)+'/') or x in allowed for x in changed),changed
          assert not subprocess.check_output(['git','diff','--cached','--name-only','--diff-filter=D'],text=True).strip()
          for name in ('reconstruction','divisor-geometry','geometry'):
              assert str(p/(name+'.pdf')) in changed and str(p/(name+'.tex')) in changed
          print('Complete standalone manuscripts, inherited checks, all predecessor proofs and isolated publication paths verified.')
          PY
          git commit -m 'A2 v167: publish complete revised manuscripts, PDFs, 62-point response and preservation receipts [skip ci]'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
