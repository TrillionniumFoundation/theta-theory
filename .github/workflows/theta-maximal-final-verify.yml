name: theta-maximal-final-verify

on:
  push:
    branches:
      - theta-maximal-strengthening-closure-2026-08-28
    paths:
      - 'canonical/THETA_MAXIMAL_FINAL_STATUS*.md'
      - 'papers/theta-program/maximal-strengthening/**'
      - 'papers/theta-program/five-paper-series/paper-*/FINAL_ADDENDUM_*.md'
      - 'papers/theta-program/five-paper-series/paper-*/TECHNICAL_NOTE_*.md'
      - 'tools/verify_theta_maximal_final_*.py'
      - '.github/workflows/theta-maximal-final-verify.yml'
  pull_request:
    paths:
      - 'canonical/THETA_MAXIMAL_FINAL_STATUS*.md'
      - 'papers/theta-program/maximal-strengthening/**'
      - 'papers/theta-program/five-paper-series/paper-*/FINAL_ADDENDUM_*.md'
      - 'papers/theta-program/five-paper-series/paper-*/TECHNICAL_NOTE_*.md'
      - 'tools/verify_theta_maximal_final_*.py'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m py_compile tools/verify_theta_maximal_final_closure.py tools/verify_theta_maximal_final_series.py
      - run: python3 tools/verify_theta_maximal_final_closure.py
      - run: python3 tools/verify_theta_maximal_final_series.py
      - run: git diff --check
