name: GTF-I v26 controlled memory foundations

on:
  push:
    branches:
      - revision/general-theta-foundations-i-v26-controlled-memory-foundations-2026-09-24
    paths:
      - 'papers/GTF-I-v26-controlled-memory-foundations/**'
      - '.github/workflows/gtf-i-v26-controlled-memory-foundations.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gtf-i-v26-controlled-memory-foundations
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/revision/general-theta-foundations-i-v26-controlled-memory-foundations-2026-09-24'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
          sparse-checkout: |
            papers/GTF-I-v26-controlled-memory-foundations
            papers/GTF-I-v25-controlled-minimax
            papers/GTF-I-v24-structural-resources
            reviews/general-theta-foundations-i-v25-external-harsh-top4-r9-2026-09-24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore hash-checked native manuscript source
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,lzma,runpy,shutil
          from pathlib import Path
          h=Path('papers/GTF-I-v26-controlled-memory-foundations')
          old=h.parent/'GTF-I-v25-controlled-minimax'
          parts=[h/'.source-parts'/('part%02d.xz'%i) for i in range(6)]
          raw=b''.join(p.read_bytes() for p in parts)
          if hashlib.sha256(raw).hexdigest()!='d4884d48ab63c211cec65c127ea70200910818d563c388983e6a33d976a5e957':
              raise RuntimeError('Source transport checksum mismatch')
          if len(raw)!=40704: raise RuntimeError('Source transport size mismatch')
          payload=json.loads(lzma.decompress(raw))
          if not isinstance(payload,dict) or len(payload)!=17: raise RuntimeError('Source manifest mismatch')
          for name,text in payload.items():
              p=Path(name)
              if p.name!=name or p.suffix not in {'.tex','.py','.md','.json'} or not isinstance(text,str):
                  raise RuntimeError('Unsafe source entry')
              dest=h/name
              if dest.exists() and dest.read_text()!=text:
                  raise RuntimeError('Refusing to replace modified native source: '+name)
              dest.write_text(text)
          for name in ['controlled-dual.tex','marked-minimax.tex','physical-bridge.tex','physical-improvement.tex','joint-revelation.tex']:
              dest=h/name
              if dest.exists() and dest.read_bytes()!=(old/name).read_bytes():
                  raise RuntimeError('Inherited module changed: '+name)
              shutil.copy2(old/name,dest)
          runpy.run_path(str(h/'assemble.py'))
          print('Verified transport; restored 17 native files, five inherited modules and assembled canonical main.tex.')
          PY
      - name: Publish native source before executing the build
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --depth=1 origin 568301ff5d8991af9a99a478371c1c4993d0bcd1
          test -z "$(git diff --name-only --diff-filter=DMRT 568301ff5d8991af9a99a478371c1c4993d0bcd1)"
          git add -f papers/GTF-I-v26-controlled-memory-foundations
          if ! git diff --cached --quiet; then
            git commit -m 'revise(GTF-I v26): exact continuous U2 saddle, finite-memory informative control and restored causal foundations [skip ci]'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
          echo "GTF_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install typesetting and exact arithmetic
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended texlive-pictures lmodern
          python -m pip install sympy==1.14.0 PyMuPDF==1.26.7
      - name: Execute exact checks, negative controls and complete publication
        run: python papers/GTF-I-v26-controlled-memory-foundations/build.py
      - name: Publish only the new revision package and ready branch
        shell: bash
        run: |
          git add -f papers/GTF-I-v26-controlled-memory-foundations GENERAL_THETA_FOUNDATIONS_I_V26_REVIEW_READY.md
          git commit -m 'publish(GTF-I v26): complete English article, referee response, preserved volumes and source-bound evidence [skip ci]'
          test -z "$(git diff --name-only --diff-filter=DMRT 568301ff5d8991af9a99a478371c1c4993d0bcd1 HEAD)"
          READY='revision/general-theta-foundations-i-v26-referee-ready-2026-09-24'
          if git ls-remote --exit-code --heads origin "$READY"; then
            git fetch origin "$READY"
            git merge-base --is-ancestor FETCH_HEAD HEAD
          fi
          git push origin HEAD:"$GITHUB_REF_NAME" HEAD:"$READY"
      - name: Upload referee package
        uses: actions/upload-artifact@v4
        with:
          name: GTF-I-v26-controlled-memory-foundations
          path: papers/GTF-I-v26-controlled-memory-foundations/
          retention-days: 30
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GTF-I-v26-diagnostics
          path: |
            papers/GTF-I-v26-controlled-memory-foundations/evidence/
            papers/GTF-I-v26-controlled-memory-foundations/*.tex
            papers/GTF-I-v26-controlled-memory-foundations/*.py
          retention-days: 7
