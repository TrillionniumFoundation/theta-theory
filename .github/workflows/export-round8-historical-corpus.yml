name: export-round8-historical-corpus

on:
  push:
    branches:
      - revision/round8-referee-positive-closure-11paper-2026-08-31
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Archive canonical CM2 and selected historical proof branches
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz \
            --output=/tmp/cm2-v83-canonical-all-chat.tar.gz \
            origin/cm2-v83-canonical-all-chat
          git archive --format=tar.gz \
            --output=/tmp/theta-dependency-closure.tar.gz \
            origin/theta-dependency-closure-2026-08-28
          sha256sum \
            /tmp/cm2-v83-canonical-all-chat.tar.gz \
            /tmp/theta-dependency-closure.tar.gz \
            > /tmp/round8-historical-corpus.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: theta-theory-round8-historical-corpus
          path: |
            /tmp/cm2-v83-canonical-all-chat.tar.gz
            /tmp/theta-dependency-closure.tar.gz
            /tmp/round8-historical-corpus.sha256
          if-no-files-found: error
