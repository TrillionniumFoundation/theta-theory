name: A2-DYN v24 targeted typography qualification
on:
  push:
    branches: [revision/a2-dyn-v24-referee-response-2026-10-06]
    paths:
      - .github/a2-dyn-v24-layout.py
      - .github/workflows/a2-dyn-v24-layout.yml
permissions:
  contents: write
jobs:
  typography:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install complete qualification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra lmodern python3-numpy python3-mpmath python3-sympy
      - name: Apply two exact layout edits, build, and create immutable source objects
        env:
          GH_TOKEN: ${{ github.token }}
          TZ: UTC
        run: python3 .github/a2-dyn-v24-layout.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a2-dyn-v24-layout-${{ github.sha }}
          if-no-files-found: error
          path: |
            v24-layout-receipt.json
            papers/A2-DYN-v24-referee-response/build/main.pdf
            papers/A2-DYN-v24-referee-response/build/main.log
            papers/A2-DYN-v24-referee-response/build/pass*.txt
