name: A2 v140 source audit
on:
  push:
    branches: ['revision/a2-v140-intrinsic-pencil-moduli-2026-09-23']
    paths: ['.github/workflows/a2-v140-source-audit.yml']
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export exact predecessor sources and transport
        run: |
          mkdir -p /tmp/a2-audit
          git rev-parse HEAD > /tmp/a2-audit/SOURCE_HEAD.txt
          git log -8 --oneline > /tmp/a2-audit/RECENT_COMMITS.txt
          git ls-tree -r --name-only HEAD papers/A2-v17-boundary-information-coarsening/article/v138 papers/A2-v17-boundary-information-coarsening/article/v139 revisions/a2-v138 revisions/a2-v139 reviews/a2-v137-independent-harsh-top4-2026-09-23 > /tmp/a2-audit/SOURCE_FILES.txt
          tar czf /tmp/a2-audit/sources.tar.gz -T /tmp/a2-audit/SOURCE_FILES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: a2-v140-pinned-predecessor-sources
          path: /tmp/a2-audit/
          retention-days: 14
