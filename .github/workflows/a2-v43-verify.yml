name: A2 v43 exact-source article and companion qualification
on:
  push:
    branches: ['revision/a2-v43-*', 'review/a2-v43-*']
    paths: ['papers/A2-v43-journal-package/**', '.github/workflows/a2-v43-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Exact source checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: |
            papers/A2-v43-journal-package
            papers/A2-v42-proof-completion
            papers/A2-v41-referee-response
            papers/A2-v40-joint-response
            .github/workflows
      - name: Capture committed sources before environment installation
        working-directory: papers/A2-v43-journal-package
        run: /usr/bin/python3 tools/qualify_v43.py --expected-head "$GITHUB_SHA" --capture-source
      - name: Install document environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended lmodern latexmk poppler-utils
      - name: Qualify the exact commit, proofs retained, finite diagnostics and both PDFs
        working-directory: papers/A2-v43-journal-package
        run: /usr/bin/python3 tools/qualify_v43.py --expected-head "$GITHUB_SHA"
      - name: Archive source-bound evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: A2-v43-${{ github.sha }}-${{ github.run_attempt }}
          path: papers/A2-v43-journal-package/verification/v43/
          if-no-files-found: error
          retention-days: 30
