name: GTF-I v33 compatible lifts and quantitative width

on:
  push:
    branches:
      - revision/general-theta-foundations-i-v33-compatible-lifts-2026-09-25
    paths:
      - 'papers/GTF-I-v33-compatible-lifts/**'
      - '.github/workflows/gtf-i-v33-compatible-lifts.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gtf-i-v33-compatible-lifts
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/revision/general-theta-foundations-i-v33-compatible-lifts-2026-09-25'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
          sparse-checkout: |
            papers/GTF-I-v33-compatible-lifts
            papers/GTF-I-v32-causal-width
            papers/GTF-I-v31-compatible-memory
            papers/GTF-I-v30-streaming-geometry
            papers/GTF-I-v29-intrinsic-continuation
            papers/GTF-I-v28-causal-response
            papers/GTF-I-v27-resource-saddle
            papers/GTF-I-v26-controlled-memory-foundations
            papers/GTF-I-v25-controlled-minimax
            papers/GTF-I-v24-structural-resources
            reviews/general-theta-foundations-i-v32-causal-width-pipeline-harsh-top4-r17-2026-09-25
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore and verify native mathematical sources
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,lzma
          from pathlib import Path
          h=Path('papers/GTF-I-v33-compatible-lifts')
          raw=b''.join((h/'.source-parts'/('part%02d.xz'%i)).read_bytes() for i in range(6))
          if len(raw)!=34612 or hashlib.sha256(raw).hexdigest()!='90cfeff73fb1574e7142ea8cb5339370efa0f5d4f4be642483de60fbc15c9b1d':
              raise RuntimeError('Source transport checksum mismatch')
          payload=json.loads(lzma.decompress(raw))
          if not isinstance(payload,dict) or len(payload)!=20:
              raise RuntimeError('Native source manifest mismatch')
          for name,text in payload.items():
              p=Path(name)
              if p.name!=name or p.suffix not in {'.tex','.py','.md','.json'} or not isinstance(text,str):
                  raise RuntimeError('Unsafe source entry')
              dest=h/name
              if dest.exists() and dest.read_text()!=text:
                  raise RuntimeError('Refusing to replace changed native source: '+name)
              dest.write_text(text)
          print('Restored and hash-verified twenty native source files.')
          PY
      - name: Publish native source before building
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --depth=1 origin eaa2661530ed473f8b79407eba7a1182c8e0a450
          test -z "$(git diff --name-only --diff-filter=DMRT eaa2661530ed473f8b79407eba7a1182c8e0a450)"
          git add -f papers/GTF-I-v33-compatible-lifts
          if ! git diff --cached --quiet; then
            git commit -m 'revise(GTF-I v33): compatible stochastic lifts, mean-support budgets, resonant synthesis and autonomous comparison [skip ci]'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
          echo "GTF_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install typesetting and exact arithmetic
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended lmodern
          python -m pip install sympy==1.14.0 PyMuPDF==1.26.7
      - name: Verify and build the complete revision
        run: python papers/GTF-I-v33-compatible-lifts/build.py
      - name: Verify the standalone core source package
        run: |
          python - <<'PY'
          import json,subprocess,sys,tempfile,zipfile
          from pathlib import Path
          h=Path('papers/GTF-I-v33-compatible-lifts')
          with tempfile.TemporaryDirectory() as td:
              zipfile.ZipFile(h/'evidence/CORE_SOURCES.zip').extractall(td)
              p=Path(td)/h.name
              subprocess.run([sys.executable,str(p/'build.py'),'--core-only'],check=True)
              r=json.loads((p/'evidence/BUILD_RECEIPT.json').read_text())
              if not r['core_only'] or not r['normal_optimized_agreement']:
                  raise RuntimeError('Standalone core verification failed')
          print('Standalone core build and checks passed without archival inputs.')
          PY
      - name: Publish only the new revision and referee-ready branch
        shell: bash
        run: |
          git add -f papers/GTF-I-v33-compatible-lifts GENERAL_THETA_FOUNDATIONS_I_V33_REVIEW_READY.md
          git commit -m 'publish(GTF-I v33): article, referee response, reproducible core and preserved archives [skip ci]'
          test -z "$(git diff --name-only --diff-filter=DMRT eaa2661530ed473f8b79407eba7a1182c8e0a450 HEAD)"
          READY='revision/general-theta-foundations-i-v33-referee-ready-2026-09-25'
          if git ls-remote --exit-code --heads origin "$READY"; then
            git fetch origin "$READY"
            git merge-base --is-ancestor FETCH_HEAD HEAD
          fi
          git push origin HEAD:"$GITHUB_REF_NAME" HEAD:"$READY"
      - name: Upload referee artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GTF-I-v33-compatible-lifts
          path: papers/GTF-I-v33-compatible-lifts/
          retention-days: 30
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GTF-I-v33-diagnostics
          path: |
            papers/GTF-I-v33-compatible-lifts/evidence/
            papers/GTF-I-v33-compatible-lifts/*.tex
            papers/GTF-I-v33-compatible-lifts/*.py
          retention-days: 7
