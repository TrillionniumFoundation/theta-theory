name: Verify Round 31 referee closure

on:
  push:
    branches:
      - revision/round31-referee-positive-closure-11paper-2026-09-03
    paths:
      - 'papers/**/ROUND31_POSITIVE_CLOSURE.tex'
      - 'papers/**/ROUND31_REVISION.tex'
      - 'papers/**/main.tex'
      - 'ROUND31_*'
      - 'AUTHOR_RESPONSE_ROUND30.md'
      - 'tools/verify_round31.py'
      - 'tools/finalize_round31_once.py'
      - '.round31-finalized'
      - '.github/workflows/verify-round31-referee-closure.yml'
  pull_request:
    paths:
      - 'papers/**/ROUND31_POSITIVE_CLOSURE.tex'
      - 'papers/**/ROUND31_REVISION.tex'
      - 'papers/**/main.tex'
      - 'ROUND31_*'
      - 'AUTHOR_RESPONSE_ROUND30.md'
      - 'tools/verify_round31.py'
      - 'tools/finalize_round31_once.py'
      - '.round31-finalized'
      - '.github/workflows/verify-round31-referee-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-regressions-build-and-render:
    if: github.event_name != 'pull_request' || github.head_ref == 'revision/round31-referee-positive-closure-11paper-2026-09-03'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Require finalized committed source
        run: |
          python3 tools/finalize_round31_once.py
          git diff --exit-code
      - name: Install TeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - name: Verify active source graph and rebuild all manuscripts
        env:
          TERM: xterm
        run: python3 tools/verify_round31.py --build
      - name: Show verification and page inventory
        run: |
          cat ROUND31_CI_VERIFICATION.json
          pdfinfo ROUND31_REVISION_DOSSIER.pdf | grep '^Pages:'
          find papers -name 'ROUND31_REVISION.pdf' -print -exec pdfinfo {} \; \
            | grep -E 'ROUND31_REVISION.pdf|^Pages:'
      - name: Upload next-review manuscripts and verification record
        uses: actions/upload-artifact@v4
        with:
          name: theta-round31-next-review-manuscripts
          if-no-files-found: error
          path: |
            ROUND31_REVISION_DOSSIER.pdf
            papers/*/ROUND31_REVISION.pdf
            papers/*/main.pdf
            ROUND31_CI_VERIFICATION.json
