name: external-review-v8
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install sympy
      - run: python tools/verify_v8.py
      - run: python tools/verify_v8_deep.py
      - name: Install TeX
        run: sudo apt-get update && sudo apt-get install -y latexmk biber texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra
      - run: make -C papers all
