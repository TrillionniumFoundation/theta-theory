name: A2-DYN v15 one-time exact-source assembly
on:
  push:
    branches:
      - revision/a2-dyn-v15-referee-response-2026-10-06
    paths:
      - .github/a2-dyn-v15-assembly/**
      - .github/workflows/a2-dyn-v15-assemble.yml
permissions:
  contents: write
jobs:
  assemble:
    if: contains(github.event.head_commit.message, '[assemble-v15]')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Replay exact source and create Git objects only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/a2-dyn-v15-assembly/assemble.py
      - name: Upload exact assembly receipt
        uses: actions/upload-artifact@v4
        with:
          name: a2-dyn-v15-assembly-${{ github.sha }}
          path: .v15-assembly/assembly-receipt.json
          if-no-files-found: error
          retention-days: 90
