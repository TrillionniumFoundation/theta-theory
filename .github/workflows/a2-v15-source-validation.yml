name: A2 v15 source validation
on:
  push:
    branches:
      - revision/a2-v15-intrinsic-scalar-transport-2026-09-11
    paths:
      - .github/workflows/a2-v15-source-validation.yml
      - papers/A2-v15-intrinsic-scalar-transport/**
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Export pinned source for local proof and compilation audit
        run: |
          mkdir -p audit-export
          git rev-parse HEAD > audit-export/SNAPSHOT_COMMIT.txt
          cp -a papers/A2-v14-intrinsic-boundary-normal-form audit-export/
          cp -a reviews/a2-v14-independent-harsh-intrinsic-density-2026-09-11 audit-export/
          cp -a reviews/a2-v13-independent-harsh-normal-form-2026-09-10 audit-export/
          if [ -d papers/A2-v15-intrinsic-scalar-transport ]; then
            cp -a papers/A2-v15-intrinsic-scalar-transport audit-export/
          fi
      - name: Check revision retention when native revision is present
        run: |
          if [ -f papers/A2-v15-intrinsic-scalar-transport/tools/verify_v15.py ]; then
            python3 papers/A2-v15-intrinsic-scalar-transport/tools/verify_v15.py --output audit-export/v15.normal.json
            python3 -O papers/A2-v15-intrinsic-scalar-transport/tools/verify_v15.py --output audit-export/v15.optimized.json
            cmp audit-export/v15.normal.json audit-export/v15.optimized.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: a2-v15-audit-source-${{ github.sha }}
          path: audit-export/
          retention-days: 14
          if-no-files-found: error
