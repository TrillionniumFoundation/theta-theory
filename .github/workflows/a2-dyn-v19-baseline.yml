name: A2-DYN v19 frozen baseline archive
on:
  push:
    branches: [revision/a2-dyn-v19-referee-response-2026-10-06]
    paths: [.github/workflows/a2-dyn-v19-baseline.yml]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Freeze source and historical derivations
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p /tmp/a2-baseline
          git archive --format=tar HEAD papers/A2-DYN-v16-referee-response papers/A2-DYN-v17-referee-response papers/A2-DYN-v18-referee-response reviews/a2-dyn-v16-external-top4-review-2026-10-06 > /tmp/a2-baseline/source.tar
          git rev-parse HEAD > /tmp/a2-baseline/commit.txt
          sha256sum /tmp/a2-baseline/source.tar > /tmp/a2-baseline/source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: a2-dyn-v19-baseline-${{ github.sha }}
          path: /tmp/a2-baseline/*
          retention-days: 90
          if-no-files-found: error
