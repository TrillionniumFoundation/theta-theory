# Finalizer source revision: 531a8626a079731fb901276e4366ca7f9e6f7b53
name: Trusted Round 43 materialization on desktop

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trusted-round43-materialization
  cancel-in-progress: false

jobs:
  materialize-round43:
    name: Materialize Round 43 on trusted desktop
    runs-on:
      - self-hosted
      - linux
      - x64
    timeout-minutes: 45
    env:
      REVISION_BRANCH: revision/round43-referee-positive-closure-gpt56pro-2026-09-04
    steps:
      - name: Check out the revision branch
        uses: actions/checkout@v4
        with:
          ref: revision/round43-referee-positive-closure-gpt56pro-2026-09-04
          fetch-depth: 1
          clean: true

      - name: Materialize and freeze the ordinary Round 43 source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = desktop
          python3 tools/finalize_round43.py

      - name: Verify inherited Round 41 object before retiring legacy writers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests/test_round41.py

      - name: Remove staging payload and every source-writing workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .round43_payload
          python3 - <<'PY'
          from pathlib import Path

          keep = {'verify-round43.yml'}
          for path in Path('.github/workflows').glob('*'):
              if path.name in keep or not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              if 'contents: write' in text or 'git push' in text or 'materialize' in path.name or 'finalize' in path.name:
                  path.unlink()
                  print(f'removed source-writing workflow: {path}')
          PY

      - name: Ensure TeX dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdflatex >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern
          fi

      - name: Run Round 43 source and algebra tests on the frozen object
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests/test_round43.py

      - name: Build the exact materialized manuscript twice
        shell: bash
        run: |
          set -euo pipefail
          pdflatex -interaction=nonstopmode -halt-on-error ROUND43_REVISION.tex
          pdflatex -interaction=nonstopmode -halt-on-error ROUND43_REVISION.tex

      - name: Refresh manifest and write verification record
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_round43.py --refresh-manifest --check-manifest --check-build --json ROUND43_LOCAL_VERIFICATION.json
          python3 tools/verify_round43.py --check-manifest --check-build

      - name: Commit the frozen reviewer object
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'revision(round43): materialize effective Jacobi closure for re-review'
          git push origin HEAD:"$REVISION_BRANCH"
