name: Trusted Round 43 materialization on desktop

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trusted-round43-materialization
  cancel-in-progress: false

jobs:
  materialize-round43:
    name: Materialize Round 43 on trusted desktop
    runs-on:
      - self-hosted
      - linux
      - x64
    timeout-minutes: 45
    env:
      REVISION_BRANCH: revision/round43-referee-positive-closure-gpt56pro-2026-09-04
    steps:
      - name: Check out the revision branch
        uses: actions/checkout@v4
        with:
          ref: revision/round43-referee-positive-closure-gpt56pro-2026-09-04
          fetch-depth: 1
          clean: true

      - name: Freeze the stored Round 41 construction inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = desktop
          python3 - <<'PY'
          from pathlib import Path

          generator = Path('tools/materialize_round41.py')
          text = generator.read_text(encoding='utf-8')
          old = 'r"""The true transient cross term is at most\n'
          new = 'r"""The\ntrue transient cross term is at most\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Round 41 frozen-source anchor not found')
          generator.write_text(text, encoding='utf-8')

          hardener = Path('tools/harden_round41_ldp.py')
          text = hardener.read_text(encoding='utf-8')
          bs = chr(92)
          old = '\n' + 'rac1n' + bs + 'log'
          new = '\n ' + bs + 'frac1n' + bs + 'log'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Round 41 denominator typo anchor not found')
          hardener.write_text(text, encoding='utf-8')
          PY

      - name: Restore and deterministically patch the Round 43 materializer
        shell: bash
        run: |
          set -euo pipefail
          cat .round43_payload/part*.b64 > /tmp/materialize_round43.py.gz.b64
          test "$(sha256sum /tmp/materialize_round43.py.gz.b64 | cut -d' ' -f1)" = "5e5ed75a74776c957674a48d28151fa2322131a1487b8dfeccbfc11a14caf72f"
          base64 --decode /tmp/materialize_round43.py.gz.b64 | gzip -dc > tools/materialize_round43.py
          test "$(sha256sum tools/materialize_round43.py | cut -d' ' -f1)" = "27041361d57cb4c0112e49ddb55c18859d8ea0920fe8548808c4cbe68918aa3d"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/materialize_round43.py')
          text = path.read_text(encoding='utf-8')
          bs = chr(92)
          replacements = [
              (
                  'self.assertIn(r"M_R=2e^{' + bs * 2 + 'Lambda_AT}' + bs * 2 + 'Lambda_A^R", quantitative)',
                  'self.assertIn(r"M_R=2e^{' + bs + 'Lambda_AT}' + bs + 'Lambda_A^R", quantitative)',
              ),
              (
                  'self.assertIn(r"C_R' + bs * 2 + 'le 2^{R+1}(R+1)!", quantitative)',
                  'self.assertIn(r"C_R' + bs + 'le 2^{R+1}(R+1)!", quantitative)',
              ),
              (
                  'self.assertIn(r"K_J' + bs * 2 + 'delta^{2R_J+3}", quantitative)',
                  'self.assertIn(r"K_J' + bs + 'delta^{2R_J+3}", quantitative)',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Round 43 test-literal anchor count={count}: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          chmod +x tools/materialize_round43.py
          sha256sum tools/materialize_round43.py | cut -d' ' -f1 > /tmp/round43_materializer_sha256
          python3 -m py_compile tools/materialize_round41.py tools/harden_round41_ldp.py tools/materialize_round43.py

      - name: Materialize ordinary manuscript sources
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/materialize_round41.py
          python3 tools/harden_round41_ldp.py
          python3 tools/materialize_round43.py
          {
            printf '%s  %s\n' '5e5ed75a74776c957674a48d28151fa2322131a1487b8dfeccbfc11a14caf72f' '.round43_payload/concatenated-base64'
            printf '%s  %s\n' '27041361d57cb4c0112e49ddb55c18859d8ea0920fe8548808c4cbe68918aa3d' 'tools/materialize_round43.py.prepatch'
            printf '%s  %s\n' "$(cat /tmp/round43_materializer_sha256)" 'tools/materialize_round43.py'
          } > round43/MATERIALIZATION_PROVENANCE.sha256

      - name: Verify inherited Round 41 object before retiring legacy writers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests/test_round41.py

      - name: Remove staging payload and every source-writing workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .round43_payload
          python3 - <<'PY'
          from pathlib import Path

          keep = {'verify-round43.yml'}
          for path in Path('.github/workflows').glob('*'):
              if path.name in keep or not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              if 'contents: write' in text or 'git push' in text or 'materialize' in path.name:
                  path.unlink()
                  print(f'removed source-writing workflow: {path}')
          PY

      - name: Ensure TeX dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdflatex >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern
          fi

      - name: Run Round 43 source and algebra tests on the frozen object
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests/test_round43.py

      - name: Build the exact materialized manuscript twice
        shell: bash
        run: |
          set -euo pipefail
          pdflatex -interaction=nonstopmode -halt-on-error ROUND43_REVISION.tex
          pdflatex -interaction=nonstopmode -halt-on-error ROUND43_REVISION.tex

      - name: Refresh manifest and write verification record
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_round43.py --refresh-manifest --check-manifest --check-build --json ROUND43_LOCAL_VERIFICATION.json
          python3 tools/verify_round43.py --check-manifest --check-build

      - name: Commit the frozen reviewer object
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'revision(round43): materialize effective Jacobi closure for re-review'
          git push origin HEAD:"$REVISION_BRANCH"
