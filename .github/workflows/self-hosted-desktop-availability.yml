name: Trusted Round 43 final audit on desktop

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trusted-round43-final-audit
  cancel-in-progress: false

jobs:
  audit-round43:
    name: Strengthen and verify Round 43
    runs-on:
      - self-hosted
      - linux
      - x64
    timeout-minutes: 45
    env:
      REVISION_BRANCH: revision/round43-referee-positive-closure-gpt56pro-2026-09-04
    steps:
      - name: Check out current revision head
        uses: actions/checkout@v4
        with:
          ref: revision/round43-referee-positive-closure-gpt56pro-2026-09-04
          fetch-depth: 1
          clean: true

      - name: Apply final mathematical and packet audit corrections
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = desktop
          python3 tools/patch_round43_final_audit.py
          rm tools/patch_round43_final_audit.py

      - name: Assert immutable workflow topology
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          test -f .github/workflows/verify-round43.yml
          grep -q 'contents: read' .github/workflows/verify-round43.yml
          ! grep -q 'contents: write' .github/workflows/verify-round43.yml
          ! grep -q 'git push' .github/workflows/verify-round43.yml

      - name: Ensure TeX dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdflatex >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern
          fi

      - name: Run inherited and Round 43 checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests/test_round41.py
          python3 -m unittest -v tests/test_round43.py

      - name: Build exact manuscript twice
        shell: bash
        run: |
          set -euo pipefail
          pdflatex -interaction=nonstopmode -halt-on-error ROUND43_REVISION.tex
          pdflatex -interaction=nonstopmode -halt-on-error ROUND43_REVISION.tex

      - name: Refresh manifest and verification record
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_round43.py --refresh-manifest --check-manifest --check-build --json ROUND43_LOCAL_VERIFICATION.json
          python3 tools/verify_round43.py --check-manifest --check-build

      - name: Commit audited reviewer object
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$REVISION_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'revision(round43): strengthen adaptive rates and freeze review packet'
          git push origin HEAD:"$REVISION_BRANCH"
