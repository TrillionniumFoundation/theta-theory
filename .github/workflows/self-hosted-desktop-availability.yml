name: Trusted Round 43 materialization on desktop

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trusted-round43-materialization
  cancel-in-progress: false

jobs:
  materialize-round43:
    name: Materialize Round 43 on trusted desktop
    runs-on:
      - self-hosted
      - linux
      - x64
    timeout-minutes: 45
    env:
      REVISION_BRANCH: revision/round43-referee-positive-closure-gpt56pro-2026-09-04
    steps:
      - name: Check out the revision branch
        uses: actions/checkout@v4
        with:
          ref: revision/round43-referee-positive-closure-gpt56pro-2026-09-04
          fetch-depth: 0
          clean: true

      - name: Freeze the stored Round 41 construction inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = desktop
          python3 - <<'PY'
          from pathlib import Path

          generator = Path('tools/materialize_round41.py')
          text = generator.read_text(encoding='utf-8')
          old = 'r"""The true transient cross term is at most\n'
          new = 'r"""The\ntrue transient cross term is at most\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Round 41 frozen-source anchor not found')
          generator.write_text(text, encoding='utf-8')

          hardener = Path('tools/harden_round41_ldp.py')
          text = hardener.read_text(encoding='utf-8')
          old = '\nrac1n\\log'
          new = '\n \\frac1n\\log'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Round 41 denominator typo anchor not found')
          hardener.write_text(text, encoding='utf-8')
          PY

      - name: Restore and harden the deterministic Round 43 materializer
        shell: bash
        run: |
          set -euo pipefail
          cat .round43_payload/part*.b64 > /tmp/materialize_round43.py.gz.b64
          test "$(sha256sum /tmp/materialize_round43.py.gz.b64 | cut -d' ' -f1)" = "e5a60fc31aea1f860bc1c0b2b604ed7e8f6173bf848899935b3b4d115a55bb6d"
          base64 --decode /tmp/materialize_round43.py.gz.b64 | gzip -dc > tools/materialize_round43.py
          test "$(sha256sum tools/materialize_round43.py | cut -d' ' -f1)" = "af440e952aa27937786a01bc8cf39b66430165d4312779550dafe9f2501a207c"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/materialize_round43.py')
          text = p.read_text(encoding='utf-8')
          old = r''' \frac{\sigma}{a}\sqrt{\frac{2\log(2|\mathcal Q|/\alpha)}{N_q(n)}}'''
          new = r''' \frac{\sigma}{a}\sqrt{\frac{2\log(2n|\mathcal Q|/\alpha)}{N_q(n)}}'''
          if text.count(old) != 1:
              raise SystemExit(f'confidence-radius anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          old_proof = r'''Conditional on the action record, the Gaussian terms in every \(\widehat h_q\)
have variance \(\sigma^2/(a^2N_q)\).  The persistent-state bias is bounded by
the second term of \eqref{eq:response-confidence-radius}.  A Gaussian tail
bound and a union bound prove simultaneous coverage.  Apply'''
          new_proof = r'''For every cell, the visit indicator at stage \(i\) is predictable before the
fresh Gaussian readout.  Therefore the selected Gaussian sums are martingale
transforms.  At each possible visit count \(1\le m\le n\), the corresponding
sum is \(N(0,m\sigma^2)\); a union bound over cells, signs, and the at most
\(n\) possible counts gives the first term of
\eqref{eq:response-confidence-radius}.  This argument remains valid when
future visits depend on earlier readouts.  The persistent-state bias is
bounded by the second term.  Apply'''
          if text.count(old_proof) != 1:
              raise SystemExit(f'confidence-proof anchor count={text.count(old_proof)}')
          text = text.replace(old_proof, new_proof, 1)
          p.write_text(text, encoding='utf-8')
          PY
          chmod +x tools/materialize_round43.py
          python3 -m py_compile tools/materialize_round41.py tools/harden_round41_ldp.py tools/materialize_round43.py

      - name: Materialize ordinary manuscript sources
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/materialize_round41.py
          python3 tools/harden_round41_ldp.py
          python3 tools/materialize_round43.py

      - name: Remove staging payload and every source-writing workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .round43_payload
          python3 - <<'PY'
          from pathlib import Path
          keep = {'verify-round43.yml'}
          for path in Path('.github/workflows').glob('*'):
              if path.name in keep or not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              if 'contents: write' in text or 'git push' in text or path.name == 'materialize-round43-bootstrap.yml':
                  path.unlink()
                  print(f'removed write-enabled workflow: {path}')
          PY

      - name: Ensure TeX dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdflatex >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern
          fi

      - name: Run exact source and algebra tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests/test_round41.py
          python3 -m unittest -v tests/test_round43.py

      - name: Build the exact materialized manuscript twice
        shell: bash
        run: |
          set -euo pipefail
          pdflatex -interaction=nonstopmode -halt-on-error ROUND43_REVISION.tex
          pdflatex -interaction=nonstopmode -halt-on-error ROUND43_REVISION.tex

      - name: Refresh manifest and write verification record
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_round43.py --refresh-manifest --check-manifest --check-build --json ROUND43_LOCAL_VERIFICATION.json
          python3 tools/verify_round43.py --check-manifest --check-build

      - name: Commit the frozen reviewer object
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'revision(round43): materialize effective Jacobi closure for re-review'
          git push origin HEAD:"$REVISION_BRANCH"
