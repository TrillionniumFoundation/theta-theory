name: export-round8-source-snapshot

on:
  push:
    branches:
      - revision/round8-referee-positive-closure-11paper-2026-08-31
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pack exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude='.git' \
            --exclude='papers/*/main.pdf' \
            --exclude='papers/*/main.aux' \
            --exclude='papers/*/main.bbl' \
            --exclude='papers/*/main.bcf' \
            --exclude='papers/*/main.blg' \
            --exclude='papers/*/main.fdb_latexmk' \
            --exclude='papers/*/main.fls' \
            --exclude='papers/*/main.log' \
            --exclude='papers/*/main.out' \
            --exclude='papers/*/main.run.xml' \
            --exclude='papers/*/main.toc' \
            -czf /tmp/round8-source-snapshot.tar.gz .
          sha256sum /tmp/round8-source-snapshot.tar.gz > /tmp/round8-source-snapshot.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: theta-theory-round8-source-snapshot
          path: |
            /tmp/round8-source-snapshot.tar.gz
            /tmp/round8-source-snapshot.sha256
          if-no-files-found: error
