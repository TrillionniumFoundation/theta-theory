schema: THETA_FIVE_PAPER_INTERFACE_V1
scope: theta-theory-only
branch: theta-five-paper-closure-2026-08-28

forbidden_imports:
  - thm:main_response_package
  - unnamed_moving_flow_response_package
  - generic_fully_nonlinear_to_2BSDE
  - mixed_Isaacs_to_pure_saddle
  - qualitative_uniform_WIP_to_full_scale_without_rate_or_characteristics

conventions:
  centered_operator: Q=L-Pi
  collision_covariance: pressure_q_q
  physical_covariance: collision_covariance/mean_roof
  physical_diffusion: physical_covariance/2
  HJB_generator_orientation: partial_t_u_plus_F_equals_zero_with_F_X_positive_semidefinite
  BSDE_integrand: Z=sigma_transpose_Du
  Paper_III_diffusion_factor: sigma_sigma_transpose=Sigma
  initial_belief_collapse: prediction_contraction_plus_vanishing_slow_initial_layer

papers:
  paper_I:
    path: paper-I-cm2-u3
    imports: []
    exports:
      P1-CM2:
        statement: graded double-time product summability
        hypotheses:
          - same_occurrence_atlas
          - bilateral_crossed_envelopes
          - strict_rate_gap
          - occurrence_summability
      P1-FDQ:
        statement: finite difference quotients converge in l1(N2)
        hypotheses:
          - common_product_envelope
          - finite_head_convergence
      P1-U3:
        statement: continuous first three source/operator derivatives
        hypotheses:
          - third_source_atom_ledger
          - vertex_and_seam_moduli
          - graded_ladder_X4_to_X1
      P1-RWORDS:
        statement: well-typed continuous third-order reduced-resolvent words
      P1-ACTUAL-4B:
        statement: open four-branch three-moving-seam actual witness

  paper_II:
    path: paper-II-pressure-diffusion
    imports:
      - P1-CM2
      - P1-FDQ
      - P1-U3
      - P1-RWORDS
    exports:
      P2-COMMON:
        statement: smooth quadratic finite-atlas common operator realization
      P2-PRESSURE3:
        statement: C3 twisted pressure and reduced spectral data
      P2-SUSP0:
        statement: low-frequency suspension resolvent response
      P2-PHYS:
        statement: physical drift covariance diffusion and parameter response
      P2-COEFF:
        statement: C3alpha x-p coefficient fields
      P2-ELL:
        statement: uniform ellipticity under noncoboundary and coupling-rank margins
      P2-ACTUAL-4B:
        statement: actual positive diffusion package for four-branch witness

  paper_III:
    path: paper-III-rough-theta
    imports:
      - P2-COMMON
      - P2-PRESSURE3
      - P2-SUSP0
      - P2-PHYS
      - P2-COEFF
      - P2-ELL
    exports:
      P3-DOOB:
        statement: frozen normalized selected kernels before HJB feedback
      P3-RWIP:
        statement: enhanced WIP with explicit modulus or direct characteristics
      P3-NAHOM:
        statement: nonautonomous homogenized characteristics
      P3-HJB:
        statement: uncontrolled or one-player viscosity limit
      P3-THETA:
        statement: time-consistent theta-expectation semigroup
      P3-NONCONVEX:
        statement: explicit nonconvex non-subadditive branch
      P3-ACTUAL-4B:
        statement: actual full-scale Bernoulli four-branch realization

  paper_IV:
    path: paper-IV-filter-games
    imports:
      - P3-DOOB
      - P3-RWIP
      - P3-NAHOM
    exports:
      P4-FILTER-B:
        statement: bounded filter contraction and initial-belief value collapse
      P4-FILTER-W:
        statement: weighted filter theorem with Lyapunov moment initial-layer and comparison gates
      P4-SEQ:
        statement: sequential lower and upper HJB limits
      P4-MIXED:
        statement: simultaneous relaxed mixed Isaacs value
      P4-PURE-GATE:
        statement: exact additional pure-saddle certificate
      P4-BELIEF:
        statement: belief-state HJB
      P4-PATH:
        statement: path-state DPP and PPDE interface
      P4-ACTUAL-4B:
        statement: actual hidden-symbol filtering and game realization

  paper_V:
    path: paper-V-representations
    imports:
      - P3-HJB
      - P3-THETA
      - P4-SEQ
      - P4-MIXED
      - P4-PURE-GATE
      - P4-BELIEF
      - P4-PATH
    exports:
      P5-SINGLE-LAW-NOGO:
        statement: payoff-independent linear-law obstruction
      P5-CALIBRATED:
        statement: exact payoff-calibrated linear PDE and Feynman-Kac formula
      P5-FBSDE:
        statement: semilinear Markov FBSDE branch
      P5-CONTROL-BSDE:
        statement: controlled or randomized BSDE branch
      P5-SECOND-ORDER:
        statement: convex 2BSDE versus nonconvex game/nonlinear-MP typing
      P5-PPDE:
        statement: path-dependent PPDE and path evaluation branch
      P5-GIRSANOV:
        statement: post-calibration Girsanov formula

edges:
  - from: paper_I
    to: paper_II
  - from: paper_II
    to: paper_III
  - from: paper_III
    to: paper_IV
    optional_for_basic_HJB: true
  - from: paper_III
    to: paper_V
  - from: paper_IV
    to: paper_V

closure:
  missing_named_imports: 0
  reverse_edges: 0
  circular_edges: 0
  blanket_imports: 0
  external_peer_review: NOT_PERFORMED
  formal_credit: 0
