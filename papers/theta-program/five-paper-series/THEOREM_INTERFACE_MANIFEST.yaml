schema: THETA_FIVE_PAPER_INTERFACE_V2
scope: theta-theory-only
branch: theta-maximal-strengthening-closure-2026-08-28

forbidden_imports:
  - thm:main_response_package
  - unnamed_moving_flow_response_package
  - generic_fully_nonlinear_to_2BSDE
  - mixed_Isaacs_to_pure_saddle
  - qualitative_uniform_WIP_to_full_scale_without_rate_or_characteristics
  - geometry_only_to_generic_noncoboundary_specular_U3
  - topology_or_test_class_free_optimal_enhanced_WIP_rate
  - full_Lipschitz_KR_exact_rate_from_Stein_Dirichlet_class
  - one_scalar_grazing_weight_to_all_moving_flow_derivatives

conventions:
  centered_operator: Q=L-Pi
  collision_covariance: pressure_q_q
  physical_covariance: collision_covariance/mean_roof
  physical_diffusion: physical_covariance/2
  HJB_generator_orientation: partial_t_u_plus_F_equals_zero_with_F_X_positive_semidefinite
  BSDE_integrand: Z=sigma_transpose_Du
  Paper_III_diffusion_factor: sigma_sigma_transpose=Sigma
  initial_belief_collapse: prediction_contraction_plus_vanishing_slow_initial_layer
  optimal_WIP_topology: step_two_fractional_Sobolev_W_eta_p
  optimal_WIP_test_distance: Stein_Dirichlet_Sigma_eta_p
  pure_saddle_orientation: maximizing_u_minimizing_v
  path_state_generator: horizontal_segment_shift_plus_present_endpoint_vertical_generator

papers:
  paper_I:
    path: paper-I-cm2-u3
    imports: []
    optional_imports: []
    exports:
      P1-CM2:
        statement: graded double-time product summability
        hypotheses:
          - same_occurrence_atlas
          - bilateral_crossed_envelopes
          - strict_rate_gap
          - occurrence_summability
      P1-FDQ:
        statement: finite difference quotients converge in l1(N2)
        hypotheses:
          - common_product_envelope
          - finite_head_convergence
      P1-U3:
        statement: continuous first three source/operator derivatives
        hypotheses:
          - third_source_atom_ledger
          - vertex_and_seam_moduli
          - graded_ladder_X4_to_X1
      P1-RWORDS:
        statement: well-typed continuous third-order reduced-resolvent words
      P1-ACTUAL-4B:
        statement: open four-branch three-moving-seam actual witness
      P1-SINAI-RADIAL-U3:
        statement: actual nonconjugate specular radial invariant-projector and exact-coboundary U-infinity response
        proof_file: ../maximal-strengthening/SPECULAR_SINAI_RADIAL_U3.md
        scope:
          - invariant_projector
          - exact_coboundary_twists
        forbidden_upgrade: generic_noncoboundary_geometry_only_U3

  paper_II:
    path: paper-II-pressure-diffusion
    imports:
      - P1-CM2
      - P1-FDQ
      - P1-U3
      - P1-RWORDS
    optional_imports:
      - P1-SINAI-RADIAL-U3
    exports:
      P2-COMMON:
        statement: smooth quadratic finite-atlas common operator realization
      P2-PRESSURE3:
        statement: C3 twisted pressure and reduced spectral data
      P2-SUSP0:
        statement: low-frequency suspension resolvent response with distinct entry and exit operators
      P2-PHYS:
        statement: physical drift covariance diffusion and parameter response
      P2-COEFF:
        statement: C3alpha x-p coefficient fields
      P2-ELL:
        statement: uniform ellipticity under noncoboundary and coupling-rank margins
      P2-ACTUAL-4B:
        statement: actual positive diffusion package for four-branch witness
      P2-BDL-HF-FAMILY:
        statement: compact-family uniform high-frequency flow resolvent and graded parameter derivatives
        proof_file: ../maximal-strengthening/MOVING_FAMILY_HIGH_FREQUENCY_BDL.md
        hypotheses:
          - BDL_FAMILY_WITNESS_v1
          - smooth_quadratic_fibre_atlas
          - graded_parameter_letters_for_derivatives
        actual_channel: nonconjugate_radial_exact_flow_coboundary

  paper_III:
    path: paper-III-rough-theta
    imports:
      - P2-COMMON
      - P2-PRESSURE3
      - P2-SUSP0
      - P2-PHYS
      - P2-COEFF
      - P2-ELL
    optional_imports:
      - P2-BDL-HF-FAMILY
    exports:
      P3-DOOB:
        statement: frozen normalized selected kernels before HJB feedback
      P3-RWIP:
        statement: enhanced WIP with explicit modulus or direct characteristics
      P3-RWIP-OPTIMAL-WETA-P:
        statement: matching N^(-(1/2-eta)) upper and lower rates in the declared step-two fractional-Sobolev Stein-Dirichlet test distance
        proof_file: ../maximal-strengthening/OPTIMAL_ENHANCED_WIP_RATE.md
        parameter_range:
          - p > 6
          - 1/3 < eta-1/p
          - eta < 1/2
        test_class: Sigma_eta_p_with_signature_pullback_second_derivative_regularization
        actual_system: four_branch_Bernoulli_symbol_process
        forbidden_upgrade: full_bounded_Lipschitz_KR_exact_rate
      P3-NAHOM:
        statement: nonautonomous homogenized characteristics
      P3-HJB:
        statement: uncontrolled or one-player viscosity limit under named DPP and comparison hypotheses
      P3-THETA:
        statement: time-consistent theta-expectation semigroup
      P3-NONCONVEX:
        statement: explicit nonconvex non-subadditive branch
      P3-ACTUAL-4B:
        statement: actual full-scale Bernoulli four-branch realization through monotone DPP comparison HJB and theta
        proof_file: paper-III-rough-theta/TECHNICAL_APPENDIX_DPP_COMPARISON.md

  paper_IV:
    path: paper-IV-filter-games
    imports:
      - P3-DOOB
      - P3-RWIP
      - P3-NAHOM
    optional_imports:
      - P3-RWIP-OPTIMAL-WETA-P
    exports:
      P4-FILTER-B:
        statement: bounded filter contraction and initial-belief value collapse
      P4-FILTER-W:
        statement: weighted filter theorem with Lyapunov moment initial-layer and comparison gates
      P4-WEIGHTED-NONCOMPACT-ACTUAL:
        statement: actual unbounded AR1 hidden signal and exponentially stable weighted filter
        proof_file: ../maximal-strengthening/WEIGHTED_NONCOMPACT_PATH_ACTUALIZATION.md
      P4-SEQ:
        statement: sequential lower and upper HJB limits
      P4-MIXED:
        statement: simultaneous relaxed mixed Isaacs value
      P4-PURE-GATE:
        statement: compatibility alias for an exact additional pure-saddle certificate
      P4-PURE-ISAACS-MAXIMAL:
        statement: pure saddle iff pure Isaacs equality plus measurable and strong-concave-convex positive classes
        proof_file: ../maximal-strengthening/PURE_STRATEGY_ISAACS.md
        negative_result: matching_pennies_refutes_unrestricted_existence
        actual_system: four_branch_quadratic_bilinear_pure_game
      P4-BELIEF:
        statement: belief-state HJB
      P4-PATH:
        statement: path-state DPP and PPDE interface
      P4-ACTUAL-4B:
        statement: actual hidden-symbol realization through filter collapse sequential schemes and relaxed mixed-Isaacs scheme
        proof_file: paper-IV-filter-games/TECHNICAL_APPENDIX_GAME_SCHEME.md

  paper_V:
    path: paper-V-representations
    imports:
      - P3-HJB
      - P3-THETA
      - P4-SEQ
      - P4-MIXED
      - P4-PURE-GATE
      - P4-PURE-ISAACS-MAXIMAL
      - P4-BELIEF
      - P4-PATH
      - P4-WEIGHTED-NONCOMPACT-ACTUAL
    optional_imports: []
    exports:
      P5-SINGLE-LAW-NOGO:
        statement: payoff-independent linear-law obstruction
      P5-CALIBRATED:
        statement: exact payoff-calibrated linear PDE and Feynman-Kac formula
      P5-FBSDE:
        statement: semilinear Markov FBSDE branch
      P5-CONTROL-BSDE:
        statement: controlled or randomized BSDE branch
      P5-SECOND-ORDER:
        statement: convex 2BSDE versus nonconvex game/nonlinear-MP typing
      P5-PPDE:
        statement: path-dependent PPDE and path evaluation branch
      P5-PATH-ACTUAL:
        statement: actual noncompact delay-state DPP segment equation and BSDE path evaluation
        proof_file: ../maximal-strengthening/WEIGHTED_NONCOMPACT_PATH_ACTUALIZATION.md
        upstream_actual_filter: P4-WEIGHTED-NONCOMPACT-ACTUAL
      P5-GIRSANOV:
        statement: post-calibration Girsanov formula

series_level_bundles:
  P4-P5-WEIGHTED-PATH-ACTUAL:
    components:
      - P4-WEIGHTED-NONCOMPACT-ACTUAL
      - P5-PATH-ACTUAL

edges:
  - from: paper_I
    to: paper_II
  - from: paper_II
    to: paper_III
  - from: paper_III
    to: paper_IV
    optional_for_basic_HJB: true
  - from: paper_III
    to: paper_V
  - from: paper_IV
    to: paper_V

closure:
  missing_named_imports: 0
  reverse_edges: 0
  circular_edges: 0
  blanket_imports: 0
  former_strengthening_items: 5
  former_strengthening_items_closed: 5
  actual_scoped_chain_through_theta: true
  actual_scoped_chain_through_mixed_Isaacs: true
  actual_scoped_chain_through_pure_Isaacs: true
  actual_weighted_noncompact_filter: true
  actual_noncompact_path_evaluation: true
  external_peer_review: NOT_PERFORMED
  mathematical_proof_certified_externally: false
  formal_credit: 0
