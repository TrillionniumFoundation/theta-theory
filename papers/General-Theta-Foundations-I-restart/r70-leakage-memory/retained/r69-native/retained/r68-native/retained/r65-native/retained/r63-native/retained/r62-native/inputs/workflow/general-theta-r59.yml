name: General Theta restart R59 independent rebuild
on:
  push:
    branches:
      - foundation/general-theta-restart-r59-causal-task-order-revision-2026-10-14
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout the exact source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: papers/General-Theta-Foundations-I-restart/r59-causal-task-order
      - name: Install isolated build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-venv texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern poppler-utils
          python3 -m venv "$RUNNER_TEMP/r59-env"
          "$RUNNER_TEMP/r59-env/bin/python" -m pip install --require-hashes -r papers/General-Theta-Foundations-I-restart/r59-causal-task-order/requirements.lock
      - name: Read-only clean rebuild and normal/optimized regression
        run: |
          set -euo pipefail
          P=papers/General-Theta-Foundations-I-restart/r59-causal-task-order
          "$RUNNER_TEMP/r59-env/bin/python" "$P/verify.py"
          "$RUNNER_TEMP/r59-env/bin/python" "$P/rebuild.py" --source "$GITHUB_SHA" --out "$RUNNER_TEMP/r59-result"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/r59-result/SOURCE_COMMIT.txt"
      - name: Upload source-bound build and test evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: general-theta-r59-independent-${{ github.sha }}
          path: ${{ runner.temp }}/r59-result
          if-no-files-found: error
          retention-days: 90
